position: Consuming
description: Deel is a global workforce platform combining payroll, Employer of Record
  (EOR), independent contractor management, HRIS, ATS, IT/device management, immigration,
  and background screenings across 150+ countries. The Deel Public API and SCIM API
  expose the full worker lifecycle — hire, onboard, pay, manage time off, run payroll,
  terminate — through a REST surface at api.letsdeel.com/rest/v2 with bearer-token
  and OAuth2 authentication, a sandbox at api-sandbox.demo.deel.com, HMAC-signed webhooks,
  a Deel App Store for partner apps, an Embedded "Deel as a Service" model, and a
  public MCP server for AI agent integration. Deel has compliantly processed over
  $20B in global payroll for 40,000+ companies.
