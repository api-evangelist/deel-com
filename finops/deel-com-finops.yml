specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Deel
providerId: deel-com
created: '2026-05-25'
modified: '2026-05-25'
reconciled: true
tags:
  - FinOps
  - Cost Management
  - FOCUS
  - HR
  - Payroll
description: |
  FOCUS-aligned FinOps definition for Deel's global workforce platform. Deel's cost surface is
  predominantly per-worker subscriptions (per contractor, per employee, per user) with no
  API-consumption fees. The billing currency is USD and invoices are issued monthly.
sources:
  - https://www.deel.com/pricing/
  - https://developer.deel.com/api/introduction
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Deel
serviceCategory: Business Applications — Human Resources
billingModel:
  pricingCategory: Subscription
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Credit
    - Adjustment
  primaryUnit: worker_month
  secondaryUnits:
    - employee_month
    - contractor_month
    - user_month
focusColumns:
  ServiceName: Deel
  ServiceCategory: Business Applications
  ProviderName: Deel
  PublisherName: Deel
  InvoiceIssuerName: Deel
  PricingCategory: Subscription
  PricingUnit: worker_month
  BillingCurrency: USD
meters:
  - name: contractor_seat
    unit: contractor_month
    aggregation: max
    dimensions:
      - country
      - currency
      - product
  - name: eor_seat
    unit: employee_month
    aggregation: max
    dimensions:
      - country
      - currency
      - tier
  - name: global_payroll_seat
    unit: employee_month
    aggregation: max
    dimensions:
      - country
      - legal_entity_id
  - name: hris_seat
    unit: employee_month
    aggregation: max
    dimensions:
      - module
  - name: it_seat
    unit: user_month
    aggregation: max
    dimensions:
      - tier
allocationDimensions:
  - team
  - department
  - cost_center
  - legal_entity
  - country
  - worker_type
exports:
  format: csv
  cadence: monthly
  channel: deel-app-billing
  notes:
    - Cost centers are first-class in the Deel platform and surface as the recommended FOCUS BillingAccount allocation dimension.
    - External IDs on contracts allow reconciling Deel charges back to internal cost-center systems.
