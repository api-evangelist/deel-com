- name: atsEmailTemplates
paths:
  /ats/email-templates:
    get:
      operationId: atsEmailTemplates_retrieveAListOfPublishedAtsEmailTemplates-v2026-02-11
      summary: Retrieve a list of published ATS email templates
      description: 'Lists the published email templates of the organization. Use it to see which templates exist, or to keep a local copy in sync by fetching only those updated since your last check. Drafts and template bodies are not included.


        **Token scopes**: `ats:read`, `worker:read`'
      tags:
      - atsEmailTemplates
      parameters:
      - name: cursor
        in: query
        description: Cursor for pagination. Use the nextCursor value from the previous response to get the next page of results.
        required: false
        schema:
          type: string
          maxLength: 1000
      - name: limit
        in: query
        description: Maximum number of email templates to return per page
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: updated_after
        in: query
        description: Return only email templates that were updated after this timestamp (ISO 8601 format)
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Successfully retrieved email templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ats-email-templates_retrieveAListOfPublishedAtsEmailTemplates-v2026-02-11_Response_200'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAListOfPublishedAtsEmailTemplates-v2026-02-11RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden. ATS is not enabled for this organization or insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAListOfPublishedAtsEmailTemplates-v2026-02-11RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAListOfPublishedAtsEmailTemplates-v2026-02-11RequestInternalServerError'
      security:
      - deelToken: []
