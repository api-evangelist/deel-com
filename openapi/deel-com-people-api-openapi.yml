openapi: 3.2.0
info:
  title: Endpoints People API
  version: 1.0.0
  description: API endpoints related to People.
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: People
  description: API endpoints related to People.
paths:
  /people:
    post:
      operationId: people_createADirectEmployee-v2026-01-01
      summary: Create a direct employee
      description: 'Creates a direct employee record in Deel''s HRIS, hired under the organization''s own legal entity. Provisions both a person and an associated employment contract. Applicable when onboarding employees managed through your own payroll providers. It can support downstream integrations, such as IT equipment orders.


        **Token scopes**: `people:write`'
      tags:
      - People
      responses:
        '201':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/People_createADirectEmployee-v2026-01-01_Response_201'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateADirectEmployee-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateADirectEmployee-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/PeoplePostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
    get:
      operationId: people_getPeople
      summary: List of People
      description: 'Returns a paginated list of people records in the organization. Supports filtering by search term, teams, custom fields, and other query parameters. Build people directories, sync HR data, or power search interfaces across your workforce records.


        **Token scopes**: `people:read`


        **Deprecated**: a newer version of this endpoint is available. This version is scheduled for removal on 2027-09-30.


        **Beta version available**: version `2026-09-30` of this endpoint is in beta. Send `X-Beta: true` to call it.'
      tags:
      - People
      parameters:
      - name: offset
        in: query
        description: Return a page of results with given number of records.
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 999999999
          default: 0
      - name: limit
        in: query
        description: Return a page of results with given number of records.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - name: search
        in: query
        description: Include a contract if by name or contractor name contains given search term.
        required: false
        schema:
          type: string
      - name: teams
        in: query
        description: Filter the results based on the team(group) the users contract is associated with
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: fields
        in: query
        description: Pick the fields you want to see in the response in order to avoid a bloated people list output. Supports dot notation (e.g., 'employments[0].contract_status') to access nested fields.
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/PeopleGetParametersFieldsSchemaItems'
      - name: sort_by
        in: query
        description: Sort people by given field name.
        required: false
        schema:
          $ref: '#/components/schemas/PeopleGetParametersSortBy'
      - name: sort_order
        in: query
        description: Order direction of results; ascending or descending.
        required: false
        schema:
          $ref: '#/components/schemas/PeopleGetParametersSortOrder'
      - name: hiring_statuses
        in: query
        description: Employee's current hiring status.
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/PeopleGetParametersHiringStatusesSchemaItems'
      - name: band_placements
        in: query
        description: Employee's current band placement.
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/PeopleGetParametersBandPlacementsSchemaItems'
      - name: comparative_ratios_from
        in: query
        description: Employee's minimum band placement
        required: false
        schema:
          type: string
          title: float
      - name: comparative_ratios_to
        in: query
        description: Employee's maximum band placement
        required: false
        schema:
          type: string
          title: float
      - name: hiring_types
        in: query
        description: Filter people by hiring types
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/PeopleGetParametersHiringTypesSchemaItems'
      - name: person_statuses
        in: query
        description: Filter people by person (worker profile) lifecycle status.
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/PeopleGetParametersPersonStatusesSchemaItems'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/people_getPeople_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOfPeople-v2026-01-01RequestInternalServerError'
      deprecated: true
      security:
      - deelToken: []
  /pwac:
    post:
      operationId: people_createPersonWithoutContract
      summary: Create a person without a contract
      description: 'Adds a person record in Deel''s HRIS without an associated employment contract. It creates a people-only record, allowing you to track individuals in your organization''s directory before or without formalizing an employment or agreement. Suitable for pre-boarding, contingent workers, or other scenarios where a contract is not yet applicable.


        **Token scopes**: `people:write`'
      tags:
      - People
      responses:
        '201':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/people_createPersonWithoutContract_Response_201'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAPersonWithoutAContract-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAPersonWithoutAContract-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/PwacPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
  /people/me:
    get:
      operationId: people_getMyCurrentPersonalProfile-v2026-01-01
      summary: Get my current personal profile
      description: 'Returns the profile of the currently authenticated user, including identity, organizational membership, and integration identifiers for connected services such as Slack.


        **Token scopes**: `worker:read`, `people:read`'
      tags:
      - People
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/People_getMyCurrentPersonalProfile-v2026-01-01_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Unauthorized. Missing or invalid authentication credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMyCurrentPersonalProfile-v2026-01-01RequestUnauthorizedError'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /people/{hris_profile_id}:
    get:
      operationId: people_getPersonById
      summary: Retrieve a single person
      description: 'Returns detailed information about a single person in the organization by their public ID. Returns personal details, employment information, organizational structure, person status, direct manager, custom fields, and related data.


        **Token scopes**: `people:read`


        **Deprecated**: a newer version of this endpoint is available. This version is scheduled for removal on 2027-10-12.


        **Beta version available**: version `2026-10-12` of this endpoint is in beta. Send `X-Beta: true` to call it.'
      tags:
      - People
      parameters:
      - name: hris_profile_id
        in: path
        description: Unique identifier for the person.
        required: true
        schema:
          type: string
          format: uuid
      - name: include_custom_fields
        in: query
        description: Include custom fields in the response.
        required: false
        schema:
          type: boolean
      - name: include_worker_relations
        in: query
        description: Include worker relations in the response.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/people_getPersonById_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveASinglePerson-v2026-01-01RequestInternalServerError'
      deprecated: true
      security:
      - deelToken: []
  /people/{id}/working-location:
    put:
      operationId: people_updatePersonWorkingLocation
      summary: Update working location
      description: 'Sets the working location for a worker identified by their HRIS profile ID.


        **Token scopes**: `people:write`'
      tags:
      - People
      parameters:
      - name: id
        in: path
        description: Hris profile ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/people_updatePersonWorkingLocation_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/PeopleIdWorkingLocationPutRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
components:
  schemas:
    PeopleHrisProfileIdGetResponsesContentApplicationJsonSchemaDataEmploymentsItemsHrisDirectEmployeeInvitation:
      type: object
      properties:
        oid:
          type: string
          description: Unique identifier of this resource.
        status:
          type:
          - string
          - 'null'
          description: The HRIS direct employee invitation status.
        send_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The HRIS direct employee invitation send date.
        timezone:
          type:
          - string
          - 'null'
          description: The HRIS direct employee invitation timezone.
      description: The HRIS direct employee invitation status.
      title: PeopleHrisProfileIdGetResponsesContentApplicationJsonSchemaDataEmploymentsItemsHrisDirectEmployeeInvitation
    PeoplePostResponsesContentApplicationJsonSchemaData:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier of the created employee record
        employee:
          $ref: '#/components/schemas/PeoplePostResponsesContentApplicationJsonSchemaDataEmployee'
          description: The person that is being hired
        employment:
          $ref: '#/components/schemas/PeoplePostResponsesContentApplicationJsonSchemaDataEmployment'
          description: The employment details of the employee
        compensation_details:
          $ref: '#/components/schemas/PeoplePostResponsesContentApplicationJsonSchemaDataCompensationDetails'
          description: The compensation details of the employee
      required:
      - id
      - employee
      - employment
      - compensation_details
      title: PeoplePostResponsesContentApplicationJsonSchemaData
    PeoplePostRequestBodyContentApplicationJsonSchemaDataEmployment:
      oneOf:
      - $ref: '#/components/schemas/PeoplePostRequestBodyContentApplicationJsonSchemaDataEmployment0'
      - $ref: '#/components/schemas/PeoplePostRequestBodyContentApplicationJsonSchemaDataEmployment1'
      description: The employment details of the employee
      title: PeoplePostRequestBodyContentApplicationJsonSchemaDataEmployment
    CreateADirectEmployee-v2026-01-01RequestInternalServerError:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/PeoplePostResponsesContentApplicationJsonSchemaError'
      required:
      - error
      title: CreateADirectEmployee-v2026-01-01RequestInternalServerError
    PeopleHrisProfileIdGetResponsesContentApplicationJsonSchemaDataEmploymentsItems:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the employment.
        name:
          type: string
          description: Name of the employee.
        team:
          $ref: '#/components/schemas/PeopleHrisProfileIdGetResponsesContentApplicationJsonSchemaDataEmploymentsItemsTeam'
          description: The team to which the employee belongs.
        email:
          type: string
          description: The work email of the employee.
        state:
          type:
          - string
          - 'null'
          description: The state of employment.
        country:
          type:
          - string
          - 'null'
          description: The country of employment.
        payment:
          $ref: '#/components/schemas/PeopleHrisProfileIdGetResponsesContentApplicationJsonSchemaDataEmploymentsItemsPayment'
          description: Payment information for the employment, including rate, scale, currency, and associated contract name.
        is_ended:
          type: boolean
          description: Whether the employment has ended.
        timezone:
          type:
          - string
          - 'null'
          description: The timezone of the employment.
        job_title:
          type:
          - string
          - 'null'
          description: The job title of the employment.
        seniority:
          type:
          - string
          - 'null'
          description: The seniority level of the employment.
        start_date:
          type:
          - string
          - 'null'
          format: date
          description: The start date of the employment.
        work_email:
          type:
          - string
          - 'null'
          description: The work email of the employment.
        hiring_type:
          type: string
          description: The type of hiring of the employment.
        hiring_status:
          type: string
          description: The current hiring status of the employment.
        completion_date:
          type:
          - string
          - 'null'
          description: The completion date of the employment contract.
        contract_status:
          type: string
          description: The status of the employment contract.
        voluntarily_left:
          type:
          - boolean
          - 'null'
          description: Whether the employee voluntarily left the employment.
        contract_coverage:
          oneOf:
          - $ref: '#/components/schemas/PeopleHrisProfileIdGetResponsesContentApplicationJsonSchemaDataEmploymentsItemsContractCoverage'
          - type: 'null'
          description: The coverage type of the employment contract. 'is_shielded' = Contractor of Record, 'is_premium' = Premium, null = Standard (no coverage).
        new_hiring_status:
          type: string
          description: The new hiring status of the employment.
        client_legal_entity:
          oneOf:
          - $ref: '#/components/schemas/PeopleHrisProfileIdGetResponsesContentApplicationJsonSchemaDataEmploymentsItemsClientLegalEntity'
          - type: 'null'
          description: The client legal entity associated with this employment contract.
        has_eor_termination:
          type:
          - boolean
          - 'null'
          description: Whether the employment has an EOR termination.
        contract_is_archived:
          type: boolean
          description: Whether the employment contract is archived.
        termination_last_day:
          type:
          - string
          - 'null'
          format: date-time
          description: The last day of work mentioned on the contract termination.
        contract_has_contractor:
          type: boolean
          description: Whether the contract has a contractor.
        is_user_contract_deleted:
          type: boolean
          description: Whether the user contract is deleted.
        hris_direct_employee_invitation:
          oneOf:
          - $ref: '#/components/schemas/PeopleHrisProfileIdGetResponsesContentApplicationJsonSchemaDataEmploymentsItemsHrisDirectEmployeeInvitation'
          - type: 'null'
          description: The HRIS direct employee invitation status.
      title: PeopleHrisProfileIdGetResponsesContentApplicationJsonSchemaDataEmploymentsItems
    PeopleGetResponsesContentApplicationJsonSchemaDataItemsEmploymentsItemsTeam:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Refers to Groups in the platform. Working groups that reflect the organization's structure.
        name:
          type: string
          description: The team name.
      description: The team to which the employee belongs.
      title: PeopleGetResponsesContentApplicationJsonSchemaDataItemsEmploymentsItemsTeam
    PeoplePostResponsesContentApplicationJsonSchemaDataEmployment:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/PeoplePostResponsesContentApplicationJsonSchemaDataEmploymentType'
          description: The type of employment
        country:
          type: string
          minLength: 2
          maxLength: 2
          description: The country of the employment
        end_date:
          type: string
          format: date
          description: The end date of the employment
        job_title:
          type: string
          description: The job title of the employment
        seniority:
          type: string
          description: The seniority of the employment
        start_date:
          type: string
          format: date
          description: The start date of the employment
        contract_id:
          type: string
          description: The unique identifier of the worker contract
        part_time_percentage:
          type: number
          format: double
          minimum: 1
          maximum: 99
          description: The percentage of PART_TIME employment
      required:
      - type
      - country
      - end_date
      - job_title
      - seniority
      - start_date
      - contract_id
      description: The employment details of the employee
      title: PeoplePostResponsesContentApplicationJsonSchemaDataEmployment
    PeoplePostRequestBodyContentApplicationJsonSchemaData:
      type: object
      properties:
        client:
          $ref: '#/components/schemas/PeoplePostRequestBodyContentApplicationJsonSchemaDataClient'
          description: The entity that is hiring the employee
        employee:
          $ref: '#/components/schemas/PeoplePostRequestBodyContentApplicationJsonSchemaDataEmployee'
          description: The person that is being hired
        employment:
          $ref: '#/components/schemas/PeoplePostRequestBodyContentApplicationJsonSchemaDataEmployment'
          description: The employment details of the employee
        compensation_details:
          $ref: '#/components/schemas/PeoplePostRequestBodyContentApplicationJsonSchemaDataCompensationDetails'
          description: The compensation details of the employee
      required:
      - client
      - employee
      - employment
      - compensation_details
      title: PeoplePostRequestBodyContentApplicationJsonSchemaData
    PeopleHrisProfileIdGetResponsesContentApplicationJsonSchemaDataAdditionalDetailsItems:
      type: object
      properties:
        type:
          type: string
          description: Field name (the JSONB key from hris_employment_eligibility.eligibility_data, e.g. socialSecurity, idNumber, taxIdentificationNumber).
        value:
          $ref: '#/components/schemas/PeopleHrisProfileIdGetResponsesContentApplicationJsonSchemaDataAdditionalDetailsItemsValue'
          description: Raw value associated with the field. May be a string, number, boolean, or null.
        country:
          type: string
          pattern: ^[A-Z]{2}$
          minLength: 2
          maxLength: 2
          description: ISO-2 country code that scopes this entry.
      title: PeopleHrisProfileIdGetResponsesContentApplicationJsonSchemaDataAdditionalDetailsItems
    PwacPostRequestBodyContentApplicationJsonSchemaDataInvitationAction:
      type: string
      enum:
      - DISABLE
      - IMMEDIATE
      description: Controls whether to send an invitation email.
      title: PwacPostRequestBodyContentApplicationJsonSchemaDataInvitationAction
    PeopleMeGetResponsesContentApplicationJsonSchemaProfileType:
      type: string
      enum:
      - client
      - contractor
      - icp
      - direct_employee
      - hris_direct_employee
      - peo_employee
      - service_account
      description: Type of profile
      title: PeopleMeGetResponsesContentApplicationJsonSchemaProfileType
    PeopleHrisProfileIdGetResponsesContentApplicationJsonSchemaDataAdditionalDetailsItemsValue:
      oneOf:
      - type: string
      - type: number
        format: double
      - type: boolean
      - type: object
        additionalProperties:
          description: Any type
      description: Raw value associated with the field. May be a string, number, boolean, or null.
      title: PeopleHrisProfileIdGetResponsesContentApplicationJsonSchemaDataAdditionalDetailsItemsValue
    PeoplePostRequestBodyContentApplicationJsonSchemaDataClientTeam:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The team that the employee is part of
        direct_manager_id:
          type: string
          format: uuid
          description: The direct manager of the employee
      required:
      - id
      description: The team information for the employee
      title: PeoplePostRequestBodyContentApplicationJsonSchemaDataClientTeam
    PeopleGetResponsesContentApplicationJsonSchemaDataItemsClientLegalEntity:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          format: uuid
          description: Unique identifier of this resource.
        name:
          type:
          - string
          - 'null'
          description: The name of the client legal entity.
      description: The primary client legal entity associated with the employee.
      title: PeopleGetResponsesContentApplicationJsonSchemaDataItemsClientLegalEntity
    PeopleGetParametersHiringTypesSchemaItems:
      type: string
      enum:
      - contractor
      - eor
      - peo
      - hris_direct_employee
      - hris_direct_contractor
      - direct_employee
      - contractor_outside_deel
      - person_without_contract
      title: PeopleGetParametersHiringTypesSchemaItems
    People_createADirectEmployee-v2026-01-01_Response_201:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PeoplePostResponsesContentApplicationJsonSchemaData'
      required:
      - data
      title: People_createADirectEmployee-v2026-01-01_Response_201
    PeopleHrisProfileIdGetResponsesContentApplicationJsonSchemaDataEmploymentsItemsPaymentRate:
      oneOf:
      - type: string
      - type: number
        format: double
      description: The payment rate. Value is a string if contract type is PEO.
      title: PeopleHrisProfileIdGetResponsesContentApplicationJsonSchemaDataEmploymentsItemsPaymentRate
    PeoplePostResponsesContentApplicationJsonSchemaDataCompensationDetailsScale:
      type: string
      enum:
      - ANNUAL
      - MONTHLY
      - SEMIMONTHLY
      - BIWEEKLY
      - WEEKLY
      - DAILY
      - HOURLY
      default: ANNUAL
      description: The scale at which the salary is paid
      title: PeoplePostResponsesContentApplicationJsonSchemaDataCompensationDetailsScale
    PwacPostRequestBodyContentApplicationJsonSchemaDataClientLegalEntity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The legal entity that the person is part of
      required:
      - id
      title: PwacPostRequestBodyContentApplicationJsonSchemaDataClientLegalEntity
    PeopleHrisProfileIdGetResponsesContentApplicationJsonSchemaDataProfileOrganizationalStructuresItems:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Id of the Organizational structure.
        name:
          type: string
          description: Name of the Organizational structure.
        teams:
          type: array
          items:
            $ref: '#/components/schemas/PeopleHrisProfileIdGetResponsesContentApplicationJsonSchemaDataProfileOrganizationalStructuresItemsTeamsItems'
          description: List of teams in the organizational structure.
      title: PeopleHrisProfileIdGetResponsesContentApplicationJsonSchemaDataProfileOrganizationalStructuresItems
    PwacPostResponsesContentApplicationJsonSchemaDataPerson:
      type: object
      properties:
