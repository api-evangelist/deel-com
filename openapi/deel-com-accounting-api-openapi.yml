openapi: 3.2.0
info:
  title: Endpoints Accounting API
  version: 1.0.0
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: Accounting
paths:
  /invoices/{id}/download:
    get:
      operationId: accounting_getBillingInvoiceDownloadLink-v2026-01-01
      summary: Download invoice PDF
      description: 'Returns a temporary download URL for an invoice PDF. Use this endpoint when a caller needs to fetch or display the PDF for a specific invoice; the URL expires at the time indicated by `expires_at` in the response, after which it must be re-requested.


        **Token scopes**: `accounting:read`'
      tags:
      - Accounting
      parameters:
      - name: id
        in: path
        description: The invoice ID used to identify the invoice to be downloaded.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accounting_getBillingInvoiceDownloadLink-v2026-01-01_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBillingInvoiceDownloadLink-v2026-01-01RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /invoices/{invoice_id}:
    get:
      operationId: accounting_getInvoiceById-v2026-01-01
      summary: Get invoice by id
      description: 'Retrieves the details of a single invoice by `invoice_id`.


        **Token scopes**: `accounting:read`'
      tags:
      - Accounting
      parameters:
      - name: invoice_id
        in: path
        description: The invoice ID used to identify the invoice to be retrieved.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The invoice resource returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accounting_getInvoiceById-v2026-01-01_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInvoiceById-v2026-01-01RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /payments/{payment_id}/breakdown:
    get:
      operationId: accounting_retrieveAPaymentBreakdown-v2026-01-01
      summary: Retrieve a payment breakdown
      description: 'Returns a breakdown of a payment made to Deel, with individual invoices and the Deel fee included as discrete line items.


        **Token scopes**: `accounting:read`'
      tags:
      - Accounting
      parameters:
      - name: payment_id
        in: path
        description: Unique identifier for the payment to retrieve the breakdown.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accounting_retrieveAPaymentBreakdown-v2026-01-01_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAPaymentBreakdown-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
  /invoices/deel:
    get:
      operationId: accounting_retrieveDeelInvoices-v2026-01-01
      summary: Retrieve Deel invoices
      description: 'Returns a paginated list of invoices for Deel platform fees.


        **Token scopes**: `accounting:read`'
      tags:
      - Accounting
      parameters:
      - name: limit
        in: query
        description: Return a page of results with given number of records; NOTE technically ALL query parameters are strings or array of strings
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: Return a page of results after given index of row; NOTE technically ALL query parameters are strings or array of strings'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accounting_retrieveDeelInvoices-v2026-01-01_Response_200'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveDeelInvoices-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /invoices:
    get:
      operationId: accounting_retrieveInvoices-v2026-01-01
      summary: Retrieve invoices
      description: 'Returns a paginated list of invoices; by default only paid invoices are returned, but passing `status=all` returns invoices in all statuses. Supports both offset- and cursor-based pagination.


        **Token scopes**: `accounting:read`'
      tags:
      - Accounting
      parameters:
      - name: issued_from_date
        in: query
        description: Filter invoices issued on or after the specified date.
        required: false
        schema:
          type: string
      - name: issued_to_date
        in: query
        description: Filter invoices issued before the specified date.
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: If status query has value of all, all invoices will be returned. Otherwise only paid invoices will be fetched.
        required: false
        schema:
          $ref: '#/components/schemas/InvoicesGetParametersStatus'
      - name: limit
        in: query
        description: Number of records to retrieve per page.
        required: false
        schema:
          type: number
          format: double
          minimum: 1
          maximum: 50
          default: 25
      - name: offset
        in: query
        description: Index of the first record to return.
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
          maximum: 999999999
          default: 0
      - name: cursor
        in: query
        description: Return next page of results after the given cursor.
        required: false
        schema:
          type: string
      - name: include
        in: query
        description: Will include invoices from COR workers in the response.
        required: false
        schema:
          $ref: '#/components/schemas/InvoicesGetParametersInclude'
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accounting_retrieveInvoices-v2026-01-01_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoicesGetResponsesContentApplicationJsonSchemaItems'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /payments:
    get:
      operationId: accounting_retrievePaymentReceipts-v2027-01-01
      summary: Retrieve payment receipts
      description: 'Returns a cursor-paginated list of payment statements to Deel, including status, totals, currency, and payment method. Child invoices and per-worker details are no longer included in this response; use `GET /rest/payments/{payment_id}/breakdown` to retrieve them. Use the `next_cursor` value from the response to retrieve subsequent pages.


        **Token scopes**: `accounting:read`'
      tags:
      - Accounting
      parameters:
      - name: date_from
        in: query
        description: Filters results to include payments created on or after this date (in ISO 8601 format).
        required: false
        schema:
          type: string
          format: date
      - name: date_to
        in: query
        description: Filters results to include payments created before this date (in ISO 8601 format).
        required: false
        schema:
          type: string
          format: date
      - name: cursor
        in: query
        description: A cursor for pagination. Use the value returned in the 'next_cursor' field to get the next page of results.
        required: false
        schema:
          type: string
      - name: currencies
        in: query
        description: Filters payments by their currency codes. Can be a single currency code or an array of codes.
        required: false
        schema:
          type: array
          items:
            type: string
            pattern: ^[A-Z]{3}$
            minLength: 3
            maxLength: 3
      - name: entities
        in: query
        description: Filters payments by legal entity type (e.g., 'individual' or 'company'). Can be a single entity type or an array.
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/PaymentsGetParametersEntitiesSchemaItems'
      - name: statuses
        in: query
        description: Filters payments by their status (e.g., 'paid' or 'processing'). Can be a single status type or an array.
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/PaymentsGetParametersStatusesSchemaItems'
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accounting_retrievePaymentReceipts-v2027-01-01_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievePaymentReceipts-v2027-01-01RequestInternalServerError'
      security:
      - deelToken: []
  /refund-statements:
    get:
      operationId: accounting_retrieveRefundStatements-v2026-04-30
      summary: Retrieve refund statements
      description: 'Use this endpoint to retrieve a list of refund statements. This allows review of past transactions and reconciliation of accounts.


        **Token scopes**: `accounting:read`'
      tags:
      - Accounting
      parameters:
      - name: date_from
        in: query
        description: Filters results to include payments created on or after this date (in ISO 8601 format).
        required: false
        schema:
          type: string
          format: date
      - name: date_to
        in: query
        description: Filters results to include payments created before this date (in ISO 8601 format).
        required: false
        schema:
          type: string
          format: date
      - name: cursor
        in: query
        description: A cursor for pagination. Use the value returned in the 'next_cursor' field to get the next page of results.
        required: false
        schema:
          type: string
      - name: currencies
        in: query
        description: Filters payments by their currency codes. Can be a single currency code or an array of codes.
        required: false
        schema:
          type: array
          items:
            type: string
            pattern: ^[A-Z]{3}$
            minLength: 3
            maxLength: 3
      - name: entities
        in: query
        description: Filters payments by legal entity type (e.g., 'individual' or 'company'). Can be a single entity type or an array.
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/RefundStatementsGetParametersEntitiesSchemaItems'
      responses:
        '200':
          description: Successfully retrieved refund statements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accounting_retrieveRefundStatements-v2026-04-30_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveRefundStatements-v2026-04-30RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveRefundStatements-v2026-04-30RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveRefundStatements-v2026-04-30RequestInternalServerError'
      security:
      - deelToken: []
components:
  schemas:
    RetrieveDeelInvoices-v2026-01-01RequestBadRequestError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/InvoicesDeelGetResponsesContentApplicationJsonSchemaErrorsItems'
      required:
      - errors
      title: RetrieveDeelInvoices-v2026-01-01RequestBadRequestError
    Accounting_getBillingInvoiceDownloadLink-v2026-01-01_Response_200:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/InvoicesIdDownloadGetResponsesContentApplicationJsonSchemaData'
      required:
      - data
      title: Accounting_getBillingInvoiceDownloadLink-v2026-01-01_Response_200
    InvoicesGetParametersInclude:
      type: string
      enum:
      - cor
      title: InvoicesGetParametersInclude
    PaymentsGetResponsesContentApplicationJsonSchemaDataRowsItemsStatus:
      type: string
      enum:
      - paid
      - processing
      description: Status of the payment. Either 'paid' or 'processing'.
      title: PaymentsGetResponsesContentApplicationJsonSchemaDataRowsItemsStatus
    InvoicesGetResponsesContentApplicationJsonSchemaPage:
      type: object
      properties:
        cursor:
          type:
          - string
          - 'null'
          description: Cursor for paginated results.
        offset:
          type: number
          format: double
          minimum: 0
          maximum: 999999999
          description: The starting position of the current page of results.
        total_rows:
          type: number
          format: double
          description: Total number of rows available for the query.
        items_per_page:
          type: number
          format: double
          minimum: 1
          maximum: 99
          description: Number of items displayed per page.
      required:
      - offset
      - total_rows
      - items_per_page
      title: InvoicesGetResponsesContentApplicationJsonSchemaPage
    PaymentsGetResponsesContentApplicationJsonSchemaDataRowsItems:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the payment.
        label:
          type: string
          description: A descriptive label for the payment.
        total:
          type: string
          description: Original invoice total before any credits or balance were applied.
        status:
          $ref: '#/components/schemas/PaymentsGetResponsesContentApplicationJsonSchemaDataRowsItemsStatus'
          description: Status of the payment. Either 'paid' or 'processing'.
        paid_at:
          type: string
          format: date-time
          description: Date and time when the payment was completed, in ISO-8601 format.
        timezone:
          type: string
          pattern: ^[+-]\d{2}:\d{2}$
          description: Timezone offset in ISO 8601 format (e.g., +02:00, -05:00).
        total_due:
          type: string
          description: Amount due for the payment after applying any credits or balance. Equals 'total' when no credits were used.
        created_at:
          type: string
          format: date-time
          description: Date and time when the payment was created, in ISO-8601 format.
        deel_reference:
          type:
          - string
          - 'null'
          description: Deel reference identifier for the payment.
        payment_method:
          $ref: '#/components/schemas/PaymentsGetResponsesContentApplicationJsonSchemaDataRowsItemsPaymentMethod'
          description: Payment method details for the transaction.
        payment_currency:
          type: string
          pattern: ^[A-Z]{3,4}$
          minLength: 3
          maxLength: 4
          description: Three or four-letter currency code for the payment, following ISO 4217 (e.g., USD, USDC).
        general_funds_used:
          $ref: '#/components/schemas/PaymentsGetResponsesContentApplicationJsonSchemaDataRowsItemsGeneralFundsUsed'
          description: Amount paid using the client's general balance funds.
        deel_granted_credits_used:
          $ref: '#/components/schemas/PaymentsGetResponsesContentApplicationJsonSchemaDataRowsItemsDeelGrantedCreditsUsed'
          description: Amount paid using Deel-granted credits.
        prepaid_billing_credits_used:
          $ref: '#/components/schemas/PaymentsGetResponsesContentApplicationJsonSchemaDataRowsItemsPrepaidBillingCreditsUsed'
          description: Amount paid using prepaid billing credits.
        eor_early_invoicing_funds_used:
          $ref: '#/components/schemas/PaymentsGetResponsesContentApplicationJsonSchemaDataRowsItemsEorEarlyInvoicingFundsUsed'
          description: Amount paid using EOR early invoicing funds.
      title: PaymentsGetResponsesContentApplicationJsonSchemaDataRowsItems
    PaymentsPaymentIdBreakdownGetResponsesContentApplicationJsonSchemaDataItems:
      type: object
      properties:
        date:
          type: string
          format: date-time
          description: Date associated with the payment breakdown.
        work:
          type: string
          description: Base payment amount for work performed, including regular salary/wages and off-cycle payments.
        bonus:
          type: string
          description: Additional bonus payment amount awarded to the worker.
        total:
          type: string
          description: Total payment due for this breakdown item.
        others:
          type: string
          description: Other payment amounts.
        currency:
          type: string
          description: Currency code for this payment.
        expenses:
          type: string
          description: Expenses related to the payment.
        group_id:
          $ref: '#/components/schemas/PaymentsPaymentIdBreakdownGetResponsesContentApplicationJsonSchemaDataItemsGroupId'
          description: Unique identifier for the group associated with this payment. Empty for organization-level payments, individual payments, and standalone service fees that are not associated with a specific group.
        overtime:
          type: string
          description: Overtime payment amount.
        pro_rata:
          type: string
          description: Pro-rated payment amount.
        approvers:
          type: string
          description: Comma-separated list of names of people who approved this payment. May be empty if no approvals were required or recorded.
        frequency:
          $ref: '#/components/schemas/PaymentsPaymentIdBreakdownGetResponsesContentApplicationJsonSchemaDataItemsFrequency'
          description: Work unit scale from the contractor's work statement. Indicates how work is measured and reported (hourly, daily, weekly, monthly, or custom units). Empty for contracts with fixed payments that don't require work quantity tracking, such as milestone-based contracts and consulting agreements.
        adjustment:
          type: string
          description: Adjustment amount for the payment.
        deductions:
          type: string
          description: Deductions from the payment.
        invoice_id:
          type: string
          description: Unique identifier of this resource.
        commissions:
          type: string
          description: Commissions included in the payment.
        contract_id:
          type:
          - string
          - 'null'
          description: Public identifier of the contract this line item belongs to. Null for service-fee and similar non-contract line items.
        approve_date:
          $ref: '#/components/schemas/PaymentsPaymentIdBreakdownGetResponsesContentApplicationJsonSchemaDataItemsApproveDate'
          description: Date when the work report was approved by designated approvers. Empty for payments that don't require work report approval, such as service fees, management fees, and automated payments.
        payment_date:
          type: string
          format: date-time
          description: Date when the payment was made.
        contract_type:
          oneOf:
          - $ref: '#/components/schemas/PaymentsPaymentIdBreakdownGetResponsesContentApplicationJsonSchemaDataItemsContractType'
          - type: 'null'
          description: Type of contract this payment relates to. Determines the nature of the work relationship and payment structure.
        processing_fee:
          type: string
          description: Processing fee amount applied to the payment.
        contract_country:
          type: string
          description: Country where the contract is established.
        contractor_email:
          type: string
          description: Email address of the worker.
        payment_currency:
          type: string
          description: Currency in which the payment was processed.
        contractor_pic_url:
          type:
          - string
          - 'null'
          description: URL to the worker's Deel avatar. Null if the worker has no avatar set or for non-worker line items.
        contract_start_date:
          $ref: '#/components/schemas/PaymentsPaymentIdBreakdownGetResponsesContentApplicationJsonSchemaDataItemsContractStartDate'
          description: Start date of the contract. Empty for service agreements and fee-related contracts (such as equipment payments, insurance payments, and management fees) that don't have traditional contract start dates.
        general_ledger_account:
          type: string
          description: General ledger account code or name for accounting purposes. May be configured at the group, company, or organization level. Empty if not configured.
        total_payment_currency:
          type: string
          description: Total payment in the payment currency.
        contractor_employee_name:
          type: string
          description: Name of the worker.
        contractor_unique_identifier:
          $ref: '#/components/schemas/PaymentsPaymentIdBreakdownGetResponsesContentApplicationJsonSchemaDataItemsContractorUniqueIdentifier'
          description: Unique identifier for the worker. May be empty for certain contract types such as service agreements and fees.
      title: PaymentsPaymentIdBreakdownGetResponsesContentApplicationJsonSchemaDataItems
    InvoicesGetResponsesContentApplicationJsonSchemaItems:
      type: object
      properties:
        code:
          type: string
          description: Machine readable error
        message:
          type: string
          description: Description of the returned error
      title: InvoicesGetResponsesContentApplicationJsonSchemaItems
    Accounting_retrievePaymentReceipts-v2027-01-01_Response_200:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PaymentsGetResponsesContentApplicationJsonSchemaData'
      title: Accounting_retrievePaymentReceipts-v2027-01-01_Response_200
    PaymentsGetResponsesContentApplicationJsonSchemaDataRowsItemsPrepaidBillingCreditsUsed:
      type: object
      properties:
        amount:
          type: string
          description: Amount deducted from prepaid billing credits, in the payment currency. '0.00' if not used.
        original_amount:
          type:
          - string
          - 'null'
          description: Amount deducted from prepaid billing credits, in the original currency they were held in. Null if not used.
        original_currency:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{3,4}$
          minLength: 3
          maxLength: 4
          description: Currency in which the prepaid billing credits were held, following ISO 4217 (e.g., USD, USDC). Null if not used.
      description: Amount paid using prepaid billing credits.
      title: PaymentsGetResponsesContentApplicationJsonSchemaDataRowsItemsPrepaidBillingCreditsUsed
    InvoicesInvoiceIdGetResponsesContentApplicationJsonSchemaDataLineItemsItemsType:
      type: string
      enum:
      - AI_WORKFORCE_MONTHLY_FEE
      - ANON_REPORT_FEE
      - ANYTIME_PAY_GP_RESERVE
      - ASO_FEE
      - ASO_PAYROLL_FUNDING
      - ATS_LINKEDIN_PREMIUM_FEE
      - BACKGROUND_CHECK_FEE
      - BANK_ACCOUNT_OPENING_FEE
      - BANK_FILE_FEE
      - BENEFITS_ADMIN_MONTHLY_PLATFORM_FEE
      - CLIENT_PREFUNDING_AMOUNT
      - COR_LOCAL_COLLECTION_FEE
      - COR_START_DELAY
      - CUSTOM_DOMAIN_FEE
      - CUSTOM_ONE_OFF_COST
      - CUSTOM_ONE_OFF_FEE
      - DEEL_ATS_SUBSCRIPTIONS
