    eor-worker-agreements_downloadWorkerEmployeeAgreement_Response_200:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/EorWorkersContractsContractIdEmployeeAgreementDownloadGetResponsesContentApplicationJsonSchemaData'
      required:
      - data
