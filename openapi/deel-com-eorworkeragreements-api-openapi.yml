openapi: 3.2.0
info:
  title: Endpoints Eor Worker Agreements API
  version: 1.0.0
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: eorWorkerAgreements
paths:
  /eor/workers/contracts/{contract_id}/employee-agreement/download:
    get:
      operationId: eorWorkerAgreements_downloadWorkerEmployeeAgreement
      summary: Download employee agreement PDF
      description: 'Returns a time-limited download URL for the employee agreement PDF associated with the given `contract_id`. When the optional `version` parameter is supplied and a version mismatch is detected, behaviour diverges from the default resolution path.


        **Token scopes**: `worker:read`'
      tags:
      - eorWorkerAgreements
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier of the employee contract.
        required: true
        schema:
          type: string
      - name: version
        in: query
        description: Optional version of the Employment Agreement to be signed. If informed and in the case of a mismatch, the API will return an error.
        required: false
        schema:
          type: string
          minLength: 20
          maxLength: 20
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eor-worker-agreements_downloadWorkerEmployeeAgreement_Response_200'
        '400':
          description: 'Invalid request: the contract was not found or is not an EOR contract.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadEmployeeAgreementPdf-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Employee agreement is not available yet for this contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadEmployeeAgreementPdf-v2026-01-01RequestNotFoundError'
        '409':
          description: Employment Agreement version mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadEmployeeAgreementPdf-v2026-01-01RequestConflictError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /eor/workers/contracts/{contract_id}/offer-letter:
    get:
      operationId: eorWorkerAgreements_downloadWorkerOfferLetter
      summary: Preview job offer letter
      description: 'Returns the job offer letter for an EOR contract in HTML format. IC and Global Payroll contract types are not supported and will not return a result.


        **Token scopes**: `worker:read`'
      tags:
      - eorWorkerAgreements
      parameters:
      - name: contract_id
        in: path
        description: Deel contract id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /eor/workers/contracts/{contract_id}/signatures:
    post:
      operationId: eorWorkerAgreements_signEORContractAsWorker
      summary: Sign a contract
      description: 'Signs a contract on behalf of the contractor, transitioning contract status to active and completing the contractor onboarding workflow.


        **Token scopes**: `worker:write`'
      tags:
      - eorWorkerAgreements
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier of the employee contract.
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eor-worker-agreements_signEORContractAsWorker_Response_201'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '409':
          description: Employment Agreement version mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignAContract-v2026-01-01RequestConflictError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/EorWorkersContractsContractIdSignaturesPostRequestBodyContentApplicationJsonSchemaData'
      security:
      - deelToken: []
components:
  schemas:
    EorWorkersContractsContractIdSignaturesPostRequestBodyContentApplicationJsonSchemaData:
      type: object
      properties:
        version:
          type: string
          minLength: 20
          maxLength: 20
          description: Optional version of the Employment Agreement to be signed. If informed and in the case of a mismatch, the API will return an error.
        signature:
          type: string
          minLength: 2
          description: Signature of employee.
      required:
      - signature
      title: EorWorkersContractsContractIdSignaturesPostRequestBodyContentApplicationJsonSchemaData
    EorWorkersContractsContractIdSignaturesPostResponsesContentApplicationJsonSchemaData:
      type: object
      properties:
        created:
          type: boolean
      required:
      - created
      title: EorWorkersContractsContractIdSignaturesPostResponsesContentApplicationJsonSchemaData
    EorWorkersContractsContractIdEmployeeAgreementDownloadGetResponsesContentApplicationJsonSchemaData:
      type: object
      properties:
        url:
          type: string
          description: URL to requested employee agreement to download.
        expires_at:
          type: string
          format: date-time
          description: Expiration date time of download URL.
      title: EorWorkersContractsContractIdEmployeeAgreementDownloadGetResponsesContentApplicationJsonSchemaData
    ApiError:
      type: object
      properties:
        message:
          type: string
          description: A description of the returned error
        path:
          type: string
          description: The JSON path where input validation failed
      title: ApiError
    EorWorkersContractsContractIdEmployeeAgreementDownloadGetResponsesContentApplicationJsonSchemaErrorsItems:
      type: object
      properties:
        message:
          type: string
          description: The error message
      title: EorWorkersContractsContractIdEmployeeAgreementDownloadGetResponsesContentApplicationJsonSchemaErrorsItems
    SignAContract-v2026-01-01RequestConflictError:
      type: object
