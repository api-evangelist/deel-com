openapi: 3.2.0
info:
  title: Endpoints Groups API
  version: 1.0.0
  description: API endpoints related to Groups.
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: Groups
  description: API endpoints related to Groups.
paths:
  /groups/{id}/clone:
    post:
      operationId: groups_cloneGroup
      summary: Clone a Group
      description: 'Creates a new group by copying the structure and settings of an existing group. The cloned group is independent of the source after creation.


        **Token scopes**: `groups:write`'
      tags:
      - Groups
      parameters:
      - name: id
        in: path
        description: Unique identifier of the group to be cloned.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Group cloned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/groups_cloneGroup_Response_201'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloneAGroup-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/GroupsIdClonePostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
  /groups:
    post:
      operationId: groups_createGroup
      summary: Create a group
      description: 'Creates a new group within the organization and returns the created group record, including its assigned `id`.


        **Token scopes**: `groups:read`, `groups:write`'
      tags:
      - Groups
      responses:
        '200':
          description: Group created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/groups_createGroup_Response_200'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGroup-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/GroupsPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
    get:
      operationId: groups_getGroups
      summary: Return list of groups
      description: 'Returns a paginated list of groups in the organization. Archived groups are included by default and can be excluded via the `include_archived_groups` parameter.


        **Token scopes**: `groups:read`'
      tags:
      - Groups
      parameters:
      - name: limit
        in: query
        description: The maximum number of groups to return (between 1 and 100)
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      - name: sort_order
        in: query
        description: Sort the results in ascending (ASC) or descending (DESC) order based on the group name.
        required: false
        schema:
          $ref: '#/components/schemas/GroupsGetParametersSortOrder'
          default: ASC
      - name: cursor
        in: query
        description: The encoded cursor for paginated results. This is an opaque string that allows fetching the next set of results.
        required: false
        schema:
          type: string
      - name: include_archived_groups
        in: query
        description: Include archived groups (soft deleted records). Defaults to `true`.
        required: false
        schema:
          type: boolean
          default: true
      - name: external_metadata
        in: query
        description: Extra information about the group.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: A list of groups in the organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/groups_getGroups_Response_200'
        '400':
          description: Invalid request parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGroups-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /groups/{id}:
    delete:
      operationId: groups_deleteGroup
      summary: Delete a group
      description: 'Soft-deletes a group by archiving it. The group is not permanently removed and the response includes the `archived_at` timestamp reflecting when the archive occurred.


        **Token scopes**: `groups:write`'
      tags:
      - Groups
      parameters:
      - name: id
        in: path
        description: Unique identifier of the group to be archived.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Group archived successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/groups_deleteGroup_Response_200'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteGroup-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteGroup-v2026-01-01RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
    patch:
      operationId: groups_updateGroup
      summary: Edit a group
      description: 'Applies a partial update to an existing group''s details. Only fields included in the request body are modified; omitted fields retain their current values.


        **Token scopes**: `groups:read`, `groups:write`'
      tags:
      - Groups
      parameters:
      - name: id
        in: path
        description: Unique identifier of the group to be edited.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Group updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/groups_updateGroup_Response_200'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditGroup-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/GroupsIdPatchRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
