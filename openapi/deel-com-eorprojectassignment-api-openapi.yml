openapi: 3.2.0
info:
  title: Endpoints Eor Project Assignment API
  version: 1.0.0
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: eorProjectAssignment
paths:
  /eor/contracts/{contract_id}/project-assignment/accept:
    post:
      operationId: eorProjectAssignment_acceptProjectAssignment
      summary: Accept EOR project assignment as client
      description: 'Records client approval of a project assignment for an EOR contract, confirming that the terms have been reviewed and accepted.


        **Token scopes**: `contracts:write`'
      tags:
      - eorProjectAssignment
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier of the employee contract.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: The project assignment was accepted successfully.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Bad Request. The request could not be understood or was missing required parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptEorProjectAssignmentAsClient-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '409':
          description: The requested version of the document mismatch the current version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptEorProjectAssignmentAsClient-v2026-01-01RequestConflictError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptEorProjectAssignmentAsClient-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/EorContractsContractIdProjectAssignmentAcceptPostRequestBodyContentApplicationJsonSchemaData'
      security:
      - deelToken: []
  /eor/contracts/{contract_id}/project-assignment:
    get:
      operationId: eorProjectAssignment_getProjectAssignment
      summary: Fetch EOR project assignment PDF
      description: 'Returns the project assignment PDF for an EOR contract pending client approval. The optional version parameter allows callers to confirm the retrieved document matches an expected version before proceeding with acceptance.


        **Token scopes**: `contracts:read`'
      tags:
      - eorProjectAssignment
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier of the employee contract.
        required: true
        schema:
          type: string
      - name: version
        in: query
        description: This field is to ensure that the latest version of the project assignment PDF matches the version received from the webhook. If it is not sent, the version validation is not performed and the endpoint returns the PDF. If it is sent, it is checked whether the current version is equal to the version sent; if not, a 409 error occurs, otherwise, the PDF is returned.
        required: false
        schema:
          type: string
          minLength: 20
          maxLength: 20
      responses:
        '200':
          description: Successful response
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Bad Request. The request could not be understood or was missing required parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchEorProjectAssignmentPdf-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '409':
          description: The requested version of the document mismatch the current version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchEorProjectAssignmentPdf-v2026-01-01RequestConflictError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchEorProjectAssignmentPdf-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
  /eor/contracts/{contract_id}/project-assignment/checkin:
    get:
      operationId: eorProjectAssignment_getProjectAssignmentCheckin
      summary: Fetch Project Assignment Checkin Questionnaire Data
      description: 'Returns the checkin questionnaire for a project assignment, including all sections and questions required for completion. The optional version parameter ensures the fetched questionnaire matches an expected version before it is rendered or submitted.


        **Token scopes**: `contracts:read`'
      tags:
      - eorProjectAssignment
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier of the contract.
        required: true
        schema:
          type: string
      - name: version
        in: query
        description: This field is to ensure that the latest version of the project assignment checkin matches the version received from the webhook. If it is not sent, the version validation is not performed. If it is sent, it is checked whether the current version is equal to the version sent; if not, a 409 error occurs, otherwise, the data is returned.
        required: false
        schema:
          type: string
          minLength: 20
          maxLength: 20
      responses:
        '200':
          description: Successful response containing form configuration data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eor-project-assignment_getProjectAssignmentCheckin_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchProjectAssignmentCheckinQuestionnaireData-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '409':
          description: The requested version of the document mismatch the current version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchProjectAssignmentCheckinQuestionnaireData-v2026-01-01RequestConflictError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchProjectAssignmentCheckinQuestionnaireData-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
    post:
      operationId: eorProjectAssignment_checkinProjectAssignment
      summary: Submit Project Assignment Checkin Questionnaire Data
      description: 'Submits completed answers for a project assignment checkin questionnaire. All required questionnaire fields must be included; partial submissions are not accepted.


        **Token scopes**: `contracts:read`, `contracts:write`'
      tags:
      - eorProjectAssignment
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier of the contract.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No content. The request was successful, but there is no response body.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitProjectAssignmentCheckinQuestionnaireData-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '409':
          description: The requested version of the document mismatch the current version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitProjectAssignmentCheckinQuestionnaireData-v2026-01-01RequestConflictError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitProjectAssignmentCheckinQuestionnaireData-v2026-01-01RequestInternalServerError'
      requestBody:
        description: Payload for submitting employee or client form answers.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/EorContractsContractIdProjectAssignmentCheckinPostRequestBodyContentApplicationJsonSchemaData'
                  description: Form submission payload containing respondent type, question answers, and optional version.
      security:
      - deelToken: []
