            $ref: '#/components/schemas/EorContractsContractIdProjectAssignmentCheckinGetResponsesContentApplicationJsonSchemaDataSectionsItems'
          description: Sections of questions
        created_at:
          type: string
          format: date-time
          description: Timestamp indicating when the resource was created (ISO 8601).
        updated_at:
          type: string
          format: date-time
          description: Timestamp indicating when the resource was last updated (ISO 8601).
      required:
