openapi: 3.2.0
info:
  title: Endpoints It Orders API
  version: 1.0.0
  description: API endpoints related to IT orders.
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: itOrders
  description: API endpoints related to IT orders.
paths:
  /it/orders/{order_id}/approve:
    post:
      operationId: itOrders_approveItOrder-v2026-09-30
      summary: Approve an IT order
      description: 'Approves an order that is currently awaiting approval, moving it to approved status, creating assignments for its approved items, and starting fulfilment. Use this once an order has been submitted and is pending manager approval, before fulfilment can begin.


        **Token scopes**: `it-orders:write`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2026-12-30.'
      tags:
      - itOrders
      parameters:
      - name: order_id
        in: path
        description: Unique identifier of the IT order
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/ItOrdersOrderIdApprovePostParametersXBeta'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IT_orders_approveItOrder-v2026-09-30_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveItOrder-v2026-09-30RequestBadRequestError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveItOrder-v2026-09-30RequestUnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveItOrder-v2026-09-30RequestForbiddenError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveItOrder-v2026-09-30RequestNotFoundError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveItOrder-v2026-09-30RequestConflictError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveItOrder-v2026-09-30RequestInternalServerError'
      security:
      - deelToken: []
  /it/orders/{order_id}/cancel:
    post:
      operationId: itOrders_cancelItOrder-v2026-09-15
      summary: Cancel an IT order
      description: 'Cancels an order that is still pre-shipment with a reason. On success the order plus its related sales order are cancelled. Cancellation is rejected if the order is paid, in payment, or already shipped.


        **Token scopes**: `it-orders:write`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2026-12-15.'
      tags:
      - itOrders
      parameters:
      - name: order_id
        in: path
        description: Unique identifier of the IT order
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/ItOrdersOrderIdCancelPostParametersXBeta'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IT_orders_cancelItOrder-v2026-09-15_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelItOrder-v2026-09-15RequestBadRequestError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelItOrder-v2026-09-15RequestUnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelItOrder-v2026-09-15RequestForbiddenError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelItOrder-v2026-09-15RequestNotFoundError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelItOrder-v2026-09-15RequestConflictError'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelItOrder-v2026-09-15RequestUnprocessableEntityError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelItOrder-v2026-09-15RequestInternalServerError'
      requestBody:
        description: Cancellation details
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/ItOrdersOrderIdCancelPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
  /it/orders:
    post:
      operationId: itOrders_createItOrder-v2026-09-17
      summary: Create an IT order
      description: 'Creates a pre-approved IT equipment order for a worker so it can be raised directly from an onboarding or procurement workflow instead of a separate approval step.


        **Token scopes**: `it-orders:write`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2026-12-17.'
      tags:
      - itOrders
      parameters:
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/ItOrdersPostParametersXBeta'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IT_orders_createItOrder-v2026-09-17_Response_201'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateItOrder-v2026-09-17RequestBadRequestError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateItOrder-v2026-09-17RequestUnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateItOrder-v2026-09-17RequestForbiddenError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateItOrder-v2026-09-17RequestNotFoundError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateItOrder-v2026-09-17RequestConflictError'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateItOrder-v2026-09-17RequestUnprocessableEntityError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateItOrder-v2026-09-17RequestInternalServerError'
      requestBody:
        description: Order to create
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/ItOrdersPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
    get:
      operationId: itOrders_listItOrders-v2026-01-01
      summary: List IT orders
      description: 'Lists your organization''s IT equipment orders with their current fulfilment status. Use it to surface order progress — pending, approved, shipped, delivered — inside your own service desk or onboarding workflow, so a worker can be told where their device is without logging into Deel.


        **Token scopes**: `it-orders:read`'
      tags:
      - itOrders
      parameters:
      - name: cursor
        in: query
        description: Indicates where the next page of results starts, as returned in a paginated list response
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Return a page of results with given number of records
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IT_orders_listItOrders-v2026-01-01_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListItOrders-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListItOrders-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
  /it/orders/{order_id}/decline:
    post:
      operationId: itOrders_declineItOrder-v2026-09-30
      summary: Reject an IT order
      description: 'Declines an order that is awaiting approval, moving it to a final DECLINED status and leaving every item unapproved with no fulfilment started. Use this when a service desk needs to reject an order before approval instead of going through the Deel IT UI. This decision cannot be reversed.


        **Token scopes**: `it-orders:write`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2026-12-30.'
      tags:
      - itOrders
      parameters:
      - name: order_id
        in: path
        description: Unique identifier of the IT order
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/ItOrdersOrderIdDeclinePostParametersXBeta'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IT_orders_declineItOrder-v2026-09-30_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclineItOrder-v2026-09-30RequestBadRequestError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclineItOrder-v2026-09-30RequestUnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclineItOrder-v2026-09-30RequestForbiddenError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclineItOrder-v2026-09-30RequestNotFoundError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclineItOrder-v2026-09-30RequestConflictError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclineItOrder-v2026-09-30RequestInternalServerError'
      security:
      - deelToken: []
  /it/orders/{order_id}:
    get:
      operationId: itOrders_retrieveAnItOrder-v2026-01-01
      summary: Retrieve an IT order
      description: 'Retrieves one order with its fulfilment status, shipping details, and the product ordered. Call this to answer "where is my device?" for a specific worker, or to poll a single order through to delivery.


        **Token scopes**: `it-orders:read`'
      tags:
      - itOrders
      parameters:
      - name: order_id
        in: path
        description: Unique identifier of the IT order
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IT_orders_retrieveAnItOrder-v2026-01-01_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAnItOrder-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAnItOrder-v2026-01-01RequestNotFoundError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAnItOrder-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
