        first_name:
          type: string
          description: First name of the user
        hris_profile_id:
          type: string
          format: uuid
          description: The unique identifier of the HRIS profile of the assigned user
      required:
      - emails
      - last_name
      - first_name
      - hris_profile_id
      description: Details of the user the order is for
      title: ItOrdersOrderIdApprovePostResponsesContentApplicationJsonSchemaDataUser
