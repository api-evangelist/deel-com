openapi: 3.2.0
info:
  title: Endpoints API
  version: 1.0.0
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: Endpoints
paths: {}
webhooks:
  atsApplications_webhookAtsApplicationCreated:
    post:
      operationId: atsApplications_webhookAtsApplicationCreated
      summary: 'Event: ATS Application Created'
      description: Triggered when a candidate application is created in Deel ATS. The payload includes the application, candidate, and job context, including the initial interview stage and source.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsAtsApplicationCreatedPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  atsApplications_webhookAtsApplicationTransitioned:
    post:
      operationId: atsApplications_webhookAtsApplicationTransitioned
      summary: 'Event: ATS Application Transitioned'
      description: Triggered when a candidate application moves between interview stages. The payload includes the previous and current stage.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsAtsApplicationTransitionedPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  atsJobPostings_webhookAtsJobPostingCreated:
    post:
      operationId: atsJobPostings_webhookAtsJobPostingCreated
      summary: 'Event: ATS Job Posting Created'
      description: Triggered when a job posting is created in Deel ATS, ahead of any job-board publication. The payload includes the posting `id`, `job_id`, title, and `status`.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsAtsJobPostingCreatedPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  atsJobPostings_webhookAtsJobPostingPublicationCreated:
    post:
      operationId: atsJobPostings_webhookAtsJobPostingPublicationCreated
      summary: 'Event: ATS Job Posting Publication Created'
      description: Triggered when a job posting begins publication to a specific job board.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsAtsJobPostingPublicationCreatedPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  atsJobPostings_webhookAtsJobPostingPublicationUpdated:
    post:
      operationId: atsJobPostings_webhookAtsJobPostingPublicationUpdated
      summary: 'Event: ATS Job Posting Publication Updated'
      description: Triggered when a job-board publication is updated. The payload includes the publication's current `state_slug`, along with the external reference and URL once the board has processed it.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsAtsJobPostingPublicationUpdatedPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  atsJobPostings_webhookAtsJobPostingUpdated:
    post:
      operationId: atsJobPostings_webhookAtsJobPostingUpdated
      summary: 'Event: ATS Job Posting Updated'
      description: Triggered when a job posting is updated. The payload reflects the posting's current state.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsAtsJobPostingUpdatedPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  contracts_webhookContractAmended:
    post:
      operationId: contracts_webhookContractAmended
      summary: 'Event: Contract Amended'
      description: Triggered when a contract amendment is applied. The payload describes the contract and its updated state, covering changes such as compensation, seniority, reporting line, or scope of work.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsContractAmendedPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  contracts_webhookContractCreated:
    post:
      operationId: contracts_webhookContractCreated
      summary: 'Event: Contract Created'
      description: Triggered when a contractor or EOR contract is created.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsContractCreatedPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  contracts_webhookContractDuplicated:
    post:
      operationId: contracts_webhookContractDuplicated
      summary: 'Event: Contract Duplicated'
      description: Triggered when a contract is duplicated. The payload describes the new contract and contract `id`.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsContractDuplicatedPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  contracts_webhookContractSignTeamMemberInvited:
    post:
      operationId: contracts_webhookContractSignTeamMemberInvited
      summary: 'Event: Contract Sign Team Member Invited'
      description: Triggered when a team member is invited into a contract-signing flow. The payload includes the `contract_oid`, `contract_name`, `invitee_id`, and `invitee_name`.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsContractSignTeamMemberInvitedPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  contracts_webhookContractStatusUpdated:
    post:
      operationId: contracts_webhookContractStatusUpdated
      summary: 'Event: Contract Status Updated'
      description: Triggered whenever a contract's status changes. The payload includes the contract's new `status`.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsContractStatusUpdatedPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  eor_webhookEorProjectAssignmentCheckinCreated:
    post:
      operationId: eor_webhookEorProjectAssignmentCheckinCreated
      summary: 'Event: EOR Project Assignment Checkin Created'
      description: Triggered when a recurring check-in for an EOR project assignment is created and becomes available to complete. The payload includes the contract `id`, check-in `type`, and `project_assignment_checkin_version`.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsEorProjectAssignmentCheckinCreatedPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  eor_webhookEorProjectAssignmentCreated:
    post:
      operationId: eor_webhookEorProjectAssignmentCreated
      summary: 'Event: EOR Project Assignment Created'
      description: Triggered when a project assignment for an EOR contract is created and ready for the client to review. The payload includes the contract context and `project_assignment_version`.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsEorProjectAssignmentCreatedPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  eor_webhookEorQuoteCreated:
    post:
      operationId: eor_webhookEorQuoteCreated
      summary: 'Event: EOR Quote Created'
      description: 'Triggered when an EOR quote is created. The payload includes the quote''s cost details: salary, employer costs, and currency, tied to the contract.'
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsEorQuoteCreatedPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  eorAmendments_webhookEorAmendmentStatusUpdated:
    post:
      operationId: eorAmendments_webhookEorAmendmentStatusUpdated
      summary: 'Event: EOR Amendment Status Updated'
      description: Triggered when an EOR amendment's status changes. The payload includes the amendment flow `id`, contract `id`, and the amendment's new `status`.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsEorAmendmentStatusUpdatedPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  eorPayslips_webhookEorPayslipsAvailable:
    post:
      operationId: eorPayslips_webhookEorPayslipsAvailable
      summary: 'Event: EOR Payslips Available'
      description: Triggered when one or more EOR payslips become available. Each payslip includes the worker `id`, pay period, and `status`.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsEorPayslipsAvailablePostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  globalPayroll_webhookGpPayslipsAvailable:
    post:
      operationId: globalPayroll_webhookGpPayslipsAvailable
      summary: 'Event: GP Payslips Available'
      description: Triggered when one or more Global Payroll payslips become available. Each payslip includes the worker `id`, pay period, and `status`.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsGpPayslipsAvailablePostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  globalPayroll_webhookGpTerminationConfirmed:
    post:
      operationId: globalPayroll_webhookGpTerminationConfirmed
      summary: 'Event: GP Termination Confirmed'
      description: Triggered when a Global Payroll termination is confirmed. The payload includes the worker and contract context.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsGpTerminationConfirmedPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  hris_webhookEmployeeCreatedContractor:
    post:
      operationId: hris_webhookEmployeeCreatedContractor
      summary: 'Event: Employee Created Contractor'
      description: Triggered when a contractor's contract has been signed and the worker record has been created. The payload includes the worker's name, email, country, and contract `id`.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsEmployeeCreatedContractorPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  hris_webhookEmployeeCreatedDirect:
    post:
      operationId: hris_webhookEmployeeCreatedDirect
      summary: 'Event: Employee Created Direct'
      description: Triggered when a direct employee record is created. The payload identifies the employee by HRIS profile `id`.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsEmployeeCreatedDirectPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  hris_webhookEmployeeCreatedEor:
    post:
      operationId: hris_webhookEmployeeCreatedEor
      summary: 'Event: Employee Created EOR'
      description: Triggered when an EOR employee record is created. Onboarding progress is reported as `onboarding.status.updated` events.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsEmployeeCreatedEorPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  hris_webhookEmployeeUpdatedDirect:
    post:
      operationId: hris_webhookEmployeeUpdatedDirect
      summary: 'Event: Employee Updated Direct'
      description: Triggered when direct employee information is updated. The payload reflects the employee's current state, covering whichever personal, job, or employment details changed.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsEmployeeUpdatedDirectPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  hris_webhookWorkerCreated:
    post:
      operationId: hris_webhookWorkerCreated
      summary: 'Event: Worker Created (SCIM)'
      description: Triggered when a worker record is created through SCIM provisioning. The payload follows SCIM conventions, including `schemas`, SCIM extension URNs, `user_name`, and `user_type`.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsWorkerCreatedPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  hris_webhookWorkerV2Created:
    post:
      operationId: hris_webhookWorkerV2Created
      summary: 'Event: Worker V2 Created'
      description: Triggered when a worker profile is created. The payload includes the profile `id`.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsWorkerV2CreatedPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  hris_webhookWorkerV2Deleted:
    post:
      operationId: hris_webhookWorkerV2Deleted
      summary: 'Event: Worker V2 Deleted'
      description: Triggered when a worker profile is deleted. The payload includes the profile `id`.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsWorkerV2DeletedPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  hris_webhookWorkerV2Updated:
    post:
      operationId: hris_webhookWorkerV2Updated
      summary: 'Event: Worker V2 Updated'
      description: Triggered when a worker profile's data changes, covering profile, contract, compensation, address, phone, custom fields, or position. The payload includes the profile `id`.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsWorkerV2UpdatedPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  immigration_webhookImmigrationCaseProcessStatusUpdate:
    post:
      operationId: immigration_webhookImmigrationCaseProcessStatusUpdate
      summary: 'Event: Immigration Case Process Status Update'
      description: Triggered when an immigration case process's status changes. The payload includes the case, its process, and the process's new `status`.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsImmigrationCaseProcessStatusUpdatePostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  immigration_webhookImmigrationCaseRenewalCreated:
    post:
      operationId: immigration_webhookImmigrationCaseRenewalCreated
      summary: 'Event: Immigration Case Renewal Created'
      description: Triggered when an expiring immigration document causes a renewal case to be created automatically. The payload includes the applicant, the contract, and the `expiring_document`.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsImmigrationCaseRenewalCreatedPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  invoiceAdjustments_webhookInvoiceAdjustmentCreated:
    post:
      operationId: invoiceAdjustments_webhookInvoiceAdjustmentCreated
      summary: 'Event: Invoice Adjustment Created'
      description: Triggered when an invoice adjustment is created, covering categories such as bonus, commission, deduction, expense, overtime, time off, and VAT. The payload includes the adjustment and its `status`.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsInvoiceAdjustmentCreatedPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  invoiceAdjustments_webhookInvoiceAdjustmentPendingForApproval:
    post:
      operationId: invoiceAdjustments_webhookInvoiceAdjustmentPendingForApproval
      summary: 'Event: Invoice Adjustment Pending For Approval'
      description: Triggered when an invoice adjustment requires approval. The payload includes the adjustment and its list of `approvers`.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsInvoiceAdjustmentPendingForApprovalPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  invoiceAdjustments_webhookInvoiceAdjustmentReviewed:
    post:
      operationId: invoiceAdjustments_webhookInvoiceAdjustmentReviewed
      summary: 'Event: Invoice Adjustment Reviewed'
      description: Triggered when an invoice adjustment is reviewed. The payload includes the review outcome in its `status`, either approved or denied.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsInvoiceAdjustmentReviewedPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  itAssets_webhookItAssetArchived:
    post:
      operationId: itAssets_webhookItAssetArchived
      summary: 'Event: IT Asset Archived'
      description: Triggered when an IT asset is archived, removing it from active assignment.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsItAssetArchivedPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  itAssets_webhookItAssetCreated:
    post:
      operationId: itAssets_webhookItAssetCreated
      summary: 'Event: IT Asset Created'
      description: Triggered when an IT asset is created. The payload includes the asset details, including purchase date and value where supplied.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsItAssetCreatedPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  itAssets_webhookItAssetLocationUpdated:
    post:
      operationId: itAssets_webhookItAssetLocationUpdated
      summary: 'Event: IT Asset Location Updated'
      description: Triggered when an IT asset's location changes. The payload includes the previous and new location in `from` and `to`.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsItAssetLocationUpdatedPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  itOrders_webhookItOrderCreated:
    post:
      operationId: itOrders_webhookItOrderCreated
      summary: 'Event: IT Order Created'
      description: Triggered when an IT order is created. The payload includes the order `id` and `status`.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsItOrderCreatedPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  itOrders_webhookItOrderUpdated:
    post:
      operationId: itOrders_webhookItOrderUpdated
      summary: 'Event: IT Order Updated'
      description: Triggered when an IT order is updated. The payload reflects the order's current state.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsItOrderUpdatedPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  learning_webhookEngageLearningJourneysAssignmentsCreated:
    post:
      operationId: learning_webhookEngageLearningJourneysAssignmentsCreated
      summary: 'Event: Engage Learning Journeys Assignments Created'
      description: Triggered when a learning-journey assignment is created. The payload includes the assignment details, including `due_at` where one is set.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsEngageLearningJourneysAssignmentsCreatedPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  learning_webhookEngageLearningJourneysAssignmentsReminded:
    post:
      operationId: learning_webhookEngageLearningJourneysAssignmentsReminded
      summary: 'Event: Engage Learning Journeys Assignments Reminded'
      description: Triggered when a reminder is sent for a learning-journey assignment. The payload includes the assignment details.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsEngageLearningJourneysAssignmentsRemindedPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  oauth_webhookOauth2TokenRevoked:
    post:
      operationId: oauth_webhookOauth2TokenRevoked
      summary: 'Event: Oauth2 Token Revoked'
      description: Triggered when an OAuth 2.0 token is revoked. The payload includes the `client_id`, scope, and token `status`.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsOauth2TokenRevokedPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  onboarding_webhookOnboardingChecklistUpdated:
    post:
      operationId: onboarding_webhookOnboardingChecklistUpdated
      summary: 'Event: Onboarding Checklist Updated'
      description: Triggered when an individual onboarding checklist step changes status. The payload includes the `step_id`, `old_status`, and new `status`; a single onboarding process produces one event per step.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsOnboardingChecklistUpdatedPostPayloadContentApplicationJsonSchemaData'
                timestamp:
                  type: string
      tags:
      - Endpoints
  onboarding_webhookOnboardingStatusUpdated:
    post:
      operationId: onboarding_webhookOnboardingStatusUpdated
      summary: 'Event: Onboarding Status Updated'
      description: Triggered when a worker's overall onboarding status changes, for example moving from invited, to onboarding, to complete. The payload includes the `old_status` and new `status`, along with the `hiring_type`.
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WebhooksEventsOnboardingStatusUpdatedPostPayloadContentApplicationJsonSchemaData'
