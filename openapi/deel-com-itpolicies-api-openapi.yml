openapi: 3.2.0
info:
  title: Endpoints It Policies API
  version: 1.0.0
  description: API endpoints related to IT policies.
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: itPolicies
  description: API endpoints related to IT policies.
paths:
  /it/policies/{it_policy_id}/assign:
    post:
      operationId: itPolicies_assignWorkersToItHardwarePolicy-v2026-09-17
      summary: Assign workers to an IT hardware policy
      description: 'Use this from onboarding or HRIS automations to put workers on the IT hardware policy that governs what equipment they can order; resolve the policy id via `GET /rest/it/policies`. Assigns the listed workers, identified by their Deel HRIS profile ids, to this policy. Accepts between 1 and 100 ids per call. The call is all-or-nothing: if any id is not found in your organization the whole request fails and no worker is moved. Workers already on the policy are left unchanged; for per-seat organizations, seat allocation follows your organization''s seat assignment setting.


        **Token scopes**: `it-policies:write`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2026-12-17.'
      tags:
      - itPolicies
      parameters:
      - name: it_policy_id
        in: path
        description: Unique identifier of the IT policy
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/ItPoliciesItPolicyIdAssignPostParametersXBeta'
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignWorkersToItHardwarePolicy-v2026-09-17RequestBadRequestError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignWorkersToItHardwarePolicy-v2026-09-17RequestUnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignWorkersToItHardwarePolicy-v2026-09-17RequestForbiddenError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignWorkersToItHardwarePolicy-v2026-09-17RequestNotFoundError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignWorkersToItHardwarePolicy-v2026-09-17RequestConflictError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignWorkersToItHardwarePolicy-v2026-09-17RequestInternalServerError'
      requestBody:
        description: Workers to assign
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/ItPoliciesItPolicyIdAssignPostRequestBodyContentApplicationJsonSchemaData'
                  description: Workers to assign to the IT policy.
              required:
              - data
      security:
      - deelToken: []
  /it/policies:
    get:
      operationId: itPolicies_listItHardwarePolicies-v2026-01-01
      summary: List IT hardware policies
      description: 'Lists your organization''s IT hardware policies, which cap what equipment each worker is eligible to order. Call this to resolve a worker''s policy and the products it allows before raising an equipment request on their behalf.


        **Token scopes**: `it-policies:read`'
      tags:
      - itPolicies
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IT_policies_listItHardwarePolicies-v2026-01-01_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListItHardwarePolicies-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListItHardwarePolicies-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
  /it/policies/{policy_id}/users:
    get:
      operationId: itPolicies_listItPolicyUsers-v2026-09-17
      summary: List users assigned to an IT policy
      description: 'Lists the workers assigned to one of your organization''s IT hardware policies. Use it to resolve which workers a policy applies to before raising equipment requests on their behalf, or to audit policy membership. Results are cursor-paginated.


        **Token scopes**: `it-policies:read`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2026-12-17.'
      tags:
      - itPolicies
      parameters:
      - name: policy_id
        in: path
        description: IT policy identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        description: Indicates where the next page of results starts, as returned in a paginated list response
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Return a page of results with given number of records
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: hris_profile_id
        in: query
        description: Filter by the worker's HRIS Profile ID, to find which policy a specific worker is attached to. Repeat the key to filter on multiple values.
        required: false
        schema:
          type: string
          format: uuid
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/ItPoliciesPolicyIdUsersGetParametersXBeta'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
