          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListItPolicyUsers-v2026-09-17RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListItPolicyUsers-v2026-09-17RequestNotFoundError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListItPolicyUsers-v2026-09-17RequestInternalServerError'
      security:
      - deelToken: []
