        description: Maximum number of records returned in one response
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ats-hiring-members_retrieveAtsHiringMembers_Response_200'
