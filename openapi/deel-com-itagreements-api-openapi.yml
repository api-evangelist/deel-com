openapi: 3.2.0
info:
  title: Endpoints It Agreements API
  version: 1.0.0
  description: API endpoints related to IT agreements.
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: itAgreements
  description: API endpoints related to IT agreements.
paths:
  /it/agreements/{agreement_id}/reassign:
    post:
      operationId: itAgreements_reassignItAgreement-v2026-09-17
      summary: Assign agreement to a new worker
      description: 'Use this when a worker leaves and their rented device should pass to a new joiner rather than return to Deel. Reassigns a rental agreement to a new HRIS profile via store-and-reuse. The caller picks a `variant_id` from `actions.reuse.details.reusable_variants` on `GET /rest/it/agreements/{agreement_id}` and supplies the new holder''s delivery address. Transitions `store_and_reuse.status` from `READY` to `IN_PROGRESS` and returns the updated agreement.


        **Token scopes**: `it-service-requests:write`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2026-12-17.'
      tags:
      - itAgreements
      parameters:
      - name: agreement_id
        in: path
        description: Unique identifier of the agreement
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/ItAgreementsAgreementIdReassignPostParametersXBeta'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IT_agreements_reassignItAgreement-v2026-09-17_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReassignItAgreement-v2026-09-17RequestBadRequestError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReassignItAgreement-v2026-09-17RequestUnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReassignItAgreement-v2026-09-17RequestForbiddenError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReassignItAgreement-v2026-09-17RequestNotFoundError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReassignItAgreement-v2026-09-17RequestConflictError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReassignItAgreement-v2026-09-17RequestInternalServerError'
      requestBody:
        description: Reassignment details
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/ItAgreementsAgreementIdReassignPostRequestBodyContentApplicationJsonSchemaData'
                  description: Reassignment payload.
              required:
              - data
      security:
      - deelToken: []
  /it/agreements:
    get:
      operationId: itAgreements_listItAgreements-v2026-09-15
      summary: List agreements
      description: 'Lists the rental agreements your organization holds with Deel, each with its current store-and-reuse state. Call this to find agreements whose device is free to hand to a different worker — an agreement in `store_and_reuse.status = READY` can be reassigned via `POST /rest/it/agreements/{agreement_id}/reassign`.


        **Token scopes**: `it-agreements:read`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2026-12-15.'
      tags:
      - itAgreements
      parameters:
      - name: cursor
        in: query
        description: Indicates where the next page of results starts, as returned in a paginated list response
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Return a page of results with given number of records
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: status
        in: query
        description: Filter agreements by status. Repeat the key to filter on multiple values.
        required: false
        schema:
          $ref: '#/components/schemas/ItAgreementsGetParametersStatus'
      - name: type
        in: query
        description: Filter agreements by type. Repeat the key to filter on multiple values.
        required: false
        schema:
          $ref: '#/components/schemas/ItAgreementsGetParametersType'
      - name: store_and_reuse_status
        in: query
        description: Filter rentals by store-and-reuse status. Repeat the key to filter on multiple values.
        required: false
        schema:
          $ref: '#/components/schemas/ItAgreementsGetParametersStoreAndReuseStatus'
      - name: hris_profile_id
        in: query
        description: Filter by the HRIS profile id currently holding the agreement.
        required: false
        schema:
          type: string
          format: uuid
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/ItAgreementsGetParametersXBeta'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IT_agreements_listItAgreements-v2026-09-15_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListItAgreements-v2026-09-15RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListItAgreements-v2026-09-15RequestInternalServerError'
      security:
      - deelToken: []
  /it/agreements/{agreement_id}:
    get:
      operationId: itAgreements_retrieveAnItAgreement-v2026-09-15
      summary: Retrieve an agreement
      description: 'Retrieves one rental agreement, including the reuse context needed to reassign it: `actions.reuse.details.reusable_variants` lists the device variants the next holder can receive. Call this before `POST /rest/it/agreements/{agreement_id}/reassign` to pick a `variant_id`.


        **Token scopes**: `it-agreements:read`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2026-12-15.'
      tags:
      - itAgreements
      parameters:
      - name: agreement_id
        in: path
        description: Unique identifier of the agreement
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/ItAgreementsAgreementIdGetParametersXBeta'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IT_agreements_retrieveAnItAgreement-v2026-09-15_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAnItAgreement-v2026-09-15RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAnItAgreement-v2026-09-15RequestNotFoundError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAnItAgreement-v2026-09-15RequestInternalServerError'
      security:
      - deelToken: []
