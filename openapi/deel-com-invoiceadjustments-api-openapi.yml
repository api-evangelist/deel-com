openapi: 3.2.0
info:
  title: Endpoints Invoice Adjustments API
  version: 1.0.0
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: invoiceAdjustments
paths:
  /invoice-adjustments:
    post:
      operationId: invoiceAdjustments_createInvoiceAdjustment
      summary: Create an invoice adjustment
      description: 'Creates an invoice adjustment — such as a bonus, commission, VAT percentage, or deduction — against a contract. Pass the `recurring` query parameter to apply the adjustment automatically to future invoices.


        **Token scopes**: `invoice-adjustments:write`, `worker:write`'
      tags:
      - invoiceAdjustments
      parameters:
      - name: recurring
        in: query
        description: Add this invoice adjustment as recurring
        required: false
        schema:
          type: string
      responses:
        '201':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/invoice-adjustments_createInvoiceAdjustment_Response_201'
        '400':
          description: Bad Request - The request payload failed validation or violated a business rule for invoice adjustments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAnInvoiceAdjustment-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Internal Server Error - The invoice adjustment could not be created due to an unexpected upstream or internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAnInvoiceAdjustment-v2026-01-01RequestInternalServerError'
      requestBody:
        description: InvoiceAdjustment object that needs to be created
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/InvoiceAdjustmentsPostRequestBodyContentApplicationJsonSchemaData'
                  description: Payload attributes required to create one invoice adjustment with optional approval, preset, and grouping metadata.
              required:
              - data
      security:
      - deelToken: []
    get:
      operationId: invoiceAdjustments_getInvoiceAdjustments
      summary: List invoice adjustments
      description: 'Returns invoice adjustments, optionally filtered by contract, adjustment type, status, invoice, reporter, or submission date range.


        **Token scopes**: `invoice-adjustments:read`'
      tags:
      - invoiceAdjustments
      parameters:
      - name: contract_id
        in: query
        description: Id of an Deel contract.
        required: false
        schema:
          type: string
      - name: contract_types
        in: query
        description: types of contracts to filter
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceAdjustmentsGetParametersContractTypesSchemaItems'
      - name: types
        in: query
        description: types of invoice adjustments to filter
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceAdjustmentsGetParametersTypesSchemaItems'
      - name: statuses
        in: query
        description: statuses of invoice adjustment to filter
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceAdjustmentsGetParametersStatusesSchemaItems'
      - name: invoice_id
        in: query
        description: ID of an existing invoice
        required: false
        schema:
          type: string
      - name: reporter_id
        in: query
        description: ID of an existing profile
        required: false
        schema:
          type: string
          format: uuid
      - name: date_from
        in: query
        description: 'To get invoice adjustments submitted on or after given start date (inclusive). Short date in format ISO-8601 (YYYY-MM-DD). For example: 2022-12-31.'
        required: false
        schema:
          type: string
          format: date
      - name: date_to
        in: query
        description: 'To get invoice adjustments submitted before given end date (excludes records submitted on this date). Short date in format ISO-8601 (YYYY-MM-DD). For example: 2022-12-31.'
        required: false
        schema:
          type: string
          format: date
      - name: limit
        in: query
        description: 'Return a page of results with given number of records; NOTE: technically ALL query parameters are strings or array of strings'
        required: false
        schema:
          type: string
          pattern: ^[1-9][0-9]?$|^100$
      - name: offset
        in: query
        description: 'Return a page of results after given index of row; NOTE: technically ALL query parameters are strings or array of strings'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/invoice-adjustments_getInvoiceAdjustments_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInvoiceAdjustments-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /invoice-adjustments/{id}:
    delete:
      operationId: invoiceAdjustments_deleteInvoiceAdjustment
      summary: Delete adjustment
      description: 'Permanently removes an invoice adjustment by its `id`.


        **Token scopes**: `invoice-adjustments:write`'
      tags:
      - invoiceAdjustments
      parameters:
      - name: id
        in: path
        description: Invoice adjustment id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/invoice-adjustments_deleteInvoiceAdjustment_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
    get:
      operationId: invoiceAdjustments_getInvoiceAdjustmentById
      summary: Invoice line item by Id
      description: 'Retrieves a single invoice line item by its `id`.


        **Token scopes**: `invoice-adjustments:read`, `worker:read`'
      tags:
      - invoiceAdjustments
      parameters:
      - name: id
        in: path
        description: ID of an existing invoice
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/invoice-adjustments_getInvoiceAdjustmentById_Response_200'
        '400':
          description: Fetch failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceLineItemById-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
    patch:
      operationId: invoiceAdjustments_updateInvoiceAdjustment
      summary: Update an invoice adjustment
      description: 'Updates an existing invoice adjustment in place. Use it when an adjustment needs correcting instead of deleting it and creating a new one. VAT adjustments cannot be edited and must be deleted and created again, and work adjustments can be edited only on ongoing time-based or pay-as-you-go time-based contracts, since other contracts manage them through timesheets.


        **Token scopes**: `invoice-adjustments:write`, `worker:write`'
      tags:
      - invoiceAdjustments
      parameters:
      - name: id
        in: path
        description: Invoice adjustment id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/invoice-adjustments_updateInvoiceAdjustment_Response_200'
        '400':
          description: Bad Request - The request payload failed validation or violated a business rule for the invoice adjustment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAnInvoiceAdjustment-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden - The requester does not have access to the specified invoice adjustment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAnInvoiceAdjustment-v2026-01-01RequestForbiddenError'
        '404':
          description: Not Found - The specified invoice adjustment does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAnInvoiceAdjustment-v2026-01-01RequestNotFoundError'
        '500':
          description: Internal Server Error - The invoice adjustment could not be updated due to an unexpected upstream or internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAnInvoiceAdjustment-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/InvoiceAdjustmentsIdPatchRequestBodyContentApplicationJsonSchemaData'
                  description: Details of adjustment to update
              required:
              - data
      security:
      - deelToken: []
  /contracts/{contract_id}/invoice-adjustments:
    get:
      operationId: invoiceAdjustments_getContractInvoiceAdjustments
      summary: Invoice line items by contract
      description: 'Retrieves invoice line items (adjustments) associated with a given contract_id, with support for filtering by contract type, adjustment type, status, invoice, reporter, and submission date range.


        **Token scopes**: `invoice-adjustments:read`'
      tags:
      - invoiceAdjustments
      parameters:
      - name: contract_id
        in: path
        description: Deel contract id.
        required: true
        schema:
          type: string
      - name: contract_types
        in: query
        description: types of contracts to filter
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ContractsContractIdInvoiceAdjustmentsGetParametersContractTypesSchemaItems'
      - name: types
        in: query
        description: types of invoice adjustments to filter
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ContractsContractIdInvoiceAdjustmentsGetParametersTypesSchemaItems'
      - name: statuses
        in: query
        description: statuses of invoice adjustment to filter
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ContractsContractIdInvoiceAdjustmentsGetParametersStatusesSchemaItems'
      - name: invoice_id
        in: query
        description: ID of an existing invoice
        required: false
        schema:
          type: string
      - name: reporter_id
        in: query
        description: ID of an existing profile
        required: false
        schema:
          type: string
          format: uuid
      - name: date_from
        in: query
        description: 'To get invoice adjustments submitted on or after given start date (inclusive).    Short date in format ISO-8601 (YYYY-MM-DD). For example: 2022-12-31.'
        required: false
        schema:
          type: string
          format: date
      - name: date_to
        in: query
        description: 'To get invoice adjustments submitted before given end date (excludes records submitted on this date).    Short date in format ISO-8601 (YYYY-MM-DD). For example: 2022-12-31.'
        required: false
        schema:
          type: string
          format: date
      - name: limit
        in: query
        description: 'Return a page of results with given number of records; NOTE: technically ALL query parameters are strings or array of strings'
        required: false
        schema:
          type: string
          pattern: ^[1-9][0-9]?$|^100$
      - name: offset
        in: query
        description: 'Return a page of results after given index of row; NOTE: technically ALL query parameters are strings or array of strings'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/invoice-adjustments_getContractInvoiceAdjustments_Response_200'
        '400':
          description: Bad Request - Validation error or invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceLineItemsByContract-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /invoice-adjustments/{id}/reviews:
    post:
      operationId: invoiceAdjustments_createInvoiceAdjustmentReview
      summary: Review a single invoice adjustment
      description: 'Submits an approve or decline review decision for a single invoice adjustment.


        **Token scopes**: `invoice-adjustments:write`'
      tags:
      - invoiceAdjustments
      parameters:
      - name: id
        in: path
        description: ID of an existing invoice adjustment.
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/invoice-adjustments_createInvoiceAdjustmentReview_Response_201'
        '400':
          description: Bad Request - The request payload failed validation or violated a business rule for the invoice adjustment review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateInvoiceAdjustmentById-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Not Found - The specified invoice adjustment could not be found for review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateInvoiceAdjustmentById-v2026-01-01RequestNotFoundError'
        '500':
          description: Internal Server Error - The invoice adjustment review could not be processed due to an unexpected upstream or internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateInvoiceAdjustmentById-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/InvoiceAdjustmentsIdReviewsPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
components:
  schemas:
    InvoiceAdjustmentsPostResponsesContentApplicationJsonSchemaErrorsItems:
      type: object
      properties:
        code:
          type: string
          description: Stable machine-readable error code identifying the upstream or internal failure category.
        message:
          type: string
          description: Human-readable error message describing the unexpected condition that prevented completing the request.
      required:
      - message
      title: InvoiceAdjustmentsPostResponsesContentApplicationJsonSchemaErrorsItems
    UpdateAnInvoiceAdjustment-v2026-01-01RequestForbiddenError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceAdjustmentsIdPatchResponsesContentApplicationJsonSchemaErrorsItems'
          description: Errors describing why the invoice adjustment could not be accessed.
      required:
      - errors
      title: UpdateAnInvoiceAdjustment-v2026-01-01RequestForbiddenError
    InvoiceAdjustmentsPostResponsesContentApplicationJsonSchemaDataId:
      oneOf:
      - type: string
      - type: integer
        format: int64
      description: Unique identifier returned for the created invoice adjustment resource after persistence succeeds.
      title: InvoiceAdjustmentsPostResponsesContentApplicationJsonSchemaDataId
    InvoiceAdjustmentsIdGetResponsesContentApplicationJsonSchemaDataApproversItems:
      type: object
      properties:
        email:
          type: string
          description: Email address of the approver.
        approved:
          type: boolean
          description: Whether the specific approver has approved the adjustment.
        full_name:
          type: string
          description: Full name of the approver.
      required:
      - approved
      title: InvoiceAdjustmentsIdGetResponsesContentApplicationJsonSchemaDataApproversItems
    InvoiceAdjustmentsGetResponsesContentApplicationJsonSchemaDataItemsWorksheet:
      type: object
      properties:
        days:
          type: number
          format: double
          description: Number of days reported.
        hours:
          type: number
          format: double
          description: Number of hours reported.
        weeks:
          type: number
          format: double
          description: Number of weeks reported.
        minutes:
          type: number
          format: double
          description: Number of minutes reported.
      required:
      - days
      - hours
      - weeks
      - minutes
      description: Breakdown of time used for time-based calculations.
      title: InvoiceAdjustmentsGetResponsesContentApplicationJsonSchemaDataItemsWorksheet
    ContractsContractIdInvoiceAdjustmentsGetResponsesContentApplicationJsonSchemaDataItemsContractType:
      type: string
      enum:
      - ongoing_time_based
      - milestones
      - time_based
      - pay_as_you_go_time_based
      - commission
      - payg_milestones
      - payg_tasks
      - eor
      - unknown
      - employee
      - global_payroll
      - shield_msa
      - hris_direct_employee
      - peo
      description: Type of a contract
      title: ContractsContractIdInvoiceAdjustmentsGetResponsesContentApplicationJsonSchemaDataItemsContractType
    InvoiceAdjustmentsIdGetResponsesContentApplicationJsonSchemaDataReviewedById:
      oneOf:
      - type: string
      - type: integer
        format: int64
      title: InvoiceAdjustmentsIdGetResponsesContentApplicationJsonSchemaDataReviewedById
    InvoiceAdjustmentsGetResponsesContentApplicationJsonSchemaDataItemsPaymentCycle:
      type: object
      properties:
        end:
          type:
          - string
          - 'null'
          format: date-time
          description: End date of the payment cycle.
        start:
          type:
          - string
          - 'null'
          format: date-time
          description: Start date of the payment cycle.
      description: Payment cycle associated with this adjustment.
      title: InvoiceAdjustmentsGetResponsesContentApplicationJsonSchemaDataItemsPaymentCycle
    ContractsContractIdInvoiceAdjustmentsGetResponsesContentApplicationJsonSchemaDataItemsReviewedById:
      oneOf:
      - type: string
      - type: integer
        format: int64
      description: Unique identifier of the reviewer (string or integer).
      title: ContractsContractIdInvoiceAdjustmentsGetResponsesContentApplicationJsonSchemaDataItemsReviewedById
    UpdateAnInvoiceAdjustment-v2026-01-01RequestNotFoundError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceAdjustmentsIdPatchResponsesContentApplicationJsonSchemaErrorsItems'
          description: Errors describing why the invoice adjustment could not be found.
      required:
      - errors
      title: UpdateAnInvoiceAdjustment-v2026-01-01RequestNotFoundError
    ContractsContractIdInvoiceAdjustmentsGetResponsesContentApplicationJsonSchemaDataItemsContract:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the contract.
        type:
          $ref: '#/components/schemas/ContractsContractIdInvoiceAdjustmentsGetResponsesContentApplicationJsonSchemaDataItemsContractType'
          description: Type of a contract
        title:
          type: string
          description: Human-readable title of the contract.
      required:
      - id
      - type
      - title
      description: Contract associated with this invoice adjustment.
      title: ContractsContractIdInvoiceAdjustmentsGetResponsesContentApplicationJsonSchemaDataItemsContract
    InvoiceAdjustmentsGetResponsesContentApplicationJsonSchemaDataItemsStatus:
      type: string
      enum:
      - approved
      - declined
      - not_payable
      - paid
      - pending
      - processing
      description: Current processing status of the invoice adjustment.
      title: InvoiceAdjustmentsGetResponsesContentApplicationJsonSchemaDataItemsStatus
    UpdateInvoiceAdjustmentById-v2026-01-01RequestInternalServerError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceAdjustmentsIdReviewsPostResponsesContentApplicationJsonSchemaErrorsItems'
          description: Generic upstream or internal errors emitted when the invoice adjustment review cannot be processed.
      required:
      - errors
      title: UpdateInvoiceAdjustmentById-v2026-01-01RequestInternalServerError
    InvoiceAdjustmentsIdGetResponsesContentApplicationJsonSchemaDataContractType:
      type: string
      enum:
      - ongoing_time_based
      - milestones
      - time_based
      - pay_as_you_go_time_based
      - commission
      - payg_milestones
      - payg_tasks
      - eor
      - unknown
      - employee
      - global_payroll
      - shield_msa
      - hris_direct_employee
      - peo
      description: Type of a contract
      title: InvoiceAdjustmentsIdGetResponsesContentApplicationJsonSchemaDataContractType
    InvoiceAdjustmentsGetResponsesContentApplicationJsonSchemaDataItemsContractType:
      type: string
      enum:
      - ongoing_time_based
      - milestones
      - time_based
      - pay_as_you_go_time_based
      - commission
      - payg_milestones
      - payg_tasks
      - eor
      - unknown
      - employee
      - global_payroll
      - shield_msa
      - hris_direct_employee
      - peo
      description: Type of the contract.
      title: InvoiceAdjustmentsGetResponsesContentApplicationJsonSchemaDataItemsContractType
    invoice-adjustments_getContractInvoiceAdjustments_Response_200:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ContractsContractIdInvoiceAdjustmentsGetResponsesContentApplicationJsonSchemaDataItems'
        page:
          $ref: '#/components/schemas/ContractsContractIdInvoiceAdjustmentsGetResponsesContentApplicationJsonSchemaPage'
          description: Pagination metadata for the response.
      required:
      - data
      - page
      title: invoice-adjustments_getContractInvoiceAdjustments_Response_200
    InvoiceAdjustmentsIdDeleteResponsesContentApplicationJsonSchemaData:
      type: object
      properties:
        deleted:
          type: boolean
          description: Confirms the deletion.
      required:
      - deleted
      title: InvoiceAdjustmentsIdDeleteResponsesContentApplicationJsonSchemaData
    ContractsContractIdInvoiceAdjustmentsGetResponsesContentApplicationJsonSchemaDataItemsWorksheet:
      type: object
      properties:
        days:
          type: number
          format: double
          minimum: 0
          description: Number of days reported.
        hours:
          type: number
          format: double
          minimum: 0
          description: Number of hours reported.
        weeks:
          type: number
          format: double
          minimum: 0
          description: Number of weeks reported.
        minutes:
          type: number
          format: double
          minimum: 0
          description: Number of minutes reported.
      required:
      - days
      - hours
      - weeks
      - minutes
      description: Breakdown of time worked across different units.
      title: ContractsContractIdInvoiceAdjustmentsGetResponsesContentApplicationJsonSchemaDataItemsWorksheet
    InvoiceAdjustmentsIdPatchResponsesContentApplicationJsonSchemaData:
      type: object
      properties:
        updated:
          type: boolean
          description: Confirms the update.
      required:
      - updated
      title: InvoiceAdjustmentsIdPatchResponsesContentApplicationJsonSchemaData
    InvoiceAdjustmentsIdReviewsPostRequestBodyContentApplicationJsonSchemaDataStatus:
      type: string
      enum:
      - approved
      - declined
      description: The status of the adjustment.
      title: InvoiceAdjustmentsIdReviewsPostRequestBodyContentApplicationJsonSchemaDataStatus
    InvoiceAdjustmentsIdGetResponsesContentApplicationJsonSchemaDataReviewedBy:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/InvoiceAdjustmentsIdGetResponsesContentApplicationJsonSchemaDataReviewedById'
        remarks:
          type: string
          description: Comments or notes left by the reviewer.
        full_name:
          type: string
          description: Full name of the reviewer.
        reviewed_at:
          type: string
          description: The timestamp when the review occurred.
      required:
      - id
      - remarks
      - reviewed_at
      description: The user who reviewed the adjustment.
      title: InvoiceAdjustmentsIdGetResponsesContentApplicationJsonSchemaDataReviewedBy
    ContractsContractIdInvoiceAdjustmentsGetResponsesContentApplicationJsonSchemaDataItemsType:
      type: string
      enum:
      - accrued_holiday
      - additional_fee
      - allowance
      - bonus
      - commission
