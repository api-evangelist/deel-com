openapi: 3.2.0
info:
  title: Deel Contractors Contractor Amendments API
  description: 'Independent Contractor (IC), Pay-As-You-Go, Milestone, and COR (Contractor of Record)

    APIs covering contract creation, amendments, bulk signing, timesheets, milestones,

    IC invoicing taxes, off-cycle payments, bonuses, expense reimbursements, and onboarding.'
  version: '2026-05-25'
  contact:
    name: Deel Developer Support
    url: https://developer.deel.com/api/contractors/introduction
servers:
- url: https://api.letsdeel.com/rest/v2
  description: Production
- url: https://api-sandbox.demo.deel.com/rest/v2
  description: Sandbox
security:
- BearerAuth: []
tags:
- name: Contractor Amendments
  description: Amend active contractor contracts
paths:
  /contracts/{contract_id}/amendments:
    post:
      operationId: createContractorAmendment
      summary: Create Contractor Amendment
      tags:
      - Contractor Amendments
      parameters:
      - name: contract_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractorAmendmentCreate'
      responses:
        '201':
          description: Amendment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractorAmendment'
  /contracts/{contract_id}/amendments/bulk-sign:
    post:
      operationId: bulkSignAmendments
      summary: Bulk Sign Contracts And Amendments
      description: Sign multiple contract amendments programmatically.
      tags:
      - Contractor Amendments
      parameters:
      - name: contract_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - amendment_ids
              properties:
                amendment_ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Amendments signed
          content:
            application/json:
              schema:
                type: object
                properties:
                  signed_count:
                    type: integer
components:
  schemas:
    ContractorAmendmentCreate:
      type: object
      required:
      - type
      - effective_date
      properties:
        type:
          type: string
          enum:
          - rate_change
          - scope_change
          - currency_change
          - term_extension
          - role_change
        effective_date:
          type: string
          format: date
        new_rate:
          type: number
        new_currency:
          type: string
        notes:
          type: string
    ContractorAmendment:
      type: object
      properties:
        id:
          type: string
        contract_id:
          type: string
        type:
          type: string
        status:
          type: string
          enum:
          - pending
          - approved
          - declined
          - signed
          - applied
        effective_date:
          type: string
          format: date
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
