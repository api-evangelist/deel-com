    ListEquityAwards-v2026-09-09RequestInternalServerError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/EquityAwardsGetResponsesContentApplicationJsonSchemaErrorsItems'
          description: List of errors that occurred while processing the request.
