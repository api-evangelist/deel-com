  /equity-participants:
    get:
      operationId: equityTokens_listEquityParticipants-v2026-09-08
      summary: List equity participants
      description: 'Retrieves the people who hold equity in an organization, as ingested from Shareworks, in ascending employee_number order. Use it to reconcile equity participants against HRIS records, or to feed worker identity and residence data into equity tax calculations. Records carry direct identifiers, including a full Social Security Number where the source reports one. Requires the `equities.view` permission at the organization level.


        **Token scopes**: `equities:read`'
