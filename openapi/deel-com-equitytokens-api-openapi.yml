          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /equity-option-ledger:
    get:
      operationId: equityTokens_listEquityOptionLedgerEntries-v2026-09-09
      summary: List equity option ledger entries
      description: 'Retrieves the full option holder ledger for an organization, as ingested from Shareworks, in ascending employee_grant_number order. Use it as the per-grant system of record: it carries the vested, unvested, exercised, cancelled, expired and outstanding share counts for every grant, plus grant agreement and disqualification dates. Records carry direct identifiers, including a tax identifier and a home address. Requires the `equities.view` permission at the organization level.


        **Token scopes**: `equities:read`'
      tags:
      - equityTokens
      parameters:
      - name: limit
        in: query
        description: Maximum number of records to return in this page.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        in: query
        description: Opaque pagination cursor returned as next_cursor by a previous response. Omit to fetch the first page.
        required: false
        schema:
          type: string
          maxLength: 2048
      - name: employee_number
        in: query
        description: Only return records for this exact Shareworks employee number.
        required: false
        schema:
          type: string
          maxLength: 64
      - name: employee_grant_number
        in: query
        description: Only return records for this exact Shareworks grant number.
        required: false
        schema:
          type: string
          maxLength: 100
      - name: grant_date_from
        in: query
        description: Only return records with a grant_date on or after this date (inclusive), in YYYY-MM-DD format.
        required: false
        schema:
          type: string
          format: date
      - name: grant_date_to
        in: query
        description: Only return records with a grant_date on or before this date (inclusive), in YYYY-MM-DD format.
        required: false
        schema:
          type: string
          format: date
