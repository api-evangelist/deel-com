        required: false
        schema:
          type: string
          format: date
      - name: grant_date_to
        in: query
        description: Only return records with a grant_date on or before this date (inclusive), in YYYY-MM-DD format.
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: List equity grant valuations returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equity_Tokens_listEquityValuations-v2026-09-09_Response_200'
        '400':
          description: Bad request — invalid or missing parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEquityValuations-v2026-09-09RequestBadRequestError'
        '401':
          description: Unauthorized — missing or invalid authentication token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEquityValuations-v2026-09-09RequestUnauthorizedError'
        '403':
          description: Forbidden — caller lacks the equities.view permission, or the caller's organization is not permitted to access this endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEquityValuations-v2026-09-09RequestForbiddenError'
        '404':
          description: Not found — the requested resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEquityValuations-v2026-09-09RequestNotFoundError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEquityValuations-v2026-09-09RequestInternalServerError'
      security:
      - deelToken: []
  /equity-grants:
    get:
      operationId: equityTokens_listEquityGrantsWithTaxEvents-v2026-08-10
      summary: List equity grants with tax events
      description: 'Retrieves the equity grants for an organization, each including its vesting events and associated tax events. Requires the `equities.view` permission at the organization level.


        **Token scopes**: `equities:read`'
      tags:
      - equityTokens
      parameters:
      - name: limit
        in: query
        description: Maximum number of grants to return
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      - name: offset
        in: query
        description: Number of grants to skip before starting to return results
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: search
        in: query
        description: Free-text search across grant/worker name and email
        required: false
        schema:
          type: string
          maxLength: 255
      responses:
        '200':
          description: A paginated list of equity grants, each including its vesting events and associated tax events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equity_Tokens_listEquityGrantsWithTaxEvents-v2026-08-10_Response_200'
        '400':
          description: One or more query parameters are invalid. See the errors array for detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEquityGrantsWithTaxEvents-v2026-08-10RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: The token does not grant `equities.view` at the organization level.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEquityGrantsWithTaxEvents-v2026-08-10RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
