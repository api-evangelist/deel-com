paths:
  /equities-tokens/tax-events:
    post:
      operationId: equityTokens_createEquityOrTokenTaxEvent-v2026-01-01
      summary: Create equity or token tax event
      description: 'Submits an equity or token tax event for an EOR worker enrolled in Equity & Token Services.


        **Token scopes**: `equities:write`'
      tags:
      - equityTokens
      responses:
        '201':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equity_Tokens_createEquityOrTokenTaxEvent-v2026-01-01_Response_201'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEquityOrTokenTaxEvent-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/EquitiesTokensTaxEventsPostRequestBodyContentApplicationJsonSchemaData'
      security:
      - deelToken: []
  /equity-awards:
    get:
      operationId: equityTokens_listEquityAwards-v2026-09-09
      summary: List equity awards granted
      description: 'Retrieves the equity awards an organization has granted, as ingested from Shareworks, in ascending employee_number order. Use it to reconcile what was granted to whom, with the grant quantity, price and fair market value at the grant date. This dataset identifies a grant by name and date rather than by grant number, so several records can share one employee and grant name; occurrence_index separates them. Requires the `equities.view` permission at the organization level.


        **Token scopes**: `equities:read`'
      tags:
      - equityTokens
      parameters:
      - name: limit
        in: query
        description: Maximum number of records to return in this page.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        in: query
        description: Opaque pagination cursor returned as next_cursor by a previous response. Omit to fetch the first page.
        required: false
        schema:
          type: string
          maxLength: 2048
      - name: employee_number
        in: query
        description: Only return records for this exact Shareworks employee number.
        required: false
        schema:
          type: string
          maxLength: 64
      - name: grant_date_from
        in: query
        description: Only return records with a grant_date on or after this date (inclusive), in YYYY-MM-DD format.
        required: false
        schema:
          type: string
          format: date
      - name: grant_date_to
        in: query
        description: Only return records with a grant_date on or before this date (inclusive), in YYYY-MM-DD format.
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: List equity awards granted returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equity_Tokens_listEquityAwards-v2026-09-09_Response_200'
        '400':
          description: Bad request — invalid or missing parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEquityAwards-v2026-09-09RequestBadRequestError'
        '401':
          description: Unauthorized — missing or invalid authentication token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEquityAwards-v2026-09-09RequestUnauthorizedError'
        '403':
          description: Forbidden — caller lacks the equities.view permission, or the caller's organization is not permitted to access this endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEquityAwards-v2026-09-09RequestForbiddenError'
        '404':
          description: Not found — the requested resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEquityAwards-v2026-09-09RequestNotFoundError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEquityAwards-v2026-09-09RequestInternalServerError'
      security:
      - deelToken: []
  /equity-amortizations:
    get:
      operationId: equityTokens_listEquityAmortizations-v2026-09-09
      summary: List equity grant expense amortization records
      description: 'Retrieves the period-by-period amortization of share-based compensation expense per equity grant in an organization, as ingested from Shareworks. Use it to build an expense recognition schedule, or to forecast the expense still to be accrued on outstanding grants. Each record reflects the most recently ingested reporting period; earlier periods are overwritten, so this is not a period history. Requires the `equities.view` permission at the organization level.


        **Token scopes**: `equities:read`'
      tags:
      - equityTokens
      parameters:
      - name: limit
        in: query
        description: Maximum number of records to return in this page.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        in: query
        description: Opaque pagination cursor returned as next_cursor by a previous response. Omit to fetch the first page.
        required: false
        schema:
          type: string
          maxLength: 2048
      - name: employee_number
        in: query
        description: Only return records for this exact Shareworks employee number.
        required: false
        schema:
          type: string
          maxLength: 64
      - name: employee_grant_number
        in: query
        description: Only return records for this exact Shareworks grant number.
        required: false
        schema:
          type: string
          maxLength: 100
      - name: grant_date_from
        in: query
        description: Only return records with a grant_date on or after this date (inclusive), in YYYY-MM-DD format.
        required: false
        schema:
          type: string
          format: date
      - name: grant_date_to
        in: query
        description: Only return records with a grant_date on or before this date (inclusive), in YYYY-MM-DD format.
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: List equity grant expense amortization records returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equity_Tokens_listEquityAmortizations-v2026-09-09_Response_200'
        '400':
          description: Bad request — invalid or missing parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEquityAmortizations-v2026-09-09RequestBadRequestError'
        '401':
          description: Unauthorized — missing or invalid authentication token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEquityAmortizations-v2026-09-09RequestUnauthorizedError'
        '403':
          description: Forbidden — caller lacks the equities.view permission, or the caller's organization is not permitted to access this endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEquityAmortizations-v2026-09-09RequestForbiddenError'
        '404':
          description: Not found — the requested resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEquityAmortizations-v2026-09-09RequestNotFoundError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEquityAmortizations-v2026-09-09RequestInternalServerError'
      security:
      - deelToken: []
