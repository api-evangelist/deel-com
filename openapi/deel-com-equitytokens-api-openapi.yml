  /equity-exercises:
    get:
      operationId: equityTokens_listEquityShareworksExercises-v2026-09-09
      summary: List Shareworks equity exercises
      description: 'Retrieves the equity exercises recorded for an organization, as ingested from Shareworks, in ascending exercise_date order. Use it to report realised option gains into payroll and tax withholding, or to reconcile exercise activity against a cap table. Each record carries the shares exercised, the strike price paid and the fair market value at exercise, so the gain can be recomputed rather than taken on trust. Requires the `equities.view` permission at the organization level.


        **Token scopes**: `equities:read`'
      tags:
      - equityTokens
      parameters:
      - name: limit
        in: query
        description: Maximum number of exercise records to return in this page.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        in: query
        description: Opaque pagination cursor returned as next_cursor by a previous response. Omit to fetch the first page.
        required: false
        schema:
          type: string
          maxLength: 2048
      - name: exercise_date_from
        in: query
        description: Only return exercises with an exercise_date on or after this date (inclusive), in YYYY-MM-DD format.
        required: false
        schema:
          type: string
          format: date
      - name: exercise_date_to
        in: query
        description: Only return exercises with an exercise_date on or before this date (inclusive), in YYYY-MM-DD format.
        required: false
        schema:
          type: string
          format: date
      - name: employee_number
        in: query
