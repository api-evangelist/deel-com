              schema:
                $ref: '#/components/schemas/ListEquityExpenses-v2026-09-09RequestBadRequestError'
        '401':
          description: Unauthorized — missing or invalid authentication token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEquityExpenses-v2026-09-09RequestUnauthorizedError'
        '403':
          description: Forbidden — caller lacks the equities.view permission, or the caller's organization is not permitted to access this endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEquityExpenses-v2026-09-09RequestForbiddenError'
        '404':
          description: Not found — the requested resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEquityExpenses-v2026-09-09RequestNotFoundError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEquityExpenses-v2026-09-09RequestInternalServerError'
      security:
      - deelToken: []
  /equity-valuations:
    get:
      operationId: equityTokens_listEquityValuations-v2026-09-09
      summary: List equity grant valuations
      description: 'Retrieves the expense valuation inputs for each equity grant in an organization, as ingested from Shareworks, in ascending employee_grant_number order. Use it to reproduce or audit a grant expense figure: it carries the valuation model, amortization method, fair value per share, forfeiture rate, and the volatility, expected life, risk-free rate and dividend yield assumptions behind them. Requires the `equities.view` permission at the organization level.


        **Token scopes**: `equities:read`'
      tags:
      - equityTokens
      parameters:
      - name: limit
        in: query
        description: Maximum number of records to return in this page.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        in: query
        description: Opaque pagination cursor returned as next_cursor by a previous response. Omit to fetch the first page.
        required: false
