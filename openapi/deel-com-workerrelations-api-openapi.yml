paths:
  /hris/worker_relations/profile/{hrisProfileOid}/parent:
    put:
      operationId: workerRelations_addWorkerRelationParent
      summary: Create a parent worker relation
      description: 'Creates or replaces the parent worker relation for the HrisProfile. If a parent relation already exists for this profile, it is overwritten with the supplied data.


        **Token scopes**: `profile:write`'
      tags:
      - workerRelations
      parameters:
      - name: hrisProfileOid
        in: path
        description: HrisProfile ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/HrisWorkerRelationsProfileHrisProfileOidParentPutRequestBodyContentApplicationJsonSchemaData'
      security:
      - deelToken: []
  /hris/worker_relations/profile/external/{profile_id}/parent:
    put:
      operationId: workerRelations_addWorkerRelationParentByExternalId
      summary: Create a parent worker relation with external id
      description: 'Sets or replaces the parent relationship for the specified HRIS profile, using external identifiers. Pass null as parent_profile_external_id to remove the existing parent relationship.


        **Token scopes**: `profile:write`'
      tags:
      - workerRelations
      parameters:
      - name: profile_id
        in: path
        description: HrisProfile external ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Bad request - The request body is invalid or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAParentWorkerRelationWithExternalId-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Not found - The HRIS profile, relationship type, or parent profile was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAParentWorkerRelationWithExternalId-v2026-01-01RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/HrisWorkerRelationsProfileExternalProfileIdParentPutRequestBodyContentApplicationJsonSchemaData'
                  description: The request payload containing parent relationship details.
      security:
      - deelToken: []
  /hris/worker_relations/profile:
    post:
      operationId: workerRelations_createWorkerRelationProfile
      summary: Create a worker relation
      description: 'Establishes a hierarchical relationship between a worker and one or more subordinates. The request body must identify both the parent worker and the subordinate profiles to be linked.


        **Token scopes**: `profile:write`'
      tags:
      - workerRelations
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/worker-relations_createWorkerRelationProfile_Response_201'
        '400':
          description: Bad request - The request body is invalid, missing required fields, or a circular relationship was detected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAWorkerRelation-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Not found - The parent profile, child profile, or relationship type was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAWorkerRelation-v2026-01-01RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/HrisWorkerRelationsProfilePostRequestBodyContentApplicationJsonSchemaData'
                  description: The request payload containing the relationship details.
      security:
      - deelToken: []
