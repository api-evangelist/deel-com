openapi: 3.2.0
info:
  title: Endpoints Worker Relations API
  version: 1.0.0
  description: API endpoints related to Worker Relations.
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
