openapi: 3.2.0
info:
  title: Endpoints On Demand Payroll API
  version: 1.0.0
  description: API endpoints related to On-Demand Payroll.
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: onDemandPayroll
  description: API endpoints related to On-Demand Payroll.
paths:
  /on-demand-payroll/{odp_id}/entries/attach:
    patch:
      operationId: onDemandPayroll_attachOnDemandPayrollEntries-v2026-07-31
      summary: Attach entries to On-Demand Payroll
      description: 'Attaches existing eligible entries to an On-Demand Payroll that is awaiting client review before submission.


        **Token scopes**: `on-demand-payroll:write`'
      tags:
      - onDemandPayroll
      parameters:
      - name: odp_id
        in: path
        description: Public ID of the On-Demand Payroll.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The updated On-Demand Payroll.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/On-Demand_Payroll_attachOnDemandPayrollEntries-v2026-07-31_Response_200'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachOnDemandPayrollEntries-v2026-07-31RequestBadRequestError'
        '401':
          description: Authentication is required or has failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachOnDemandPayrollEntries-v2026-07-31RequestUnauthorizedError'
        '403':
          description: The caller is not allowed to perform this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachOnDemandPayrollEntries-v2026-07-31RequestForbiddenError'
        '404':
          description: On-Demand Payroll not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachOnDemandPayrollEntries-v2026-07-31RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        description: Existing entries to attach to the On-Demand Payroll.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/OnDemandPayrollOdpIdEntriesAttachPatchRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
  /on-demand-payroll/{odp_id}/cancel:
    post:
      operationId: onDemandPayroll_cancelOnDemandPayroll-v2026-07-31
      summary: Cancel On-Demand Payroll
      description: 'Cancels an On-Demand Payroll, optionally keeping the specified entries available for a future regular payroll cycle.


        **Token scopes**: `on-demand-payroll:write`'
      tags:
      - onDemandPayroll
      parameters:
      - name: odp_id
        in: path
        description: Public ID of the On-Demand Payroll.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: On-Demand Payroll cancelled successfully.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelOnDemandPayroll-v2026-07-31RequestBadRequestError'
        '401':
          description: Authentication is required or has failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelOnDemandPayroll-v2026-07-31RequestUnauthorizedError'
        '403':
          description: The caller is not allowed to perform this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelOnDemandPayroll-v2026-07-31RequestForbiddenError'
        '404':
          description: On-Demand Payroll not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelOnDemandPayroll-v2026-07-31RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        description: Optionally, the entries to keep when cancelling the ODP.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/OnDemandPayrollOdpIdCancelPostRequestBodyContentApplicationJsonSchemaData'
      security:
      - deelToken: []
  /on-demand-payroll/contract/{contract_id}:
    post:
      operationId: onDemandPayroll_createOnDemandPayroll-v2026-07-28
      summary: Create On-Demand Payroll
      description: 'Creates an On-Demand Payroll for the given contract from existing eligible entries and/or a salary advance amount.


        **Token scopes**: `on-demand-payroll:write`'
      tags:
      - onDemandPayroll
      parameters:
      - name: contract_id
        in: path
        description: Public ID (oid) of the contract.
        required: true
        schema:
          type: string
      responses:
        '201':
          description: The created On-Demand Payroll.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/On-Demand_Payroll_createOnDemandPayroll-v2026-07-28_Response_201'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOnDemandPayroll-v2026-07-28RequestBadRequestError'
        '401':
          description: Authentication is required or has failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOnDemandPayroll-v2026-07-28RequestUnauthorizedError'
        '403':
          description: The caller is not allowed to perform this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOnDemandPayroll-v2026-07-28RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        description: Entries and/or salary advance to include in the new On-Demand Payroll.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/OnDemandPayrollContractContractIdPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
  /on-demand-payroll/{odp_id}/entries/detach:
    patch:
      operationId: onDemandPayroll_detachOnDemandPayrollEntries-v2026-07-31
      summary: Detach entries from On-Demand Payroll
      description: 'Detaches entries from an On-Demand Payroll, keeping or removing the specified entries before the ODP is submitted.


        **Token scopes**: `on-demand-payroll:write`'
      tags:
      - onDemandPayroll
      parameters:
      - name: odp_id
        in: path
        description: Public ID of the On-Demand Payroll.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Entries detached successfully.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetachOnDemandPayrollEntries-v2026-07-31RequestBadRequestError'
        '401':
          description: Authentication is required or has failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetachOnDemandPayrollEntries-v2026-07-31RequestUnauthorizedError'
        '403':
          description: The caller is not allowed to perform this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetachOnDemandPayrollEntries-v2026-07-31RequestForbiddenError'
        '404':
          description: On-Demand Payroll not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetachOnDemandPayrollEntries-v2026-07-31RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        description: Entries to keep and/or to delete from the On-Demand Payroll.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/OnDemandPayrollOdpIdEntriesDetachPatchRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
  /on-demand-payroll/contract/{contract_id}/entries:
    get:
      operationId: onDemandPayroll_listOnDemandPayrollEntries-v2026-07-16
      summary: List On-Demand Payroll entries
      description: 'Use this endpoint to discover which adjustments are currently eligible for On-Demand Payroll on a contract, together with the contract''s eligibility details and limits. Call it before creating an On-Demand Payroll or attaching entries to an existing one: the returned entry IDs are the values you pass as existing_entry_ids.


        **Token scopes**: `on-demand-payroll:read`'
      tags:
      - onDemandPayroll
      parameters:
      - name: contract_id
        in: path
        description: Public ID (oid) of the contract.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Eligible entries grouped by contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/On-Demand_Payroll_listOnDemandPayrollEntries-v2026-07-16_Response_200'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOnDemandPayrollEntries-v2026-07-16RequestBadRequestError'
        '401':
          description: Authentication is required or has failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOnDemandPayrollEntries-v2026-07-16RequestUnauthorizedError'
        '403':
          description: The caller is not allowed to perform this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOnDemandPayrollEntries-v2026-07-16RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /on-demand-payroll/contract/{contract_id}/current:
    get:
      operationId: onDemandPayroll_retrieveCurrentOnDemandPayroll-v2026-07-16
      summary: Retrieve current On-Demand Payroll
      description: 'Retrieves the active On-Demand Payroll for the given contract, including its status, SLAs, invoice and attached entries.


        **Token scopes**: `on-demand-payroll:read`'
      tags:
      - onDemandPayroll
      parameters:
      - name: contract_id
        in: path
        description: Public ID (oid) of the contract.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The active On-Demand Payroll for the contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/On-Demand_Payroll_retrieveCurrentOnDemandPayroll-v2026-07-16_Response_200'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveCurrentOnDemandPayroll-v2026-07-16RequestBadRequestError'
        '401':
          description: Authentication is required or has failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveCurrentOnDemandPayroll-v2026-07-16RequestUnauthorizedError'
        '403':
          description: The caller is not allowed to perform this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveCurrentOnDemandPayroll-v2026-07-16RequestForbiddenError'
        '404':
          description: No active On-Demand Payroll for the contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveCurrentOnDemandPayroll-v2026-07-16RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /on-demand-payroll/{odp_id}/submit:
    post:
      operationId: onDemandPayroll_submitOnDemandPayroll-v2026-07-17
      summary: Submit On-Demand Payroll
      description: 'Submits an On-Demand Payroll for Deel processing after the client has reviewed and approved all of its entries.


        **Token scopes**: `on-demand-payroll:write`'
      tags:
      - onDemandPayroll
      parameters:
      - name: odp_id
        in: path
        description: Public ID of the On-Demand Payroll.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: On-Demand Payroll submitted successfully.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitOnDemandPayroll-v2026-07-17RequestBadRequestError'
        '401':
          description: Authentication is required or has failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitOnDemandPayroll-v2026-07-17RequestUnauthorizedError'
        '403':
          description: The caller is not allowed to perform this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitOnDemandPayroll-v2026-07-17RequestForbiddenError'
        '404':
          description: On-Demand Payroll not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitOnDemandPayroll-v2026-07-17RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
components:
  schemas:
    RetrieveCurrentOnDemandPayroll-v2026-07-16RequestForbiddenError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/OnDemandPayrollContractContractIdCurrentGetResponsesContentApplicationJsonSchemaErrorsItems'
          description: List of errors.
      required:
      - errors
      title: RetrieveCurrentOnDemandPayroll-v2026-07-16RequestForbiddenError
    OnDemandPayrollContractContractIdCurrentGetResponsesContentApplicationJsonSchemaDataStatus:
      type: string
      enum:
      - AWAITING_CLIENT_APPROVAL
      - AWAITING_CLIENT_SUBMISSION
      - AWAITING_ADJUSTMENTS_TO_BE_READY
      - AWAITING_DEEL_PROCESSING
      - DEEL_PROCESSING
      - REJECTED
      - CANCELLED
      - PARTIALLY_APPROVED
      - APPROVED
      description: Lifecycle status of the ODP.
      title: OnDemandPayrollContractContractIdCurrentGetResponsesContentApplicationJsonSchemaDataStatus
    On-Demand_Payroll_listOnDemandPayrollEntries-v2026-07-16_Response_200:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OnDemandPayrollContractContractIdEntriesGetResponsesContentApplicationJsonSchemaDataItems'
          description: List of contracts with their eligible entries.
      required:
      - data
      title: On-Demand Payroll_listOnDemandPayrollEntries-v2026-07-16_Response_200
    DetachOnDemandPayrollEntries-v2026-07-31RequestBadRequestError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/OnDemandPayrollOdpIdEntriesDetachPatchResponsesContentApplicationJsonSchemaErrorsItems'
          description: List of errors.
      required:
      - errors
      title: DetachOnDemandPayrollEntries-v2026-07-31RequestBadRequestError
    OnDemandPayrollContractContractIdPostResponsesContentApplicationJsonSchemaDataEntriesItemsUom:
      type: string
      enum:
      - CURRENCY
      description: Unit of measure of the entry amount. Always CURRENCY.
      title: OnDemandPayrollContractContractIdPostResponsesContentApplicationJsonSchemaDataEntriesItemsUom
    SubmitOnDemandPayroll-v2026-07-17RequestUnauthorizedError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/OnDemandPayrollOdpIdSubmitPostResponsesContentApplicationJsonSchemaErrorsItems'
          description: List of errors.
      required:
      - errors
      title: SubmitOnDemandPayroll-v2026-07-17RequestUnauthorizedError
    OnDemandPayrollOdpIdCancelPostRequestBodyContentApplicationJsonSchemaData:
      type: object
      properties:
        move_to_regular:
          type: array
          items:
            type: string
          description: Public IDs of the entries to move to the regular payroll cycle instead of cancelling them with the ODP.
      title: OnDemandPayrollOdpIdCancelPostRequestBodyContentApplicationJsonSchemaData
    OnDemandPayrollContractContractIdPostResponsesContentApplicationJsonSchemaDataEntriesItemsMetadata:
      type: object
      properties:
        type:
          type: string
          description: The adjustment type of the entry.
        public_id:
          type: string
          description: Public ID of the underlying adjustment.
        reviewed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the last review of the entry.
        vendor_name:
          type:
          - string
          - 'null'
          description: Vendor associated with the entry, when applicable.
        category_label:
          type:
          - string
          - 'null'
          description: Label of the adjustment category.
        submission_date:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when the entry was submitted.
        category_group_label:
          type:
          - string
          - 'null'
          description: Label of the adjustment category group.
      description: Additional, non-contractual metadata about the entry.
      title: OnDemandPayrollContractContractIdPostResponsesContentApplicationJsonSchemaDataEntriesItemsMetadata
    OnDemandPayrollOdpIdEntriesAttachPatchResponsesContentApplicationJsonSchemaData:
      type: object
      properties:
        id:
          type: string
          description: Public ID of the On-Demand Payroll.
        sla:
          $ref: '#/components/schemas/OnDemandPayrollOdpIdEntriesAttachPatchResponsesContentApplicationJsonSchemaDataSla'
          description: Processing SLAs (in days) configured for the contract EOR entity.
        status:
          $ref: '#/components/schemas/OnDemandPayrollOdpIdEntriesAttachPatchResponsesContentApplicationJsonSchemaDataStatus'
          description: Lifecycle status of the ODP.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/OnDemandPayrollOdpIdEntriesAttachPatchResponsesContentApplicationJsonSchemaDataEntriesItems'
          description: Entries currently attached to the ODP.
        invoice_id:
          type:
          - string
          - 'null'
          description: Public ID of the invoice associated with the ODP, when one has been generated. Use the Invoices API to fetch its details.
        submitted_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when the ODP was submitted, when submitted.
        submitted_by:
          type:
          - string
          - 'null'
          description: Name of the person who submitted the ODP, when submitted.
        deel_reviewed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when Deel reviewed the ODP, when reviewed.
        estimated_payday:
          type:
          - string
          - 'null'
          format: date
          description: Estimated payday for the ODP (YYYY-MM-DD).
        next_available_payment_date:
          type:
          - string
          - 'null'
          format: date
          description: Next available payment date for the EOR contract (YYYY-MM-DD), when applicable.
      required:
      - id
      - sla
      - status
      - entries
      description: An On-Demand Payroll for a contract.
      title: OnDemandPayrollOdpIdEntriesAttachPatchResponsesContentApplicationJsonSchemaData
    CancelOnDemandPayroll-v2026-07-31RequestNotFoundError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/OnDemandPayrollOdpIdCancelPostResponsesContentApplicationJsonSchemaErrorsItems'
          description: List of errors.
      required:
      - errors
      title: CancelOnDemandPayroll-v2026-07-31RequestNotFoundError
    OnDemandPayrollContractContractIdCurrentGetResponsesContentApplicationJsonSchemaDataEntriesItemsMetadata:
      type: object
      properties:
        type:
          type: string
          description: The adjustment type of the entry.
        public_id:
          type: string
          description: Public ID of the underlying adjustment.
        reviewed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the last review of the entry.
        vendor_name:
          type:
          - string
          - 'null'
          description: Vendor associated with the entry, when applicable.
        category_label:
          type:
          - string
          - 'null'
          description: Label of the adjustment category.
        submission_date:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when the entry was submitted.
        category_group_label:
          type:
          - string
          - 'null'
          description: Label of the adjustment category group.
      description: Additional, non-contractual metadata about the entry.
      title: OnDemandPayrollContractContractIdCurrentGetResponsesContentApplicationJsonSchemaDataEntriesItemsMetadata
    RetrieveCurrentOnDemandPayroll-v2026-07-16RequestUnauthorizedError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/OnDemandPayrollContractContractIdCurrentGetResponsesContentApplicationJsonSchemaErrorsItems'
          description: List of errors.
      required:
      - errors
      title: RetrieveCurrentOnDemandPayroll-v2026-07-16RequestUnauthorizedError
    OnDemandPayrollOdpIdCancelPostResponsesContentApplicationJsonSchemaErrorsItems:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable error code.
        field:
          type: string
          description: Field that caused the error, when applicable.
        message:
          type: string
          description: Human-readable error message.
      title: OnDemandPayrollOdpIdCancelPostResponsesContentApplicationJsonSchemaErrorsItems
    OnDemandPayrollContractContractIdEntriesGetResponsesContentApplicationJsonSchemaDataItemsEntriesItemsSubmitter:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          description: Public ID of the submitter, when available.
        name:
          type: string
          description: Full name of the submitter.
      description: The person who submitted the entry.
      title: OnDemandPayrollContractContractIdEntriesGetResponsesContentApplicationJsonSchemaDataItemsEntriesItemsSubmitter
    OnDemandPayrollContractContractIdPostResponsesContentApplicationJsonSchemaDataSla:
      type: object
      properties:
        payment_buffer:
          type:
          - integer
          - 'null'
          description: Payment buffer in days.
        payment_processing:
          type:
          - integer
          - 'null'
          description: Payment processing SLA in days.
        payment_settlement:
          type:
          - integer
          - 'null'
          description: Payment settlement SLA in days.
        payroll_processing:
          type:
          - integer
          - 'null'
          description: Payroll processing SLA in days.
        post_termination_buffer:
          type:
          - integer
          - 'null'
          description: Post-termination buffer in days during which an ODP is still allowed.
      description: Processing SLAs (in days) configured for the contract EOR entity.
      title: OnDemandPayrollContractContractIdPostResponsesContentApplicationJsonSchemaDataSla
    ListOnDemandPayrollEntries-v2026-07-16RequestForbiddenError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/OnDemandPayrollContractContractIdEntriesGetResponsesContentApplicationJsonSchemaErrorsItems'
          description: List of errors.
      required:
      - errors
      title: ListOnDemandPayrollEntries-v2026-07-16RequestForbiddenError
    AttachOnDemandPayrollEntries-v2026-07-31RequestNotFoundError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/OnDemandPayrollOdpIdEntriesAttachPatchResponsesContentApplicationJsonSchemaErrorsItems'
          description: List of errors.
      required:
      - errors
      title: AttachOnDemandPayrollEntries-v2026-07-31RequestNotFoundError
    OnDemandPayrollContractContractIdEntriesGetResponsesContentApplicationJsonSchemaDataItems:
      type: object
      properties:
        team:
          oneOf:
          - $ref: '#/components/schemas/OnDemandPayrollContractContractIdEntriesGetResponsesContentApplicationJsonSchemaDataItemsTeam'
          - type: 'null'
          description: Team the contract belongs to.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/OnDemandPayrollContractContractIdEntriesGetResponsesContentApplicationJsonSchemaDataItemsEntriesItems'
          description: Eligible entries for the contract.
        currency:
          type: string
          description: ISO 4217 currency code of the contract.
        job_title:
          type:
          - string
          - 'null'
          description: Job title of the employee.
        odp_limit:
          type: number
          format: double
          description: Maximum total ODP amount allowed, in the contract currency.
        contract_id:
          type: string
          description: Public ID (oid) of the contract.
