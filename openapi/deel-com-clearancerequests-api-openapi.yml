openapi: 3.2.0
info:
  title: Endpoints Clearance Requests API
  version: 1.0.0
  description: API endpoints related to Clearance requests.
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: clearanceRequests
  description: API endpoints related to Clearance requests.
paths:
  /it/clearance-requests/{clearance_request_id}/decide:
    post:
      operationId: clearanceRequests_decideAClearanceRequest-v2026-09-17
      summary: Approve or reject quotes on a clearance request
      description: 'Approves or rejects each item in a clearance request that is `PENDING_DECISION`. Every request item currently in the clearance request must be included in the payload. When every item is rejected the clearance request is cancelled. Accepted items move on to collection and hand-off to the clearance partner.


        **Token scopes**: `it-service-requests:write`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2026-12-17.'
      tags:
      - clearanceRequests
      parameters:
      - name: clearance_request_id
        in: path
        description: Unique identifier of the clearance request
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/ItClearanceRequestsClearanceRequestIdDecidePostParametersXBeta'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clearance_requests_decideAClearanceRequest-v2026-09-17_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecideAClearanceRequest-v2026-09-17RequestBadRequestError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecideAClearanceRequest-v2026-09-17RequestUnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecideAClearanceRequest-v2026-09-17RequestForbiddenError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecideAClearanceRequest-v2026-09-17RequestNotFoundError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecideAClearanceRequest-v2026-09-17RequestConflictError'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecideAClearanceRequest-v2026-09-17RequestUnprocessableEntityError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecideAClearanceRequest-v2026-09-17RequestInternalServerError'
      requestBody:
        description: Per-item decisions for the clearance request
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/ItClearanceRequestsClearanceRequestIdDecidePostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
  /it/clearance-requests/{clearance_request_id}/cancel:
    post:
      operationId: clearanceRequests_cancelAClearanceRequest-v2026-09-15
      summary: Cancel a clearance request
      description: 'Cancels a clearance request belonging to your organization. Only clearance requests in `PENDING_QUOTE` or `PENDING_DECISION` status can be cancelled. Cancelling reverts every associated asset back to active tracking.


        **Token scopes**: `it-service-requests:write`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2026-12-15.'
      tags:
      - clearanceRequests
      parameters:
      - name: clearance_request_id
        in: path
        description: Unique identifier of the clearance request
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/ItClearanceRequestsClearanceRequestIdCancelPostParametersXBeta'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clearance_requests_cancelAClearanceRequest-v2026-09-15_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelAClearanceRequest-v2026-09-15RequestBadRequestError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelAClearanceRequest-v2026-09-15RequestUnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelAClearanceRequest-v2026-09-15RequestForbiddenError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelAClearanceRequest-v2026-09-15RequestNotFoundError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelAClearanceRequest-v2026-09-15RequestConflictError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelAClearanceRequest-v2026-09-15RequestInternalServerError'
      security:
      - deelToken: []
  /it/assets/{asset_id}/clear:
    post:
      operationId: clearanceRequests_clearItAsset-v2026-09-17
      summary: Create a clearance request for an asset
      description: 'Retires a device at end of life, for resale value or certified data erasure. Creates a clearance request for the given asset so it can be recovered, resold, or written off. The referenced manager is recorded as the requester and receives lifecycle notifications. Clearance must be enabled for the organization.


        **Token scopes**: `it-service-requests:write`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2026-12-17.'
      tags:
      - clearanceRequests
      parameters:
      - name: asset_id
        in: path
        description: Unique identifier of the IT asset
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/ItAssetsAssetIdClearPostParametersXBeta'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clearance_requests_clearItAsset-v2026-09-17_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearItAsset-v2026-09-17RequestBadRequestError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearItAsset-v2026-09-17RequestUnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearItAsset-v2026-09-17RequestForbiddenError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearItAsset-v2026-09-17RequestNotFoundError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearItAsset-v2026-09-17RequestConflictError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearItAsset-v2026-09-17RequestInternalServerError'
      requestBody:
        description: Clearance request details
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/ItAssetsAssetIdClearPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
  /it/clearance-requests:
    get:
      operationId: clearanceRequests_listClearanceRequests-v2026-09-16
      summary: List clearance requests
      description: 'Lists the clearance requests your organization has raised to retire devices for resale value or certified data erasure. Use it to find requests waiting on you — those in `PENDING_DECISION` need a response via `POST /rest/it/clearance-requests/{clearance_request_id}/decide` before their assets move on to collection.


        **Token scopes**: `it-service-requests:read`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2026-12-16.'
      tags:
      - clearanceRequests
      parameters:
      - name: cursor
        in: query
        description: Indicates where the next page of results starts, as returned in a paginated list response
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Return a page of results with given number of records
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: status
        in: query
        description: Filter clearance requests by their status. Repeat the key to filter on multiple values.
        required: false
        schema:
          $ref: '#/components/schemas/ItClearanceRequestsGetParametersStatus'
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/ItClearanceRequestsGetParametersXBeta'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clearance_requests_listClearanceRequests-v2026-09-16_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListClearanceRequests-v2026-09-16RequestBadRequestError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListClearanceRequests-v2026-09-16RequestUnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListClearanceRequests-v2026-09-16RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListClearanceRequests-v2026-09-16RequestInternalServerError'
      security:
      - deelToken: []
  /it/clearance-requests/{clearance_request_id}:
    get:
      operationId: clearanceRequests_retrieveAClearanceRequest-v2026-09-15
      summary: Retrieve a clearance request
      description: 'Retrieves one clearance request with the status of each item being cleared. Call this once a quote lands to review what each asset is worth before approving or rejecting items via `POST /rest/it/clearance-requests/{clearance_request_id}/decide`.


        **Token scopes**: `it-service-requests:read`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2026-12-15.'
      tags:
      - clearanceRequests
      parameters:
      - name: clearance_request_id
        in: path
        description: Unique identifier of the clearance request
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/ItClearanceRequestsClearanceRequestIdGetParametersXBeta'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clearance_requests_retrieveAClearanceRequest-v2026-09-15_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAClearanceRequest-v2026-09-15RequestBadRequestError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAClearanceRequest-v2026-09-15RequestUnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAClearanceRequest-v2026-09-15RequestForbiddenError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAClearanceRequest-v2026-09-15RequestNotFoundError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAClearanceRequest-v2026-09-15RequestInternalServerError'
      security:
      - deelToken: []
