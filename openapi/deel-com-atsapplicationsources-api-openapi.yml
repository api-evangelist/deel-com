tags:
- name: atsApplicationSources
paths:
  /ats/application-sources:
    get:
      operationId: atsApplicationSources_retrieveAListOfAtsApplicationSources
      summary: Retrieve a list of ATS application sources
      description: 'Returns a paginated list of the application sources configured in the ATS. Use it to discover the valid source slugs for the `source_slugs` filter when listing applications, and to interpret the `source_slug` returned on an application.


        **Token scopes**: `ats:read`, `worker:read`'
      tags:
      - atsApplicationSources
      parameters:
      - name: cursor
        in: query
        description: Cursor for pagination
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of records returned in one response
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Successfully retrieved application sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ats-application-sources_retrieveAListOfAtsApplicationSources_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAListOfAtsApplicationSources-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden. ATS is not enabled for this organization or insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAListOfAtsApplicationSources-v2026-01-01RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAListOfAtsApplicationSources-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
