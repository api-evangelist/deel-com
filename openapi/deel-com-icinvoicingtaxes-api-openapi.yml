openapi: 3.2.0
info:
  title: Endpoints Ic Invoicing Taxes API
  version: 1.0.0
  description: API endpoints related to IC invoicing taxes.
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: icInvoicingTaxes
  description: API endpoints related to IC invoicing taxes.
paths:
  /contracts/{contract_id}/ic-invoicing-taxes:
    post:
      operationId: icInvoicingTaxes_createIcInvoicingTax-v2026-01-01
      summary: Create IC invoicing tax
      description: 'Creates an invoicing tax entry for an independent contractor contract.


        **Token scopes**: `invoice-adjustments:write`'
      tags:
      - icInvoicingTaxes
      parameters:
      - name: contract_id
        in: path
        description: Deel Contract ID
        required: true
        schema:
          type: string
      responses:
        '201':
          description: IC tax successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IC_invoicing_taxes_createIcInvoicingTax-v2026-01-01_Response_201'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateIcInvoicingTax-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateIcInvoicingTax-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/ContractsContractIdIcInvoicingTaxesPostRequestBodyContentApplicationJsonSchemaData'
      security:
      - deelToken: []
    get:
      operationId: icInvoicingTaxes_getIcInvoicingTaxes-v2026-01-01
      summary: Get IC invoicing taxes
      description: 'Retrieves the VAT and withholding tax settings configured for an independent contractor contract.


        **Token scopes**: `invoice-adjustments:read`'
      tags:
      - icInvoicingTaxes
      parameters:
      - name: contract_id
        in: path
        description: Deel Contract ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: IC invoicing taxes response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IC_invoicing_taxes_getIcInvoicingTaxes-v2026-01-01_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetIcInvoicingTaxes-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetIcInvoicingTaxes-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
    patch:
      operationId: icInvoicingTaxes_updateIcInvoicingTax-v2026-01-01
      summary: Update IC invoicing tax
      description: 'Applies a partial update to the invoicing tax for an independent contractor contract; accepts `tax_type` (WITHHOLDING_TAX or VAT) and `percentage` to modify how taxes are calculated on future invoices.


        **Token scopes**: `invoice-adjustments:write`'
      tags:
      - icInvoicingTaxes
      parameters:
      - name: contract_id
        in: path
        description: Deel Contract ID
        required: true
        schema:
          type: string
      responses:
        '204':
          description: IC tax successfully updated
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Bad Request - The request payload failed validation or violated a business rule for the IC invoicing tax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateIcInvoicingTax-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Not Found - The specified contract does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateIcInvoicingTax-v2026-01-01RequestNotFoundError'
        '500':
          description: Internal Server Error - The IC invoicing tax could not be updated due to an unexpected upstream or internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateIcInvoicingTax-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/ContractsContractIdIcInvoicingTaxesPatchRequestBodyContentApplicationJsonSchemaData'
                  description: IC invoicing tax fields to update on the contract.
      security:
      - deelToken: []
  /contracts/{contract_id}/ic-invoicing-taxes/{tax_type}:
    delete:
      operationId: icInvoicingTaxes_deleteIcInvoicingTax-v2026-01-01
      summary: Delete IC invoicing tax
      description: 'Permanently removes the specified `tax_type` from the contract''s invoicing tax configuration; this action is irreversible and takes effect on future invoices.


        **Token scopes**: `invoice-adjustments:write`'
      tags:
      - icInvoicingTaxes
      parameters:
      - name: contract_id
        in: path
        description: Deel Contract ID
        required: true
        schema:
          type: string
      - name: tax_type
        in: path
        description: IC tax type
        required: true
        schema:
          $ref: '#/components/schemas/ContractsContractIdIcInvoicingTaxesTaxTypeDeleteParametersTaxType'
      responses:
        '204':
          description: IC tax successfully deleted
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Bad Request - The request payload failed validation or violated a business rule for the IC invoicing tax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteIcInvoicingTax-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Not Found - The specified contract does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteIcInvoicingTax-v2026-01-01RequestNotFoundError'
        '500':
          description: Internal Server Error - The IC invoicing tax could not be deleted due to an unexpected upstream or internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteIcInvoicingTax-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
