openapi: 3.2.0
info:
  title: Endpoints Organization Structure API
  version: 1.0.0
  description: API endpoints related to Organization structure.
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: organizationStructure
  description: API endpoints related to Organization structure.
paths:
  /hris/organization_structures:
    post:
      operationId: organizationStructure_createOrganizationStructure
      summary: Create a new HRIS Organization Structure
      description: 'Creates a new organization structure within the HRIS, returning the created record including its assigned `id` and `organization_id`. The `is_multi_select` and `enable_roles` flags on the request body control whether the structure supports multiple team assignments and role management respectively.


        **Token scopes**: `organizations:write`'
      tags:
      - organizationStructure
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/organization-structure_createOrganizationStructure_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateANewHrisOrganizationStructure-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateANewHrisOrganizationStructure-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/HrisOrganizationStructuresPostRequestBodyContentApplicationJsonSchemaData'
      security:
      - deelToken: []
    get:
      operationId: organizationStructure_getOrganizationStructures
      summary: Get Organization Structures
      description: 'Returns the organization''s hierarchical structure, including departments and teams, with offset-based pagination.


        **Token scopes**: `organizations:read`'
      tags:
      - organizationStructure
      parameters:
      - name: offset
        in: query
        description: Return a page of results with given number of records.
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
          maximum: 999999999
          default: 0
      - name: limit
        in: query
        description: Return a page of results with given number of records.
        required: false
        schema:
          type: number
          format: double
          minimum: 1
          maximum: 200
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/organization-structure_getOrganizationStructures_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /hris/organization_structures/{hris_org_structure_id}:
    delete:
      operationId: organizationStructure_deleteOrganizationStructure
      summary: Delete an Org Structure from the Organization
      description: 'Delete an Org Structure from the Organization. Use the force flag to bypass validation checks and remove the structure even when profiles are still assigned to it.


        **Token scopes**: `organizations:write`'
      tags:
      - organizationStructure
      parameters:
      - name: hris_org_structure_id
        in: path
        description: Org Structure
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/organization-structure_deleteOrganizationStructure_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAnOrgStructureFromTheOrganization-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAnOrgStructureFromTheOrganization-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
    get:
      operationId: organizationStructure_getOrganizationStructure
      summary: Get Organization Structure
      description: 'Retrieves detailed information about a specific organizational structure including its teams and roles.


        **Token scopes**: `organizations:read`'
      tags:
      - organizationStructure
      parameters:
      - name: hris_org_structure_id
        in: path
        description: HRIS Organization Structure ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/organization-structure_getOrganizationStructure_Response_200'
        '400':
          description: Bad request - The provided hrisOrgStructureId is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchAnOrgStructureFromTheOrganization-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Not found - No organization structure exists for the provided ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchAnOrgStructureFromTheOrganization-v2026-01-01RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
    patch:
      operationId: organizationStructure_updateOrganizationStructure
      summary: Update an existing HRIS Org Structure
      description: 'Update an existing HRIS Org Structure including its name, settings, and teams hierarchy.


        **Token scopes**: `organizations:write`'
      tags:
      - organizationStructure
      parameters:
      - name: hris_org_structure_id
        in: path
        description: Org Structure
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/organization-structure_updateOrganizationStructure_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAnExistingHrisOrgStructure-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAnExistingHrisOrgStructure-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/HrisOrganizationStructuresHrisOrgStructureIdPatchRequestBodyContentApplicationJsonSchemaData'
      security:
      - deelToken: []
  /hris/organization_structures/external/{external_id}:
    delete:
      operationId: organizationStructure_deleteOrganizationStructureByExternalId
      summary: Delete an Org Structure from the Organization by external ID
      description: 'Permanently removes an organization structure from the organization.


        **Token scopes**: `organizations:write`'
      tags:
      - organizationStructure
      parameters:
      - name: external_id
        in: path
        description: External ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/organization-structure_deleteOrganizationStructureByExternalId_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
    get:
      operationId: organizationStructure_getOrganizationStructureByExternalId
      summary: Get Organization Structure by External ID
      description: 'Fetches a single organization structure, returning associated roles and teams alongside structure metadata.


        **Token scopes**: `organizations:read`'
      tags:
      - organizationStructure
      parameters:
      - name: external_id
        in: path
        description: External ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/organization-structure_getOrganizationStructureByExternalId_Response_200'
        '400':
          description: Bad request - The provided hrisOrgStructureId is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchAnOrgStructureFromTheOrganization-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Not found - No organization structure exists for the provided ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchAnOrgStructureFromTheOrganization-v2026-01-01RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
    patch:
      operationId: organizationStructure_updateOrganizationStructureByExternalId
      summary: Update an existing HRIS Org Structure by external ID
      description: 'Applies a partial update to an existing organization structure. Only fields provided in the request body are modified; omitted fields retain their current values.


        **Token scopes**: `organizations:write`'
      tags:
      - organizationStructure
      parameters:
      - name: external_id
        in: path
        description: External ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/organization-structure_updateOrganizationStructureByExternalId_Response_200'
        '400':
          description: Bad request - The request body is invalid or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAnExistingHrisOrgStructureByExternalId-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Not found - No organization structure exists for the provided externalId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAnExistingHrisOrgStructureByExternalId-v2026-01-01RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/HrisOrganizationStructuresExternalExternalIdPatchRequestBodyContentApplicationJsonSchemaData'
      security:
      - deelToken: []
  /people/{id}/department:
    put:
      operationId: organizationStructure_updatePersonDepartment
      summary: Update organization structure
      description: 'Assigns a worker to a department by their HRIS profile ID. By default the new assignment appends to existing positions; set `replace_other_positions` to true to replace all current positions instead.


        **Token scopes**: `people:write`'
      tags:
      - organizationStructure
      parameters:
      - name: id
        in: path
        description: Hris profile ID
        required: true
        schema:
          type: string
      - name: replace_other_positions
        in: query
        description: Indicates if this department position should replace all other positions or only append to the existing ones.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/organization-structure_updatePersonDepartment_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/PeopleIdDepartmentPutRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
  /hris/organization-structures/teams/{team_id}/custom-fields:
    patch:
      operationId: organizationStructure_updateTeamCustomFields
      summary: Update Team Custom Fields
      tags:
      - organizationStructure
      parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
components:
