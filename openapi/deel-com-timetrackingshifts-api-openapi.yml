openapi: 3.2.0
info:
  title: Endpoints Time Tracking Shifts API
  version: 1.0.0
  description: API endpoints related to Time Tracking Shifts.
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: timeTrackingShifts
  description: API endpoints related to Time Tracking Shifts.
paths:
  /v2/time_tracking/shifts/raw:
    post:
      operationId: timeTrackingShifts_createTimeTrackingShiftsRaw
      summary: Create raw time tracking shifts
      description: 'Create raw shifts for the specified contract ID. "Raw shifts" refers to uncategorized entries—simply submit the clock-in and clock-out times. The classification of those hours (e.g., regular or overtime) will be handled by the Deel platform.


        **Token scopes**: `time-tracking:write`'
      tags:
      - timeTrackingShifts
      responses:
        '201':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/time-tracking-shifts_createTimeTrackingShiftsRaw_Response_201'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        description: Request body for creating raw shifts
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/V2TimeTrackingShiftsRawPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
  /v2/time_tracking/shifts:
    post:
      operationId: timeTrackingShifts_createTimeTrackingShifts
      summary: Create shifts
      description: 'Creates multiple time tracking shifts for a contract, supporting both regular shift submissions and corrections that adjust hours for previously processed shifts. The contract must be a Global Payroll contract. A correction shift must reference, via `shift_reference_id`, an already-exported regular shift on the same contract; only one correction per referenced shift is allowed, and a correction cannot be submitted once the payroll cycle it falls in has closed.


        **Token scopes**: `time-tracking:write`'
      tags:
      - timeTrackingShifts
      responses:
        '201':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/time-tracking-shifts_createTimeTrackingShifts_Response_201'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        description: Request body to create time tracking shifts supporting regular shifts and correction shifts.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/V2TimeTrackingShiftsPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
    get:
      operationId: timeTrackingShifts_getTimeTrackingShifts
      summary: List of shifts
      description: 'Retrieve a paginated list of shifts with details such as start and end times, breaks, metadata, and summary metrics. Supports pagination through `limit` and `offset` query parameters and filtering by `contractId`, date range (`fromDate` and `toDate`).


        **Token scopes**: `time-tracking:read`'
      tags:
      - timeTrackingShifts
      parameters:
      - name: limit
        in: query
        description: Limit the number of results
        required: false
        schema:
          type: integer
          maximum: 200
          exclusiveMinimum: 0
      - name: offset
        in: query
        description: Offset for pagination
        required: false
        schema:
          type: integer
          minimum: 0
      - name: from_date
        in: query
        description: Filter shifts from this date (YYYY-MM-DD)
        required: false
        schema:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
      - name: to_date
        in: query
        description: Filter shifts until this date (YYYY-MM-DD)
        required: false
        schema:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
      - name: contract_id
        in: query
        description: Filter shifts by one or more contract IDs
        required: false
        schema:
          type: array
          items:
            type: string
      - name: contract_id[]
        in: query
        description: Filter shifts by one or more contract IDs.
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Successful response with paginated shifts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/time-tracking-shifts_getTimeTrackingShifts_Response_200'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /time_tracking/shifts/{external_id}:
    delete:
      operationId: timeTrackingShifts_deleteTimeTrackingShiftByExternalId
      summary: Delete a Shift by External ID
      description: 'Permanently deletes a shift identified by its external_id. Once deleted, the shift cannot be retrieved or modified. Deletion is blocked once the payroll cycle the shift belongs to has closed.


        **Token scopes**: `time-tracking:write`'
      tags:
      - timeTrackingShifts
      parameters:
      - name: external_id
        in: path
        description: The unique external identifier of the shift to be deleted.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Shift deleted successfully. No content is returned.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
    get:
      operationId: timeTrackingShifts_getTimeTrackingShiftByExternalId
      summary: Get Shift details
      description: 'Retrieves the details of a specific shift.


        **Token scopes**: `time-tracking:read`'
      tags:
      - timeTrackingShifts
      parameters:
      - name: external_id
        in: path
        description: Unique identifier of the shift to retrieve.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Shift details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/time-tracking-shifts_getTimeTrackingShiftByExternalId_Response_200'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetShiftDetails-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
    patch:
      operationId: timeTrackingShifts_updateTimeTrackingShiftByExternalId
      summary: Update a shift
      description: 'Applies a partial update to an existing shift, modifying only the fields supplied in the request body. Fields omitted from the request are left unchanged. Correction shifts cannot be updated through this endpoint, the update is blocked once the payroll cycle the shift belongs to has closed, and `summary.shift_rate_external_id` cannot be repointed to a shift rate of a different type than the shift currently has.


        **Token scopes**: `time-tracking:write`'
      tags:
      - timeTrackingShifts
      parameters:
      - name: external_id
        in: path
        description: Unique identifier of the shift to be updated.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Shift updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/time-tracking-shifts_updateTimeTrackingShiftByExternalId_Response_200'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        description: Request body for updating a shift
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/TimeTrackingShiftsExternalIdPatchRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
  /v2/time_tracking/shifts/bulk-delete:
    post:
      operationId: timeTrackingShifts_deleteMultipleShiftsByExternalId-v2026-01-01
      summary: Delete multiple shifts by External ID
      description: 'Permanently deletes multiple shifts in a single call using their external IDs; once deleted, the shifts cannot be retrieved or modified. Deletion is blocked once the payroll cycle a shift belongs to has closed. The call is all-or-nothing: if any referenced shift has a closed payroll cycle or cannot be found, no shifts are deleted and the request fails.


        **Token scopes**: `time-tracking:write`'
      tags:
      - timeTrackingShifts
      responses:
        '200':
          description: Shifts deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Time_Tracking_Shifts_deleteMultipleShiftsByExternalId-v2026-01-01_Response_200'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        description: Request body to bulk delete shifts by their external IDs.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/V2TimeTrackingShiftsBulkDeletePostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
