openapi: 3.2.0
info:
  title: Deel Global Payroll Time Tracking API
  description: 'Global Payroll APIs for direct employees on the client''s own legal entities across

    120+ countries. Covers payroll events/cycles, gross-to-net adjustments (bonuses,

    deductions, one-time payments, expense reimbursements), time-tracking shifts,

    payslips/paystubs, and Global Payroll hiring.'
  version: '2026-05-25'
  contact:
    name: Deel Developer Support
    url: https://developer.deel.com/api/global-payroll/introduction
servers:
- url: https://api.letsdeel.com/rest/v2
  description: Production
- url: https://api-sandbox.demo.deel.com/rest/v2
  description: Sandbox
security:
- BearerAuth: []
tags:
- name: Time Tracking
  description: Time tracking shifts for Global Payroll employees
paths:
  /gp/time-tracking/shifts:
    get:
      operationId: getShifts
      summary: List Time Tracking Shifts
      tags:
      - Time Tracking
      parameters:
      - name: worker_id
        in: query
        schema:
          type: string
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Shifts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Shift'
    post:
      operationId: createShift
      summary: Create Shift
      tags:
      - Time Tracking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftCreate'
      responses:
        '201':
          description: Shift created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'
  /v2/time_tracking/shift_rates:
    post:
      operationId: timeTracking_createTimeTrackingShiftRate
      summary: Create a New Shift Rate
      description: 'Create a new shift rate with the specified attributes such as name, type, value, and a unique external identifier.


        **Token scopes**: `time-tracking:write`'
      tags:
      - Time Tracking
      responses:
        '201':
          description: Shift rate created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/time-tracking_createTimeTrackingShiftRate_Response_201'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        description: Details of the shift rate to create.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/V2TimeTrackingShiftRatesPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
    get:
      operationId: timeTracking_getTimeTrackingShiftRates
      summary: Retrieve a Paginated List of Shift Rates
      description: 'Retrieve a paginated list of shift rates, including details such as rate name, type, value, and timestamps. Pagination parameters can be used to control the size and position of the result set.


        **Token scopes**: `time-tracking:read`'
      tags:
      - Time Tracking
      parameters:
      - name: limit
        in: query
        description: Limit the number of results
        required: false
        schema:
          type: integer
          maximum: 200
          exclusiveMinimum: 0
      - name: offset
        in: query
        description: Offset for pagination
        required: false
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: Paginated list of shift rates retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/time-tracking_getTimeTrackingShiftRates_Response_200'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /time_tracking/shift_rates/{external_id}:
    delete:
      operationId: timeTracking_deleteTimeTrackingShiftRateByExternalId
      summary: Delete a Shift Rate by external ID
      description: 'Deletes a shift rate identified by its external_id, which is the custom identifier assigned at creation time. Deletion is blocked if the shift rate is currently associated with any active shift.


        **Token scopes**: `time-tracking:write`'
      tags:
      - Time Tracking
      parameters:
      - name: external_id
        in: path
        description: external ID
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Successfully deleted
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
    get:
      operationId: timeTracking_getTimeTrackingShiftRateByExternalId
      summary: Retrieve a Shift Rate by External ID
      description: 'Retrieves a shift rate.


        **Token scopes**: `time-tracking:read`'
      tags:
      - Time Tracking
      parameters:
      - name: external_id
        in: path
        description: The unique external identifier of the shift rate to retrieve.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Shift rate retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/time-tracking_getTimeTrackingShiftRateByExternalId_Response_200'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
    patch:
      operationId: timeTracking_updateTimeTrackingShiftRateByExternalId
      summary: Update a Shift Rate
      description: 'Updates the name, type, or value of an existing shift rate. This is rejected once the rate is referenced by any shift — remove or reassign those shifts first.


        **Token scopes**: `time-tracking:write`'
      tags:
      - Time Tracking
      parameters:
      - name: external_id
        in: path
        description: Unique identifier of the shift rate to be updated.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Shift rate updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/time-tracking_updateTimeTrackingShiftRateByExternalId_Response_200'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAShiftRate-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        description: Update an existing shift rate policy
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/TimeTrackingShiftRatesExternalIdPatchRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
  /time-tracking/timesheets/upload-url:
    post:
      operationId: timeTracking_getTimeTrackingTimesheetsUploadUrl
      summary: Generate timesheet upload url
      description: 'Accepts timesheet file metadata and returns a pre-signed `upload_url` together with a new timesheet record `id`. Currently limited to EOR contracts.


        **Token scopes**: `time-tracking:write`'
      tags:
      - Time Tracking
      responses:
        '201':
          description: Timesheet created successfully. Returns upload URL, upload form fields, and timesheet ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/time-tracking_getTimeTrackingTimesheetsUploadUrl_Response_201'
        '400':
          description: Bad request. Validation or business rule violation (e.g., non-EOR contract, invalid date range).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateTimesheetUploadUrl-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateTimesheetUploadUrl-v2026-01-01RequestNotFoundError'
        '422':
          description: Unprocessable entity. Business logic constraint violation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateTimesheetUploadUrl-v2026-01-01RequestUnprocessableEntityError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        description: timesheet information needed for uploading timesheet file
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/TimeTrackingTimesheetsUploadUrlPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
  /time-tracking/timesheets/{timesheet_id}:
    get:
      operationId: timeTracking_getTimeTrackingTimesheetById
      summary: Retrieve a timesheet
      description: 'Retrieves a timesheet by `timesheet_id`, including its submission, review, and processing status. Pass `expand=file_data` to include file name and download URL in the response.


        **Token scopes**: `time-tracking:read`'
      tags:
      - Time Tracking
      parameters:
      - name: timesheet_id
        in: path
        description: ID of the timesheet to fetch file for
        required: true
        schema:
          type: string
          format: uuid
      - name: extend
        in: query
        description: Optional list of fields to extend in the response. Currently only `file_data` is supported, which includes file details (file_id, file_name) and download URL.
        required: false
        schema:
          type: string
          maxLength: 100
      responses:
        '200':
          description: Timesheet retrieved successfully. Returns timesheet details including validation errors if applicable. When extend=file_data, also includes file_data object with file details and download URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/time-tracking_getTimeTrackingTimesheetById_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Timesheet not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveATimesheet-v2026-01-01RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /time-tracking/timesheets/{timesheet_id}/review:
    post:
      operationId: timeTracking_reviewTimeTrackingTimesheet
      summary: Review a submitted timesheet
      description: 'Approves or rejects a submitted timesheet; only timesheets in `PENDING_REVIEW` status are eligible, and all associated hours are approved or rejected as a single operation.


        **Token scopes**: `time-tracking:write`'
      tags:
      - Time Tracking
      parameters:
      - name: timesheet_id
        in: path
        description: ID of the timesheet to review
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Timesheet reviewed successfully. Returns updated timesheet details with review status and review timestamp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/time-tracking_reviewTimeTrackingTimesheet_Response_201'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Timesheet not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewASubmittedTimesheet-v2026-01-01RequestNotFoundError'
        '422':
          description: Unprocessable entity. Timesheet cannot be reviewed in its current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewASubmittedTimesheet-v2026-01-01RequestUnprocessableEntityError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        description: Review information for the timesheet. review_reason is required when review_status is REJECTED.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/TimeTrackingTimesheetsTimesheetIdReviewPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
components:
  schemas:
    ShiftCreate:
      type: object
      required:
      - worker_id
      - start_at
      - end_at
      properties:
        worker_id:
          type: string
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        break_minutes:
          type: integer
        notes:
          type: string
    Shift:
      type: object
      properties:
        id:
          type: string
        worker_id:
          type: string
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        break_minutes:
          type: integer
        notes:
          type: string
        status:
          type: string
          enum:
          - draft
          - submitted
          - approved
          - declined
    time-tracking_createTimeTrackingShiftRate_Response_201:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/V2TimeTrackingShiftRatesPostResponsesContentApplicationJsonSchemaData'
      required:
      - data
      description: Shift rate policy response
      title: time-tracking_createTimeTrackingShiftRate_Response_201
    V2TimeTrackingShiftRatesGetResponsesContentApplicationJsonSchemaDataItemsType:
      type: string
      enum:
      - MULTIPLIER_PERCENTAGE
      - PER_HOUR_FLAT_RATE
      - PER_UNIT_FLAT_RATE
      description: Type of the shift rate
      title: V2TimeTrackingShiftRatesGetResponsesContentApplicationJsonSchemaDataItemsType
    TimeTrackingTimesheetsTimesheetIdGetResponsesContentApplicationJsonSchemaData:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the timesheet
        end_date:
          type: string
          format: date
          description: End date of the timesheet period
        file_data:
          oneOf:
          - $ref: '#/components/schemas/TimeTrackingTimesheetsTimesheetIdGetResponsesContentApplicationJsonSchemaDataFileData'
          - type: 'null'
          description: Present only when `extend=file_data` is provided. Contains file details and download URL.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the timesheet was created
        start_date:
          type: string
          format: date
          description: Start date of the timesheet period
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the timesheet was last updated
        contract_id:
          type: string
          description: External id of the worker's contract associated with the timesheet
        review_status:
          $ref: '#/components/schemas/TimeTrackingTimesheetsTimesheetIdGetResponsesContentApplicationJsonSchemaDataReviewStatus'
          description: Current status of the timesheet review
        submission_status:
          $ref: '#/components/schemas/TimeTrackingTimesheetsTimesheetIdGetResponsesContentApplicationJsonSchemaDataSubmissionStatus'
          description: Current status of the timesheet submission
        validation_errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TimeTrackingTimesheetsTimesheetIdGetResponsesContentApplicationJsonSchemaDataValidationErrorsItems'
          description: Array of validation errors found during timesheet processing. Null if no errors found.
      required:
      - id
      - end_date
      - created_at
      - start_date
      - updated_at
      - contract_id
      - review_status
      - submission_status
      - validation_errors
      description: Timesheet data including validation errors if applicable. When extend=file_data, also includes file_data object with file details and download URL.
      title: TimeTrackingTimesheetsTimesheetIdGetResponsesContentApplicationJsonSchemaData
    ReviewASubmittedTimesheet-v2026-01-01RequestNotFoundError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/TimeTrackingTimesheetsTimesheetIdReviewPostResponsesContentApplicationJsonSchemaErrorsItems'
      required:
      - errors
      title: ReviewASubmittedTimesheet-v2026-01-01RequestNotFoundError
    time-tracking_getTimeTrackingTimesheetsUploadUrl_Response_201:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/TimeTrackingTimesheetsUploadUrlPostResponsesContentApplicationJsonSchemaData'
      required:
      - data
      title: time-tracking_getTimeTrackingTimesheetsUploadUrl_Response_201
    time-tracking_getTimeTrackingShiftRates_Response_200:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/V2TimeTrackingShiftRatesGetResponsesContentApplicationJsonSchemaDataItems'
        page:
          $ref: '#/components/schemas/V2TimeTrackingShiftRatesGetResponsesContentApplicationJsonSchemaPage'
      required:
      - data
      - page
      description: Shift rate policies response
      title: time-tracking_getTimeTrackingShiftRates_Response_200
    TimeTrackingTimesheetsTimesheetIdReviewPostResponsesContentApplicationJsonSchemaDataReviewStatus:
      type: string
      enum:
      - PENDING_CREATION
      - PENDING_REVIEW
      - APPROVED
      - REJECTED
      description: Current status of the timesheet review
      title: TimeTrackingTimesheetsTimesheetIdReviewPostResponsesContentApplicationJsonSchemaDataReviewStatus
    V2TimeTrackingShiftRatesPostRequestBodyContentApplicationJsonSchemaDataType:
      type: string
      enum:
      - MULTIPLIER_PERCENTAGE
      - PER_HOUR_FLAT_RATE
      - PER_UNIT_FLAT_RATE
      description: Type of the shift
      title: V2TimeTrackingShiftRatesPostRequestBodyContentApplicationJsonSchemaDataType
    time-tracking_getTimeTrackingTimesheetById_Response_200:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/TimeTrackingTimesheetsTimesheetIdGetResponsesContentApplicationJsonSchemaData'
          description: Timesheet data including validation errors if applicable. When extend=file_data, also includes file_data object with file details and download URL.
      required:
      - data
      title: time-tracking_getTimeTrackingTimesheetById_Response_200
    TimeTrackingTimesheetsUploadUrlPostResponsesContentApplicationJsonSchemaData:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the created timesheet
        created_at:
          type: string
          format: date-time
          description: Timestamp when the timesheet was created
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the timesheet was last updated
        upload_url:
          type: string
          format: uri
          description: Pre-signed S3 URL for uploading the timesheet file
        upload_fields:
          type: object
          additionalProperties:
            description: Any type
          description: Form fields required for the multipart POST upload to S3. Include these fields alongside the file in the upload request.
      required:
      - id
      - created_at
      - updated_at
      - upload_url
      - upload_fields
      title: TimeTrackingTimesheetsUploadUrlPostResponsesContentApplicationJsonSchemaData
    ? TimeTrackingTimesheetsTimesheetIdReviewPostResponsesContentApplicationJsonSchemaErrorsItemsDetailsTimesheetSubmissionStatus
    : type: string
      enum:
      - UPLOADING
      - UPLOAD_FAILED
      - PROCESSING
      - SUBMITTED
      - INVALID
      - FAILED
      description: Current status of the timesheet submission
      title: TimeTrackingTimesheetsTimesheetIdReviewPostResponsesContentApplicationJsonSchemaErrorsItemsDetailsTimesheetSubmissionStatus
    TimeTrackingTimesheetsTimesheetIdReviewPostResponsesContentApplicationJsonSchemaData:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the timesheet
        reviewed_at:
          type: string
          format: date-time
          description: Timestamp when the timesheet was reviewed
        review_reason:
          type:
          - string
          - 'null'
          description: Reason provided by the reviewer when rejecting the timesheet. Only present when review_status is REJECTED.
        review_status:
          $ref: '#/components/schemas/TimeTrackingTimesheetsTimesheetIdReviewPostResponsesContentApplicationJsonSchemaDataReviewStatus'
          description: Current status of the timesheet review
      required:
      - id
      - reviewed_at
      - review_status
      description: Updated timesheet details after review
      title: TimeTrackingTimesheetsTimesheetIdReviewPostResponsesContentApplicationJsonSchemaData
    TimeTrackingTimesheetsTimesheetIdReviewPostResponsesContentApplicationJsonSchemaErrorsItemsDetailsTimesheetReviewStatus:
      type: string
      enum:
      - PENDING_CREATION
      - PENDING_REVIEW
      - APPROVED
      - REJECTED
      description: Current status of the timesheet review
      title: TimeTrackingTimesheetsTimesheetIdReviewPostResponsesContentApplicationJsonSchemaErrorsItemsDetailsTimesheetReviewStatus
    time-tracking_reviewTimeTrackingTimesheet_Response_201:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/TimeTrackingTimesheetsTimesheetIdReviewPostResponsesContentApplicationJsonSchemaData'
          description: Updated timesheet details after review
      required:
      - data
      title: time-tracking_reviewTimeTrackingTimesheet_Response_201
    V2TimeTrackingShiftRatesGetResponsesContentApplicationJsonSchemaPage:
      type: object
      properties:
        offset:
          type: number
          format: double
          description: Offset for pagination
        total_rows:
          type: number
          format: double
          description: Total number of shift rate policies
        items_per_page:
          type: number
          format: double
          description: Number of shift rate policies per page
      required:
      - offset
      - total_rows
      - items_per_page
      title: V2TimeTrackingShiftRatesGetResponsesContentApplicationJsonSchemaPage
    GenerateTimesheetUploadUrl-v2026-01-01RequestUnprocessableEntityError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/TimeTrackingTimesheetsUploadUrlPostResponsesContentApplicationJsonSchemaErrorsItems'
      required:
      - errors
      title: GenerateTimesheetUploadUrl-v2026-01-01RequestUnprocessableEntityError
    V2TimeTrackingShiftRatesGetResponsesContentApplicationJsonSchemaDataItems:
      type: object
      properties:
        name:
          type: string
          description: Name of the shift rate policy
        type:
          $ref: '#/components/schemas/V2TimeTrackingShiftRatesGetResponsesContentApplicationJsonSchemaDataItemsType'
          description: Type of the shift rate
        value:
          type: number
          format: double
          exclusiveMinimum: 0
          multipleOf: 0.01
          description: The value of the shift rate (supports up to 2 decimal places)
        created_at:
          type: string
          format: date-time
          description: Date when the shift rate was created
        updated_at:
          type: string
          format: date-time
          description: Date when the shift rate was last updated
        external_id:
          type: string
          description: ID specified by the client for uniquely identifying shift rate across organization
      required:
      - name
      - created_at
      - updated_at
      - external_id
      title: V2TimeTrackingShiftRatesGetResponsesContentApplicationJsonSchemaDataItems
    TimeTrackingShiftRatesExternalIdPatchRequestBodyContentApplicationJsonSchemaData:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 3000
          description: The updated name of the shift rate.
        type:
          $ref: '#/components/schemas/TimeTrackingShiftRatesExternalIdPatchRequestBodyContentApplicationJsonSchemaDataType'
          description: The updated type of shift rate.
        value:
          type: number
          format: double
          exclusiveMinimum: 0
