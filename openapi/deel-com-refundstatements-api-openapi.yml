paths:
  /refund-statements/{refund_statement_id}/breakdown:
    get:
      operationId: refundStatements_retrieveRefundStatementCreditNoteBreakdown-v2026-05-11
      summary: Retrieve refund statement credit-note breakdown
      description: 'Use this endpoint to retrieve a detailed breakdown of credit notes associated with a specific refund statement. It provides comprehensive details for financial tracking and reconciliation.


        **Token scopes**: `accounting:read`'
      tags:
      - refundStatements
      parameters:
      - name: refund_statement_id
        in: path
        description: Public id (`invoice_id`) of the refund statement root invoice.
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Breakdown succeeded. `data` contains zero or more rows (empty array when there are no child credit notes).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund_Statements_retrieveRefundStatementCreditNoteBreakdown-v2026-05-11_Response_200'
        '400':
          description: 'Bad request: missing organization context, or request validation failed (e.g. invalid path id format, invalid query types).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveRefundStatementCreditNoteBreakdown-v2026-05-11RequestBadRequestError'
        '401':
          description: 'Unauthorized: caller is not authenticated (e.g. missing or invalid session or bearer token).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveRefundStatementCreditNoteBreakdown-v2026-05-11RequestUnauthorizedError'
        '403':
          description: Forbidden (role or feature flag).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveRefundStatementCreditNoteBreakdown-v2026-05-11RequestForbiddenError'
        '404':
          description: Statement not found or not accessible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveRefundStatementCreditNoteBreakdown-v2026-05-11RequestNotFoundError'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveRefundStatementCreditNoteBreakdown-v2026-05-11RequestInternalServerError'
      security:
      - deelToken: []
