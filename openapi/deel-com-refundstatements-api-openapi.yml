    RefundStatementsRefundStatementIdBreakdownGetResponsesContentApplicationJsonSchemaDataItems:
      type: object
      properties:
        id:
          type: string
          description: Public id of the credit note (or credit statement line) invoice.
        label:
          type: string
          description: Display label (sequencing label or description fallback).
        amount:
          type: string
          description: Credit amount; typically negative for credits.
        currency:
          type: string
          description: ISO 4217 currency code.
        contract_id:
          type:
          - string
          - 'null'
          description: Contract `oid` when the credit note is tied to a contract; otherwise null.
        original_invoice_id:
          type:
          - string
          - 'null'
          description: Public id of the invoice being credited when applicable; `null` when not linked.
      required:
      - id
      - label
      - amount
      - currency
      title: RefundStatementsRefundStatementIdBreakdownGetResponsesContentApplicationJsonSchemaDataItems
