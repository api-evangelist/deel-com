openapi: 3.2.0
info:
  title: Endpoints It Products API
  version: 1.0.0
  description: API endpoints related to IT products.
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: itProducts
  description: API endpoints related to IT products.
paths:
  /it/products:
    get:
      operationId: itProducts_listItProducts-v2026-09-17
      summary: List products in the catalog
      description: 'Browse the Deel IT catalog to see which devices are available for purchase or rent before creating an order, filtered by country and other criteria. Returns product metadata only — no pricing, taxes, fees, or contract settings.


        **Token scopes**: `it-products:read`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2026-12-17.'
      tags:
      - itProducts
      parameters:
      - name: cursor
        in: query
        description: Indicates where the next page of results starts, as returned in a paginated list response
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Return a page of results with given number of records
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: country
        in: query
        description: ISO 3166 alpha-2 country code. Restricts results to products whose variants ship to this country.
        required: false
        schema:
          type: string
      - name: stock_condition
        in: query
        description: Filter by stock condition. Omit to include products of any stock condition.
        required: false
        schema:
          $ref: '#/components/schemas/ItProductsGetParametersStockCondition'
      - name: acquisition_types
        in: query
        description: Restrict results to products offering at least one of these acquisition types (RENTAL, PURCHASE, REUSE). REUSE represents BYOD (customer-owned) stock. Omit to include all acquisition types the organization is entitled to.
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ItProductsGetParametersAcquisitionTypesSchemaItems'
      - name: search
        in: query
        description: Return products whose name or brand contains this text. Case-insensitive, and partial words match, so 'book' finds 'MacBook Pro'. Only the name and brand are searched — not the description or hardware specification. Use brands for an exact manufacturer match.
        required: false
        schema:
          type: string
      - name: category
        in: query
        description: Filter by product category
        required: false
        schema:
          $ref: '#/components/schemas/ItProductsGetParametersCategory'
      - name: operating_systems
        in: query
        description: Filter by operating system — repeat for OR semantics
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ItProductsGetParametersOperatingSystemsSchemaItems'
      - name: keyboard_layouts
        in: query
        description: Filter by keyboard layout — repeat for OR semantics
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ItProductsGetParametersKeyboardLayoutsSchemaItems'
      - name: brands
        in: query
        description: Filter by manufacturer — exact and case-insensitive, repeat for OR semantics. Unlike search it does not substring-match.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: it_policy_ids
        in: query
        description: Restrict results to products approved by any of these IT policies, to see what workers on those policies can order. Repeat for OR semantics. A policy id your organization does not own matches nothing.
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: is_marketplace
        in: query
        description: Filter by marketplace sourcing. Organizations without marketplace access never see marketplace products, and the filter is ignored for them rather than emptying the catalog.
        required: false
        schema:
          type: boolean
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/ItProductsGetParametersXBeta'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IT_products_listItProducts-v2026-09-17_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListItProducts-v2026-09-17RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListItProducts-v2026-09-17RequestInternalServerError'
      security:
      - deelToken: []
  /it/products/{product_id}:
    get:
      operationId: itProducts_retrieveAnItProduct-v2026-09-17
      summary: Retrieve a product's catalog details
      description: 'Returns catalog data for a single product — variants, images, hardware spec, and available addons. Variants are filtered to those the organization''s allowed acquisition types cover, and (when country is supplied) to those shipping to that country. No pricing, taxes, fees, contract-setting-derived values, or stock counts are returned. Use this after listing products to pull a specific product''s variant and addon options before creating an order.


        **Token scopes**: `it-products:read`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2026-12-17.'
      tags:
      - itProducts
      parameters:
      - name: product_id
        in: path
        description: Unique identifier of the product
        required: true
        schema:
          type: string
          format: uuid
      - name: country
        in: query
        description: ISO 3166 alpha-2 country code. When set, restricts returned variants to those shipping to this country.
        required: false
        schema:
          type: string
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/ItProductsProductIdGetParametersXBeta'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IT_products_retrieveAnItProduct-v2026-09-17_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAnItProduct-v2026-09-17RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAnItProduct-v2026-09-17RequestNotFoundError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAnItProduct-v2026-09-17RequestInternalServerError'
      security:
      - deelToken: []
