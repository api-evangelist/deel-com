openapi: 3.2.0
info:
  title: Endpoints Tasks API
  version: 1.0.0
  description: API endpoints related to Tasks.
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: Tasks
  description: API endpoints related to Tasks.
paths:
  /contracts/{contract_id}/tasks:
    post:
      operationId: tasks_createContractTask
      summary: Create a new task
      description: 'Creates a new task for the contractor associated with the specified contract. A task can include an amount, description, and submission date.


        **Token scopes**: `contracts:write`'
      tags:
      - Tasks
      parameters:
      - name: contract_id
        in: path
        description: The unique Deel contract ID associated with the task.
        required: true
        schema:
          type: string
      responses:
        '201':
          description: The task was successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tasks_createContractTask_Response_201'
        '400':
          description: Bad request. Missing required fields or invalid data format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateANewTask-v2026-01-01RequestBadRequestError'
        '401':
          description: Unauthorized. Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateANewTask-v2026-01-01RequestUnauthorizedError'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Internal server error. An unexpected error occurred while processing the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateANewTask-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/ContractsContractIdTasksPostRequestBodyContentApplicationJsonSchemaData'
      security:
      - deelToken: []
    get:
      operationId: tasks_getContractTasks
      summary: List of tasks
      description: 'Retrieves all tasks associated with a specific contract, including each task''s ID, amount, submission date, status, and description.


        **Token scopes**: `contracts:read`'
      tags:
      - Tasks
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier for the Deel contract.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation. A list of tasks associated with the specified contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tasks_getContractTasks_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /contracts/{contract_id}/tasks/{task_id}:
    delete:
      operationId: tasks_deleteContractTask
      summary: Delete task
      description: 'Deletes a specific task from a contract. An optional `reason` can be supplied for audit or documentation purposes.


        **Token scopes**: `contracts:write`'
      tags:
      - Tasks
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier of the Deel contract.
        required: true
        schema:
          type: string
      - name: task_id
        in: path
        description: The unique identifier of the task to be deleted.
        required: true
        schema:
          type: string
      - name: reason
        in: query
        description: The reason for deleting the task. This can be used for auditing purposes.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The task was successfully deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tasks_deleteContractTask_Response_200'
        '400':
          description: Invalid request. For example, missing required parameters or invalid format.
          content:
            application/json:
              schema:
                description: Any type
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Permission denied. The user does not have the required access to delete the task.
          content:
            application/json:
              schema:
                description: Any type
        '404':
          description: The specified task or contract was not found.
          content:
            application/json:
              schema:
                description: Any type
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /contracts/{contract_id}/tasks/{task_id}/reviews:
    post:
      operationId: tasks_createContractTaskReview
      summary: Review a single task
      description: 'Submits an approval or rejection review for a task associated with a contract. If the review status is declined, an optional reason may be included in the request body.


        **Token scopes**: `contracts:write`'
      tags:
      - Tasks
      parameters:
      - name: contract_id
        in: path
        description: The unique Deel contract ID associated with the task.
        required: true
        schema:
          type: string
      - name: task_id
        in: path
        description: The unique ID of the task to be reviewed.
        required: true
        schema:
          type: string
      responses:
        '201':
          description: The task review was successfully processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tasks_createContractTaskReview_Response_201'
        '400':
          description: Bad request. Missing required fields or invalid data format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewASingleTask-v2026-01-01RequestBadRequestError'
        '401':
          description: Unauthorized. Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewASingleTask-v2026-01-01RequestUnauthorizedError'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Not found. The specified task or contract was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewASingleTask-v2026-01-01RequestNotFoundError'
        '500':
          description: Internal server error. An unexpected error occurred while processing the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewASingleTask-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/ContractsContractIdTasksTaskIdReviewsPostRequestBodyContentApplicationJsonSchemaData'
      security:
      - deelToken: []
  /contracts/{contract_id}/tasks/many/reviews:
    post:
      operationId: tasks_reviewMultipleTasks-v2026-01-01
      summary: Review multiple tasks
      description: 'Approves or declines multiple submitted tasks associated with a contract in a single request. Each task review must include a status of approved or declined, with an optional reason required when declining.


        **Token scopes**: `contracts:write`'
      tags:
      - Tasks
      parameters:
      - name: contract_id
        in: path
        description: The unique Deel contract ID associated with the tasks.
        required: true
        schema:
          type: string
      responses:
        '201':
          description: The task reviews were successfully processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tasks_reviewMultipleTasks-v2026-01-01_Response_201'
        '400':
          description: Bad request. Missing required fields or invalid data format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewMultipleTasks-v2026-01-01RequestBadRequestError'
        '401':
          description: Unauthorized. Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewMultipleTasks-v2026-01-01RequestUnauthorizedError'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Not found. One or more specified tasks or the contract was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewMultipleTasks-v2026-01-01RequestNotFoundError'
        '500':
          description: Internal server error. An unexpected error occurred while processing the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewMultipleTasks-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/ContractsContractIdTasksManyReviewsPostRequestBodyContentApplicationJsonSchemaData'
      security:
      - deelToken: []
  /tasks/{task_id}:
    patch:
      operationId: tasks_updateTaskById-v2026-01-01
      summary: Update Task By ID
      description: 'Applies a partial update to the specified task and returns whether the update was successful.


        **Token scopes**: `tasks:write`'
      tags:
      - Tasks
      parameters:
      - name: task_id
        in: path
        description: The id of an existing task
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The task was successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tasks_updateTaskById-v2026-01-01_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateTaskById-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateTaskById-v2026-01-01RequestInternalServerError'
      requestBody:
        description: Task update object containing fields to modify.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/TasksTaskIdPatchRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
