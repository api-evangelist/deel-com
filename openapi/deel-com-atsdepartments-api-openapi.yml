openapi: 3.2.0
info:
  title: Endpoints Ats Departments API
  version: 1.0.0
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: atsDepartments
paths:
  /ats/departments:
    get:
      operationId: atsDepartments_retrieveAListOfAtsDepartments
      summary: Retrieve a list of ATS departments
      description: 'Returns a paginated list of all departments configured in the organization''s ATS. Use it to resolve the department IDs accepted by the `department_ids` filter when listing jobs and by job creation, and page through results with the `cursor` and `limit` query parameters.


        **Token scopes**: `ats:read`, `worker:read`'
      tags:
      - atsDepartments
      parameters:
      - name: cursor
        in: query
        description: Cursor for pagination to get the next set of results
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of records returned in one response
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: include_archived
        in: query
        description: If true, archived departments are included in the response; they are excluded by default
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response with departments data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ats-departments_retrieveAListOfAtsDepartments_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAListOfAtsDepartments-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden. ATS is not enabled for this organization or insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAListOfAtsDepartments-v2026-01-01RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAListOfAtsDepartments-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
