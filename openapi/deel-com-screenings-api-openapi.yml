openapi: 3.2.0
info:
  title: Deel Com Screenings API
  version: '1.0'
  description: 'Operations tagged Screenings across 2 of this provider''s published API definitions: deel-com-openapi.yml, deel-platform-extensions-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
- url: https://api.letsdeel.com/rest/v2
  description: Production
- url: https://api-sandbox.demo.deel.com/rest/v2
  description: Sandbox
tags:
- name: Screenings
  description: API endpoints related to Screenings.
paths:
  /screenings/manual-verification:
    post:
      operationId: screenings_createManualVerification
      summary: Create manual verification screening
      description: 'Creates a manual identity verification submission as a fallback when automated verification has failed multiple times or when the document''s country of issue is not supported by the automated solution.


        **Token scopes**: `worker:write`'
      tags:
      - Screenings
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/screenings_createManualVerification_Response_201'
        '400':
          description: Bad Request - Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateManualVerificationScreening-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '409':
          description: Conflict - There is an existing name change screening pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateManualVerificationScreening-v2026-01-01RequestConflictError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                back:
                  type: string
                  format: binary
                  description: The back side of the document
                front:
                  type: string
                  format: binary
                  description: The front side of the document
                additional:
                  type: string
                  format: binary
                  description: An additional document
                document_type:
                  $ref: '#/components/schemas/ScreeningsManualVerificationPostRequestBodyContentMultipartFormDataSchemaDocumentType'
                  description: The type of document to be verified
                operation_type:
                  $ref: '#/components/schemas/ScreeningsManualVerificationPostRequestBodyContentMultipartFormDataSchemaOperationType'
                  description: The type of KYC operation to perform
                selfie_with_id:
                  type: string
                  format: binary
                  description: A selfie of the user holding the ID document
                document_country:
                  type: string
                  minLength: 2
                  maxLength: 2
                  description: The issuing country code of the document to be verified (ISO 3166-1 alpha-2)
                proof_of_residence:
                  type: string
                  format: binary
                  description: A proof of residence document
                translation_required:
                  type: boolean
                  description: Indicates whether the document requires translation
              required:
              - front
              - document_type
              - operation_type
              - selfie_with_id
              - translation_required
      security:
      - deelToken: []
    servers:
    - url: https://api.letsdeel.com/rest
      description: Production
    - url: https://api-staging.letsdeel.com/rest
      description: Demo
    - url: https://api.letsdeel.com/scim/v2
      description: Production
    - url: https://api-staging.letsdeel.com/scim/v2
      description: Demo
  /veriff/session:
    post:
      operationId: screenings_createVeriffSession
      summary: Create Veriff session
      description: 'Initiates an identity verification session via Veriff, returning a URL to which the worker must be redirected to complete the verification flow.


        **Token scopes**: `screenings:write`, `worker:write`'
      tags:
      - Screenings
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/screenings_createVeriffSession_Response_201'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/VeriffSessionPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
    servers:
    - url: https://api.letsdeel.com/rest
      description: Production
    - url: https://api-staging.letsdeel.com/rest
      description: Demo
    - url: https://api.letsdeel.com/scim/v2
      description: Production
    - url: https://api-staging.letsdeel.com/scim/v2
      description: Demo
  /screenings/aml/{entity_type}/{entity_id}:
    get:
      operationId: screenings_getAMLDetails
      summary: Get entity screening details
      description: 'Returns the most recent AML screening result for the specified entity. The `entity_type` must be one of `profile`, `hris_profile`, or `legal_entity`.


        **Token scopes**: `screenings:read`'
      tags:
      - Screenings
      parameters:
      - name: entity_type
        in: path
        description: The type of entity to screen. Only 'profile', 'hris_profile', 'legal_entity' are accepted.
        required: true
        schema:
          $ref: '#/components/schemas/ScreeningsAmlEntityTypeEntityIdGetParametersEntityType'
      - name: entity_id
        in: path
        description: UUID v4 of the entity
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Details of the screening request for the specified entity type and ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/screenings_getAMLDetails_Response_200'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmlApiForWhitelabelDataRetrieval-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Entity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmlApiForWhitelabelDataRetrieval-v2026-01-01RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
    servers:
    - url: https://api.letsdeel.com/rest
      description: Production
    - url: https://api-staging.letsdeel.com/rest
      description: Demo
    - url: https://api.letsdeel.com/scim/v2
      description: Production
    - url: https://api-staging.letsdeel.com/scim/v2
      description: Demo
  /screenings/verification-method:
    get:
      operationId: screenings_getVerificationMethod
      summary: Get verification method
      description: 'Returns the KYC verification method supported for a given combination of issuing country and document type.


        **Token scopes**: `screenings:read`, `worker:read`'
      tags:
      - Screenings
      parameters:
      - name: country
        in: query
        description: The document's issuing country code (ISO 3166-1 alpha-2)
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 2
      - name: document_type
        in: query
        description: The document to be provided during KYC
        required: true
        schema:
          $ref: '#/components/schemas/ScreeningsVerificationMethodGetParametersDocumentType'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/screenings_getVerificationMethod_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
    servers:
    - url: https://api.letsdeel.com/rest
      description: Production
    - url: https://api-staging.letsdeel.com/rest
      description: Demo
    - url: https://api.letsdeel.com/scim/v2
      description: Production
    - url: https://api-staging.letsdeel.com/scim/v2
      description: Demo
  /screenings/kyc/details:
    get:
      operationId: screenings_getKYCDetails
      summary: Get worker's KYC details
      description: 'Retrieves KYC verification details for a worker identified by `worker_profile_id` or `profile_id`; these two parameters are mutually exclusive. `contract_id` is required when multiple profiles are associated with the worker.


        **Token scopes**: `screenings:read`'
      tags:
      - Screenings
      parameters:
      - name: worker_profile_id
        in: query
        description: Worker's HRIS profile public ID client requests to fetch KYC details for. This parameter is mutually exclusive with profile_id
        required: false
        schema:
          type: string
          format: uuid
      - name: contract_id
        in: query
        description: Worker's contract ID. This parameter is required in case there are multiple profiles associated to the target worker. For example, when worker used to work for the former company he had another profile ID. So we need contract ID to properly resolve profile's KYC details. In case this parameter is not provided and multiple associated profiles are found, exception with 409 status code will be thrown
        required: false
        schema:
          type: string
          maxLength: 100
      - name: profile_id
        in: query
        description: 'Worker''s profile public ID client requests to fetch KYC details for, This parameter is mutually exclusive with worker_profile_id '
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: KYC details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/screenings_getKYCDetails_Response_200'
        '400':
          description: Bad request - Invalid worker profile ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkersKycDetails-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden - User not authorized to access this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkersKycDetails-v2026-01-01RequestForbiddenError'
        '404':
          description: Not Found - We could not extract any profile by the provided hris profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkersKycDetails-v2026-01-01RequestNotFoundError'
        '409':
          description: Conflict - We found multiple profiles for the provided worker ID. Please provide the contract id to resolve KYC details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkersKycDetails-v2026-01-01RequestConflictError'
        '412':
          description: Precondition Failed - Could not extract contractor ID from the contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkersKycDetails-v2026-01-01RequestPreconditionFailedError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
    servers:
    - url: https://api.letsdeel.com/rest
      description: Production
    - url: https://api-staging.letsdeel.com/rest
      description: Demo
    - url: https://api.letsdeel.com/scim/v2
      description: Production
    - url: https://api-staging.letsdeel.com/scim/v2
      description: Demo
  /screenings/kyc/external:
    post:
      operationId: screenings_submitExternalKyc-v2026-01-01
      summary: Submit external KYC
      description: 'Submits an external KYC record that combines automated Live ID verification (IDV) with a manual review workflow to satisfy identity verification and compliance requirements.


        **Token scopes**: `worker:write`'
      tags:
      - Screenings
      responses:
        '201':
          description: KYC data successfully received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Screenings_submitExternalKyc-v2026-01-01_Response_201'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitExternalKyc-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/ScreeningsKycExternalPostRequestBodyContentMultipartFormDataSchemaData'
              required:
              - data
      security:
      - deelToken: []
    servers:
    - url: https://api.letsdeel.com/rest
      description: Production
    - url: https://api-staging.letsdeel.com/rest
      description: Demo
    - url: https://api.letsdeel.com/scim/v2
      description: Production
    - url: https://api-staging.letsdeel.com/scim/v2
      description: Demo
  /screenings:
    get:
      operationId: getScreenings
      summary: List Background Screenings
      tags:
      - Screenings
      parameters:
      - name: person_id
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
          enum:
          - pending
          - in_progress
          - completed
          - failed
          - cancelled
      responses:
        '200':
          description: Screenings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Screening'
      security:
      - BearerAuth: []
    post:
      operationId: createScreening
      summary: Create Background Screening
      tags:
      - Screenings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScreeningCreate'
      responses:
        '201':
          description: Screening created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Screening'
      security:
      - BearerAuth: []
    servers:
    - url: https://api.letsdeel.com/rest/v2
      description: Production
    - url: https://api-sandbox.demo.deel.com/rest/v2
      description: Sandbox
  /screenings/{screening_id}:
    get:
      operationId: getScreening
      summary: Retrieve A Screening
      tags:
      - Screenings
      parameters:
      - name: screening_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Screening detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Screening'
      security:
      - BearerAuth: []
    servers:
    - url: https://api.letsdeel.com/rest/v2
      description: Production
    - url: https://api-sandbox.demo.deel.com/rest/v2
      description: Sandbox
components:
  schemas:
    VeriffSessionPostResponsesContentApplicationJsonSchemaData:
      type: object
      properties:
        url:
          type: string
          description: The URL of the Veriff session
      required:
      - url
      title: VeriffSessionPostResponsesContentApplicationJsonSchemaData
    ScreeningsAmlEntityTypeEntityIdGetResponsesContentApplicationJsonSchemaResult:
      type: string
      enum:
      - ACCEPT
      - REJECT
      - REFERRED
      - PENDING
      description: The result of the screening. ACCEPT means the screening passed, REJECT means it failed, and REFERRED means it is pending further review.
      title: ScreeningsAmlEntityTypeEntityIdGetResponsesContentApplicationJsonSchemaResult
    ScreeningsManualVerificationPostResponsesContentApplicationJsonSchemaData:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
          description: Timestamp when screening was successfully received and processed (ISO 8601)
        request_id:
          type: string
          description: Unique request identifier
      required:
      - created_at
      - request_id
      title: ScreeningsManualVerificationPostResponsesContentApplicationJsonSchemaData
    ScreeningsVerificationMethodGetParametersDocumentType:
      type: string
      enum:
      - passport
      - government_id
      - driving_license
      - other
      title: ScreeningsVerificationMethodGetParametersDocumentType
    AmlApiForWhitelabelDataRetrieval-v2026-01-01RequestBadRequestError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ScreeningsAmlEntityTypeEntityIdGetResponsesContentApplicationJsonSchemaErrorsItems'
      title: AmlApiForWhitelabelDataRetrieval-v2026-01-01RequestBadRequestError
    ScreeningsKycExternalPostRequestBodyContentMultipartFormDataSchemaDataKycDocumentType:
      type: string
      enum:
      - passport
      - driving_license
      - government_id
      - other
      description: Type of KYC document (e.g., passport, driver's license)
      title: ScreeningsKycExternalPostRequestBodyContentMultipartFormDataSchemaDataKycDocumentType
    ScreeningsVerificationMethodGetResponsesContentApplicationJsonSchemaData:
      type: object
      properties:
        verification_method:
          type: string
          description: The supported method for KYC
      required:
      - verification_method
      title: ScreeningsVerificationMethodGetResponsesContentApplicationJsonSchemaData
    ScreeningsKycDetailsGetResponsesContentApplicationJsonSchemaErrorsItems:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable explanation of the error
      title: ScreeningsKycDetailsGetResponsesContentApplicationJsonSchemaErrorsItems
    ScreeningsAmlEntityTypeEntityIdGetResponsesContentApplicationJsonSchemaDetailedResultsSanctions:
      type: string
      enum:
      - PASS
      - FAIL
      description: The result of the sanctions check.
      title: ScreeningsAmlEntityTypeEntityIdGetResponsesContentApplicationJsonSchemaDetailedResultsSanctions
    ScreeningsKycExternalPostRequestBodyContentMultipartFormDataSchemaData:
      type: object
      properties:
        back:
          type: string
          format: binary
          description: Back side file of the KYC document. Required when kyc_document.type equals to either 'driving_license' or 'government_id'. Not needed when equals to 'passport'. Optional when type is 'other'
        front:
          type: string
          format: binary
          description: Front side file of the KYC document
        last_name:
          type: string
          maxLength: 100
          description: Worker's last name
        first_name:
          type: string
          maxLength: 100
          description: Worker's first name
        middle_name:
          type:
          - string
          - 'null'
          maxLength: 100
          description: Worker's middle name (if available)
        kyc_document:
          $ref: '#/components/schemas/ScreeningsKycExternalPostRequestBodyContentMultipartFormDataSchemaDataKycDocument'
        date_of_birth:
          type: string
          format: date
          description: Worker's date of birth (YYYY-MM-DD)
        screening_type:
          $ref: '#/components/schemas/ScreeningsKycExternalPostRequestBodyContentMultipartFormDataSchemaDataScreeningType'
          description: Tells your API whether the identity verification check should be performed automatically (“live”) or via human review (“manual”)
        selfie_with_id:
          type: string
          format: binary
          description: Selfie file for identity verification
        screening_status:
          $ref: '#/components/schemas/ScreeningsKycExternalPostRequestBodyContentMultipartFormDataSchemaDataScreeningStatus'
          description: The result of the screening process
      required:
      - front
      - last_name
      - first_name
      - kyc_document
      - date_of_birth
      - screening_type
      - selfie_with_id
      - screening_status
      title: ScreeningsKycExternalPostRequestBodyContentMultipartFormDataSchemaData
    ScreeningsKycDetailsGetResponsesContentApplicationJsonSchemaErrorsOneOf2Items:
      oneOf:
      - type: string
      - $ref: '#/components/schemas/ScreeningsKycDetailsGetResponsesContentApplicationJsonSchemaErrorsOneOf2Items1'
      title: ScreeningsKycDetailsGetResponsesContentApplicationJsonSchemaErrorsOneOf2Items
    ScreeningsKycExternalPostRequestBodyContentMultipartFormDataSchemaDataScreeningType:
      type: string
      enum:
      - live
      - manual
      description: Tells your API whether the identity verification check should be performed automatically (“live”) or via human review (“manual”)
      title: ScreeningsKycExternalPostRequestBodyContentMultipartFormDataSchemaDataScreeningType
    ScreeningsKycDetailsGetResponsesContentApplicationJsonSchemaData:
      type: object
      properties:
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time when the KYC screening was created
        kyc_status:
          $ref: '#/components/schemas/ScreeningsKycDetailsGetResponsesContentApplicationJsonSchemaDataKycStatus'
          description: The current KYC verification status of the profile
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time when the KYC screening was last updated
        approval_date:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time when the KYC screening was approved (null if not approved)
        rejection_date:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time when the KYC screening was rejected (null if not rejected or pending review for Veriff)
        expiration_date:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time when the KYC screening expires (null if no expiry)
        submission_date:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time when the KYC screening was submitted
        identity_document_name:
          type:
          - string
          - 'null'
          description: The name of the identity document used for verification (in case of other document type)
        identity_document_type:
          oneOf:
          - $ref: '#/components/schemas/ScreeningsKycDetailsGetResponsesContentApplicationJsonSchemaDataIdentityDocumentType'
          - type: 'null'
          description: The type of identity document used for verification
        identity_document_number:
          type:
          - string
          - 'null'
          description: Number of the submitted document
        document_extracted_last_name:
          type:
          - string
          - 'null'
          description: The last name extracted from the submitted document
        document_extracted_first_name:
          type:
          - string
          - 'null'
          description: The first name extracted from the submitted document
        document_extracted_middle_name:
          type:
          - string
          - 'null'
          description: The middle name extracted from the submitted document
      required:
      - created_at
      - kyc_status
      - updated_at
      - approval_date
      - rejection_date
      - expiration_date
      - submission_date
      - identity_document_type
      - document_extracted_middle_name
      title: ScreeningsKycDetailsGetResponsesContentApplicationJsonSchemaData
    screenings_createVeriffSession_Response_201:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/VeriffSessionPostResponsesContentApplicationJsonSchemaData'
      required:
      - data
      title: screenings_createVeriffSession_Response_201
    Screenings_submitExternalKyc-v2026-01-01_Response_201:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ScreeningsKycExternalPostResponsesContentApplicationJsonSchemaData'
      required:
      - data
      title: Screenings_submitExternalKyc-v2026-01-01_Response_201
    ScreeningsManualVerificationPostRequestBodyContentMultipartFormDataSchemaOperationType:
