openapi: 3.2.0
info:
  title: Endpoints Payouts API
  version: 1.0.0
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: Payouts
paths:
  /payouts/employees/methods:
    post:
      operationId: payouts_addEditBankDetails-v2026-01-01
      summary: Add/Edit Bank Details
      description: 'Creates or updates an employee''s bank payout method. If a method already exists, the existing record is superseded and the response includes a version identifier and activation status reflecting the updated state.


        **Token scopes**: `worker:read`, `worker:write`'
      tags:
      - Payouts
      responses:
        '200':
          description: Add Bank Details / Edit Bank Details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payouts_addEditBankDetails-v2026-01-01_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/PayoutsEmployeesMethodsPostRequestBodyContentApplicationJsonSchemaData'
                  description: Request data
      security:
      - deelToken: []
    get:
      operationId: payouts_getBankDetails-v2026-01-01
      summary: Get Bank Details
      description: 'Retrieves the configured bank payout methods for an employee.


        **Token scopes**: `worker:read`, `worker:write`'
      tags:
      - Payouts
      responses:
        '200':
          description: Get Bank Details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payouts_getBankDetails-v2026-01-01_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /payouts/auto-withdrawal-setting:
    patch:
      operationId: payouts_changeTheAutoWithdrawalSetting-v2026-01-01
      summary: Change the auto-withdrawal setting
      description: 'Partially updates the auto-withdrawal configuration, allowing callers to enable or disable auto-withdrawal and change the target withdrawal method.


        **Token scopes**: `worker:write`'
      tags:
      - Payouts
      responses:
        '200':
          description: Successfully update auto-withdrawal settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payouts_changeTheAutoWithdrawalSetting-v2026-01-01_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        description: Change the auto withdrawal setting
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/PayoutsAutoWithdrawalSettingPatchRequestBodyContentApplicationJsonSchemaData'
      security:
      - deelToken: []
    get:
      operationId: payouts_getTheAutoWithdrawalSetting-v2026-01-01
      summary: Get the auto-withdrawal setting
      description: 'Returns the current auto-withdrawal configuration for the authenticated worker, including whether auto-withdrawal is enabled and the identifier of the selected withdrawal method.


        **Token scopes**: `worker:read`'
      tags:
      - Payouts
      responses:
        '200':
          description: Auto-withdrawal setting result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payouts_getTheAutoWithdrawalSetting-v2026-01-01_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /payouts/contractors/methods:
    post:
      operationId: payouts_createABankTransferMethod-v2026-01-01
      summary: Create a bank transfer method
      description: 'Registers a new bank transfer payout method; the request payload structure is dynamic and determined by the selected option, so callers should retrieve field requirements before submitting.


        **Token scopes**: `worker:read`, `worker:write`'
      tags:
      - Payouts
      responses:
        '201':
          description: Bank transfer method created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payouts_createABankTransferMethod-v2026-01-01_Response_201'
        '400':
          description: Invalid request parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateABankTransferMethod-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/PayoutsContractorsMethodsPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
    get:
      operationId: payouts_fetchAllPayoutMethods-v2026-01-01
      summary: Fetch all payout methods
      description: 'Returns all payout methods associated with the authenticated account, with optional filtering to return only the default method.


        **Token scopes**: `worker:read`, `worker:write`'
      tags:
      - Payouts
      parameters:
      - name: is_default
        in: query
        description: Filter by whether the method is default. If true, only default methods will be returned.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: List of payout methods retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payouts_fetchAllPayoutMethods-v2026-01-01_Response_200'
        '400':
          description: Invalid request parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchAllPayoutMethods-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /payouts/employees/methods/{id}:
    delete:
      operationId: payouts_deleteBankDetails-v2026-01-01
      summary: Delete Bank Details
      description: 'Permanently removes the bank payout method identified by the given method `id`.


        **Token scopes**: `worker:read`, `worker:write`'
      tags:
      - Payouts
      parameters:
      - name: id
        in: path
        description: method ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Delete Bank Details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payouts_deleteBankDetails-v2026-01-01_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /payouts/contractors/methods/bank_transfers/requirements:
    get:
      operationId: payouts_getBankTransferRequirements-v2026-01-01
      summary: Get bank transfer requirements
      description: 'Call this endpoint before creating a bank transfer payout method to determine the required input fields for the given country and currency, along with a fee preview for the specified amount (defaulting to 100.00 when none is provided). The returned fields map directly to the payload expected by the bank transfer method creation endpoint.


        **Token scopes**: `worker:read`'
      tags:
      - Payouts
      parameters:
      - name: country
        in: query
        description: Country code
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{2}$
          minLength: 2
          maxLength: 2
      - name: currency
        in: query
        description: Currency code
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{3}$
          minLength: 3
          maxLength: 3
      - name: amount
        in: query
        description: Amount for calculating fees, if not provided, the default amount of 100.00 is used
        required: false
        schema:
          type: number
          format: double
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payouts_getBankTransferRequirements-v2026-01-01_Response_200'
        '400':
          description: Invalid request parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBankTransferRequirements-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /payouts/contractors/methods/bank_transfers/supported_routes:
    get:
      operationId: payouts_getBankTransferSupportedRoutes-v2026-01-01
      summary: Get bank transfer supported routes for contractor
      description: 'Returns all bank transfer routes available to the authenticated contractor.


        **Token scopes**: `worker:read`, `worker:write`'
      tags:
      - Payouts
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payouts_getBankTransferSupportedRoutes-v2026-01-01_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /payouts/employees/methods/bank_transfers/requirements:
    post:
      operationId: payouts_dynamicRequirements-v2026-01-01
      summary: Get dynamic bank transfer requirements
      description: 'Returns the progressive field requirements needed to configure a bank transfer payout method, based on the data provided in the request. The `is_final` flag in the response indicates whether all requirements have been satisfied; callers should continue submitting updated data until `is_final` is `true` before calling `POST /payouts/employees/methods`.


        **Token scopes**: `worker:read`, `worker:write`'
      tags:
      - Payouts
      responses:
        '200':
          description: Dynamic Requirements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payouts_dynamicRequirements-v2026-01-01_Response_200'
        '400':
          description: Invalid request parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicRequirements-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/PayoutsEmployeesMethodsBankTransfersRequirementsPostRequestBodyContentApplicationJsonSchemaData'
                  description: Request data
      security:
      - deelToken: []
  /payouts/employees/methods/bank-transfers/requirements:
    get:
      operationId: payouts_getStaticEmployeeBankTransferRequirements-v2026-09-28
      summary: Get static employee bank transfer requirements
      description: 'Returns the static bank transfer requirements for a bank country and currency, as resolved for employee payouts: the preferred transfer type (BTS, then local bank account, IBAN or SWIFT) with its input fields and validation rules. Needs no employee or contract context, so organization tokens can call it. Returns no fees and does not re-evaluate requirements as values change; for that, use `POST /payouts/employees/methods/bank_transfers/requirements`.


        **Token scopes**: `payments:read`'
      tags:
      - Payouts
      parameters:
      - name: country
        in: query
        description: Bank country as an ISO 3166-1 alpha-2 code.
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{2}$
          minLength: 2
          maxLength: 2
      - name: currency
        in: query
        description: Payout currency as an ISO 4217 code.
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{3}$
          minLength: 3
          maxLength: 3
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payouts_getStaticEmployeeBankTransferRequirements-v2026-09-28_Response_200'
        '400':
          description: 'Invalid request: missing, unsupported or malformed `country` or `currency`, or an unknown query parameter.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetStaticEmployeeBankTransferRequirements-v2026-09-28RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Unexpected failure while resolving the requirements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetStaticEmployeeBankTransferRequirements-v2026-09-28RequestInternalServerError'
        '503':
          description: The bank transfer requirements provider is temporarily unavailable; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetStaticEmployeeBankTransferRequirements-v2026-09-28RequestServiceUnavailableError'
      security:
      - deelToken: []
  /payouts/balances:
    get:
      operationId: payouts_listContractorBalances-v2026-01-01
      summary: List Contractor Balances
      description: 'Returns the total available balances for the authenticated contractor, broken down by currency and aggregated into a single cross-currency total.


        **Token scopes**: `worker:read`'
      tags:
      - Payouts
      responses:
        '200':
          description: Successful operation. Returns the contractor's balances.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payouts_listContractorBalances-v2026-01-01_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PayoutsBalancesGetResponsesContentApplicationJsonSchemaItems'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /payouts/withdrawals:
    post:
      operationId: payouts_requestToWithdrawFunds-v2026-01-01
      summary: Request to withdraw funds
      description: 'Initiates a withdrawal of available funds to the employee''s configured payout method. The operation is asynchronous; the outcome is delivered via webhook rather than the synchronous response.


        **Token scopes**: `worker:write`'
      tags:
      - Payouts
      responses:
        '201':
          description: Withdrawal successfully initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payouts_requestToWithdrawFunds-v2026-01-01_Response_201'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestToWithdrawFunds-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/PayoutsWithdrawalsPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
  /payouts/contractors/methods/{id}:
    put:
      operationId: payouts_updateABankTransferMethod-v2026-01-01
      summary: Update a bank transfer method
      description: 'Updates an existing bank transfer payout method. This performs a full replacement of the method rather than a partial update.


        **Token scopes**: `worker:write`'
      tags:
      - Payouts
      parameters:
      - name: id
        in: path
        description: Method unique identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Bank transfer method created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payouts_updateABankTransferMethod-v2026-01-01_Response_200'
        '400':
