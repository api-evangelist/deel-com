      security:
      - deelToken: []
components:
  schemas:
    ? PayoutsContractorsMethodsBankTransfersRequirementsGetResponsesContentApplicationJsonSchemaDataItemsFieldsItemsGroupItemsValuesAllowedItems
    : type: object
      properties:
        key:
          type: string
          description: The country code (e.g., AL for Albania).
        name:
          type: string
          description: The full name of the country (e.g., Albania).
      required:
      - key
      - name
      title: PayoutsContractorsMethodsBankTransfersRequirementsGetResponsesContentApplicationJsonSchemaDataItemsFieldsItemsGroupItemsValuesAllowedItems
    FetchAllPayoutMethods-v2026-01-01RequestBadRequestError:
      type: object
      properties:
        errors:
          type: array
