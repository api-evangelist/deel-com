openapi: 3.2.0
info:
  title: Endpoints Users API
  version: 1.0.0
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: Users
paths:
  /Users:
    get:
      operationId: users_getUsers
      summary: List users
      description: 'Retrieve a list of users in Deel''s HRIS.


        **Token scopes**: `Users:read`'
      tags:
      - Users
      parameters:
      - name: filter
        in: query
        description: Filter results using [SCIM's filtering syntax](https://datatracker.ietf.org/doc/html/rfc7644#section-3.4.2.2). Currently supports only `eq` operator and filtering by a user's email. Expected format 'email eq "email@domain.com"'.
        required: false
        schema:
          $ref: '#/components/schemas/UsersGetParametersFilter'
      - name: startIndex
        in: query
        description: The 1-based index of the first result to return. Used for pagination. Minimum value is 1. Defaults to 1 if not provided.
        required: false
        schema:
          type: string
          pattern: ^[0-9]+$
      - name: count
        in: query
        description: The maximum number of results to return per page. Used for pagination. A value of 0 is treated as a special case and returns 1 result. Typically should be a positive integer.
        required: false
        schema:
          type: string
          pattern: ^[0-9]+$
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Users_getUsers_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsers-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
  /Users/{hris_profile_id}:
    get:
      operationId: users_getUserById
      summary: Retrieve a single User
      description: 'Retrieve a single user by id.


        **Token scopes**: `Users:read`'
      tags:
      - Users
      parameters:
      - name: hris_profile_id
        in: path
        description: The unique identifier (OID) of the HRIS profile to retrieve.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Users_getUserById_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found - The provided hrisProfileOid does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveASingleUser-v2026-01-01RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - deelToken: []
