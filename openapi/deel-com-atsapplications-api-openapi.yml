openapi: 3.2.0
info:
  title: Endpoints Ats Applications API
  version: 1.0.0
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: atsApplications
paths:
  /ats/applications/{application_id}:
    get:
      operationId: atsApplications_retrieveAtsApplication-v2026-01-01
      summary: Retrieve ATS application
      description: 'Retrieves one ATS application by application_id, including its full interview-stage timeline — when it entered and left each stage and who moved it — not just its current status. Use it to check where a candidate stands or to reconstruct how an application progressed.


        **Token scopes**: `ats:read`, `worker:read`'
      tags:
      - atsApplications
      parameters:
      - name: application_id
        in: path
        description: Application ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successfully retrieved application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ats-applications_retrieveAtsApplication-v2026-01-01_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAtsApplication-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden. ATS is not enabled for this organization or insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAtsApplication-v2026-01-01RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAtsApplication-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
  /ats/applications/{application_id}/notes:
    post:
      operationId: atsApplications_addNoteToAnApplication-v2026-01-01
      summary: Add note to an application
      description: 'Adds a note to a specific application. The `author_id` must correspond to a valid HRIS user.


        **Token scopes**: `ats:write`, `ats.applications.notes:write`'
      tags:
      - atsApplications
      parameters:
      - name: application_id
        in: path
        description: Id of the application which the note will be added
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Application note created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ats-applications_addNoteToAnApplication-v2026-01-01_Response_201'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddNoteToAnApplication-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden. ATS is not enabled for this organization or insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddNoteToAnApplication-v2026-01-01RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddNoteToAnApplication-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/AtsApplicationsApplicationIdNotesPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
  /ats/applications/{application_id}/interview-plan-stages:
    post:
      operationId: atsApplications_associateApplicationWithAnInterviewPlanStage-v2026-01-01
      summary: Assign application to interview plan stage
      description: 'Associates an application with a specific interview plan stage. Set `is_current_stage` to `true` to advance the application''s active stage, or `false` to record a historical stage entry without changing the current stage. Pass `applicable_job_activities` to selectively trigger activities, omit it to trigger all, or pass an empty array to trigger none; if archiving the candidate, include `candidate_archivation_reason_id` and optionally `candidate_archivation_email_template_id` to send a rejection email.


        **Token scopes**: `ats:write`, `worker:write`'
      tags:
      - atsApplications
      parameters:
      - name: application_id
        in: path
        description: ID of the application to be associated with the interview plan stage
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Application interview plan stage successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ats-applications_associateApplicationWithAnInterviewPlanStage-v2026-01-01_Response_201'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssociateApplicationWithAnInterviewPlanStage-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden. ATS is not enabled for this organization or insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssociateApplicationWithAnInterviewPlanStage-v2026-01-01RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssociateApplicationWithAnInterviewPlanStage-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/AtsApplicationsApplicationIdInterviewPlanStagesPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
  /ats/applications:
    post:
      operationId: atsApplications_createAtsApplication-v2026-01-01
      summary: Create ATS Application
      description: 'Creates a new ATS application linking an existing candidate to an existing job. Both the candidate and job must exist prior to this call; the returned id can be used for subsequent operations such as adding notes or associating interview stages.


        **Token scopes**: `ats:write`, `worker:write`'
      tags:
      - atsApplications
      responses:
        '201':
          description: Successful response with application data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ats-applications_createAtsApplication-v2026-01-01_Response_201'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApplication-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden. ATS is not enabled for this organization or insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApplication-v2026-01-01RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApplication-v2026-01-01RequestInternalServerError'
      requestBody:
        description: Create application request
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/AtsApplicationsPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
    get:
      operationId: atsApplications_retrieveAListOfAtsApplications-v2026-01-01
      summary: Retrieve a list of ATS applications
      description: 'Use this endpoint to trace where candidates stand in the hiring pipeline and how they got there — every interview plan stage an application has reached and when it entered and left each one.


        **Token scopes**: `ats:read`, `worker:read`'
      tags:
      - atsApplications
      parameters:
      - name: cursor
        in: query
        description: Cursor for pagination. Use the nextCursor value from the previous response to get the next page of results.
        required: false
        schema:
          type: string
          maxLength: 1000
      - name: limit
        in: query
        description: Maximum number of applications to return per page
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 20
      - name: search_text
        in: query
        description: Search text to filter applications
        required: false
        schema:
          type: string
          maxLength: 500
      - name: job_id
        in: query
        description: Filter by job ID
        required: false
        schema:
          type: string
          format: uuid
      - name: interview_plan_stage_ids
        in: query
        description: Filter by the CURRENT interview plan stage IDs (comma-separated). Applications that have since moved to another stage are excluded — use reached_interview_plan_stage_ids for those.
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: reached_interview_plan_stage_ids
        in: query
        description: Filter by interview plan stage IDs the application has EVER been in (comma-separated), including applications that have since advanced, been hired or been archived.
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: moved_to_current_stage_before
        in: query
        description: Return only applications that moved to their current stage strictly before this ISO 8601 datetime (stalled candidates)
        required: false
        schema:
          type: string
          format: date-time
      - name: archivation_reason_ids
        in: query
        description: Filter by archivation reason IDs (comma-separated); see GET /rest/ats/reasons with reason_group_slug=CANDIDATE_ARCHIVATION
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: candidate_tag_ids_operator
        in: query
        description: 'How candidate_tag_ids are combined: ANY (default) matches candidates with at least one of the tags, ALL requires every tag'
        required: false
        schema:
          $ref: '#/components/schemas/AtsApplicationsGetParametersCandidateTagIdsOperator'
      - name: include
        in: query
        description: Optional expansions to embed on each item. STAGE_HISTORY adds the full stage timeline with entered/exited timestamps.
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/AtsApplicationsGetParametersIncludeSchemaItems'
      - name: candidate_tag_ids
        in: query
        description: Filter by candidate tag IDs (comma-separated)
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: source_slugs
        in: query
        description: Filter by application source (comma-separated)
        required: false
        schema:
          type: array
          items:
            type: string
      - name: job_criterias_matchings
        in: query
        description: Filter applications by job criteria matching state
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/AtsApplicationsGetParametersJobCriteriasMatchingsSchemaItems'
      - name: current_stage_category_type_slugs
        in: query
        description: Filter applications by current stage category type slugs. Accepted values are lead, active and completed, in either case — the job list reports them uppercase and this filter accepts that form too.
        required: false
        schema:
          type: array
          items:
            type: string
            maxLength: 50
      - name: current_stage_default_type_slugs
        in: query
        description: Filter applications by current stage default type slugs (e.g. new_lead, application_review, offer, hired, archived), in either case. Use 'others' for custom stages.
        required: false
        schema:
          type: array
          items:
            type: string
            maxLength: 50
      - name: updated_after
        in: query
        description: Filter applications updated after this timestamp (ISO 8601 format)
        required: false
        schema:
          type: string
          format: date-time
      - name: sort_by
        in: query
        description: Field to sort applications by
        required: false
        schema:
          $ref: '#/components/schemas/AtsApplicationsGetParametersSortBy'
      - name: sort_order
        in: query
        description: Sort order for applications
        required: false
        schema:
          $ref: '#/components/schemas/AtsApplicationsGetParametersSortOrder'
      responses:
        '200':
          description: Successfully retrieved applications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ats-applications_retrieveAListOfAtsApplications-v2026-01-01_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAListOfAtsApplications-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden. ATS is not enabled for this organization or insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAListOfAtsApplications-v2026-01-01RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAListOfAtsApplications-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
components:
  schemas:
    AtsApplicationsGetParametersJobCriteriasMatchingsSchemaItems:
      type: object
      properties:
        is_matched:
          $ref: '#/components/schemas/AtsApplicationsGetParametersJobCriteriasMatchingsSchemaItemsIsMatched'
        job_criteria_id:
          type: string
          format: uuid
      required:
      - is_matched
      - job_criteria_id
      title: AtsApplicationsGetParametersJobCriteriasMatchingsSchemaItems
    AtsApplicationsGetParametersSortBy:
      type: string
      enum:
      - APPLICATION_CREATION_DATE
      - STAGE_CREATION_DATE
      title: AtsApplicationsGetParametersSortBy
    AtsApplicationsGetResponsesContentApplicationJsonSchemaDataItemsApplicationJobCriteriasMatchingsItemsIsMatched:
      type: string
      enum:
      - MATCHED
      - NOT_MATCHED
      - UNDECIDED
      description: Whether the criteria is matched
      title: AtsApplicationsGetResponsesContentApplicationJsonSchemaDataItemsApplicationJobCriteriasMatchingsItemsIsMatched
    AtsApplicationsApplicationIdGetResponsesContentApplicationJsonSchemaDataJobPostingPublication:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Job posting publication unique identifier
      required:
      - id
      description: Job posting publication details
      title: AtsApplicationsApplicationIdGetResponsesContentApplicationJsonSchemaDataJobPostingPublication
    AtsApplicationsGetResponsesContentApplicationJsonSchemaDataItemsApplicationFormSubmissionAnswersItemsQuestionType:
      type: string
      enum:
      - FREETEXT
      - PARAGRAPH
      - SINGLESELECTION
      - MULTISELECTION
      - DOCUMENTUPLOAD
      - PRESETDROPDOWN
      - CUSTOMDROPDOWN
      - NUMBER
      - DATEPICKER
      - ADDRESS
      - PHONENUMBER
      - EMAIL
      description: Type of the question (uppercase)
      title: AtsApplicationsGetResponsesContentApplicationJsonSchemaDataItemsApplicationFormSubmissionAnswersItemsQuestionType
    AddNoteToAnApplication-v2026-01-01RequestInternalServerError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/AtsApplicationsApplicationIdNotesPostResponsesContentApplicationJsonSchemaErrorsItems'
          description: List of error objects
      required:
      - errors
      title: AddNoteToAnApplication-v2026-01-01RequestInternalServerError
    AtsApplicationsApplicationIdGetResponsesContentApplicationJsonSchemaDataCurrentApplicationInterviewPlanStage:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the application interview plan stage record
        interview_plan_stage:
          oneOf:
          - $ref: '#/components/schemas/AtsApplicationsApplicationIdGetResponsesContentApplicationJsonSchemaDataCurrentApplicationInterviewPlanStageInterviewPlanStage'
          - type: 'null'
      required:
      - id
      - interview_plan_stage
      description: Current interview plan stage for the application
      title: AtsApplicationsApplicationIdGetResponsesContentApplicationJsonSchemaDataCurrentApplicationInterviewPlanStage
    AtsApplicationsGetResponsesContentApplicationJsonSchemaDataItemsJobEmploymentType:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Job employment type unique identifier
        employment_type:
          $ref: '#/components/schemas/AtsApplicationsGetResponsesContentApplicationJsonSchemaDataItemsJobEmploymentTypeEmploymentType'
      required:
      - id
      - employment_type
      description: Employment type information for the job
      title: AtsApplicationsGetResponsesContentApplicationJsonSchemaDataItemsJobEmploymentType
    AtsApplicationsApplicationIdGetResponsesContentApplicationJsonSchemaDataApplicationJobCriteriasMatchingsItems:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Job criteria matching identifier
        is_matched:
          $ref: '#/components/schemas/AtsApplicationsApplicationIdGetResponsesContentApplicationJsonSchemaDataApplicationJobCriteriasMatchingsItemsIsMatched'
          description: Match status
        description:
          type: string
          description: Match description
        job_criteria:
          $ref: '#/components/schemas/AtsApplicationsApplicationIdGetResponsesContentApplicationJsonSchemaDataApplicationJobCriteriasMatchingsItemsJobCriteria'
      required:
      - id
      - is_matched
      - description
      - job_criteria
      title: AtsApplicationsApplicationIdGetResponsesContentApplicationJsonSchemaDataApplicationJobCriteriasMatchingsItems
    AtsApplicationsApplicationIdNotesPostResponsesContentApplicationJsonSchemaErrorsItems:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable error code
        field:
          type: string
          description: Request field related to the error, if applicable
        message:
          type: string
          description: Human-readable error message
      required:
      - code
      - message
      title: AtsApplicationsApplicationIdNotesPostResponsesContentApplicationJsonSchemaErrorsItems
    ? AtsApplicationsApplicationIdGetResponsesContentApplicationJsonSchemaDataCurrentApplicationInterviewPlanStageInterviewPlanStage
    : type: object
      properties:
        id:
          type: string
          format: uuid
          description: Interview plan stage unique identifier
        name:
          type: string
          description: Interview plan stage name
        position_number:
          type: integer
          description: Position of the stage in the interview plan
        default_type_slug:
          type:
          - string
          - 'null'
          description: Default type slug
        category_type_slug:
          type: string
          description: Category type slug
      required:
      - id
      - name
      - position_number
      - default_type_slug
      - category_type_slug
      title: AtsApplicationsApplicationIdGetResponsesContentApplicationJsonSchemaDataCurrentApplicationInterviewPlanStageInterviewPlanStage
    AtsApplicationsPostRequestBodyContentApplicationJsonSchemaData:
      type: object
      properties:
        notes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AtsApplicationsPostRequestBodyContentApplicationJsonSchemaDataNotesItems'
          description: Array of notes to attach to the application
        job_id:
          type: string
          format: uuid
          description: The ID of the job for this application
        source_slug:
          type: string
          description: The application source. Accepts any active source slug of the organization, e.g. SOURCED_INTERNALLY, SOURCED_EXTERNALLY, INTERNAL_REFERRAL_AWARE, INTERNAL_REFERRAL_NOT_AWARE, EXTERNAL_CAREER_PAGE or a custom source slug (case-insensitive). Defaults to the candidate origin source when omitted.
        candidate_id:
          type: string
          format: uuid
          description: The ID of the candidate applying
        job_posting_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The ID of the job posting (optional)
        job_employment_type_id:
          type: string
          format: uuid
          description: The ID of the employment type for this job
        application_form_submission_data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AtsApplicationsPostRequestBodyContentApplicationJsonSchemaDataApplicationFormSubmissionDataItems'
          description: Array of form submission answers
      required:
      - job_id
      - candidate_id
      - job_employment_type_id
      title: AtsApplicationsPostRequestBodyContentApplicationJsonSchemaData
    AtsApplicationsApplicationIdGetResponsesContentApplicationJsonSchemaDataReferralFormSubmission:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          format: uuid
          description: Identifier of the referral form submission
        form_builder_stringified:
          type:
          - string
          - 'null'
          description: Stringified JSON data for the referral form submission
      required:
      - id
      - form_builder_stringified
      description: Referral form submission metadata
      title: AtsApplicationsApplicationIdGetResponsesContentApplicationJsonSchemaDataReferralFormSubmission
    AtsApplicationsApplicationIdGetResponsesContentApplicationJsonSchemaDataApplicationFormSubmission:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the application form submission
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AtsApplicationsApplicationIdGetResponsesContentApplicationJsonSchemaDataApplicationFormSubmissionAnswersItems'
          description: Array of question answers with parsed data
      required:
      - id
      - answers
      description: Application form submission data with mapped answers
      title: AtsApplicationsApplicationIdGetResponsesContentApplicationJsonSchemaDataApplicationFormSubmission
    AtsApplicationsApplicationIdGetResponsesContentApplicationJsonSchemaDataJobEmploymentType:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the job employment type record
        employment_type:
          $ref: '#/components/schemas/AtsApplicationsApplicationIdGetResponsesContentApplicationJsonSchemaDataJobEmploymentTypeEmploymentType'
          description: Employment type metadata
      required:
      - id
      - employment_type
      description: Employment type associated with the application
      title: AtsApplicationsApplicationIdGetResponsesContentApplicationJsonSchemaDataJobEmploymentType
    AtsApplicationsApplicationIdGetResponsesContentApplicationJsonSchemaErrorsItems:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable error code
        field:
          type: string
          description: Request field related to the error, if applicable
        message:
          type: string
          description: Human-readable error message
      required:
      - code
      - message
      title: AtsApplicationsApplicationIdGetResponsesContentApplicationJsonSchemaErrorsItems
    AtsApplicationsApplicationIdInterviewPlanStagesPostResponsesContentApplicationJsonSchemaData:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier of the created application interview plan stage record
        created_at:
          type: string
          format: date-time
          description: The timestamp when the record was created
        updated_at:
          type: string
          format: date-time
          description: The timestamp when the record was last updated
      required:
      - id
      - created_at
      - updated_at
      description: The created application interview plan stage record
      title: AtsApplicationsApplicationIdInterviewPlanStagesPostResponsesContentApplicationJsonSchemaData
    AtsApplicationsGetResponsesContentApplicationJsonSchemaErrorsItems:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable error code
        field:
          type: string
          description: Request field related to the error, if applicable
        message:
          type: string
          description: Human-readable error message
      required:
      - code
      - message
      title: AtsApplicationsGetResponsesContentApplicationJsonSchemaErrorsItems
    ? AtsApplicationsApplicationIdGetResponsesContentApplicationJsonSchemaDataApplicationAutomationRuleExecutionsItemsEvaluationResultItemsOperatorEnum
    : type: string
      enum:
      - EQUALS
      - NOT_EQUALS
      - CONTAINS
      - DOES_NOT_CONTAIN
      - IS_EMPTY
      - IS_NOT_EMPTY
      - GREATER_THAN
      - GREATER_THAN_OR_EQUAL
      - LESS_THAN
      - LESS_THAN_OR_EQUAL
      description: Comparison operator
      title: AtsApplicationsApplicationIdGetResponsesContentApplicationJsonSchemaDataApplicationAutomationRuleExecutionsItemsEvaluationResultItemsOperatorEnum
    AtsApplicationsPostRequestBodyContentApplicationJsonSchemaDataApplicationFormSubmissionDataItems11:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AtsApplicationsPostRequestBodyContentApplicationJsonSchemaDataApplicationFormSubmissionDataItemsOneOf11Type'
          description: Question type this answer belongs to.
        email:
          type: string
          format: email
          description: Email address
        question_id:
          type: string
          description: Question identifier
      required:
      - type
      - email
      - question_id
      title: AtsApplicationsPostRequestBodyContentApplicationJsonSchemaDataApplicationFormSubmissionDataItems11
    AtsApplicationsGetResponsesContentApplicationJsonSchemaDataItemsCandidateCandidateTagsItems:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Candidate tag unique identifier
        tag:
          $ref: '#/components/schemas/AtsApplicationsGetResponsesContentApplicationJsonSchemaDataItemsCandidateCandidateTagsItemsTag'
      required:
      - id
      - tag
      description: Candidate tag with label
      title: AtsApplicationsGetResponsesContentApplicationJsonSchemaDataItemsCandidateCandidateTagsItems
    AtsApplicationsPostRequestBodyContentApplicationJsonSchemaDataApplicationFormSubmissionDataItemsOneOf10Type:
      type: string
      enum:
