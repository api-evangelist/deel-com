    TimeOffsTimeOffIdPatchResponsesContentApplicationJsonSchemaTimeOff:
      type: object
      properties:
        amount:
          type: string
          title: float
          description: Amount of time off taken. This is the total amount of time off taken. For example, if you take 2 days off, this will be 2. If you take 1 day off, this will be 1.
        reason:
          type: string
          description: Reason for taking time off. This is complementary information for the time-off description. Useful to provide sub categories for the same policy.
        status:
          $ref: '#/components/schemas/TimeOffsTimeOffIdPatchResponsesContentApplicationJsonSchemaTimeOffStatus'
          description: Status of the time off request. Can be REQUESTED, APPROVED, REJECTED, USED or CANCELED.
        is_paid:
          type: boolean
          description: Whether the time off is paid or unpaid.
        end_date:
          type: string
          format: date
          description: End date of the time off request. This is the date when the time off ends. For example, if you take 2 days off, this will be the end date of the second day.
        created_at:
          type: string
          format: date-time
          description: This is the date when the time off request was created in the database.
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Time off deletion date. Present only when the time-off is soft-deleted and include_deleted_time_offs was requested.
        start_date:
          type: string
          format: date
          description: Start date of the time off request. This is the date when the time off starts. For example, if you take 2 days off, this will be the start date of the first day.
        updated_at:
          type: string
          format: date-time
          description: This is the date when the time off request was last updated in the database.
        approved_at:
          type:
          - string
          - 'null'
          format: date-time
          description: This is the date when the time off request was approved. This will be null if the time off request is not approved yet.
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/TimeOffsTimeOffIdPatchResponsesContentApplicationJsonSchemaTimeOffAttachmentsItems'
          description: List of attachments associated with the time off request.
        canceled_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Time off cancellation date
        description:
          type: string
          description: Description of the time off request. Some policies require that a description is provided.
        contract_oid:
          type: string
          description: Contract id. This is the id of the contract associated with the time off request.
        requested_at:
          type: string
          format: date
          description: This is the date when the time off request was made.
        half_end_date:
          type: boolean
          description: Whether the end date is a half day or not.
        time_off_type:
          $ref: '#/components/schemas/TimeOffsTimeOffIdPatchResponsesContentApplicationJsonSchemaTimeOffTimeOffType'
          description: The type of time off taken.
        time_off_event:
          $ref: '#/components/schemas/TimeOffsTimeOffIdPatchResponsesContentApplicationJsonSchemaTimeOffTimeOffEvent'
        half_start_date:
          type: boolean
          description: Whether the start date is a half day or not.
        deduction_amount:
          type: string
          title: float
          description: Deduction amount. Available for independent contractor's policies
        entitlement_unit:
          $ref: '#/components/schemas/TimeOffsTimeOffIdPatchResponsesContentApplicationJsonSchemaTimeOffEntitlementUnit'
          description: The unit in which the time off usage and entitlement are calculated.
        time_off_dailies:
          type: array
          items:
            $ref: '#/components/schemas/TimeOffsTimeOffIdPatchResponsesContentApplicationJsonSchemaTimeOffTimeOffDailiesItems'
          description: Used to break down the time off request into daily records. Each entry represents a single day within the time off period, allowing for detailed tracking of working days, non-working days, and holidays included in the request.
        time_off_type_id:
          type: string
          format: uuid
          description: Time off type id. This is the id of the time off type associated with the time off request.
        recipient_profile:
          $ref: '#/components/schemas/TimeOffsTimeOffIdPatchResponsesContentApplicationJsonSchemaTimeOffRecipientProfile'
          description: The time off profile of the recipient of the time off request. Must be a worker profile.
        requester_profile:
          $ref: '#/components/schemas/TimeOffsTimeOffIdPatchResponsesContentApplicationJsonSchemaTimeOffRequesterProfile'
          description: The time off profile of the requester of the time off request. Can be either a client or worker profile.
        custom_field_values:
          type: array
          items:
            $ref: '#/components/schemas/TimeOffsTimeOffIdPatchResponsesContentApplicationJsonSchemaTimeOffCustomFieldValuesItems'
          description: Answers to the custom fields the request policy declares. Omitted when the policy declares none.
        time_off_percentage:
          type: string
          title: float
          description: Used to specify the percentage of time off taken relative to full-time employment. This value ranges from 0 to 1, where 1 represents full-time (100%) and 0.5 represents part-time (50%). This is useful for part-time workers or when taking partial time off.
        is_end_date_estimated:
          type: boolean
          description: Used to indicate if the end date is an estimate rather than a confirmed date. This is particularly important for event-based policies such as Parental Leave, where the actual end date may depend on the actual birth or adoption date, which may not be known at the time of request submission.
        other_type_description:
          type: string
          description: Used to provide a custom description when the time off type is categorized as 'OTHER'. This allows users to specify the nature of time off that doesn't fit into standard categories, providing flexibility for unique or organization-specific time off types.
      required:
