openapi: 3.2.0
info:
  title: Endpoints Time Off API
  version: 1.0.0
  description: API endpoints related to Time Off.
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: timeOff
  description: API endpoints related to Time Off.
paths:
  /time_offs/review:
    post:
      operationId: timeOff_reviewTimeOffRequest
      summary: Approve or reject time-off requests
      description: 'Approves or rejects a batch of time-off requests in a single call. The desired status must be either APPROVED or REJECTED for each entry. Only time-offs currently in REQUESTED status can be reviewed; entries in any other status are returned as not reviewed. Rejecting a time-off request is irreversible: once rejected, its status cannot be changed through this API. The response distinguishes successfully processed requests from those that encountered errors.


        **Token scopes**: `time-off:write`'
      tags:
      - timeOff
      responses:
        '201':
          description: Review process completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/time-off_reviewTimeOffRequest_Response_201'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveRejectTimeOffRequests-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/TimeOffsReviewPostRequestBodyContentApplicationJsonSchemaDataItems'
                  description: Array of time-offs to be reviewed
              required:
              - data
      security:
      - deelToken: []
  /time_offs/{time_off_id}:
    delete:
      operationId: timeOff_deleteTimeOffRequest
      summary: Cancel time-off request
      description: 'Cancels the time-off request identified by time_off_id. Use this when a previously submitted or approved time off needs to be withdrawn. This action immediately sets the request to CANCELED regardless of its current status and cannot be reversed.


        **Token scopes**: `time-off:write`, `worker:write`'
      tags:
      - timeOff
      parameters:
      - name: time_off_id
        in: path
        description: Time off request id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: time off deleted
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelTimeOffRequest-v2026-01-01RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
    patch:
      operationId: timeOff_updateTimeOffRequest
      summary: Update time-off request
      description: 'Corrects details of an existing time-off request, such as its dates, amount, reason, or time-off type, without requiring the worker to cancel and resubmit it. Applies a partial update identified by time_off_id; only fields included in the request body are modified.


        **Token scopes**: `time-off:write`, `worker:write`'
      tags:
      - timeOff
      parameters:
      - name: time_off_id
        in: path
        description: Time off request id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Time off updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/time-off_updateTimeOffRequest_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateTimeOffRequest-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        description: Time off update request data
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/TimeOffsTimeOffIdPatchRequestBodyContentApplicationJsonSchemaData'
                  description: Time off update request data
      security:
      - deelToken: []
  /time_offs:
    post:
      operationId: timeOff_createTimeOffRequest
      summary: Create time-off request
      description: 'Submits a new time-off request for a worker under a given policy. Use `POST /rest/time_offs/validate` first to confirm eligibility, balances, and any required custom-field answers, since the request must satisfy the policy''s validation rules to succeed. Requests stay in `REQUESTED` status until approved or rejected via `POST /rest/time_offs/review` — unless `use_deel_approval_flow` is set to `true`, which routes the request through Deel''s own approval flow instead.


        **Token scopes**: `time-off:write`, `worker:write`'
      tags:
      - timeOff
      responses:
        '201':
          description: Time off creation data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/time-off_createTimeOffRequest_Response_201'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTimeOffRequest-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTimeOffRequest-v2026-01-01RequestForbiddenError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTimeOffRequest-v2026-01-01RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        description: The time off request data
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/TimeOffsPostRequestBodyContentApplicationJsonSchemaData'
                  description: The time off request data
      security:
      - deelToken: []
    get:
      operationId: timeOff_listTimeOffRequestsForOrganization-v2026-01-01
      summary: List time-off requests for Organization
      description: 'Returns time-off requests across the entire authenticated organization; to list a single worker''s requests, use GET /rest/time_offs/profile/{hris_profile_id} instead. Intended for bulk synchronization or auditing into an external HRIS, payroll, or reporting system. Only requests belonging to workers with an active primary employment are returned, and pending requests are included alongside approved and closed ones unless you filter by status.


        **Token scopes**: `time-off:read`'
      tags:
      - timeOff
      parameters:
      - name: status
        in: query
        description: Time off status
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/TimeOffsGetParametersStatusSchemaItems'
      - name: time_off_ids
        in: query
        description: Time off ids
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: start_date
        in: query
        description: Start date of time off
        required: false
        schema:
          type: string
          format: date-time
      - name: end_date
        in: query
        description: End date of time off
        required: false
        schema:
          type: string
          format: date-time
      - name: approval_start_date
        in: query
        description: Approval start date
        required: false
        schema:
          type: string
          format: date-time
      - name: approval_end_date
        in: query
        description: Approval end date
        required: false
        schema:
          type: string
          format: date-time
      - name: updated_start_date
        in: query
        description: Updated start date
        required: false
        schema:
          type: string
          format: date-time
      - name: updated_end_date
        in: query
        description: Updated end date
        required: false
        schema:
          type: string
          format: date-time
      - name: page_size
        in: query
        description: Page size
        required: false
        schema:
          type: integer
          minimum: 5
          maximum: 200
      - name: policy_types
        in: query
        description: Policy types
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: policy_type_names
        in: query
        description: Filter by policy type names. When omitted, Work Location time-offs are excluded by default. Pass policy_type_names=Work+Location to retrieve only Work Location entries.
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/TimeOffsGetParametersPolicyTypeNamesSchemaItems'
      - name: next
        in: query
        description: Next page
        required: false
        schema:
          type: string
      - name: include_deleted_time_offs
        in: query
        description: When true, includes soft-deleted time-off records in the response. Deleted records will have a deleted_at timestamp and status DELETED.
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Successful operation time offs returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Time_Off_listTimeOffRequestsForOrganization-v2026-01-01_Response_200'
        '400':
          description: Bad request (invalid query parameters or validation error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTimeOffRequestsForOrganization-v2026-01-01RequestBadRequestError'
        '401':
          description: Unauthorized (missing or invalid token).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTimeOffRequestsForOrganization-v2026-01-01RequestUnauthorizedError'
        '403':
          description: Forbidden (insufficient permissions).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTimeOffRequestsForOrganization-v2026-01-01RequestForbiddenError'
        '404':
          description: Not found (organization or HRIS profile not found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTimeOffRequestsForOrganization-v2026-01-01RequestNotFoundError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTimeOffRequestsForOrganization-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
  /time-offs/policy:
    get:
      operationId: timeOff_getPoliciesForOrganization-v2026-09-09
      summary: Get Policies for Organization
      description: 'Look up an organization''s time-off policies, most commonly to resolve a policy_id for use with Get Profiles Assigned to Policy, or to audit policy configuration (allowances, tracking rules) before assigning workers or reviewing compliance. Filter by policy_type to narrow results to the leave categories relevant to your integration; each result''s assigned profile count lets you spot unused or over-assigned policies without an extra call.


        **Token scopes**: `time-off:read`'
      tags:
      - timeOff
      parameters:
      - name: policy_type
        in: query
        description: Filter by policy type names
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/TimeOffsPolicyGetParametersPolicyTypeSchemaItems'
      - name: policy_name
        in: query
        description: Filter by policy name (case-insensitive search)
        required: false
        schema:
          type: string
      - name: country
        in: query
        description: Filter by country codes
        required: false
        schema:
          type: array
          items:
            type: string
      - name: state_or_region
        in: query
        description: Filter by state/region codes
        required: false
        schema:
          type: array
          items:
            type: string
      - name: worker_types_assigned
        in: query
        description: Filter by worker types
        required: false
        schema:
          type: array
          items:
            type: string
      - name: has_workers_assigned
        in: query
        description: Filter by assignment status
        required: false
        schema:
          type: boolean
      - name: page_size
        in: query
        description: Items per page (max 50)
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
      - name: next
        in: query
        description: Pagination token from the previous response (next)
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Paginated list of policies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Time_Off_getPoliciesForOrganization-v2026-09-09_Response_200'
        '400':
          description: Bad request (invalid page_size or query parameters).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPoliciesForOrganization-v2026-09-09RequestBadRequestError'
        '401':
          description: Unauthorized (missing or invalid token).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPoliciesForOrganization-v2026-09-09RequestUnauthorizedError'
        '403':
          description: Forbidden (insufficient permissions).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPoliciesForOrganization-v2026-09-09RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPoliciesForOrganization-v2026-09-09RequestInternalServerError'
      security:
      - deelToken: []
  /time_offs/profile/{hris_profile_id}/entitlements:
    get:
      operationId: timeOff_getTimeOffEntitlements
      summary: Get Profile Entitlements
      description: 'Use this endpoint to check a worker''s current leave balance — total entitlement granted, days used, and days remaining — across all active policies for a given tracking period. Call it before approving a leave request to verify available balance, to surface entitlement data in an HR portal, or to sync leave balances to an external system. Filter by `policy_type_name` to scope results to a specific leave category, or pass `tracking_period_date` to retrieve the balance as of a past tracking period.


        **Token scopes**: `time-off:read`'
      tags:
      - timeOff
      parameters:
      - name: hris_profile_id
        in: path
        description: HRIS profile ID
        required: true
        schema:
          type: string
          format: uuid
      - name: policy_type_name
        in: query
        description: Policy type name
        required: false
        schema:
          $ref: '#/components/schemas/TimeOffsProfileHrisProfileIdEntitlementsGetParametersPolicyTypeName'
      - name: tracking_period_date
        in: query
        description: Tracking period date
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/time-off_getTimeOffEntitlements_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProfileEntitlements-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /time-offs/policy/{policy_id}/assignments:
    get:
      operationId: timeOff_getProfilesAssignedToPolicy-v2026-09-09
      summary: Get Profiles Assigned to Policy
      description: 'Use this after resolving a policy_id via Get All Policies to see which workers are covered by a specific time-off policy — for example, to verify coverage before running payroll, audit compliance, or reconcile assignments following a policy change. Paginate through large populations with page_size and the next cursor.


        **Token scopes**: `time-off:read`'
      tags:
      - timeOff
      parameters:
      - name: policy_id
        in: path
        description: Policy UID, as returned by the Get Policies for Organization endpoint
        required: true
        schema:
          type: string
          format: uuid
      - name: page_size
        in: query
        description: Items per page (max 100)
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: next
        in: query
        description: Pagination cursor
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Paginated list of profiles assigned to the policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Time_Off_getProfilesAssignedToPolicy-v2026-09-09_Response_200'
        '400':
          description: Bad request (invalid policy ID format or page_size).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProfilesAssignedToPolicy-v2026-09-09RequestBadRequestError'
        '401':
          description: Unauthorized (missing or invalid token).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProfilesAssignedToPolicy-v2026-09-09RequestUnauthorizedError'
        '403':
          description: Forbidden (insufficient permissions).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProfilesAssignedToPolicy-v2026-09-09RequestForbiddenError'
        '404':
          description: Not found (policy not found for this organization).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProfilesAssignedToPolicy-v2026-09-09RequestNotFoundError'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProfilesAssignedToPolicy-v2026-09-09RequestInternalServerError'
      security:
      - deelToken: []
  /time_offs/time-off-events:
    get:
      operationId: timeOff_getTimeOffEvents
      summary: Get Time Off Events for Profile
      description: 'Returns time-off events for a worker profile identified by hris_profile_id, with optional filtering by time_off_type_id or policy_id.


        **Token scopes**: `time-off:read`'
      tags:
      - timeOff
      parameters:
      - name: hris_profile_id
        in: query
        description: Worker hris profile id
        required: true
        schema:
          type: string
          format: uuid
      - name: time_off_type_id
        in: query
        description: Time off type id
        required: false
        schema:
          type: string
          format: uuid
      - name: policy_id
        in: query
        description: Policy id
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: List of time off events for the profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/time-off_getTimeOffEvents_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTimeOffEventsForProfile-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /time_offs/attachments/{attachment_id}/download:
    get:
      operationId: timeOff_getTimeOffAttachmentDownloadUrl-v2026-07-31
      summary: Get time-off attachment download URL
      description: 'Returns a short-lived presigned URL to download a time-off attachment. The attachment_id is the id field returned in the attachments array of time-off responses.


        **Token scopes**: `time-off:read`'
      tags:
      - timeOff
      parameters:
      - name: attachment_id
        in: path
        description: Time-off attachment id (the id field from the attachments array in time-off responses)
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Presigned download URL for the time-off attachment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Time_Off_getTimeOffAttachmentDownloadUrl-v2026-07-31_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden — caller is not the recipient, direct manager, or an approver for this time off
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTimeOffAttachmentDownloadUrl-v2026-07-31RequestForbiddenError'
        '404':
          description: Attachment not found or not in the caller's organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTimeOffAttachmentDownloadUrl-v2026-07-31RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /time_offs/dailies:
    get:
      operationId: timeOff_getTimeOffDailies
      summary: Get Work Schedule and Holidays
      description: 'Returns holidays, work schedule entries, and time-off dailies for a given date range, scoped to one or more HRIS profile IDs or countries.


        **Token scopes**: `time-off:read`'
      tags:
      - timeOff
      parameters:
      - name: start_date
        in: query
        description: Start date of non working days date range
        required: false
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        description: End date of non working days date range
        required: false
        schema:
          type: string
          format: date
      - name: hris_profile_ids
        in: query
        description: HRIS profile ids
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: countries
        in: query
        description: List of countries to be fetched
        required: false
        schema:
          type: array
          items:
            type: string
            pattern: ^[A-Z]{2}$
            minLength: 2
            maxLength: 2
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/time-off_getTimeOffDailies_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkScheduleAndHolidays-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /time_offs/profile/{hris_profile_id}/policies:
    get:
