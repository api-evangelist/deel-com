  /time_offs/profile/{hris_profile_id}:
    get:
      operationId: timeOff_getTimeOffProfile
      summary: List time-off requests
      description: 'Use this endpoint to retrieve a specific worker''s time-off history or upcoming requests — e.g. to build a worker-facing view, check availability before scheduling, or reconcile attendance during payroll. Unlike GET /rest/time_offs, which lists requests org-wide, this scopes to a single hris_profile_id. Combine the status, policy, and date-range filters to narrow results, and page through history with page_size and next.


        **Token scopes**: `time-off:read`'
      tags:
