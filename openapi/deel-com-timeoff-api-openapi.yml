      - created_at
      - start_date
      - updated_at
      - requested_at
      - half_end_date
      - half_start_date
      - entitlement_unit
      - time_off_type_id
      description: Used to return the updated time off request after modification. Contains all the time off details including status, dates, amounts, and associated metadata.
