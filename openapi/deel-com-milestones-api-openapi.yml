openapi: 3.2.0
info:
  title: Endpoints Milestones API
  version: 1.0.0
  description: API endpoints related to Milestones.
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: Milestones
  description: API endpoints related to Milestones.
paths:
  /contracts/{contract_id}/milestones:
    post:
      operationId: milestones_createContractMilestone
      summary: Create a Milestone
      description: 'Creates a new payment milestone on a milestone-based contract. After creation, the milestone enters a review workflow before payment is processed.


        **Token scopes**: `milestones:write`'
      tags:
      - Milestones
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier of the Deel contract where the milestone will be added.
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Milestone created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/milestones_createContractMilestone_Response_201'
        '400':
          description: Bad Request - The request payload failed validation or violated a business rule, such as the contract not supporting milestones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMilestone-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden - The requester does not own this contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMilestone-v2026-01-01RequestForbiddenError'
        '404':
          description: Not Found - The specified contract or an associated resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMilestone-v2026-01-01RequestNotFoundError'
        '500':
          description: Internal Server Error - The milestone could not be created due to an unexpected upstream or internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMilestone-v2026-01-01RequestInternalServerError'
      requestBody:
        description: The milestone object containing the required details to be added to the contract.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/ContractsContractIdMilestonesPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
    get:
      operationId: milestones_getContractMilestones
      summary: Retrieve Milestones by Contract
      description: 'Retrieves all milestones associated with a specific contract, including each milestone''s title, amount, status, relevant dates, and creator and reviewer information.


        **Token scopes**: `milestones:read`'
      tags:
      - Milestones
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier of the Deel contract for which milestones are being retrieved.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A list of milestones for the specified contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/milestones_getContractMilestones_Response_200'
        '400':
          description: Bad Request - The contract_id parameter failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMilestonesByContract-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden - The requesting token does not have access to this organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMilestonesByContract-v2026-01-01RequestForbiddenError'
        '404':
          description: Not Found - The specified contract does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMilestonesByContract-v2026-01-01RequestNotFoundError'
        '500':
          description: Internal Server Error - The contract milestones could not be retrieved due to an unexpected upstream or internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMilestonesByContract-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
  /contracts/{contract_id}/milestones/{milestone_id}:
    delete:
      operationId: milestones_deleteContractMilestone
      summary: Delete a Milestone
      description: 'Permanently deletes a specific milestone from a contract. This operation is irreversible and removes all associated milestone data.


        **Token scopes**: `milestones:write`'
      tags:
      - Milestones
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier of the Deel contract from which the milestone will be deleted.
        required: true
        schema:
          type: string
      - name: milestone_id
        in: path
        description: The unique identifier of the milestone that is to be deleted.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Milestone successfully deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/milestones_deleteContractMilestone_Response_200'
        '400':
          description: Bad Request - The milestone cannot be removed given its current status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteMilestoneById-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden - The requester does not own this contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteMilestoneById-v2026-01-01RequestForbiddenError'
        '404':
          description: Not Found - The specified contract or milestone does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteMilestoneById-v2026-01-01RequestNotFoundError'
        '500':
          description: Internal Server Error - The milestone could not be deleted due to an unexpected upstream or internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteMilestoneById-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
    get:
      operationId: milestones_getContractMilestoneById
      summary: Retrieve a single milestone
      description: 'Retrieves a single milestone identified by milestone_id within a specific contract.


        **Token scopes**: `milestones:read`'
      tags:
      - Milestones
      parameters:
      - name: contract_id
        in: path
        description: Deel contract id.
        required: true
        schema:
          type: string
      - name: milestone_id
        in: path
        description: ID of milestone to return
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/milestones_getContractMilestoneById_Response_200'
        '400':
          description: Bad Request - The contract_id or milestone_id parameter failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMilestonesByContractAndId-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Not Found - The specified contract or milestone does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMilestonesByContractAndId-v2026-01-01RequestNotFoundError'
        '500':
          description: Internal Server Error - The milestone could not be retrieved due to an unexpected upstream or internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMilestonesByContractAndId-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
