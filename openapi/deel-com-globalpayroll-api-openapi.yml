  /gp/workers/creation-schema:
    get:
      operationId: globalPayroll_retrieveGpWorkerCreationSchema-v2026-10-01
      summary: Retrieve the Global Payroll worker creation schema
      description: 'Returns the fields POST /rest/gp/workers accepts, with whether each is required, its permitted values and its validation rules. Pass country, or legal_entity_id and payroll_group_id, to get the rules that apply to that case: contract_state and its provinces, work_location for US entities, postal code format, allowed currencies and the employee_number requirement of a Payroll Connect group. Build the form from this response and the create will not reject it.


        **Token scopes**: `contracts:read`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2027-01-12.'
      tags:
      - globalPayroll
