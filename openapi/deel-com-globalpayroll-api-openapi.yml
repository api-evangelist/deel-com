openapi: 3.2.0
info:
  title: Endpoints Global Payroll API
  version: 1.0.0
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: globalPayroll
paths:
  /gp/contracts/{contract_id}/banks:
    post:
      operationId: globalPayroll_addGpContractBankAccount-v2026-09-17
      summary: Add bank account
      description: 'Adds a bank account for the GP contract; country-specific field requirements must be retrieved from `GET /gp/contracts/{contract_id}/banks/guide` before submitting.


        **Token scopes**: `people:write`'
      tags:
      - globalPayroll
      parameters:
      - name: contract_id
        in: path
        description: Unique identifier for a contract.
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Global_Payroll_addGpContractBankAccount-v2026-09-17_Response_201'
        '400':
          description: Invalid request parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddGpContractBankAccount-v2026-09-17RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        description: Request body containing the details of the bank account to be added.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/GpContractsContractIdBanksPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
    get:
      operationId: globalPayroll_getGpContractBankAccounts-v2026-09-17
      summary: Retrieve bank accounts
      description: 'Retrieves the bank accounts configured for a specific contract, including how each account''s share of the salary is split via funds_distribution — use this when a worker has multiple accounts under one contract to see how pay is being distributed across them.


        **Token scopes**: `people:read`'
      tags:
      - globalPayroll
      parameters:
      - name: contract_id
        in: path
        description: Unique identifier for a contract.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Global_Payroll_getGpContractBankAccounts-v2026-09-17_Response_200'
        '400':
          description: Invalid request parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGpContractBankAccounts-v2026-09-17RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /gp/legal-entities/{legal_entity_id}/payroll-migration-imports:
    post:
      operationId: globalPayroll_importPayrollMigrationFiles-v2026-09-14
      summary: Add payroll migration files to a legal entity
      description: 'Attach year-to-date payroll files to a legal entity''s payroll migration import, created on the first call. Upload each file to the Deel file service first and pass the id and secret it returns. The import stays IN_PROGRESS until submitted; attaching files to a submitted one reopens it. Atomic: one rejected file stores nothing.


        **Token scopes**: `global-payroll:write`'
      tags:
      - globalPayroll
      parameters:
      - name: legal_entity_id
        in: path
        description: The unique identifier of the legal entity the payroll migration files belong to.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Global_Payroll_importPayrollMigrationFiles-v2026-09-14_Response_201'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportPayrollMigrationFiles-v2026-09-14RequestBadRequestError'
        '401':
          description: '401'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportPayrollMigrationFiles-v2026-09-14RequestUnauthorizedError'
        '403':
          description: '403'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportPayrollMigrationFiles-v2026-09-14RequestForbiddenError'
        '404':
          description: '404'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportPayrollMigrationFiles-v2026-09-14RequestNotFoundError'
        '409':
          description: '409'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportPayrollMigrationFiles-v2026-09-14RequestConflictError'
        '500':
          description: '500'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportPayrollMigrationFiles-v2026-09-14RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/GpLegalEntitiesLegalEntityIdPayrollMigrationImportsPostRequestBodyContentApplicationJsonSchemaData'
                  description: The payroll migration files to attach to the import.
              required:
              - data
      security:
      - deelToken: []
    get:
      operationId: globalPayroll_listPayrollMigrationImports-v2026-09-15
      summary: List payroll migration imports for a legal entity
      description: 'Use this to check on the status of payroll migration imports for a legal entity before starting a new one — for example, to confirm previously submitted files have been reviewed, or to see files a partner already added before uploading more.


        **Token scopes**: `global-payroll:read`'
      tags:
      - globalPayroll
      parameters:
      - name: legal_entity_id
        in: path
        description: The unique identifier of the legal entity whose payroll migration imports to list.
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        description: The maximum number of imports to return, between 1 and 50. Defaults to 20.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      - name: cursor
        in: query
        description: An opaque cursor from the previous page's pagination.next_cursor. Omit it for the first page.
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 255
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Global_Payroll_listPayrollMigrationImports-v2026-09-15_Response_200'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPayrollMigrationImports-v2026-09-15RequestBadRequestError'
        '401':
          description: '401'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPayrollMigrationImports-v2026-09-15RequestUnauthorizedError'
        '403':
          description: '403'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPayrollMigrationImports-v2026-09-15RequestForbiddenError'
        '404':
          description: '404'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPayrollMigrationImports-v2026-09-15RequestNotFoundError'
        '500':
          description: '500'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPayrollMigrationImports-v2026-09-15RequestInternalServerError'
      security:
      - deelToken: []
  /gp/workers:
    post:
      operationId: globalPayroll_createGpWorker-v2026-10-01
      summary: Create a Global Payroll worker
      description: 'Creates a Global Payroll worker and their contract in a single call, so API clients and partner integrations can onboard Global Payroll workers directly instead of using the legacy `POST /rest/contracts/gp` flow. No invitation email is sent to the worker unless the request asks for one.


        **Token scopes**: `contracts:write`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2027-01-12.'
      tags:
      - globalPayroll
      parameters:
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/GpWorkersPostParametersXBeta'
      responses:
        '201':
          description: The worker and their contract were created. `data.id` is the contract id; `data.employee.id` is the worker id to use with the other Global Payroll worker endpoints.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Global_Payroll_createGpWorker-v2026-10-01_Response_201'
        '400':
          description: 'Bad request. Codes: validation_error (the body is invalid; field names the offending property), invalid_payroll_group (the payroll group is missing, inactive, not a Global Payroll group or in another legal entity), currency_not_allowed (not allowed for the legal entity country), work_location_required (US legal entities), contract_state_required (the country needs contract_state), entity_integration_active (the legal entity has an active HR integration).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGpWorker-v2026-10-01RequestBadRequestError'
        '401':
          description: The authentication is missing or is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGpWorker-v2026-10-01RequestUnauthorizedError'
        '403':
          description: 'Forbidden. Codes: team_permission_denied (the caller cannot create contracts in the team), forbidden (the caller''s organization cannot use this endpoint).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGpWorker-v2026-10-01RequestForbiddenError'
        '404':
          description: 'Not found. Codes: legal_entity_not_found, team_not_found, entity_address_not_found. The referenced resource does not exist or does not belong to your organization.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGpWorker-v2026-10-01RequestNotFoundError'
        '409':
          description: 'Conflict. Codes: worker_already_exists (the external_id or the email already has a worker or active contract in this legal entity; details carry worker_id and contract_id), external_id_mismatch (the email belongs to a worker with a different external_id), employee_number_taken (the employee number is used in this legal entity), creation_in_progress (an identical create is still running, retry shortly).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGpWorker-v2026-10-01RequestConflictError'
        '500':
          description: An unexpected error occurred while creating the worker.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGpWorker-v2026-10-01RequestInternalServerError'
      requestBody:
        description: Worker, contract and compensation details.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/GpWorkersPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
  /gp/workers/{id}/payslips/{payslip_id}/download:
    get:
      operationId: globalPayroll_downloadAGpWorkerPayslip-v2026-01-01
      summary: Download a GP worker payslip
      description: 'Returns a pre-signed download URL for a specific Global Payroll (GP) employee payslip PDF. Use this after calling Retrieve employee payslips to obtain the payslipId. Requires the worker id (UUID) and the payslipId from the list response. The returned URL is temporary and should be used promptly to download the file. Supports only GP contract types.


        **Token scopes**: `payslips:read`, `worker:read`'
      tags:
      - globalPayroll
      parameters:
      - name: id
        in: path
        description: Unique identifier for the worker.
        required: true
        schema:
          type: string
          format: uuid
      - name: payslipId
        in: path
        description: Unique identifier for the payslip.
        required: true
        schema:
          type: string
          format: uuid
      - name: payslip_id
        in: path
        description: Unique identifier for the payslip.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Global_Payroll_downloadAGpWorkerPayslip-v2026-01-01_Response_200'
        '400':
          description: Bad Request - Validation error or invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadAGpWorkerPayslip-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /gp/legal-entities/{legal_entity_id}/payroll-migration-imports/{import_id}:
    get:
      operationId: globalPayroll_getPayrollMigrationImport-v2026-09-15
      summary: Get a payroll migration import
      description: 'Read back one payroll migration import: its state, when it was submitted, and the files attached to it. There is no webhook today, so this is how a caller follows a submission after submitting it.


        **Token scopes**: `global-payroll:read`'
      tags:
      - globalPayroll
      parameters:
      - name: legal_entity_id
        in: path
        description: The unique identifier of the legal entity the payroll migration import belongs to.
        required: true
        schema:
          type: string
          format: uuid
      - name: import_id
        in: path
        description: The unique identifier of the payroll migration import, as returned when it was submitted.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Global_Payroll_getPayrollMigrationImport-v2026-09-15_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: '401'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPayrollMigrationImport-v2026-09-15RequestUnauthorizedError'
        '403':
          description: '403'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPayrollMigrationImport-v2026-09-15RequestForbiddenError'
        '404':
          description: '404'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPayrollMigrationImport-v2026-09-15RequestNotFoundError'
        '500':
          description: '500'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPayrollMigrationImport-v2026-09-15RequestInternalServerError'
      security:
      - deelToken: []
  /contracts/{contract_id}/additional-info:
    get:
      operationId: globalPayroll_getContractAdditionalInfo-v2026-09-14
      summary: Get additional info for a contract
      description: 'Returns the values a worker submitted for the country-specific additional-information fields on a contract - details local law requires before payroll can run, such as local identifiers, demographic data and emergency contacts. The field set varies per country, so it is kept out of the core contract payload: call this to mirror those values into an external HRIS or payroll system, or to check what a worker supplied during onboarding. Use GET /contracts/{contract_id} for the contract terms. EOR and GP.


        **Token scopes**: `contracts:read`'
      tags:
      - globalPayroll
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier of the GP contract.
        required: true
        schema:
          type: string
          pattern: ^(([a-z0-9]{6,})|([a-z0-9-_]{20,})|(-2[0-9]{2}))$
          maxLength: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Global_Payroll_getContractAdditionalInfo-v2026-09-14_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: '403'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetContractAdditionalInfo-v2026-09-14RequestForbiddenError'
        '404':
          description: '404'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetContractAdditionalInfo-v2026-09-14RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /payroll-activations:
    get:
      operationId: globalPayroll_getPayrollActivations-v2026-10-12
      summary: Get payroll activation readiness for a legal entity
      description: 'Returns whether a legal entity has reached payroll activation readiness, giving clients and partners a self-serve signal they can check over the public API instead of asking Deel support. Call it before starting a step that requires payroll to already be active for the legal entity, and gate that step on the result. A legal entity whose activation is still in progress, or that has none yet, is reported as not ready.


        **Token scopes**: `global-payroll:read`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2027-01-12.'
      tags:
      - globalPayroll
      parameters:
      - name: legal_entity_id
        in: query
        description: The unique identifier of the legal entity whose payroll readiness should be returned.
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/PayrollActivationsGetParametersXBeta'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Global_Payroll_getPayrollActivations-v2026-10-12_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: '401'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPayrollActivations-v2026-10-12RequestUnauthorizedError'
        '403':
          description: '403'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPayrollActivations-v2026-10-12RequestForbiddenError'
        '404':
          description: '404'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPayrollActivations-v2026-10-12RequestNotFoundError'
        '500':
          description: '500'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPayrollActivations-v2026-10-12RequestInternalServerError'
      security:
      - deelToken: []
  /payroll-groups:
    get:
      operationId: globalPayroll_listPayrollGroups-v2026-09-08
      summary: List payroll groups for a legal entity
      description: 'Lists the active payroll groups of a legal entity, with the REGULAR payroll calendars of each group that start in the chosen year (the current year by default). Use it to find the payroll groups of a legal entity and their calendars for a given year; leave the calendars out when you only need the groups.


        **Token scopes**: `global-payroll:read`'
      tags:
      - globalPayroll
      parameters:
      - name: legalEntityId
        in: query
        description: Public UUID of the legal entity whose payroll groups to retrieve.
        required: true
        schema:
          type: string
          format: uuid
      - name: calendarYear
        in: query
        description: Calendar year to filter payroll cycles by. Defaults to the current year.
        required: false
        schema:
          type: integer
          minimum: 2020
          maximum: 2035
      - name: includePayrollCalendar
        in: query
        description: Whether to include REGULAR payroll calendars for each group. Defaults to true. Set to false to skip calendar fetching for a faster response.
        required: false
        schema:
          type: boolean
          default: true
      - name: pagination
        in: query
        description: 'Cursor-based pagination parameters. limit: max items per page (1-15, default 10). cursor: opaque string from the previous response''s pagination.nextCursor field.'
        required: false
        schema:
          $ref: '#/components/schemas/PayrollGroupsGetParametersPagination'
          default:
            limit: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Global_Payroll_listPayrollGroups-v2026-09-08_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: '403'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPayrollGroups-v2026-09-08RequestForbiddenError'
        '404':
          description: '404'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPayrollGroups-v2026-09-08RequestNotFoundError'
        '500':
          description: '500'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPayrollGroups-v2026-09-08RequestInternalServerError'
      security:
      - deelToken: []
  /forms/gp/worker-additional-fields/{country_code}:
    get:
      operationId: globalPayroll_retrieveAdditionalInformationFieldsForGpWorkersByCountry-v2026-01-01
      summary: Retrieve additional information fields for GP workers by country
      description: 'Retrieves the country-specific additional fields a Global Payroll worker must provide to stay compliant with local regulations. Call this before creating a GP contract or submitting worker additional information via POST or PATCH `/gp/workers/contracts/{contract_id}/additional-information`, so you know which fields to include and whether each is required.


        **Token scopes**: `forms:read`'
      tags:
      - globalPayroll
      parameters:
      - name: country_code
        in: path
        description: ISO 3166-1 alpha-2 country code for which to retrieve GP worker additional fields.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Use this response to render dynamic form fields for GP worker onboarding. Contains field configuration, validation rules, display metadata, and dependency logic needed to build country-specific additional information forms.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Global_Payroll_retrieveAdditionalInformationFieldsForGpWorkersByCountry-v2026-01-01_Response_200'
        '400':
          description: Returned when the country_code path parameter is not a recognized ISO 3166-1 alpha-2 code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAdditionalInformationFieldsForGpWorkersByCountry-v2026-01-01RequestBadRequestError'
        '401':
          description: Authentication failed. The access token is missing, expired, or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAdditionalInformationFieldsForGpWorkersByCountry-v2026-01-01RequestUnauthorizedError'
        '403':
          description: Access denied. The authenticated user does not have the required forms:read scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAdditionalInformationFieldsForGpWorkersByCountry-v2026-01-01RequestForbiddenError'
        '404':
          description: The country_code is a valid ISO code but no additional information template exists for it in the Employee Data Management system.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAdditionalInformationFieldsForGpWorkersByCountry-v2026-01-01RequestNotFoundError'
        '429':
          description: Rate limit exceeded. The client has sent too many requests in a given time window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAdditionalInformationFieldsForGpWorkersByCountry-v2026-01-01RequestTooManyRequestsError'
        '500':
