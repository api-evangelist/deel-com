        required: false
        schema:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
      - name: payroll_group_id
        in: query
        description: Payroll group of the legal entity. When it is a Payroll Connect (Soft GP) group, employee_number is reported as required. Requires legal_entity_id.
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 100
