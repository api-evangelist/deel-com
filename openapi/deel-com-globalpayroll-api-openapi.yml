      - name: country
        in: query
        description: ISO 3166-1 alpha-2 country of the legal entity. Adds the country rules. Must match the legal entity when legal_entity_id is also given.
        required: false
        schema:
          type: string
          pattern: ^[A-Z]{2}$
          minLength: 2
          maxLength: 2
