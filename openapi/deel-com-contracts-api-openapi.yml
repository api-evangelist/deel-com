openapi: 3.2.0
info:
  title: Endpoints Contracts API
  version: 1.0.0
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: Contracts
paths:
  /contracts/{contract_id}:
    patch:
      operationId: contracts_updateICContract
      summary: Add external Id
      description: 'Sets an external identifier. Link your internal reference IDs, such as employee numbers or ERP keys, to a Deel worker. The external ID must be unique and, once set, can be used as a filter when listing contracts to directly look up Deel records from an external system.


        **Token scopes**: `contracts:write`'
      tags:
      - Contracts
      parameters:
      - name: contract_id
        in: path
        description: Deel contract id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/contracts_updateICContract_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddExternalId-v2026-01-01RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        description: Contract object that needs to be created
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/ContractsContractIdPatchRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
    get:
      operationId: contracts_getContract
      summary: Retrieve a single contract
      description: 'Retrieves the full record for a specific contract by `contract_id`, including status, compensation, worker details, and metadata. Pass `expand=cost_centers` or `expand=custom_fields` as a query parameter to include additional data in the response.


        **Token scopes**: `contracts:read`'
      tags:
      - Contracts
      parameters:
      - name: contract_id
        in: path
        description: Unique identifier of the contract.
        required: true
        schema:
          type: string
      - name: expand
        in: query
        description: Include additional fields in the response. Multiple values can be passed as comma-separated list.
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ContractsContractIdGetParametersExpandSchemaItems'
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/contracts_getContract_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveASingleContract-v2026-01-01RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /equity/exercise/{public_id}:
    patch:
      operationId: contracts_approveAnEquityExercise-v2026-01-01
      summary: Approve an equity exercise
      description: 'Updates the employer approval status for a pending equity exercise. This is a partial update — only `employer_approval` is accepted in the request body.


        **Token scopes**: `contracts:write`'
      tags:
      - Contracts
      parameters:
      - name: public_id
        in: path
        description: Equity exercise public ID.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contracts_approveAnEquityExercise-v2026-01-01_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Authentication failed. The access token is missing, expired, or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveAnEquityExercise-v2026-01-01RequestUnauthorizedError'
        '403':
          description: Access denied. The authenticated user does not have the required contracts:write scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveAnEquityExercise-v2026-01-01RequestForbiddenError'
        '404':
          description: Resource not found. The equity exercise request does not exist, is not in the required status (APPROVED_BY_EMPLOYEE), or its associated worker profile was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveAnEquityExercise-v2026-01-01RequestNotFoundError'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveAnEquityExercise-v2026-01-01RequestTooManyRequestsError'
        '500':
          description: Internal server error. Occurs when an unexpected failure happens during approval processing (e.g., funding task creation failure). The exercise request status may be set to ERROR.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveAnEquityExercise-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                employer_approval:
                  type: string
                  description: 'Approval decision by the employer for the equity exercise. Valid values: ''approved'', ''rejected''.'
              required:
              - employer_approval
      security:
      - deelToken: []
  /contracts:
    post:
      operationId: contracts_createICContract
      summary: Create a new contract
      description: 'Creates a new contractor contract and returns it with its assigned `id`. After creation, invite the contractor to sign via `POST /contracts/{contract_id}/invitations`.


        **Token scopes**: `contracts:write`'
      tags:
      - Contracts
      responses:
        '201':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/contracts_createICContract_Response_201'
        '400':
          description: Bad Request - Validation error or invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateANewContract-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/ContractsPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
    get:
      operationId: contracts_getContracts
      summary: List of contracts
      description: 'Returns a paginated list of contract summaries for the organization, with optional filtering by status, type, team, legal entity, country, currency, external ID, or a name search term. Use `GET /contracts/{contract_id}` to retrieve full details for a specific contract.


        **Token scopes**: `contracts:read`'
      tags:
      - Contracts
      parameters:
      - name: after_cursor
        in: query
        description: Return next page of results after the given cursor.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Return a page of results with the given number of records.
        required: false
        schema:
          type: string
          pattern: ^[0-9]+$
          default: 50
      - name: order_direction
        in: query
        description: Order direction of results; ascending or descending.
        required: false
        schema:
          $ref: '#/components/schemas/ContractsGetParametersOrderDirection'
      - name: types
        in: query
        description: Filter contracts by type. A contract is included in the results if its type is in this list.
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ContractsGetParametersTypesSchemaItems'
      - name: statuses
        in: query
        description: Filter contracts by current status. A contract is included in the results if its status is in this list.
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ContractsGetParametersStatusesSchemaItems'
      - name: team_id
        in: query
        description: Filter contracts for the given team ID(s). A contract is included in the results if its team is in this list.
        required: false
        schema:
          $ref: '#/components/schemas/ContractsGetParametersTeamId'
      - name: legal_entity_id
        in: query
        description: Filter contracts for the given legal entity ID(s). A contract is included in the results if its legal entity is in this list.
        required: false
        schema:
          $ref: '#/components/schemas/ContractsGetParametersLegalEntityId'
      - name: external_id
        in: query
        description: Filter contracts for the given external ID.
        required: false
        schema:
          type: string
      - name: external_id_absent
        in: query
        description: Filter contracts by external ID presence. When true, returns contracts without an external ID. When false, returns contracts with an external ID. Cannot be used with external_id query param when set to true.
        required: false
        schema:
          type: string
      - name: countries
        in: query
        description: Filter contracts by country codes.
        required: false
        schema:
          type: array
          items:
            type: string
            pattern: ^[A-Z]{2}$
            minLength: 2
            maxLength: 2
      - name: currencies
        in: query
        description: Filter contracts by currency codes.
        required: false
        schema:
          type: array
          items:
            type: string
            pattern: ^[A-Z]{3}$
            minLength: 3
            maxLength: 3
      - name: search
        in: query
        description: Include a contract if its name or the contractor's name contains the given search term.
        required: false
        schema:
          type: string
      - name: sort_by
        in: query
        description: Sort contracts by the given field name.
        required: false
        schema:
          $ref: '#/components/schemas/ContractsGetParametersSortBy'
      - name: expand
        in: query
        description: Include additional fields in the response. Multiple values can be passed as comma-separated list.
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ContractsGetParametersExpandSchemaItems'
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/contracts_getContracts_Response_200'
        '400':
          description: Bad Request - Validation error or invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOfContracts-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /equity/exercise:
    post:
      operationId: contracts_createARequestToExerciseEquity-v2026-01-01
      summary: Create a request to exercise equity
      description: 'Submits a new equity exercise request, associating the specified option grant and stakeholder details with a worker. The request is created in a pending state; employer approval is handled as a separate operation.


        **Token scopes**: `contracts:write`'
      tags:
      - Contracts
      responses:
        '201':
          description: Equity exercise request created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contracts_createARequestToExerciseEquity-v2026-01-01_Response_201'
        '400':
          description: Request validation failed. A required field is missing, has an invalid format, or the worker is not eligible for equity exercise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateARequestToExerciseEquity-v2026-01-01RequestBadRequestError'
        '401':
          description: Authentication failed. The access token is missing, expired, or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateARequestToExerciseEquity-v2026-01-01RequestUnauthorizedError'
        '403':
          description: Access denied. The authenticated user does not have the required contracts:write scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateARequestToExerciseEquity-v2026-01-01RequestForbiddenError'
        '404':
          description: The worker profile associated with the given worker_id was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateARequestToExerciseEquity-v2026-01-01RequestNotFoundError'
        '422':
          description: A request with the same exercise_id already exists. Each exercise_id can only be used once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateARequestToExerciseEquity-v2026-01-01RequestUnprocessableEntityError'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateARequestToExerciseEquity-v2026-01-01RequestTooManyRequestsError'
        '500':
          description: Internal server error. Possible causes include missing EOR contract for the worker, FX rate service failure, or database errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateARequestToExerciseEquity-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fmv:
                  type: string
                  description: The fair market value of the equity.
                quantity:
                  type: number
                  format: double
                  description: The quantity of equity to exercise. Must be a positive number.
                issuer_id:
                  type: string
                  description: The unique identifier of the issuer.
                worker_id:
                  type: string
                  description: The public UUID of the worker. Must correspond to an existing worker in the system.
                address_zip:
                  type: string
                  description: The zip code of the address.
                exercise_id:
                  type: string
                  format: uuid
                  description: The unique identifier of the exercise.
                address_city:
                  type: string
                  description: The city of the address.
                address_state:
                  type: string
                  description: The state of the address.
                address_street:
                  type: string
                  description: The street of the address.
                stakeholder_id:
                  type: string
                  description: The unique identifier of the stakeholder.
                address_country:
                  type: string
                  description: The country of the address.
                option_grant_id:
                  type: string
                  description: The numeric identifier of the option grant. Must contain only digits.
                fmv_currency_code:
                  type: string
                  description: The currency code of the fair market value (ISO 4217).
                stakeholder_email:
                  type: string
                  format: email
                  description: The email address of the stakeholder.
                option_grant_issue:
                  type: string
                  description: The issue of the option grant.
                option_grant_label:
                  type: string
                  description: The label of the option grant.
                option_grant_currency:
                  type: string
                  description: The currency of the option grant (ISO 4217).
                option_grant_issue_date:
                  type: string
                  format: date
                  description: The issue date of the option grant (ISO 8601 date).
                option_grant_expiry_date:
                  type: string
                  format: date
                  description: The expiry date of the option grant (ISO 8601 date).
                stakeholder_relationship:
                  type: string
                  description: The relationship of the stakeholder.
                option_grant_strike_price:
                  type: string
                  description: The strike price of the option grant.
              required:
              - fmv
              - quantity
              - issuer_id
              - worker_id
              - address_zip
              - exercise_id
              - address_city
              - address_state
              - address_street
              - stakeholder_id
              - address_country
              - option_grant_id
              - fmv_currency_code
              - stakeholder_email
              - option_grant_issue
              - option_grant_label
              - option_grant_currency
              - option_grant_issue_date
              - option_grant_expiry_date
              - stakeholder_relationship
              - option_grant_strike_price
      security:
      - deelToken: []
  /work-statement-payment-policies:
    post:
      operationId: contracts_createWorkStatementPaymentPolicy-v2026-09-07
      summary: Create a work statement payment policy
      description: 'Use this endpoint to define a payment cycle once and reuse it, rather than repeating the same cycle fields on every contract you create. The returned policy ID can be referenced when creating contracts. Both the policy name and the combination of cycle settings must be unique within the organization.


        **Token scopes**: `contracts:write`'
      tags:
      - Contracts
      responses:
        '201':
          description: The work statement payment policy was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contracts_createWorkStatementPaymentPolicy-v2026-09-07_Response_201'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorkStatementPaymentPolicy-v2026-09-07RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorkStatementPaymentPolicy-v2026-09-07RequestInternalServerError'
      requestBody:
        description: The work statement payment policy to create.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WorkStatementPaymentPoliciesPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
    get:
      operationId: contracts_getWorkStatementPaymentPolicies-v2026-09-07
      summary: List work statement payment policies
      description: 'Use this endpoint to discover the payment policies configured for the authenticated organization and to pick the policy ID to reference when creating a contract. A payment policy is a reusable payment cycle configuration — when a cycle ends, when payment falls due, and whether payment moves earlier when the due date lands on a weekend.


        **Token scopes**: `contracts:read`'
      tags:
      - Contracts
      responses:
        '200':
          description: Returns the organization's work statement payment policies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contracts_getWorkStatementPaymentPolicies-v2026-09-07_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkStatementPaymentPolicies-v2026-09-07RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkStatementPaymentPolicies-v2026-09-07RequestInternalServerError'
      security:
      - deelToken: []
  /contracts/termination-reasons:
    get:
      operationId: contracts_listContractTerminationReasons-v2026-01-01
      summary: List contract termination reasons
      description: 'Retrieves the standardized list of termination reasons to present when initiating a contract termination


        **Token scopes**: `contracts:read`'
      tags:
      - Contracts
      parameters:
      - name: limit
        in: query
        description: 'Number of items to return per page (default: 20, max: 100)'
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        description: Cursor for pagination. Use the value from `next_cursor` in the previous response to fetch the next page.
        required: false
        schema:
          type: string
      - name: order_by
        in: query
        description: Field to order results by
        required: false
        schema:
          $ref: '#/components/schemas/ContractsTerminationReasonsGetParametersOrderBy'
          default: frequency
      - name: order
        in: query
        description: Sort direction for results
        required: false
        schema:
          $ref: '#/components/schemas/ContractsTerminationReasonsGetParametersOrder'
          default: asc
      responses:
        '200':
          description: Paginated list of termination reasons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contracts_listContractTerminationReasons-v2026-01-01_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListContractTerminationReasons-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListContractTerminationReasons-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
  /workers/contracts/{contract_id}/reject:
    post:
      operationId: contracts_rejectContract-v2026-01-01
      summary: Reject contract
      description: 'Rejects a contract identified by contract_id, provided it is currently in a pending, unsigned state. Contracts that have already been signed or previously rejected are not eligible for this operation.


        **Token scopes**: `worker:write`'
      tags:
      - Contracts
      parameters:
      - name: contract_id
        in: path
        description: The unique public identifier of the contract to reject. This is the contract's public ID that can be used to identify the specific contract in the system.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RejectContract-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RejectContract-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
  /workers/contracts/{contract_id}/pdf:
    get:
      operationId: contracts_retrieveContractPdfDownloadLink-v2026-01-01
      summary: Retrieve contract PDF download link
      description: 'Returns a secure, time-limited URL for downloading the PDF version of the contract identified by contract_id. The URL is accessible only to the authenticated worker associated with that contract.


        **Token scopes**: `worker:read`'
      tags:
      - Contracts
      parameters:
      - name: contract_id
        in: path
        description: The unique public identifier of the contract.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contracts_retrieveContractPdfDownloadLink-v2026-01-01_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
