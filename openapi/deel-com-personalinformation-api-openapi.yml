openapi: 3.2.0
info:
  title: Endpoints Personal Information API
  version: 1.0.0
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: personalInformation
paths:
  /people/{worker_id}/personal:
    get:
      operationId: personalInformation_getPersonPersonalInfo
      summary: Get personal information by id
      description: 'Returns personal information for a worker by their worker ID.


        **Token scopes**: `people:read`'
      tags:
      - personalInformation
      parameters:
      - name: worker_id
        in: path
        description: Unique identifier for a worker (External ID).
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/personal-information_getPersonPersonalInfo_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPersonalInformationById-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
    patch:
      operationId: personalInformation_updatePersonPersonalInfo
      summary: Update personal information
      description: 'Partially updates personal information for a worker by their worker ID; only fields included in the request body are modified.


        **Token scopes**: `people:write`'
      tags:
      - personalInformation
      parameters:
      - name: worker_id
        in: path
        description: Unique identifier for a worker.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/PeopleWorkerIdPersonalPatchRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
  /people/external/{worker_id}/personal:
    get:
      operationId: personalInformation_getPersonPersonalInfoExternalID
      summary: Get worker profile by external ID
      description: 'Retrieves a worker profile record using a system-wide external worker identifier.


        **Token scopes**: `people:read`'
      tags:
      - personalInformation
      parameters:
      - name: worker_id
        in: path
        description: System-wide external identifier for a worker record.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
    patch:
      operationId: personalInformation_updatePersonPersonalInfoExternalID
      summary: Update personal information by external id
      description: 'Partially updates a worker''s personal information using an external identifier. Only fields included in the request body are modified.


        **Token scopes**: `people:write`'
      tags:
      - personalInformation
      parameters:
      - name: worker_id
        in: path
        description: Unique identifier for a worker (External ID).
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/PeopleExternalWorkerIdPersonalPatchRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
  /profiles:
    patch:
      operationId: personalInformation_updateProfile
      summary: Profiles
      description: 'Applies a partial update to the authenticated user''s profile, modifying only the fields supplied in the request body.


        **Token scopes**: `profile:write`, `profile:read`'
      tags:
      - personalInformation
      responses:
        '200':
          description: Successfully updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/personal-information_updateProfile_Response_200'
        '400':
          description: Invalid request parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profiles-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        description: Update profile information for the authenticated user
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/ProfilesPatchRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
components:
  schemas:
    ProfilesPatchRequestBodyContentApplicationJsonSchemaData:
      type: object
      properties:
        phone:
          type: string
          description: The contact number for the profile.
        currency:
          type: string
          description: The preferred currency for the profile.
        timezone:
          type: string
          description: The timezone of the profile.
        last_name:
          type: string
          description: The last name of the profile.
        first_name:
          type: string
          description: The first name of the profile.
        preferred_name:
          type: string
          description: The preferred name of the profile.
      title: ProfilesPatchRequestBodyContentApplicationJsonSchemaData
    PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataEmergencyContactsItemsPreferredLanguage:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the preferred language.
        language:
          type: string
          maxLength: 32
          description: The name of the language.
      required:
      - id
      - language
      description: The preferred language in which the emergency contact should be contacted.
      title: PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataEmergencyContactsItemsPreferredLanguage
    PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataDemographics:
      type: object
      properties:
        gender:
          oneOf:
          - $ref: '#/components/schemas/PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataDemographicsGender'
          - type: 'null'
          description: Gender information for the worker.
        ethnicity:
          oneOf:
          - $ref: '#/components/schemas/PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataDemographicsEthnicity'
          - type: 'null'
          description: Ethnicity information for the worker.
      required:
      - gender
      - ethnicity
      description: Demographic information for the worker, including gender and ethnicity.
      title: PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataDemographics
    PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataNationalitiesItems:
      type: object
      properties:
        code:
          type: string
          maxLength: 2
          description: Unique 2-letters ISO country code.
        name:
          type: string
          maxLength: 100
          description: The name of the country.
      required:
      - code
      - name
      title: PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataNationalitiesItems
    PeopleWorkerIdPersonalPatchRequestBodyContentApplicationJsonSchemaDataPhoneNumbersItems:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/PeopleWorkerIdPersonalPatchRequestBodyContentApplicationJsonSchemaDataPhoneNumbersItemsType'
          description: The type of the phone number.
        dial_code:
          type: string
          maxLength: 10
          description: The dial code (also known as country code).
        phone_number:
          type: string
          maxLength: 30
          description: The phone number.
      required:
      - type
      - dial_code
      - phone_number
      title: PeopleWorkerIdPersonalPatchRequestBodyContentApplicationJsonSchemaDataPhoneNumbersItems
    ProfilesPatchResponsesContentApplicationJsonSchemaData:
      type: object
      properties:
        phone:
          type: string
          description: The contact number for the profile.
        currency:
          type: string
          description: The preferred currency for the profile.
        timezone:
          type: string
          description: The timezone of the profile.
        last_name:
          type: string
          description: The last name of the profile.
        first_name:
          type: string
          description: The first name of the profile.
        preferred_name:
          type: string
          description: The preferred name of the profile.
      title: ProfilesPatchResponsesContentApplicationJsonSchemaData
    PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataAddressesItems:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the address.
        zip:
          type:
          - string
          - 'null'
          maxLength: 255
          description: The zip code.
        city:
          type:
          - string
          - 'null'
          maxLength: 255
          description: The city.
        type:
          $ref: '#/components/schemas/PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataAddressesItemsType'
          description: The type of the address.
        state:
          type:
          - string
          - 'null'
          maxLength: 255
          description: The state.
        street:
          type:
          - string
          - 'null'
          maxLength: 255
          description: The street address.
        country:
          type: string
          maxLength: 255
          description: The country.
      required:
      - id
      - zip
      - city
      - type
      - state
      - street
      - country
      title: PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataAddressesItems
    personal-information_getPersonPersonalInfo_Response_200:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaData'
      required:
      - data
      title: personal-information_getPersonPersonalInfo_Response_200
    PeopleExternalWorkerIdPersonalPatchRequestBodyContentApplicationJsonSchemaData:
      type: object
      properties:
        date_of_birth:
          type: string
          format: date
          description: 'The date of birth of the worker. Format: YYYY-MM-DD.'
        personal_email:
          type: string
          format: email
          maxLength: 255
          description: The personal email of the worker.
        preferred_name:
          type:
          - string
          - 'null'
          maxLength: 255
          description: The preferred name of the worker.
        legal_last_name:
          type: string
          maxLength: 100
          description: The legal last name of the worker.
        legal_first_name:
          type: string
          maxLength: 100
          description: The legal first name of the worker.
      title: PeopleExternalWorkerIdPersonalPatchRequestBodyContentApplicationJsonSchemaData
    PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataDemographicsGender:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the gender.
        name:
          type: string
          maxLength: 100
          description: The name of the gender.
        other_name:
          type:
          - string
          - 'null'
          maxLength: 100
          description: Gender added by user when "Other" option was chosen.
      required:
      - id
      - name
      - other_name
      description: Gender information for the worker.
      title: PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataDemographicsGender
    PeopleWorkerIdPersonalPatchRequestBodyContentApplicationJsonSchemaData:
      type: object
      properties:
        work_email:
          type: string
          format: email
          maxLength: 255
          description: The personal email of the worker.
        date_of_birth:
          type: string
          format: date
          description: 'The date of birth of the worker. Format: YYYY-MM-DD.'
        phone_numbers:
          type: array
          items:
            $ref: '#/components/schemas/PeopleWorkerIdPersonalPatchRequestBodyContentApplicationJsonSchemaDataPhoneNumbersItems'
        personal_email:
          type: string
          format: email
          maxLength: 255
          description: The personal email of the worker.
        preferred_name:
          type:
          - string
          - 'null'
          maxLength: 255
          description: The preferred name of the worker.
        legal_last_name:
          type: string
          maxLength: 100
          description: The legal last name of the worker.
        legal_first_name:
          type: string
          maxLength: 100
          description: The legal first name of the worker.
      title: PeopleWorkerIdPersonalPatchRequestBodyContentApplicationJsonSchemaData
    PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataDemographicsEthnicity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the ethnicity.
        name:
          type: string
          maxLength: 100
          description: The name of the ethnicity.
        other_name:
          type:
          - string
          - 'null'
          maxLength: 100
          description: Ethnicity added by user when "Other" option was chosen.
      required:
      - id
      - name
      - other_name
      description: Ethnicity information for the worker.
      title: PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataDemographicsEthnicity
    GetPersonalInformationById-v2026-01-01RequestInternalServerError:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaError'
      required:
      - error
      title: GetPersonalInformationById-v2026-01-01RequestInternalServerError
    PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataKyc:
      type: object
      properties:
        is_kyc_approved:
          type: boolean
          description: Boolean to identify if the user is KYC verified
        kyc_approval_date:
          type:
          - string
          - 'null'
          description: The Date the user was KYC verified if applicable
      required:
      - is_kyc_approved
      - kyc_approval_date
      description: KYC (Know Your Customer) verification information for the worker.
      title: PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataKyc
    PeopleWorkerIdPersonalPatchRequestBodyContentApplicationJsonSchemaDataPhoneNumbersItemsType:
      type: string
      enum:
      - PERSONAL
      - WORK
      - HOME
      description: The type of the phone number.
      title: PeopleWorkerIdPersonalPatchRequestBodyContentApplicationJsonSchemaDataPhoneNumbersItemsType
    PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataOoo:
      type: object
      properties:
        name:
          type: string
          description: The worker out of office name.
        end_date:
          type: string
          maxLength: 10
          description: The worker out of office end date.
        leave_type:
          $ref: '#/components/schemas/PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataOooLeaveType'
          description: The worker leave type.
        start_date:
          type: string
          format: date
          description: The worker out of office start date.
      required:
      - name
      - end_date
      - leave_type
      - start_date
      description: Out of office information for the worker, including leave type and dates.
      title: PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataOoo
    PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaError:
      type: object
      properties:
        code:
          type: string
          description: Error code identifying the type of error.
        details:
          type:
          - string
          - 'null'
          description: Additional details about the error.
        message:
          type: string
          description: Error message describing what went wrong.
      required:
      - code
      - message
      title: PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaError
    PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataAddressesItemsType:
      type: string
      enum:
      - HOME
      - POSTAL
      - CONTRACT
      description: The type of the address.
      title: PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataAddressesItemsType
    ApiErrorRequest:
      type: object
      properties:
        method:
          type: string
          description: The HTTP method of the failed request
        url:
          type: string
          description: The relative URL of the failed request
        status:
          type: number
          format: double
          description: The status code of the response
        api_req_id:
          type: string
          description: The request ID of the failed request
        docs:
          type: string
          description: A link to the official documentation for the requested endpoint resource
        source:
          type: string
          description: The source handler which produced the returned error
        code:
          type: number
          format: double
          description: The code of the source handler which produced the returned error
      title: ApiErrorRequest
    ApiErrorContainer:
      type: object
      properties:
        request:
          $ref: '#/components/schemas/ApiErrorRequest'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiError'
      title: ApiErrorContainer
    ApiError:
      type: object
      properties:
        message:
          type: string
          description: A description of the returned error
        path:
          type: string
          description: The JSON path where input validation failed
      title: ApiError
    personal-information_updateProfile_Response_200:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ProfilesPatchResponsesContentApplicationJsonSchemaData'
      title: personal-information_updateProfile_Response_200
    PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataOooLeaveType:
      type: string
      enum:
      - LONG_TERM_LEAVE
      - SHORT_TERM_LEAVE
      description: The worker leave type.
      title: PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataOooLeaveType
    Profiles-v2026-01-01RequestBadRequestError:
      type: object
      properties:
        message:
          type: string
          description: Error message explaining what went wrong.
      title: Profiles-v2026-01-01RequestBadRequestError
    PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataPhoneNumbersItems:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataPhoneNumbersItemsType'
          description: The type of the phone number.
        dial_code:
          type: string
          maxLength: 10
          description: The dial code (also known as country code).
        phone_number:
          type: string
          maxLength: 30
          description: The phone number.
      required:
      - type
      - dial_code
      - phone_number
      title: PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataPhoneNumbersItems
    PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataEmergencyContactsItems:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the emergency contact.
        name:
          type: string
          maxLength: 255
          description: The name of the emergency contact.
        email:
          type:
          - string
          - 'null'
          format: email
          maxLength: 255
          description: The email of the emergency contact.
        phone:
          type: string
          maxLength: 30
          description: The phone number of the emergency contact.
        relationship:
          type: string
          maxLength: 100
          description: The type of relationship between the owner and the emergency contact.
        preferred_language:
          oneOf:
          - $ref: '#/components/schemas/PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataEmergencyContactsItemsPreferredLanguage'
          - type: 'null'
          description: The preferred language in which the emergency contact should be contacted.
      required:
      - id
      - name
      - email
      - phone
      - relationship
      - preferred_language
      title: PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataEmergencyContactsItems
    PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataPhoneNumbersItemsType:
      type: string
      enum:
      - PERSONAL
      - WORK
      - HOME
      description: The type of the phone number.
      title: PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataPhoneNumbersItemsType
    PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaData:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the worker.
        kyc:
          $ref: '#/components/schemas/PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataKyc'
          description: KYC (Know Your Customer) verification information for the worker.
        ooo:
          oneOf:
          - $ref: '#/components/schemas/PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataOoo'
          - type: 'null'
          description: Out of office information for the worker, including leave type and dates.
        addresses:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataAddressesItems'
          description: Array of addresses associated with the worker.
        worker_id:
          type: integer
          description: The worker id.
        work_email:
          type:
          - string
          - 'null'
          format: email
          maxLength: 255
          description: The work email of the worker.
        external_id:
          type:
          - string
          - 'null'
          maxLength: 100
          description: The external id of the worker.
        demographics:
          oneOf:
          - $ref: '#/components/schemas/PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataDemographics'
          - type: 'null'
          description: Demographic information for the worker, including gender and ethnicity.
        date_of_birth:
          type:
          - string
          - 'null'
          format: date
          description: The date of birth of the worker.
        nationalities:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataNationalitiesItems'
          description: Array of nationalities associated with the worker.
        phone_numbers:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataPhoneNumbersItems'
          description: Array of phone numbers associated with the worker.
        personal_email:
          type:
          - string
          - 'null'
          format: email
          maxLength: 255
          description: The personal email of the worker.
        preferred_name:
          type:
          - string
          - 'null'
          maxLength: 255
          description: The preferred name of the worker.
        legal_last_name:
          type:
          - string
          - 'null'
          maxLength: 100
          description: The legal last name of the worker.
        legal_first_name:
          type:
          - string
          - 'null'
          maxLength: 100
          description: The legal first name of the worker.
        emergency_contacts:
          type: array
          items:
            $ref: '#/components/schemas/PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaDataEmergencyContactsItems'
          description: Array of emergency contacts associated with the worker.
      required:
      - id
      - worker_id
      - emergency_contacts
      title: PeopleWorkerIdPersonalGetResponsesContentApplicationJsonSchemaData
  securitySchemes:
    deelToken:
      type: http
      scheme: bearer
      description: "## Authentication\nThe Deel API uses bearer tokens to authenticate requests. All API calls must be made over HTTPS — calls over plain HTTP or without authentication will fail.\n\n```curl\ncurl -X GET 'https://api.letsdeel.com/rest/v2/contracts' \\\n  -H 'Authorization: Bearer YOUR-TOKEN-HERE'\n```\n\n[Learn more about authentication](/api/authentication)"
    oauth2:
      type: http
      scheme: bearer
      description: Standard OAuth2 security scheme based on https://swagger.io/docs/specification/authentication/
