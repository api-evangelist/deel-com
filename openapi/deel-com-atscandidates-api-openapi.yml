      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the interview plan stage
        name:
          type: string
          description: Name of the interview plan stage
        description:
          type:
          - string
          - 'null'
          description: Description of the interview plan stage
        stage_order:
          type: number
          format: double
          description: Order of the stage in the interview plan
        default_type_slug:
          type:
          - string
          - 'null'
          description: Default type slug for the interview plan stage
        interview_plan_id:
          type: string
          format: uuid
          description: Unique identifier for the interview plan
        category_type_slug:
          type: string
          description: Category type slug for the interview plan stage
      required:
      - id
      - name
      - stage_order
      - interview_plan_id
      - category_type_slug
      title: AtsCandidatesGetResponsesContentApplicationJsonSchemaDataItemsApplicationsItemsCurrentApplicationInterviewPlanStageInterviewPlanStage
