                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
    servers:
    - url: https://api.letsdeel.com/rest
      description: Production
    - url: https://api-staging.letsdeel.com/rest
      description: Demo
    - url: https://api.letsdeel.com/scim/v2
      description: Production
    - url: https://api-staging.letsdeel.com/scim/v2
      description: Demo
  /immigration/invoices:
    get:
      operationId: immigration_listCaseInvoices-v2026-10-14
      summary: List case invoices
      description: 'Retrieves the invoices issued to the organization for a case, earliest due first. Requires the case_id returned from the List cases endpoint.


        **Token scopes**: `immigration:read`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2027-01-14.'
      tags:
      - immigration
      parameters:
      - name: case_id
        in: query
        description: The unique identifier of the case whose invoices should be listed.
        required: true
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        description: Opaque pagination cursor returned as next_cursor from a previous response. Omit to fetch the first page.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of invoices to return. Capped at 100.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/ImmigrationInvoicesGetParametersXBeta'
      responses:
        '200':
          description: Successful response with the case's invoices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Immigration_listCaseInvoices-v2026-10-14_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCaseInvoices-v2026-10-14RequestBadRequestError'
        '401':
