      description: Production
    - url: https://api-staging.letsdeel.com/rest
      description: Demo
    - url: https://api.letsdeel.com/scim/v2
      description: Production
    - url: https://api-staging.letsdeel.com/scim/v2
      description: Demo
  /immigration/notes:
    get:
      operationId: immigration_listCaseNotes-v2026-08-10
      summary: List case notes
      description: 'Retrieves the externally-visible notes for a case, most recent first. Requires the case_id returned from the List cases endpoint.


        **Token scopes**: `immigration:read`'
      tags:
