        required: true
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        description: Opaque pagination cursor returned as next_cursor from a previous response. Omit to fetch the first page.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of notes to return. Capped at 100.
        required: false
        schema:
          type: integer
          maximum: 100
          default: 20
      responses:
        '200':
          description: Successful response with the case's externally-visible notes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Immigration_listCaseNotes-v2026-08-10_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCaseNotes-v2026-08-10RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCaseNotes-v2026-08-10RequestInternalServerError'
      security:
