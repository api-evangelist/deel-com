              schema:
                $ref: '#/components/schemas/ImmigrationDocument-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
    servers:
    - url: https://api.letsdeel.com/rest
      description: Production
    - url: https://api-staging.letsdeel.com/rest
      description: Demo
    - url: https://api.letsdeel.com/scim/v2
      description: Production
    - url: https://api-staging.letsdeel.com/scim/v2
      description: Demo
  /immigration/visa-types/{country_code}:
    get:
      operationId: immigration_getVisaTypes
      summary: Immigration visa types
      description: 'Returns the visa types supported for immigration processing in a country, identified by its Alpha-2 country code.


        **Token scopes**: `immigration:read`'
      tags:
      - immigration
      parameters:
      - name: country_code
        in: path
        description: Alpha 2 country code
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/immigration_getVisaTypes_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
