openapi: 3.2.0
info:
  title: Deel Com Immigration API
  version: '1.0'
  description: 'Operations tagged immigration across 2 of this provider''s published API definitions: deel-com-openapi.yml, deel-platform-extensions-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
- url: https://api.letsdeel.com/rest/v2
  description: Production
- url: https://api-sandbox.demo.deel.com/rest/v2
  description: Sandbox
tags:
- name: immigration
paths:
  /immigration/visa-application-quotes/{visa_application_quote_id}/approve:
    post:
      operationId: immigration_approveVisaApplicationQuote-v2026-10-14
      summary: Approve a visa application quote
      description: 'Approves a visa application quote in IN_REVIEW and opens the visa application case, returned as generated_case_id. An approved visa application quote cannot be approved again. Requires the visa application quote id returned from the List case visa application quotes endpoint.


        **Token scopes**: `immigration:write`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2027-01-14.'
      tags:
      - immigration
      parameters:
      - name: visa_application_quote_id
        in: path
        description: The unique identifier of the visa application quote to approve.
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/ImmigrationVisaApplicationQuotesVisaApplicationQuoteIdApprovePostParametersXBeta'
      responses:
        '200':
          description: Successful response with the approved visa application quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Immigration_approveVisaApplicationQuote-v2026-10-14_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveVisaApplicationQuote-v2026-10-14RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveVisaApplicationQuote-v2026-10-14RequestInternalServerError'
      security:
      - deelToken: []
    servers:
    - url: https://api.letsdeel.com/rest
      description: Production
    - url: https://api-staging.letsdeel.com/rest
      description: Demo
    - url: https://api.letsdeel.com/scim/v2
      description: Production
    - url: https://api-staging.letsdeel.com/scim/v2
      description: Demo
  /immigration/client/cases:
    post:
      operationId: immigration_createClientCase
      summary: Create an immigration case
      description: 'Creates a new immigration case for a worker. The appropriate visa type must be determined before calling this endpoint.


        **Token scopes**: `immigration:write`'
      tags:
      - immigration
      responses:
        '201':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/immigration_createClientCase_Response_201'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAnImmigrationCase-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAnImmigrationCase-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/ImmigrationClientCasesPostRequestBodyContentApplicationJsonSchemaData'
      security:
      - deelToken: []
    get:
      operationId: immigration_getClientCases
      summary: List of immigration cases
      description: 'Use this endpoint to track the progress of your organization''s immigration cases and identify ones that need attention, such as those currently on hold.


        **Token scopes**: `immigration:read`'
      tags:
      - immigration
      parameters:
      - name: search
        in: query
        description: Search by applicant name or code
        required: false
        schema:
          type: string
          minLength: 3
          maxLength: 100
      - name: case_type_ids
        in: query
        description: Filter by case type IDs
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: statuses
        in: query
        description: Filter by case status
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ImmigrationClientCasesGetParametersStatusesSchemaItems'
      - name: countries
        in: query
        description: Filter by country. Uses ISO 3166-1 alpha-2 codes (https://www.iban.com/country-codes).
        required: false
        schema:
          type: array
          items:
            type: string
            pattern: ^[A-Z]{2}$
            minLength: 2
            maxLength: 2
      - name: cursor
        in: query
        description: Pagination cursor for fetching next set of results
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Max number of results to return
        required: false
        schema:
          type: integer
          maximum: 100
          default: 20
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/immigration_getClientCases_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOfImmigrationCases-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOfImmigrationCases-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
    servers:
    - url: https://api.letsdeel.com/rest
      description: Production
    - url: https://api-staging.letsdeel.com/rest
      description: Demo
    - url: https://api.letsdeel.com/scim/v2
      description: Production
    - url: https://api-staging.letsdeel.com/scim/v2
      description: Demo
  /immigration/visa-requirement/business:
    get:
      operationId: immigration_getBusinessVisaRequirement
      summary: Get business visa eligibility and requirements
      description: 'Analyzes a traveller''s nationality, residence country, destination, and trip dates to return the available business visa options along with their fees, estimated timelines, and qualification criteria. An optional `second_nationality` may be provided to expand eligibility assessment.


        **Token scopes**: `immigration:read`'
      tags:
      - immigration
      parameters:
      - name: destination_country
        in: query
        description: The destination country code of the trip in ISO 3166-1 alpha-2 format
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{2}$
      - name: nationality
        in: query
        description: The nationality country code of the person in ISO 3166-1 alpha-2 format
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{2}$
      - name: residence_country
        in: query
        description: The residence country code of the person in ISO 3166-1 alpha-2 format
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{2}$
      - name: trip_start_date
        in: query
        description: The trip start date in ISO 8601 format (YYYY-MM-DD)
        required: true
        schema:
          type: string
          format: date
      - name: trip_end_date
        in: query
        description: The trip end date in ISO 8601 format (YYYY-MM-DD)
        required: true
        schema:
          type: string
          format: date
      - name: trip_reason
        in: query
        description: The reason for the trip
        required: true
        schema:
          $ref: '#/components/schemas/ImmigrationVisaRequirementBusinessGetParametersTripReason'
      - name: second_nationality
        in: query
        description: The second nationality country code of the person in ISO 3166-1 alpha-2 format (optional)
        required: false
        schema:
          type: string
          pattern: ^[A-Z]{2}$
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/immigration_getBusinessVisaRequirement_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBusinessVisaEligibilityAndRequirements-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBusinessVisaEligibilityAndRequirements-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
    servers:
    - url: https://api.letsdeel.com/rest
      description: Production
    - url: https://api-staging.letsdeel.com/rest
      description: Demo
    - url: https://api.letsdeel.com/scim/v2
      description: Production
    - url: https://api-staging.letsdeel.com/scim/v2
      description: Demo
  /immigration/cases/{case_id}/timeline:
    get:
      operationId: immigration_getCaseTimeline-v2026-10-14
      summary: Get case timeline
      description: 'Retrieves the processes, steps and client or employee actions of a case, in order. Requires the case_id returned from the List cases endpoint.


        **Token scopes**: `immigration:read`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2027-01-14.'
      tags:
      - immigration
      parameters:
      - name: case_id
        in: path
        description: The unique identifier of the case whose timeline should be returned.
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/ImmigrationCasesCaseIdTimelineGetParametersXBeta'
      responses:
        '200':
          description: Successful response with the case timeline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Immigration_getCaseTimeline-v2026-10-14_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCaseTimeline-v2026-10-14RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCaseTimeline-v2026-10-14RequestInternalServerError'
      security:
      - deelToken: []
    servers:
    - url: https://api.letsdeel.com/rest
      description: Production
    - url: https://api-staging.letsdeel.com/rest
      description: Demo
    - url: https://api.letsdeel.com/scim/v2
      description: Production
    - url: https://api-staging.letsdeel.com/scim/v2
      description: Demo
  /immigration/client/cases/{id}:
    get:
      operationId: immigration_getClientCase
      summary: Get immigration case details
      description: 'Retrieves the details of an immigration case by its case ID.


        **Token scopes**: `immigration:read`'
      tags:
      - immigration
      parameters:
      - name: id
        in: path
        description: Immigration case id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/immigration_getClientCase_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetImmigrationCaseDetails-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetImmigrationCaseDetails-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
    servers:
    - url: https://api.letsdeel.com/rest
      description: Production
    - url: https://api-staging.letsdeel.com/rest
      description: Demo
    - url: https://api.letsdeel.com/scim/v2
      description: Production
    - url: https://api-staging.letsdeel.com/scim/v2
      description: Demo
  /immigration/workers/cases/{case_id}:
    get:
      operationId: immigration_getWorkerCase
      summary: Get specific immigration case details
      description: 'Get detailed information for a specific immigration case. Use this to check case status and track process progress. The id path parameter is the case UUID returned from the ''Create Client Case'' endpoint. Response is enriched with applicant profile, visa type, case status, estimated completion date, process details, and compliance document details.


        **Token scopes**: `worker:read`'
      tags:
      - immigration
      parameters:
      - name: case_id
        in: path
        description: Filter by case ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/immigration_getWorkerCase_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSpecificImmigrationCaseDetails-v2026-04-02RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSpecificImmigrationCaseDetails-v2026-04-02RequestInternalServerError'
      security:
      - deelToken: []
    servers:
    - url: https://api.letsdeel.com/rest
      description: Production
    - url: https://api-staging.letsdeel.com/rest
      description: Demo
    - url: https://api.letsdeel.com/scim/v2
      description: Production
    - url: https://api-staging.letsdeel.com/scim/v2
      description: Demo
  /immigration/documents/{id}:
    get:
      operationId: immigration_getDocument
      summary: Immigration document
      description: 'Retrieves the details of an immigration case document by its document `id`.


        **Token scopes**: `immigration:read`'
      tags:
      - immigration
      parameters:
      - name: id
        in: path
        description: 'Immigration case document id '
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/immigration_getDocument_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
