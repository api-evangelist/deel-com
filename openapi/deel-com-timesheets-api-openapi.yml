openapi: 3.2.0
info:
  title: Endpoints Timesheets API
  version: 1.0.0
  description: API endpoints related to Timesheets.
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: Timesheets
  description: API endpoints related to Timesheets.
paths:
  /timesheets:
    post:
      operationId: timesheets_createTimesheet
      summary: Create a timesheet entry
      description: 'Creates a timesheet entry for an hourly contractor, recording the contract, date, hours worked, and an optional description. The entry is immediately placed into a review workflow upon creation.


        **Token scopes**: `timesheets:write`'
      tags:
      - Timesheets
      responses:
        '201':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/timesheets_createTimesheet_Response_201'
        '400':
          description: Bad Request - The request payload failed validation or violated a business rule for timesheet entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateATimesheetEntry-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Internal Server Error - The timesheet entry could not be created due to an unexpected upstream or internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateATimesheetEntry-v2026-01-01RequestInternalServerError'
      requestBody:
        description: Timesheet object that needs to be created
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/TimesheetsPostRequestBodyContentApplicationJsonSchemaData'
                  description: Payload attributes required to create one timesheet entry with optional approval, preset, and grouping metadata.
              required:
              - data
      security:
      - deelToken: []
    get:
      operationId: timesheets_getTimesheets
      summary: List of timesheets
      description: 'Returns a paginated list of timesheets in the account, optionally filtered by contract_id, contract_types, statuses, reporter_id, or date range.


        **Token scopes**: `timesheets:read`'
      tags:
      - Timesheets
      parameters:
      - name: contract_id
        in: query
        description: Filter results to timesheets belonging to this Deel contract ID.
        required: false
        schema:
          type: string
      - name: contract_types
        in: query
        description: Filter results to timesheets associated with the specified contract types.
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/TimesheetsGetParametersContractTypesSchemaItems'
      - name: statuses
        in: query
        description: Filter results to timesheets with the specified statuses.
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/TimesheetsGetParametersStatusesSchemaItems'
      - name: reporter_id
        in: query
        description: Filter results to timesheets submitted by this user ID.
        required: false
        schema:
          type: string
          format: uuid
      - name: date_from
        in: query
        description: 'Filter results to timesheets submitted on or after this date (inclusive). Short date in format ISO-8601 (YYYY-MM-DD). For example: 2022-12-31.'
        required: false
        schema:
          type: string
          format: date
      - name: date_to
        in: query
        description: 'Filter results to timesheets submitted before this date (exclusive). Short date in format ISO-8601 (YYYY-MM-DD). For example: 2022-12-31.'
        required: false
        schema:
          type: string
          format: date
      - name: limit
        in: query
        description: 'Maximum number of records to return per page. NOTE: query parameters are passed as strings.'
        required: false
        schema:
          type: string
          pattern: ^[0-9]+$
      - name: offset
        in: query
        description: 'Number of records to skip before starting to return results. NOTE: query parameters are passed as strings.'
        required: false
        schema:
          type: string
          pattern: ^[0-9]+$
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/timesheets_getTimesheets_Response_200'
        '400':
          description: Bad Request - Validation error or invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOfTimesheets-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /timesheets/{id}/reviews:
    post:
      operationId: timesheets_createTimesheetReview
      summary: Create Timesheet Review
      tags:
      - Timesheets
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
  /timesheets/{timesheet_id}:
    delete:
      operationId: timesheets_deleteTimesheetById-v2026-01-01
      summary: Delete a timesheet entry
      description: 'Permanently deletes a timesheet entry. An optional `reason` query parameter may be provided to record the rationale for deletion.


        **Token scopes**: `timesheets:write`'
      tags:
      - Timesheets
      parameters:
      - name: timesheet_id
        in: path
        description: ID of an existing timesheet
        required: true
        schema:
          type: string
      - name: reason
        in: query
        description: Reason for deleting an existing task
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timesheets_deleteTimesheetById-v2026-01-01_Response_200'
        '400':
          description: Bad Request - The timesheet cannot be deleted given its current status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteTimesheetById-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden - The specified timesheet does not exist or the requester does not have access to it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteTimesheetById-v2026-01-01RequestForbiddenError'
        '404':
          description: Not Found - The specified timesheet does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteTimesheetById-v2026-01-01RequestNotFoundError'
        '500':
          description: Internal Server Error - The timesheet could not be deleted due to an unexpected upstream or internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteTimesheetById-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
    get:
      operationId: timesheets_getTimesheetById-v2026-01-01
      summary: Retrieve a single timesheet entry
      description: 'Returns a single timesheet entry.


        **Token scopes**: `timesheets:read`'
      tags:
      - Timesheets
      parameters:
      - name: timesheet_id
        in: path
        description: ID of an existing timesheet
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timesheets_getTimesheetById-v2026-01-01_Response_200'
        '400':
          description: Bad Request - The id parameter failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTimesheetById-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden - The specified timesheet does not exist or the requester does not have access to it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTimesheetById-v2026-01-01RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Internal Server Error - The timesheet could not be retrieved due to an unexpected upstream or internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTimesheetById-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
    patch:
      operationId: timesheets_updateATimesheetEntry-v2026-01-01
      summary: Update a timesheet entry
      description: 'Partially updates an existing timesheet entry; only fields supplied in the request body are modified. Both clients and contractors may perform this operation.


        **Token scopes**: `timesheets:write`'
      tags:
      - Timesheets
      parameters:
      - name: timesheet_id
        in: path
        description: ID of an existing timesheet.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timesheets_updateATimesheetEntry-v2026-01-01_Response_200'
        '400':
          description: Bad Request - The request payload failed validation or violated a business rule for the timesheet entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateATimesheetEntry-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden - The specified timesheet does not exist or the requester does not have access to it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateATimesheetEntry-v2026-01-01RequestForbiddenError'
        '404':
          description: Not Found - The specified timesheet does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateATimesheetEntry-v2026-01-01RequestNotFoundError'
        '500':
          description: Internal Server Error - The timesheet could not be updated due to an unexpected upstream or internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateATimesheetEntry-v2026-01-01RequestInternalServerError'
      requestBody:
        description: Details of the timesheet to update. Both a client or a contractor may update a timesheet.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/TimesheetsTimesheetIdPatchRequestBodyContentApplicationJsonSchemaData'
                  description: Fields to update on the existing timesheet entry.
              required:
              - data
      security:
      - deelToken: []
  /timesheets/{id}:
    get:
      operationId: timesheets_getTimesheetById
      summary: Get Timesheet By Id
      tags:
      - Timesheets
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
    patch:
      operationId: timesheets_updateTimesheet
      summary: Update Timesheet
      tags:
      - Timesheets
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
  /contracts/{contract_id}/timesheets:
    get:
      operationId: timesheets_getContractTimesheets
      summary: List of timesheets by contract
      description: 'Returns timesheets associated with the specified contract, with optional filtering by contract type, status, reporter, and date range.


        **Token scopes**: `timesheets:read`'
      tags:
      - Timesheets
      parameters:
      - name: contract_id
        in: path
        description: Deel contract id.
        required: true
        schema:
          type: string
      - name: contract_types
        in: query
        description: Filter results to timesheets associated with the specified contract types.
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ContractsContractIdTimesheetsGetParametersContractTypesSchemaItems'
      - name: statuses
        in: query
        description: Filter results to timesheets with the specified statuses.
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ContractsContractIdTimesheetsGetParametersStatusesSchemaItems'
      - name: reporter_id
        in: query
        description: Filter results to timesheets submitted by this user ID.
        required: false
        schema:
          type: string
          format: uuid
      - name: date_from
        in: query
        description: 'Filter results to timesheets submitted on or after this date (inclusive). Short date in format ISO-8601 (YYYY-MM-DD). For example: 2022-12-31.'
        required: false
        schema:
          type: string
          format: date
      - name: date_to
        in: query
        description: 'Filter results to timesheets submitted before this date (exclusive). Short date in format ISO-8601 (YYYY-MM-DD). For example: 2022-12-31.'
        required: false
        schema:
          type: string
          format: date
      - name: limit
        in: query
        description: 'Maximum number of records to return per page. NOTE: query parameters are passed as strings.'
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: 'Number of records to skip before starting to return results. NOTE: query parameters are passed as strings.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/timesheets_getContractTimesheets_Response_200'
        '400':
          description: Bad Request - Validation error or invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTimesheetsByContract-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden - The requester does not have access to the specified contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTimesheetsByContract-v2026-01-01RequestForbiddenError'
        '404':
          description: Not Found - The specified contract does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTimesheetsByContract-v2026-01-01RequestNotFoundError'
        '500':
          description: Internal Server Error - The contract timesheets could not be listed due to an unexpected upstream or internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTimesheetsByContract-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
  /timesheets/{timesheet_id}/reviews:
    post:
      operationId: timesheets_createTimesheetReview-v2026-01-01
      summary: Review a single timesheet
      description: 'Submits an approve or reject decision for a timesheet entry. Approved timesheets are queued for inclusion in the next payment cycle.


        **Token scopes**: `timesheets:write`'
      tags:
      - Timesheets
      parameters:
      - name: timesheet_id
        in: path
        description: ID of an existing timesheet
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timesheets_createTimesheetReview-v2026-01-01_Response_201'
        '400':
          description: Bad Request - The request payload failed validation or violated a business rule for the timesheet review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTimesheetReview-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Not Found - The specified timesheet id could not be found for review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTimesheetReview-v2026-01-01RequestNotFoundError'
        '500':
          description: Internal Server Error - The timesheet review could not be processed due to an unexpected upstream or internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTimesheetReview-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/TimesheetsTimesheetIdReviewsPostRequestBodyContentApplicationJsonSchemaData'
                  description: Review decision payload to apply to the timesheet entry.
              required:
              - data
      security:
      - deelToken: []
  /timesheets/many/reviews:
    post:
      operationId: timesheets_createtimesheetreviews-v2026-01-01
      summary: Review multiple timesheets
      description: 'Review a batch of timesheets to approve or reject submitted work.


        **Token scopes**: `timesheets:write`'
      tags:
      - Timesheets
      responses:
        '201':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timesheets_createtimesheetreviews-v2026-01-01_Response_201'
        '400':
          description: Bad Request - The request payload failed validation or violated a business rule for the timesheet reviews.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Createtimesheetreviews-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden - The caller does not hold a client role on this organization (bare text/html body), or has no access to the contract (JSON error envelope).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Createtimesheetreviews-v2026-01-01RequestForbiddenError'
        '404':
          description: Not Found - None of the supplied ids has a pending approval request to review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Createtimesheetreviews-v2026-01-01RequestNotFoundError'
        '409':
          description: Conflict - A previous batch approval for this approver is still being processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Createtimesheetreviews-v2026-01-01RequestConflictError'
        '500':
          description: Internal Server Error - The timesheet reviews could not be processed due to an unexpected upstream or internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Createtimesheetreviews-v2026-01-01RequestInternalServerError'
      requestBody:
        description: Timesheet review objects that need to be created
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/TimesheetsManyReviewsPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
components:
  schemas:
    ContractsContractIdTimesheetsGetResponsesContentApplicationJsonSchemaErrorsItems:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable error code identifying the failure category.
        message:
          type: string
          description: Human-readable error message describing the unexpected condition.
      required:
      - message
      title: ContractsContractIdTimesheetsGetResponsesContentApplicationJsonSchemaErrorsItems
    TimesheetsGetResponsesContentApplicationJsonSchemaDataItemsContractType:
      type: string
      enum:
      - ongoing_time_based
      - milestones
      - time_based
      - pay_as_you_go_time_based
      - commission
      - payg_milestones
      - payg_tasks
      - eor
      - unknown
      - employee
      - global_payroll
      - shield_msa
      - hris_direct_employee
      - peo
      description: Type of a contract
      title: TimesheetsGetResponsesContentApplicationJsonSchemaDataItemsContractType
    TimesheetsGetResponsesContentApplicationJsonSchemaDataItemsContract:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the contract.
        type:
          $ref: '#/components/schemas/TimesheetsGetResponsesContentApplicationJsonSchemaDataItemsContractType'
          description: Type of a contract
        title:
          type: string
          description: Human-readable title of the contract.
      required:
      - id
      - type
      - title
      title: TimesheetsGetResponsesContentApplicationJsonSchemaDataItemsContract
    CreateATimesheetEntry-v2026-01-01RequestInternalServerError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/TimesheetsPostResponsesContentApplicationJsonSchemaErrorsItems'
          description: Generic upstream or internal errors emitted when the timesheet entry cannot be processed.
      required:
      - errors
      title: CreateATimesheetEntry-v2026-01-01RequestInternalServerError
    GetTimesheetsByContract-v2026-01-01RequestNotFoundError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ContractsContractIdTimesheetsGetResponsesContentApplicationJsonSchemaErrorsItems'
          description: Errors describing why the contract could not be found.
      required:
      - errors
      title: GetTimesheetsByContract-v2026-01-01RequestNotFoundError
    TimesheetsGetResponsesContentApplicationJsonSchemaDataItemsReportedBy:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the reporting user.
        full_name:
          type: string
          description: Full name of the user who submitted the timesheet.
      required:
      - id
      description: User who submitted the timesheet.
      title: TimesheetsGetResponsesContentApplicationJsonSchemaDataItemsReportedBy
    ContractsContractIdTimesheetsGetResponsesContentApplicationJsonSchemaDataItemsContract:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the contract.
        type:
          $ref: '#/components/schemas/ContractsContractIdTimesheetsGetResponsesContentApplicationJsonSchemaDataItemsContractType'
          description: Type of a contract
        title:
          type: string
          description: Human-readable title of the contract.
      required:
      - id
      - type
      - title
      description: Contract associated with this timesheet.
      title: ContractsContractIdTimesheetsGetResponsesContentApplicationJsonSchemaDataItemsContract
    DeleteTimesheetById-v2026-01-01RequestInternalServerError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/TimesheetsTimesheetIdDeleteResponsesContentApplicationJsonSchemaErrorsItems'
          description: Generic upstream or internal errors emitted when the timesheet cannot be deleted.
      required:
      - errors
      title: DeleteTimesheetById-v2026-01-01RequestInternalServerError
    TimesheetsManyReviewsPostRequestBodyContentApplicationJsonSchemaDataStatus:
      type: string
      enum:
      - approved
      - declined
      description: The status to set for the timesheets
      title: TimesheetsManyReviewsPostRequestBodyContentApplicationJsonSchemaDataStatus
    ContractsContractIdTimesheetsGetParametersStatusesSchemaItems:
      type: string
      enum:
      - approved
      - declined
      - new
      - not_payable
      - paid
      - pending
      - processing
      description: Current processing status of the timesheet.
      title: ContractsContractIdTimesheetsGetParametersStatusesSchemaItems
    UpdateATimesheetEntry-v2026-01-01RequestInternalServerError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/TimesheetsTimesheetIdPatchResponsesContentApplicationJsonSchemaErrorsItems'
          description: Generic upstream or internal errors emitted when the timesheet cannot be updated.
      required:
      - errors
      title: UpdateATimesheetEntry-v2026-01-01RequestInternalServerError
    GetTimesheetsByContract-v2026-01-01RequestBadRequestError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ContractsContractIdTimesheetsGetResponsesContentApplicationJsonSchemaErrorsItems'
          description: Validation errors describing why the contract timesheets could not be listed.
      required:
      - errors
      title: GetTimesheetsByContract-v2026-01-01RequestBadRequestError
    GetTimesheetById-v2026-01-01RequestBadRequestError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/TimesheetsTimesheetIdGetResponsesContentApplicationJsonSchemaErrorsItems'
          description: Validation errors describing why the timesheet could not be retrieved.
      required:
      - errors
      title: GetTimesheetById-v2026-01-01RequestBadRequestError
    GetTimesheetById-v2026-01-01RequestInternalServerError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/TimesheetsTimesheetIdGetResponsesContentApplicationJsonSchemaErrorsItems'
          description: Generic upstream or internal errors emitted when the timesheet cannot be retrieved.
      required:
      - errors
      title: GetTimesheetById-v2026-01-01RequestInternalServerError
    CreateTimesheetReview-v2026-01-01RequestNotFoundError:
      type: object
      properties:
        errors:
          type: array
          items:
