  /workers/tax-forms/{tax_form_id}:
    put:
      operationId: workers_replaceATaxFormForAWorker-v2026-01-01
      summary: Update a tax form for the authenticated worker
      description: 'Replace the authenticated worker''s existing tax form with a corrected version, for example to fix a mistyped tax identification number, legal name or address. The worker is resolved from the access token and only their own forms are addressable. The body is the complete form rather than a partial update: an optional field left out is cleared, except contractor_signature, which keeps the value already on file when omitted — it must be supplied when the stored form carries no signature. client_legal_entity_id is not accepted — the legal entity is part of the form''s uniqueness key and can never be reassigned. The worker must have an active (non-terminated) contract with the form''s legal entity. Editing a form whose 1099 has already been filed with the IRS is permitted but does not refile it.


        **Token scopes**: `worker:write`'
      tags:
      - Workers
      parameters:
      - name: tax_form_id
        in: path
        description: Public ID (UUID) of the tax form to replace, as returned by the create or list endpoints.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Tax form replaced successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workers_replaceATaxFormForAWorker-v2026-01-01_Response_200'
        '400':
          description: Validation failed — for example a request body field is missing or malformed, client_legal_entity_id was supplied (the legal entity cannot be reassigned), contractor_signature was omitted for a form that has no signature on record, or the form_type does not match the contractor's tax residency (e.g. a W-8BEN submitted for a US contractor).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceATaxFormForAWorker-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: No live contract exists between the contractor and the tax form's client legal entity. A tax form can only be edited while the contractor has a non-terminated contract with that legal entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceATaxFormForAWorker-v2026-01-01RequestForbiddenError'
        '404':
          description: The tax form does not exist or does not belong to the authenticated worker, or the worker was not found in the calling organization or has no contractor profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceATaxFormForAWorker-v2026-01-01RequestNotFoundError'
        '409':
          description: The tax form was replaced by another request while this one was in flight. Fetch the current version and retry the edit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceATaxFormForAWorker-v2026-01-01RequestConflictError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceATaxFormForAWorker-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WorkersTaxFormsTaxFormIdPutRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
