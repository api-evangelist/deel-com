openapi: 3.2.0
info:
  title: Endpoints Workers API
  version: 1.0.0
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: Workers
paths:
  /onboarding/workers/individual:
    post:
      operationId: workers_completeIndividualContractorProfileSetup-v2026-01-01
      summary: Complete individual contractor profile setup
      description: 'Complete the profile setup for independent contractors including address, tax details, and legal status in a single call during the IC-embedded onboarding flow. This operation requires a worker session token obtained via the worker session endpoint.


        **Token scopes**: `worker:write`'
      tags:
      - Workers
      responses:
        '200':
          description: Individual profile setup completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workers_completeIndividualContractorProfileSetup-v2026-01-01_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteIndividualContractorProfileSetup-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteIndividualContractorProfileSetup-v2026-01-01RequestInternalServerError'
      requestBody:
        description: Individual contractor setup details including address, tax information, and legal status.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/OnboardingWorkersIndividualPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
  /worker:
    post:
      operationId: workers_createWorker-v2026-01-01
      summary: Create a new worker
      description: Use this endpoint to provision a new worker in a white-label DaaS setup. Provide the worker's personal details, contract association, profile type, and company information. On success, the response returns the `user_id`, `profile_id`, and `contract_id` identifiers needed for subsequent operations such as generating consent tokens or magic links.
      tags:
      - Workers
      responses:
        '201':
          description: Worker created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workers_createWorker-v2026-01-01_Response_201'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorker-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorker-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WorkerPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
  /workers/tax-forms:
    post:
      operationId: workers_createATaxFormForAWorker-v2026-01-01
      summary: Create a tax form for the authenticated worker
      description: 'Submit a new US tax form for the authenticated worker against a specific client legal entity, typically during onboarding or when a fresh form must be recorded for a worker/legal-entity pair. The worker is resolved from the access token; the target legal entity is set via client_legal_entity_id. Select the form type based on the worker''s US tax status: W-9 for US individuals or entities, W-8BEN for non-US individuals, W-8BEN-E for non-US entities. The worker must have an active (non-terminated) contract with the legal entity, and only one tax form may exist per worker/legal-entity pair.


        **Token scopes**: `worker:write`'
      tags:
      - Workers
      responses:
        '201':
          description: Tax form created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workers_createATaxFormForAWorker-v2026-01-01_Response_201'
        '400':
          description: Validation failed — for example a request body field is missing or malformed, the client_legal_entity_id does not exist, or the form_type does not match the contractor's tax residency (e.g. a W-8BEN submitted for a US contractor).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateATaxFormForAWorker-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: No live contract exists between the contractor and the specified client legal entity. A tax form can only be submitted for a contractor who has a non-terminated contract with that legal entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateATaxFormForAWorker-v2026-01-01RequestForbiddenError'
        '404':
          description: The authenticated worker was not found in the calling organization, or has no contractor profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateATaxFormForAWorker-v2026-01-01RequestNotFoundError'
        '409':
          description: A tax form already exists for this contractor and client legal entity. Only one tax form can exist per contractor/legal-entity pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateATaxFormForAWorker-v2026-01-01RequestConflictError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateATaxFormForAWorker-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WorkersTaxFormsPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
    get:
      operationId: workers_listTaxFormsForAWorker-v2026-01-01
      summary: List tax forms for the authenticated worker
      description: 'List the tax forms of the worker resolved from the access token, ordered by creation date descending, using cursor pagination (limit + cursor). Each item contains the resource fields (id, created_at, updated_at, client_legal_entity_id, pdf_url) and the full form data in the same public shape the create endpoint accepts; the fields present depend on the item''s form_type. Each form appears once, carrying its current data. Tax identification numbers are unmasked because the authenticated worker owns the data.


        **Token scopes**: `worker:read`'
      tags:
      - Workers
      parameters:
      - name: limit
        in: query
        description: Maximum number of tax forms to return per page (1-100).
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        description: Opaque pagination cursor returned as next_cursor by a previous page. Omit to fetch the first page.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: A page of the worker's tax forms.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workers_listTaxFormsForAWorker-v2026-01-01_Response_200'
        '400':
          description: Validation failed — for example the cursor is malformed or the limit is out of range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTaxFormsForAWorker-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: The authenticated worker was not found in the calling organization, or has no contractor profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTaxFormsForAWorker-v2026-01-01RequestNotFoundError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTaxFormsForAWorker-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
  /workers/contracts/{contract_id}/compliance-documents/{document_id}:
    delete:
      operationId: workers_deleteWorkerContractComplianceDocumentSubmission-v2026-08-25
      summary: Delete the submission of one compliance document of a worker contract
      description: 'Deletes what the authenticated worker submitted against a compliance document of one of their Global Payroll contracts. This removes EVERY file of the requirement, not one file: there is no per-file delete on this endpoint. The action is permanent and the files cannot be recovered. The requirement itself is not removed — after the delete it is still listed, as a requirement with nothing submitted, and it can be submitted again. The response carries no body. Only Global Payroll contracts are supported.


        **Token scopes**: `worker:write`'
      tags:
      - Workers
      parameters:
      - name: contract_id
        in: path
        description: Public id of the Global Payroll contract the documents belong to.
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
      - name: document_id
        in: path
        description: Public UUID of the compliance document requirement, as returned in `id` by the list endpoint.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Submission deleted successfully. No response body.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Bad request — the requirement has nothing submitted against it, so there is nothing to delete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWorkerContractComplianceDocumentSubmission-v2026-08-25RequestBadRequestError'
        '401':
          description: Unauthorized — the access token is missing, expired or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWorkerContractComplianceDocumentSubmission-v2026-08-25RequestUnauthorizedError'
        '403':
          description: Forbidden — the worker does not hold this contract, or the token lacks the required scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWorkerContractComplianceDocumentSubmission-v2026-08-25RequestForbiddenError'
        '404':
          description: Not found — `document_id` is not part of the contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWorkerContractComplianceDocumentSubmission-v2026-08-25RequestNotFoundError'
        '422':
          description: Unprocessable entity — the contract is not a Global Payroll contract, so compliance documents are not available on this endpoint. The error code is `WORKER_TYPE_NOT_SUPPORTED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWorkerContractComplianceDocumentSubmission-v2026-08-25RequestUnprocessableEntityError'
        '429':
          description: 'Too many deletions from this worker in a short window. Deletions are rate limited per authenticated worker, on a budget separate from submissions: back off and retry rather than looping.'
          content:
            application/json:
              schema:
                description: Any type
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
    get:
      operationId: workers_getWorkerContractComplianceDocument-v2026-08-25
      summary: Retrieve one compliance document of a worker contract
      description: 'Returns a single compliance document of one of the authenticated worker Global Payroll contracts, in the same shape the list endpoint returns. Use it to poll one requirement after a submission instead of fetching the whole list. Only Global Payroll contracts are supported.


        **Token scopes**: `worker:read`'
      tags:
      - Workers
      parameters:
      - name: contract_id
        in: path
        description: Public id of the Global Payroll contract the documents belong to.
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
      - name: document_id
        in: path
        description: Public UUID of the compliance document requirement, as returned in `id` by the list endpoint.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Compliance document returned successfully. `created_at` and `updated_at` come from the submission; `created_at` carries the same value as `uploaded_at`, and all three are null until something is submitted against the requirement. The language of `name` and `description` follows the language preference of the authenticated worker. It cannot be selected per request, and the same document may read differently for two workers of the same organization. Text falls back to English when no published translation exists for that language.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workers_getWorkerContractComplianceDocument-v2026-08-25_Response_200'
        '400':
          description: Bad request — invalid or missing parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkerContractComplianceDocument-v2026-08-25RequestBadRequestError'
        '401':
          description: Unauthorized — the access token is missing, expired or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkerContractComplianceDocument-v2026-08-25RequestUnauthorizedError'
        '403':
          description: Forbidden — the worker does not hold this contract, or the token lacks the required scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkerContractComplianceDocument-v2026-08-25RequestForbiddenError'
        '404':
          description: Not found — `document_id` is not part of the contract, or it is a requirement that no longer applies to it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkerContractComplianceDocument-v2026-08-25RequestNotFoundError'
        '422':
          description: Unprocessable entity — the contract is not a Global Payroll contract, so compliance documents are not available on this endpoint. The error code is `WORKER_TYPE_NOT_SUPPORTED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkerContractComplianceDocument-v2026-08-25RequestUnprocessableEntityError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
    post:
      operationId: workers_submitWorkerContractComplianceDocumentFiles-v2026-08-25
      summary: Submit files for one compliance document of a worker contract
      description: 'Submits one or more files against a compliance document of one of the authenticated worker Global Payroll contracts. Upload the bytes to the File Service first, then reference each file here by `file_id` and its `one_time_secret`; the Files endpoints of this API issue both. Side effects: the files replace whatever was previously submitted against the requirement, and the previous version is archived when document versioning is enabled for the organization. Only Global Payroll contracts are supported.


        **Token scopes**: `worker:write`'
      tags:
      - Workers
      parameters:
      - name: contract_id
        in: path
        description: Public id of the Global Payroll contract the documents belong to.
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
      - name: document_id
        in: path
        description: Public UUID of the compliance document requirement, as returned in `id` by the list endpoint.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Files submitted successfully. No response body — read the document back through the list or the single document endpoint to confirm the filenames, where `submission_status` can read `REVIEWING` until the submission is final.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Bad request — an unusable `file_id` or `one_time_secret`, or a file type outside pdf, png, jpg, jpeg and heic. Multipart bodies and raw storage keys are not accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitWorkerContractComplianceDocumentFiles-v2026-08-25RequestBadRequestError'
        '401':
          description: Unauthorized — the access token is missing, expired or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitWorkerContractComplianceDocumentFiles-v2026-08-25RequestUnauthorizedError'
        '403':
          description: Forbidden — the requirement is not open for submission, the worker does not hold this contract, or the token lacks the required scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitWorkerContractComplianceDocumentFiles-v2026-08-25RequestForbiddenError'
        '404':
          description: Not found — `document_id` is not part of the contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitWorkerContractComplianceDocumentFiles-v2026-08-25RequestNotFoundError'
        '412':
          description: The files could not be stored against the requirement. Nothing was submitted, so the request can be retried.
          content:
            application/json:
              schema:
                description: Any type
        '422':
          description: Unprocessable entity — the contract is not a Global Payroll contract, so compliance documents are not available on this endpoint. The error code is `WORKER_TYPE_NOT_SUPPORTED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitWorkerContractComplianceDocumentFiles-v2026-08-25RequestUnprocessableEntityError'
        '429':
          description: 'Too many submissions from this worker in a short window. Submissions are rate limited per authenticated worker: back off and retry rather than looping.'
          content:
            application/json:
              schema:
                description: Any type
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/WorkersContractsContractIdComplianceDocumentsDocumentIdPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
  /workers/contracts/{contract_id}/compliance-documents/{document_id}/download:
    get:
      operationId: workers_downloadWorkerContractComplianceDocument-v2026-08-25
      summary: Get a download URL for one compliance document of a worker contract
      description: 'Returns a short-lived URL for the file submitted against a compliance document of one of the authenticated worker Global Payroll contracts. The URL is valid for about 15 minutes: fetch the file with it rather than storing the URL. Pass `file` to pick a specific file when several were submitted; the first file is returned by default. Documents in the `PASSPORT_OR_NATIONAL_ID` category are never downloadable through this API, for any token type. Only Global Payroll contracts are supported.


        **Token scopes**: `worker:read`'
      tags:
      - Workers
      parameters:
      - name: contract_id
        in: path
        description: Public id of the Global Payroll contract the documents belong to.
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
      - name: document_id
        in: path
        description: Public UUID of the compliance document requirement, as returned in `id` by the list endpoint.
        required: true
        schema:
          type: string
          format: uuid
      - name: file
        in: query
        description: Zero-based index of the submitted file to download. Defaults to the first file.
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Download URL returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workers_downloadWorkerContractComplianceDocument-v2026-08-25_Response_200'
        '400':
          description: Bad request — invalid or missing parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadWorkerContractComplianceDocument-v2026-08-25RequestBadRequestError'
        '401':
          description: Unauthorized — the access token is missing, expired or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadWorkerContractComplianceDocument-v2026-08-25RequestUnauthorizedError'
        '403':
          description: Forbidden — the document is in the `PASSPORT_OR_NATIONAL_ID` category, the worker does not hold this contract, or the token lacks the required scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadWorkerContractComplianceDocument-v2026-08-25RequestForbiddenError'
        '404':
          description: Not found — `document_id` is not part of the contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadWorkerContractComplianceDocument-v2026-08-25RequestNotFoundError'
        '412':
          description: Nothing is submitted against this requirement, or the requested `file` index is beyond the submitted files.
          content:
            application/json:
              schema:
                description: Any type
        '422':
          description: Unprocessable entity — the contract is not a Global Payroll contract, so compliance documents are not available on this endpoint. The error code is `WORKER_TYPE_NOT_SUPPORTED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadWorkerContractComplianceDocument-v2026-08-25RequestUnprocessableEntityError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /ic/workers/invoices/{invoice_id}:
    get:
      operationId: workers_getInvoiceDetailsById-v2026-04-27
      summary: Get invoice details by ID
      description: 'This endpoint retrieves invoice information by ID. Use it to access detailed invoice data for reference or verification.


        **Token scopes**: `worker:read`'
      tags:
      - Workers
      parameters:
      - name: invoice_id
        in: path
        description: Public invoice id for the invoice to return.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Invoice detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workers_getInvoiceDetailsById-v2026-04-27_Response_200'
        '400':
          description: Bad request (invalid query or path parameters).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInvoiceDetailsById-v2026-04-27RequestBadRequestError'
        '401':
          description: Unauthorized (missing or invalid worker token).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInvoiceDetailsById-v2026-04-27RequestUnauthorizedError'
        '403':
          description: Forbidden (invoice not found or not accessible to this worker).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInvoiceDetailsById-v2026-04-27RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '412':
          description: Precondition failed (e.g. `icEmbeddedWorkerSetup` is not enabled for the organization).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInvoiceDetailsById-v2026-04-27RequestPreconditionFailedError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInvoiceDetailsById-v2026-04-27RequestInternalServerError'
      security:
      - deelToken: []
  /workers/contracts/{contract_id}/compliance-documents:
    get:
      operationId: workers_listWorkerContractComplianceDocuments-v2026-08-25
      summary: List compliance documents of a worker contract
      description: 'Lists the compliance documents the authenticated worker has to satisfy on one of their Global Payroll contracts, together with what has already been submitted against each one. Use it to see what is still outstanding before payroll. Requirements with nothing submitted are included, with an empty `filenames` array and null timestamps. Retired requirements are excluded, except a retired I9, which stays listed while it can still be submitted. Only Global Payroll contracts are supported.


        **Token scopes**: `worker:read`'
      tags:
      - Workers
      parameters:
      - name: contract_id
        in: path
        description: Public id of the Global Payroll contract the documents belong to.
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
      - name: limit
        in: query
        description: Maximum number of documents to return per page.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        description: Opaque `next_cursor` value from the previous response, passed back unchanged. Omit for the first page.
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          minLength: 1
          maxLength: 512
      responses:
        '200':
          description: 'Compliance documents returned successfully. `created_at` and `updated_at` come from the submission; `created_at` carries the same value as `uploaded_at`, and all three are null until something is submitted against the requirement. The language of `name` and `description` follows the language preference of the authenticated worker. It cannot be selected per request, and the same document may read differently for two workers of the same organization. Text falls back to English when no published translation exists for that language. `total_count`, `has_more` and `next_cursor` always describe the whole set of requirements for the contract rather than an estimate. `next_cursor` is an opaque token: pass it back unchanged and never construct or parse one. The set is small — expect tens of documents for one contract, not thousands.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workers_listWorkerContractComplianceDocuments-v2026-08-25_Response_200'
        '400':
          description: Bad request — `limit` is outside 1 to 100, or `cursor` is not a token a previous response handed out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkerContractComplianceDocuments-v2026-08-25RequestBadRequestError'
        '401':
          description: Unauthorized — the access token is missing, expired or invalid.
          content:
