        '503':
          description: Service unavailable. The EDD request or its form could not be read, so the question could not be checked. The file was not stored; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLegalEntityKybEddDocument-v2026-10-14RequestServiceUnavailableError'
