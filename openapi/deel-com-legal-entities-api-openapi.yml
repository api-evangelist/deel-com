      summary: Upload a document for an EDD request of a legal entity
      description: 'Stores one document answering a `DOCUMENT_UPLOAD` question of the open enhanced due diligence (EDD) request of a legal entity, and returns an opaque handle. Reference the handle from `POST /rest/legal-entities/{legal_entity_id}/kyb/edd`. Handles are bound to the legal entity, the EDD request and the question, usable once, and expire after 24 hours if unused. The file itself is never returned.


        **Token scopes**: `legal-entity:write`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2027-01-14.'
      tags:
      - Legal Entities
      parameters:
      - name: legal_entity_id
        in: path
        description: Public id of the legal entity. The entity must belong to the authenticated organization; any other id answers 404.
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/LegalEntitiesLegalEntityIdKybEddDocumentsPostParametersXBeta'
      responses:
        '201':
          description: The document was stored. Use the returned handle in an EDD answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Legal_Entities_uploadLegalEntityKybEddDocument-v2026-10-14_Response_201'
        '400':
          description: Bad request. No file was uploaded, or the multipart body could not be processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLegalEntityKybEddDocument-v2026-10-14RequestBadRequestError'
        '401':
          description: Unauthorized. The request token is missing or invalid. The API gateway rejects an unauthenticated call before it reaches Deel; a call that reaches Deel without a valid session is rejected by the access middleware, whose error item carries a message and no code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLegalEntityKybEddDocument-v2026-10-14RequestUnauthorizedError'
        '403':
          description: 'Forbidden. Codes: GENERIC_ERROR (the token lacks the `legal-entity:write` scope, or the actor cannot submit verification for this organization), KYB_SERVICE_ACCOUNT_MISSING (the organization has no service account to act as; contact Deel support).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLegalEntityKybEddDocument-v2026-10-14RequestForbiddenError'
        '404':
          description: Not found. The legal entity does not exist or does not belong to the authenticated organization. The two cases are deliberately indistinguishable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLegalEntityKybEddDocument-v2026-10-14RequestNotFoundError'
        '409':
          description: 'Conflict. Codes: KYB_EDD_NOT_OPEN (the entity is not in EDD, or the request was already answered), KYB_EDD_REQUEST_MISMATCH (`edd_request_id` is not the open request; read the KYB state again).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLegalEntityKybEddDocument-v2026-10-14RequestConflictError'
        '415':
          description: Unsupported media type. The file content type is not accepted; `details.allowed` lists the accepted types (application/pdf, image/jpeg, image/png).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLegalEntityKybEddDocument-v2026-10-14RequestUnsupportedMediaTypeError'
        '422':
          description: 'Unprocessable. Codes: KYB_EDD_DOCUMENT_QUESTION_INVALID (`question_key` is not a `DOCUMENT_UPLOAD` question of the open EDD request), KYB_EDD_DOCUMENT_CLAIM_FAILED (the verification service refused the file; upload it again).'
          content:
