openapi: 3.2.0
info:
  title: Endpoints Legal Entities API
  version: 1.0.0
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: Legal Entities
paths:
  /legal-entities:
    post:
      operationId: legalEntities_createLegalEntity
      summary: Create a new legal entity
      description: 'Creates a new legal entity under the organization and returns the entity record including its assigned id.


        **Token scopes**: `legal-entity:write`, `legal-entity:read`'
      tags:
      - Legal Entities
      responses:
        '200':
          description: Successfully created legal entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/legal-entities_createLegalEntity_Response_200'
        '400':
          description: Invalid request parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateLegalEntity-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Permission denied. User must have the `entities.manage` permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateLegalEntity-v2026-01-01RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/LegalEntitiesPostRequestBodyContentApplicationJsonSchemaData'
      security:
      - deelToken: []
    get:
      operationId: legalEntities_getLegalEntities
      summary: List of legal entities
      description: 'Lists the legal entities under the calling organization so an integration can resolve which entity a worker, contract, payroll cycle or invoice belongs to. The ids returned are the legal entity ids other Deel endpoints expect; use the single-entity endpoint when you already hold an id and need the full record.


        **Token scopes**: `organizations:read`, `accounting:read`'
      tags:
      - Legal Entities
      parameters:
      - name: limit
        in: query
        description: The number of results to return per page.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      - name: sort_order
        in: query
        description: Sorting order of the results.
        required: false
        schema:
          $ref: '#/components/schemas/LegalEntitiesGetParametersSortOrder'
          default: ASC
      - name: cursor
        in: query
        description: Cursor for pagination.
        required: false
        schema:
          type: string
      - name: include_archived
        in: query
        description: Whether to include archived legal entities in the results.
        required: false
        schema:
          type: boolean
          default: true
      - name: legal_entity_id
        in: query
        description: Filter by specific legal entity ID.
        required: false
        schema:
          type: string
      - name: global_payroll
        in: query
        description: Filter by global payroll flag.
        required: false
        schema:
          type: boolean
      - name: type
        in: query
        description: Filter by entity type.
        required: false
        schema:
          type: string
      - name: country
        in: query
        description: Filter by country.
        required: false
        schema:
          type: string
      - name: include_payroll_settings
        in: query
        description: Whether to include payroll settings in the response.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/legal-entities_getLegalEntities_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOfLegalEntities-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /legal-entities/{id}:
    delete:
      operationId: legalEntities_deleteLegalEntity
      summary: Delete a legal entity
      description: 'Archives the legal entity identified by id, marking it as inactive without permanently removing it; the response includes the archived_at timestamp.


        **Token scopes**: `legal-entity:read`, `legal-entity:write`'
      tags:
      - Legal Entities
      parameters:
      - name: id
        in: path
        description: The ID of the legal entity to archive.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully archived the legal entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/legal-entities_deleteLegalEntity_Response_200'
        '400':
          description: Invalid request parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteLegalEntity-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Permission denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteLegalEntity-v2026-01-01RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
    patch:
      operationId: legalEntities_updateLegalEntity
      summary: Edit a legal entity
      description: 'Applies a partial update to an existing legal entity identified by id; only fields included in the request body are modified.


        **Token scopes**: `legal-entity:write`'
      tags:
      - Legal Entities
      parameters:
      - name: id
        in: path
        description: The ID of the legal entity to update.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully updated the legal entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/legal-entities_updateLegalEntity_Response_200'
        '400':
          description: Invalid request parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditALegalEntity-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Permission denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditALegalEntity-v2026-01-01RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/LegalEntitiesIdPatchRequestBodyContentApplicationJsonSchemaData'
      security:
      - deelToken: []
  /legal-entities/country-fields/{country_code}:
    get:
      operationId: legalEntities_getCountryFieldsForALegalEntity-v2026-09-11
      summary: Get registration/tax identifier fields for a country
      description: 'Retrieve which registration and tax identifier fields a country requires before you submit a legal entity to Deel, so you can collect the right values ahead of the entity-creation call. Each field returns its name, kind (`registration_id`/`tax_id`), an optional validation regex, and a requirement level (`mandatory`/`optional`/`bypass`).


        **Token scopes**: `legal-entity:read`'
      tags:
      - Legal Entities
      parameters:
      - name: country_code
        in: path
        description: ISO 3166-1 alpha-2 country code. Case-insensitive.
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z]{2}$
      responses:
        '200':
          description: Registration/tax identifier fields for the given country.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Legal_Entities_getCountryFieldsForALegalEntity-v2026-09-11_Response_200'
        '400':
          description: Malformed country code (not two ASCII letters).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCountryFieldsForALegalEntity-v2026-09-11RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Well-formed country code that is not a recognized ISO 3166-1 alpha-2 country.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCountryFieldsForALegalEntity-v2026-09-11RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /industries:
    get:
      operationId: legalEntities_getIndustries
      summary: List all industry subcategories
      description: 'Lists industry subcategories with their parent category details and NAICS codes, supporting cursor-based pagination and sorting by category or subcategory name.


        **Token scopes**: `legal-entity:read`'
      tags:
      - Legal Entities
      parameters:
      - name: limit
        in: query
        description: Maximum number of items to return per page.
        required: false
        schema:
          type: integer
          minimum: 1
      - name: order
        in: query
        description: Sorting order of the results.
        required: false
        schema:
          $ref: '#/components/schemas/IndustriesGetParametersOrder'
          default: ASC
      - name: sort_by
        in: query
        description: Field used to sort the results.
        required: false
        schema:
          $ref: '#/components/schemas/IndustriesGetParametersSortBy'
          default: categoryName
      - name: cursor
        in: query
        description: Cursor used for paginating to the next page of results.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: List of industry subcategories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/legal-entities_getIndustries_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAllIndustrySubcategories-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /legal-entities/{legal_entity_id}:
    get:
      operationId: legalEntities_getLegalEntity-v2026-09-09
      summary: Retrieve a legal entity
      description: 'Returns the full record for a single legal entity by id: registration and tax identifiers, address, industry, incorporation date and lifecycle status. `cdd_status` carries the raw Customer Due Diligence value (coalesced to `PENDING` when CDD is required, `NOT_REQUIRED` for Tier-0/SaaS entities before verification starts) and `status` the mapped lifecycle status, so integrations can poll entity clearance.


        **Token scopes**: `legal-entity:read`'
      tags:
      - Legal Entities
      parameters:
      - name: legal_entity_id
        in: path
        description: The ID of the legal entity to retrieve.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Legal_Entities_getLegalEntity-v2026-09-09_Response_200'
        '400':
          description: Invalid request parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLegalEntity-v2026-09-09RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: The legal entity belongs to another organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLegalEntity-v2026-09-09RequestForbiddenError'
        '404':
          description: Legal entity not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLegalEntity-v2026-09-09RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /legal-entities/{legal_entity_id}/kyb:
    get:
      operationId: legalEntities_getLegalEntityKybState-v2026-10-01
      summary: Retrieve the KYB state of a legal entity
      description: 'Returns the Know Your Business (entity verification) state of a legal entity: the verification status, whether the client must act, the outstanding requirements including Proof of Authority, which company documents have been supplied, the declared persons of significant control, when the entity was rejected, and the open enhanced due diligence (EDD) request with its questions while the entity is in EDD. Use it to drive an automated verification flow instead of finishing KYB in the Deel app.


        **Token scopes**: `legal-entity:read`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2027-01-01.'
      tags:
      - Legal Entities
      parameters:
      - name: legal_entity_id
        in: path
        description: Public id of the legal entity. The entity must belong to the authenticated organization; any other id answers 404.
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/LegalEntitiesLegalEntityIdKybGetParametersXBeta'
      responses:
        '200':
          description: The KYB state of the legal entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Legal_Entities_getLegalEntityKybState-v2026-10-01_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Unauthorized. The request token is missing or invalid. The API gateway rejects an unauthenticated call before it reaches Deel; a call that reaches Deel without a valid session is rejected by the access middleware, whose error item carries a message and no code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLegalEntityKybState-v2026-10-01RequestUnauthorizedError'
        '403':
          description: Forbidden. The token lacks the `legal-entity:read` scope or the actor cannot view entities of this organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLegalEntityKybState-v2026-10-01RequestForbiddenError'
        '404':
          description: Not found. The legal entity does not exist or does not belong to the authenticated organization. The two cases are deliberately indistinguishable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLegalEntityKybState-v2026-10-01RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
    post:
      operationId: legalEntities_submitLegalEntityKyb-v2026-10-12
      summary: Submit KYB information for a legal entity
      description: 'Submits the Know Your Business (entity verification) information for a legal entity — company facts, required declarations, documents, and declared persons of significant control. Only accepted while the entity is `PENDING` or `DRAFT`; refused once it is `REJECTED`, already under review, approved, or when verification isn''t required. Returns the resulting KYB state after submission.


        **Token scopes**: `legal-entity:write`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2027-01-12.'
      tags:
      - Legal Entities
      parameters:
      - name: legal_entity_id
        in: path
        description: Public id of the legal entity. The entity must belong to the authenticated organization; any other id answers 404.
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/LegalEntitiesLegalEntityIdKybPostParametersXBeta'
      responses:
        '200':
          description: The submission was accepted. The KYB state after the submission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Legal_Entities_submitLegalEntityKyb-v2026-10-12_Response_200'
        '400':
          description: 'Bad request. Codes: VALIDATION_ERROR (the request body failed validation; the error item also carries a details object naming the offending key), GENERIC_ERROR (the submitted domain could not be normalised, or the authenticated organization is not set up for deal registration). The API gateway rejects a schema-invalid request body before it reaches Deel; each error item of that response carries a path field and no code, and the body also carries a request object that describes the failed call.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitLegalEntityKyb-v2026-10-12RequestBadRequestError'
        '401':
          description: Unauthorized. The request token is missing or invalid. The API gateway rejects an unauthenticated call before it reaches Deel; a call that reaches Deel without a valid session is rejected by the access middleware, whose error item carries a message and no code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitLegalEntityKyb-v2026-10-12RequestUnauthorizedError'
        '403':
          description: 'Forbidden. Codes: GENERIC_ERROR (the token lacks the `legal-entity:write` scope, or the actor cannot submit verification for this organization), KYB_SERVICE_ACCOUNT_MISSING (the organization has no service account to act as; contact Deel support).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitLegalEntityKyb-v2026-10-12RequestForbiddenError'
        '404':
          description: Not found. The legal entity does not exist or does not belong to the authenticated organization. The two cases are deliberately indistinguishable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitLegalEntityKyb-v2026-10-12RequestNotFoundError'
        '409':
          description: 'Conflict. Codes: KYB_SUBMISSION_IN_REVIEW (a submission is under review; poll the KYB state or subscribe to the `legal-entity.kyb.changed` webhook), KYB_ALREADY_APPROVED, KYB_NOT_REQUIRED, KYB_ENTITY_REJECTED (the verification was rejected; resubmission after a rejection is not yet supported over the public API).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitLegalEntityKyb-v2026-10-12RequestConflictError'
        '422':
          description: 'Unprocessable. Codes: KYB_DOCUMENT_REFERENCE_INVALID (`details.keys` names every offending field; nothing was submitted), KYB_SUBMISSION_REJECTED (the verification service rejected the record; `details.reason` carries its message when available, and the document handles remain usable).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitLegalEntityKyb-v2026-10-12RequestUnprocessableEntityError'
        '429':
          description: Too many requests. The verification service is rate-limiting submissions; nothing was submitted. Retry after a delay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitLegalEntityKyb-v2026-10-12RequestTooManyRequestsError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '503':
          description: Service unavailable. The verification status could not be read, so the submission was not attempted. Retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitLegalEntityKyb-v2026-10-12RequestServiceUnavailableError'
      requestBody:
        description: The verification information for the legal entity.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/LegalEntitiesLegalEntityIdKybPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
  /legal-entities/{legal_entity_id}/kyb/edd:
    post:
      operationId: legalEntities_answerLegalEntityKybEdd-v2026-10-16
      summary: Submit EDD request answers for a legal entity
      description: 'Answers the open enhanced due diligence (EDD) request of a legal entity with one answer per question listed in the `edd` block of the KYB state. The request then shows as `ANSWERED` in the KYB state until Deel resumes the review. Refused when the entity has no open EDD request, when the request is not the one the KYB state lists, and when the form cannot be answered over the API. Returns the KYB state after the answers.


        **Token scopes**: `legal-entity:write`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2027-01-16.'
      tags:
      - Legal Entities
      parameters:
      - name: legal_entity_id
        in: path
        description: Public id of the legal entity. The entity must belong to the authenticated organization; any other id answers 404.
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/LegalEntitiesLegalEntityIdKybEddPostParametersXBeta'
      responses:
        '200':
          description: The answers were recorded. The KYB state after the answers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Legal_Entities_answerLegalEntityKybEdd-v2026-10-16_Response_200'
        '400':
          description: 'Bad request. Codes: VALIDATION_ERROR (the body failed validation), KYB_EDD_ANSWERS_INVALID (an answer is missing, does not match its question, or names an unknown question; `details.keys` lists the question keys). Nothing was recorded.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerLegalEntityKybEdd-v2026-10-16RequestBadRequestError'
        '401':
          description: Unauthorized. The request token is missing or invalid. The API gateway rejects an unauthenticated call before it reaches Deel; a call that reaches Deel without a valid session is rejected by the access middleware, whose error item carries a message and no code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerLegalEntityKybEdd-v2026-10-16RequestUnauthorizedError'
        '403':
          description: 'Forbidden. Codes: GENERIC_ERROR (the token lacks the `legal-entity:write` scope, or the actor cannot submit verification for this organization), KYB_SERVICE_ACCOUNT_MISSING (the organization has no service account to act as; contact Deel support).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerLegalEntityKybEdd-v2026-10-16RequestForbiddenError'
        '404':
          description: Not found. The legal entity does not exist or does not belong to the authenticated organization. The two cases are deliberately indistinguishable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerLegalEntityKybEdd-v2026-10-16RequestNotFoundError'
        '409':
          description: 'Conflict. Codes: KYB_EDD_NOT_OPEN (the entity is not in EDD, or the request was already answered), KYB_EDD_REQUEST_MISMATCH (`edd_request_id` is not the open request; read the KYB state again), KYB_EDD_NOT_ANSWERABLE (the form has a required unsupported question, or it is addressed to another submitter, such as a person who submitted verification in the Deel app; `details.keys` lists blocking question keys when any).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerLegalEntityKybEdd-v2026-10-16RequestConflictError'
        '422':
          description: 'Unprocessable. Codes: KYB_EDD_ANSWERS_REJECTED (the form service did not record the answers; the request stays open; `details.reason` carries the form service''s reason when it gave one and does not name the question), KYB_EDD_DOCUMENT_REFERENCE_INVALID (a document handle is unknown, expired, already used, belongs to another legal entity or EDD request, answers a different question, or is used for more than one field; `details.keys` lists the question keys). Nothing was recorded and the other handles stay usable.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerLegalEntityKybEdd-v2026-10-16RequestUnprocessableEntityError'
        '500':
          description: Operation failed.
          content:
            application/json:
