        id:
          type: string
          format: uuid
          description: Unique identifier of the IT seat subscription.
        term:
          $ref: '#/components/schemas/ItSeatsStatusGetResponsesContentApplicationJsonSchemaDataTerm'
          description: Committed length of the subscription.
        status:
          $ref: '#/components/schemas/ItSeatsStatusGetResponsesContentApplicationJsonSchemaDataStatus'
          description: Current status of the subscription.
        end_date:
          type: string
          format: date
          description: Last day the subscription is in force.
        created_at:
          type: string
          format: date-time
          description: When the subscription was created.
        paid_seats:
          type: integer
          format: int64
          description: Number of seats the organization pays for.
        start_date:
          type: string
          format: date
          description: First day the subscription is in force.
        assigned_seats:
          type: integer
          format: int64
          description: Number of seats held by a worker, whether or not the seat's paid features are in use yet.
        available_seats:
          type: integer
          format: int64
          description: Number of paid seats free to assign right now.
        monthly_seat_price:
          $ref: '#/components/schemas/ItSeatsStatusGetResponsesContentApplicationJsonSchemaDataMonthlySeatPrice'
          description: Price of each seat per month.
        pending_approval_seats:
          type: integer
          format: int64
          description: Number of seats pending purchase approval. These do not consume a paid seat until approved.
      required:
      - id
      - term
      - status
      - end_date
      - created_at
      - paid_seats
      - start_date
      - assigned_seats
      - available_seats
      - monthly_seat_price
      - pending_approval_seats
      title: ItSeatsStatusGetResponsesContentApplicationJsonSchemaData
    ItSeatsGetResponsesContentApplicationJsonSchemaDataItemsAssignedHrisProfile:
      type: object
      properties:
        emails:
          type: array
          items:
            type: string
            format: email
          description: Array of user email addresses
        last_name:
          type: string
