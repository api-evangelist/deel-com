      title: UnassignWorkersFromItSeats-v2026-09-25RequestNotFoundError
    ItSeatsUnassignPostRequestBodyContentApplicationJsonSchemaData:
      type: object
      properties:
        hris_profile_ids:
          type: array
          items:
            type: string
            format: uuid
          description: HRIS profile identifiers of the workers whose IT seat to release. Between 1 and 100 unique ids per request; the whole request is rejected when any id is not found in your organization.
      required:
      - hris_profile_ids
      description: Workers whose IT seat to release.
      title: ItSeatsUnassignPostRequestBodyContentApplicationJsonSchemaData
    ListItSeats-v2026-09-25RequestInternalServerError:
      type: object
