    ItSeatsGetResponsesContentApplicationJsonSchemaDataItems:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the seat.
        status:
          $ref: '#/components/schemas/ItSeatsGetResponsesContentApplicationJsonSchemaDataItemsStatus'
          description: Current status of the seat.
        active_on:
          type:
          - string
          - 'null'
          format: date
          description: Day the seat's paid features started being used. `null` while the seat is not in use.
        created_at:
          type: string
          format: date-time
          description: When the seat was created.
        assigned_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the seat was given to its worker. `null` when the seat has never been assigned.
        declined_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the worker declined the seat. `null` unless the worker declined it.
        deactivated_on:
          type:
          - string
          - 'null'
          format: date
          description: Day the seat was released. `null` while the seat is still held.
        assigned_hris_profile:
          oneOf:
          - $ref: '#/components/schemas/ItSeatsGetResponsesContentApplicationJsonSchemaDataItemsAssignedHrisProfile'
          - type: 'null'
          description: Worker holding the seat. `null` when the seat is free or its worker has no Deel HRIS profile.
      required:
      - id
      - status
      - active_on
      - created_at
      - assigned_at
      - declined_at
      - deactivated_on
      - assigned_hris_profile
      title: ItSeatsGetResponsesContentApplicationJsonSchemaDataItems
    AssignWorkersToItSeats-v2026-09-24RequestNotFoundError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ItSeatsAssignPostResponsesContentApplicationJsonSchemaErrorsItems'
