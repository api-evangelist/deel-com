      title: UnassignWorkersFromItSeats-v2026-09-25RequestBadRequestError
    ItSeatsUnassignPostResponsesContentApplicationJsonSchemaErrorsItems:
      type: object
      properties:
        code:
          type: string
          description: Error code of the handler which produced the returned error
        field:
          type:
          - string
          - 'null'
          description: The field name where input validation failed
        message:
          type: string
          description: Description of the returned error
      required:
      - code
      - field
      - message
      title: ItSeatsUnassignPostResponsesContentApplicationJsonSchemaErrorsItems
    UnassignWorkersFromItSeats-v2026-09-25RequestNotFoundError:
