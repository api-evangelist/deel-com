      title: ListItSeats-v2026-09-25RequestInternalServerError
    ItSeatsGetParametersXBeta:
      type: string
      enum:
      - 'true'
      default: 'true'
      title: ItSeatsGetParametersXBeta
    ItSeatsAssignPostRequestBodyContentApplicationJsonSchemaData:
      type: object
      properties:
        hris_profile_ids:
          type: array
          items:
            type: string
            format: uuid
          description: HRIS profile identifiers of the workers to give an IT seat. Between 1 and 100 unique ids per request; the whole request is rejected when any id is not found in your organization.
        is_accepting_new_seat_subscription:
          type: boolean
          description: Whether missing seats may be purchased. When true and the subscription has fewer free seats than the workers need, the missing seats are added to your organization's IT-seat subscription at its monthly seat price and billed immediately, bypassing the seat purchase approval your organization would go through in the Deel IT UI. When false (the default) the request fails with a conflict instead and nothing is changed.
      required:
      - hris_profile_ids
      - is_accepting_new_seat_subscription
      description: Workers to give an IT seat.
      title: ItSeatsAssignPostRequestBodyContentApplicationJsonSchemaData
    IT_seats_retrieveTheItSeatContract-v2026-09-25_Response_200:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ItSeatsStatusGetResponsesContentApplicationJsonSchemaData'
      required:
      - data
      title: IT seats_retrieveTheItSeatContract-v2026-09-25_Response_200
    ListItSeats-v2026-09-25RequestNotFoundError:
