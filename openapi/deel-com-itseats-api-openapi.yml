openapi: 3.2.0
info:
  title: Endpoints It Seats API
  version: 1.0.0
  description: API endpoints related to IT seats.
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: itSeats
  description: API endpoints related to IT seats.
paths:
  /it/seats/assign:
    post:
      operationId: itSeats_assignWorkersToItSeats-v2026-09-24
      summary: Assign workers to IT seats
      description: 'Use this from onboarding or HRIS automations to give workers an IT seat on your organization''s IT-seat subscription. Assigns a seat to each listed worker, identified by their Deel HRIS profile id. Accepts between 1 and 100 ids per call. The call is all-or-nothing: if any id is not found in your organization, or the seats cannot be assigned, the whole request fails and nothing changes. Workers already holding a seat are left unchanged and workers whose seat is pending approval have it approved. If the subscription has fewer free seats than the workers need, the request fails with a conflict unless is_accepting_new_seat_subscription is true, in which case the missing seats are added to the subscription at its monthly seat price and billed to your organization; check the available seats and the monthly seat price via `GET /rest/it/seats/status` before accepting. Only organizations on a per-seat plan with an active IT-seat subscription can use this endpoint.


        **Token scopes**: `it-seats:write`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2026-12-24.'
      tags:
      - itSeats
      parameters:
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/ItSeatsAssignPostParametersXBeta'
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignWorkersToItSeats-v2026-09-24RequestBadRequestError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignWorkersToItSeats-v2026-09-24RequestUnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignWorkersToItSeats-v2026-09-24RequestForbiddenError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignWorkersToItSeats-v2026-09-24RequestNotFoundError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignWorkersToItSeats-v2026-09-24RequestConflictError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignWorkersToItSeats-v2026-09-24RequestInternalServerError'
      requestBody:
        description: Workers to give an IT seat
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/ItSeatsAssignPostRequestBodyContentApplicationJsonSchemaData'
                  description: Workers to give an IT seat.
              required:
              - data
      security:
      - deelToken: []
  /it/seats:
    get:
      operationId: itSeats_listItSeats-v2026-09-25
      summary: List IT seats
      description: 'Use this endpoint to let HRIS and finance automations audit which worker holds each IT seat and reconcile seat usage, instead of checking the seat list manually in the Deel IT UI. Only available to organizations on a per-seat plan.


        **Token scopes**: `it-seats:read`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2026-12-25.'
      tags:
      - itSeats
      parameters:
      - name: cursor
        in: query
        description: Indicates where the next page of results starts, as returned in a paginated list response
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Return a page of results with given number of records
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: status
        in: query
        description: Filter seats by their status — repeat the key for OR semantics. Omit to include seats of any status.
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ItSeatsGetParametersStatusSchemaItems'
      - name: hris_profile_id
        in: query
        description: Filter seats by the HRIS profile holding them — repeat the key for OR semantics. Ids not found in your organization match nothing. Omit to include seats of any worker.
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/ItSeatsGetParametersXBeta'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IT_seats_listItSeats-v2026-09-25_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListItSeats-v2026-09-25RequestBadRequestError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListItSeats-v2026-09-25RequestUnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListItSeats-v2026-09-25RequestForbiddenError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListItSeats-v2026-09-25RequestNotFoundError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListItSeats-v2026-09-25RequestConflictError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListItSeats-v2026-09-25RequestInternalServerError'
      security:
      - deelToken: []
  /it/seats/status:
    get:
      operationId: itSeats_retrieveTheItSeatContract-v2026-09-25
      summary: Retrieve the IT seat subscription
      description: 'Reports your organization''s IT-seat subscription so HRIS and finance automations can see how many seats are paid for, how many are already taken, how many are free and what one more seat costs per month — before assigning workers via `POST /rest/it/seats/assign`. Returns the subscription in force today; if your organization is between subscriptions, the most recent one is returned with its status, so an expired subscription is still visible. Only organizations on a per-seat plan can use this endpoint.


        **Token scopes**: `it-seats:read`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2026-12-25.'
      tags:
      - itSeats
      parameters:
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/ItSeatsStatusGetParametersXBeta'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IT_seats_retrieveTheItSeatContract-v2026-09-25_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveTheItSeatContract-v2026-09-25RequestBadRequestError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveTheItSeatContract-v2026-09-25RequestUnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveTheItSeatContract-v2026-09-25RequestForbiddenError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveTheItSeatContract-v2026-09-25RequestNotFoundError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveTheItSeatContract-v2026-09-25RequestConflictError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveTheItSeatContract-v2026-09-25RequestInternalServerError'
      security:
      - deelToken: []
  /it/seats/unassign:
    post:
      operationId: itSeats_unassignWorkersFromItSeats-v2026-09-25
      summary: Unassign workers from IT seats
      description: 'Use this from offboarding or HRIS automations to release the IT seats of workers who no longer need one. Releases the seat of each listed worker, identified by their Deel HRIS profile id, on your organization''s IT-seat subscription: released seats become available to assign to another worker, and the number of paid seats is unchanged. The call is all-or-nothing: if any id is not found in your organization the whole request fails and no seat is released. Workers without a seat are left unchanged. A seat whose paid feature is already in use cannot be released; the whole request then fails with a conflict and no seat is released. The worker''s IT policy is not changed. Only organizations on a per-seat plan with an active IT-seat subscription can use this endpoint.


        **Token scopes**: `it-seats:write`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2026-12-25.'
      tags:
      - itSeats
      parameters:
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/ItSeatsUnassignPostParametersXBeta'
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnassignWorkersFromItSeats-v2026-09-25RequestBadRequestError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnassignWorkersFromItSeats-v2026-09-25RequestUnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnassignWorkersFromItSeats-v2026-09-25RequestForbiddenError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnassignWorkersFromItSeats-v2026-09-25RequestNotFoundError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnassignWorkersFromItSeats-v2026-09-25RequestConflictError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnassignWorkersFromItSeats-v2026-09-25RequestInternalServerError'
      requestBody:
        description: Workers whose IT seat to release
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/ItSeatsUnassignPostRequestBodyContentApplicationJsonSchemaData'
                  description: Workers whose IT seat to release.
              required:
              - data
      security:
      - deelToken: []
