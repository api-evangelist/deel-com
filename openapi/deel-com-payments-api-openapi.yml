openapi: 3.2.0
info:
  title: Endpoints Payments API
  version: 1.0.0
  description: API endpoints related to Payments.
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: Payments
  description: API endpoints related to Payments.
paths:
  /payments/statements:
    post:
      operationId: payments_createPaymentStatement-v2026-07-23
      summary: Create and pay a payment statement
      description: 'Creates a payment statement for the requested invoices and pays it by bank transfer in a single call, instead of creating and paying in two separate steps. Use it when all invoices belong in one statement, grouped by statement type and legal entity. Every invoice must also be pending and not already locked in another payment. Submit invoices that span more than one statement in separate calls.


        **Token scopes**: `payment-statements:write`'
      tags:
      - Payments
      parameters:
      - name: Idempotency-Key
        in: header
        description: Unique key that makes the request idempotent. Replaying the same key returns the original response without creating a duplicate statement. Reusing a key with a different body returns 409 idempotency_conflict.
        required: true
        schema:
          type: string
          maxLength: 64
      responses:
        '201':
          description: Successfully created and initiated payment of the statement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payments_createPaymentStatement-v2026-07-23_Response_201'
        '400':
          description: 'Bad request. Codes: too_many_invoices (invoice_ids exceeds the maximum of 100), currency_not_supported (the requested country does not support the requested currency for bank transfer), invalid_parameter (request validation failed), INVALID_IDEMPOTENCY_KEY (the Idempotency-Key header is missing, empty, or longer than 64 characters).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaymentStatement-v2026-07-23RequestBadRequestError'
        '401':
          description: The authentication is missing or is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaymentStatement-v2026-07-23RequestUnauthorizedError'
        '403':
          description: The organization is not permitted to use this endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaymentStatement-v2026-07-23RequestForbiddenError'
        '404':
          description: One or more referenced resources could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaymentStatement-v2026-07-23RequestNotFoundError'
        '409':
          description: 'Conflict. Codes: invoices_not_payable (some invoices are already in a statement or not pending), invoices_locked (invoices are in an active payment process), no_payable_invoices (none of the invoices are payable), cor_preparation_failed (shielded/contract-of-record preparation failed), idempotency_conflict (the Idempotency-Key was reused with a different request body), multiple_statements (the invoices resolve to more than one statement — submit each group separately), payment_failed (the statement was created but the synchronous payment could not be completed).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaymentStatement-v2026-07-23RequestConflictError'
        '429':
          description: Too many requests. Another request with the same Idempotency-Key is currently in progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaymentStatement-v2026-07-23RequestTooManyRequestsError'
        '500':
          description: An unexpected error occurred while creating and paying the payment statement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaymentStatement-v2026-07-23RequestInternalServerError'
      requestBody:
        description: Invoices and settlement options for the payment statement.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/PaymentsStatementsPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
  /payments/statements/{payment_statement_id}:
    get:
      operationId: payments_getPaymentStatement-v2026-07-23
      summary: Retrieve a payment statement
      description: 'Retrieves a payment statement''s status and settlement details. Use it to check whether a statement has been paid, to see which invoices it covers, including any invoices Deel added automatically, and, for bank transfers, to get the exact beneficiary account to send funds to.


        **Token scopes**: `payment-statements:read`'
      tags:
      - Payments
      parameters:
      - name: payment_statement_id
        in: path
        description: Unique identifier of the payment statement to retrieve.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved the payment statement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payments_getPaymentStatement-v2026-07-23_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: The authentication is missing or is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPaymentStatement-v2026-07-23RequestUnauthorizedError'
        '403':
          description: The organization is not permitted to use this endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPaymentStatement-v2026-07-23RequestForbiddenError'
        '404':
          description: The payment statement does not exist or is not accessible to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPaymentStatement-v2026-07-23RequestNotFoundError'
        '500':
          description: An unexpected error occurred while retrieving the payment statement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPaymentStatement-v2026-07-23RequestInternalServerError'
      security:
      - deelToken: []
