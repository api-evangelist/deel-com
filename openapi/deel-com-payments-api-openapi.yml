        country:
          type: string
          pattern: ^[A-Z]{2}$
          minLength: 2
          maxLength: 2
          description: Two-letter country code for the bank transfer method, following ISO 3166-1 alpha-2.
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          minLength: 3
          maxLength: 3
          description: Three-letter currency code of the payment statement, following ISO 4217. Must match the currency of the created statement.
      required:
