    PaymentsStatementsPaymentStatementIdGetResponsesContentApplicationJsonSchemaData:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the payment statement.
        amount:
          type:
          - string
          - 'null'
          description: Total amount of the payment statement before any balance is applied. Null until the amount is set.
        status:
          $ref: '#/components/schemas/PaymentsStatementsPaymentStatementIdGetResponsesContentApplicationJsonSchemaDataStatus'
          description: Normalized status of the payment statement. 'PROCESSING' covers any in-flight state (pending, preprocessing, awaiting payment); 'paid', 'cancelled' and 'failed' are terminal.
        paid_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time when the client paid, in ISO-8601 format. For bank transfers this can be set while the status is still processing. Null until payment is captured.
        invoices:
          type: array
          items:
            $ref: '#/components/schemas/PaymentsStatementsPaymentStatementIdGetResponsesContentApplicationJsonSchemaDataInvoicesItems'
          description: Authoritative superset of invoices settled by this payment statement. It always contains the requested invoices and may include additional overdue or required fee invoices that Deel attaches automatically.
        reference:
          type:
          - string
          - 'null'
          description: Reference to use when reconciling this payment statement against incoming wires.
        amount_due:
          type:
          - string
          - 'null'
          description: Amount still due after any applied balance and fee credits. Null until the amount is set.
        created_at:
          type: string
          format: date-time
          description: Date and time when the payment statement was created, in ISO-8601 format.
        payment_method:
          type:
          - string
          - 'null'
          description: Method used to settle the payment statement. Null until a payment method is attached.
        balance_applied:
          type: string
          description: Amount of client balance applied to the payment statement.
        payment_currency:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{3}$
          minLength: 3
          maxLength: 3
          description: Three-letter currency code of the payment statement, following ISO 4217. Null until a payment method is attached.
        beneficiary_details:
          oneOf:
          - $ref: '#/components/schemas/PaymentsStatementsPaymentStatementIdGetResponsesContentApplicationJsonSchemaDataBeneficiaryDetails'
          - type: 'null'
          description: Beneficiary bank details the payment is settled to. Null when not yet resolved.
        fee_credits_applied:
          type: string
          description: Amount of fee credits applied to the payment statement.
      required:
      - id
      - amount
      - status
      - invoices
      - amount_due
      - payment_currency
      title: PaymentsStatementsPaymentStatementIdGetResponsesContentApplicationJsonSchemaData
    GetPaymentStatement-v2026-07-23RequestNotFoundError:
