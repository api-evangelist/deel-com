      title: PaymentsStatementsPaymentStatementIdGetResponsesContentApplicationJsonSchemaDataBeneficiaryDetailsIntermediaryBank
    PaymentsStatementsPostRequestBodyContentApplicationJsonSchemaDataPayment:
      type: object
