openapi: 3.2.0
info:
  title: Endpoints Eor Amendments API
  version: 1.0.0
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: eorAmendments
paths:
  /eor/contracts/{contract_id}/amendments/{amendment_id}/accept:
    post:
      operationId: eorAmendments_acceptContractAmendment
      summary: Accept amendment
      description: 'Accepts a pending amendment on an EOR worker contract, formally approving the proposed modifications on the client''s behalf. The amendment must already exist and be in a pending state before this operation can be called.


        **Token scopes**: `contracts:write`'
      tags:
      - eorAmendments
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier of EOR worker contract.
        required: true
        schema:
          type: string
          format: alphanumeric
      - name: amendment_id
        in: path
        description: A unique identifier for the employee contract amendment.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Amendment info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eor-amendments_acceptContractAmendment_Response_200'
        '400':
          description: Bad Request. The request could not be understood or was missing required parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptAContractAmendmentOnBehalfOfTheClient-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Resource not found (e.g., contract, profile, amendment, change request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptAContractAmendmentOnBehalfOfTheClient-v2026-01-01RequestNotFoundError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptAContractAmendmentOnBehalfOfTheClient-v2026-01-01RequestInternalServerError'
      requestBody:
        description: This operation does not require a request body. Provide an empty JSON object if required by the client.
        content:
          application/json:
            schema:
              type: object
              properties: {}
      security:
      - deelToken: []
  /eor/contracts/{contract_id}/amendments/{amendment_id}:
    delete:
      operationId: eorAmendments_deleteContractAmendment
      summary: Cancel amendment
      description: 'Cancels a pending EOR contract amendment, voiding the request and preventing it from being reviewed or applied to the contract.


        **Token scopes**: `contracts:write`'
      tags:
      - eorAmendments
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier of EOR worker contract.
        required: true
        schema:
          type: string
          format: alphanumeric
      - name: amendment_id
        in: path
        description: A unique identifier for the employee contract amendment.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eor-amendments_deleteContractAmendment_Response_200'
        '400':
          description: Bad Request. The request could not be understood or was missing required parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelAmendment-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Resource not found (e.g., contract, profile, amendment, change request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelAmendment-v2026-01-01RequestNotFoundError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelAmendment-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
    get:
      operationId: eorAmendments_getContractAmendmentById
      summary: Get amendment by ID
      description: 'Retrieves the full details of a single amendment on an EOR contract by its ID, including its current status, requested changes, effective date, and rejection context. Use it to inspect an amendment after creating, updating, or acting on it.


        **Token scopes**: `contracts:read`'
      tags:
      - eorAmendments
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier of EOR worker contract.
        required: true
        schema:
          type: string
          format: alphanumeric
      - name: amendment_id
        in: path
        description: A unique identifier for the employee contract amendment.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Amendment info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eor-amendments_getContractAmendmentById_Response_200'
        '400':
          description: Bad Request. The request could not be understood or was missing required parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewInformationAboutAmendment-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Resource not found (e.g., contract, profile, amendment, change request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewInformationAboutAmendment-v2026-01-01RequestNotFoundError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewInformationAboutAmendment-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
    patch:
      operationId: eorAmendments_updateContractAmendment
      summary: Update amendment
      description: 'Applies a partial update to a specific EOR contract amendment. The amendment must be in DRAFT status; updates to amendments in any other state will be rejected. This operation overwrites existing draft data and cannot be undone.


        **Token scopes**: `contracts:write`'
      tags:
      - eorAmendments
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier of EOR worker contract.
        required: true
        schema:
          type: string
          format: alphanumeric
      - name: amendment_id
        in: path
        description: A unique identifier for the employee contract amendment. This string is either supplied by the client or generated by the system and is used to uniquely identify the amendment during upsert operations.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Amendment info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eor-amendments_updateContractAmendment_Response_200'
        '400':
          description: Bad Request. The request could not be understood or was missing required parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateASpecificEorContractAmendment-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Resource not found (e.g., contract, profile, amendment, change request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateASpecificEorContractAmendment-v2026-01-01RequestNotFoundError'
        '409':
          description: Conflict error. Indicates that the requested operation conflicts with the current state of the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateASpecificEorContractAmendment-v2026-01-01RequestConflictError'
        '422':
          description: Validation errors or disabled amendments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateASpecificEorContractAmendment-v2026-01-01RequestUnprocessableEntityError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateASpecificEorContractAmendment-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/EorContractsContractIdAmendmentsAmendmentIdPatchRequestBodyContentApplicationJsonSchemaData'
      security:
      - deelToken: []
  /eor/contracts/{contract_id}/amendments/{amendment_id}/confirm:
    post:
      operationId: eorAmendments_confirmContractAmendment
      summary: Confirm amendment
      description: 'Confirms a draft amendment on an EOR contract and initiates the review process, routing it to Deel and the employee for acknowledgment and approval. The amendment must exist in a confirmable state prior to calling this endpoint.


        **Token scopes**: `contracts:write`'
      tags:
      - eorAmendments
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier of EOR worker contract.
        required: true
        schema:
          type: string
          format: alphanumeric
      - name: amendment_id
        in: path
        description: A unique identifier for the employee contract amendment.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Amendment info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eor-amendments_confirmContractAmendment_Response_200'
        '400':
          description: Bad Request. The request could not be understood or was missing required parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmAnExistingContractAmendment-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Resource not found (e.g., contract, profile, amendment, change request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmAnExistingContractAmendment-v2026-01-01RequestNotFoundError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmAnExistingContractAmendment-v2026-01-01RequestInternalServerError'
      requestBody:
        description: This operation does not require a request body. Provide an empty JSON object if required by the client.
        content:
          application/json:
            schema:
              type: object
              properties: {}
      security:
      - deelToken: []
  /eor/contracts/{contract_id}/amendments/{amendment_id}/pdf:
    get:
      operationId: eorAmendments_getContractAmendmentPdf
      summary: Contract amendment PDF
      description: 'Generates a secure, time-limited download URL for the PDF of a specific EOR contract amendment. The returned URL is valid for 15 minutes from the time of generation.


        **Token scopes**: `contracts:read`'
      tags:
      - eorAmendments
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier of EOR worker contract.
        required: true
        schema:
          type: string
          format: alphanumeric
      - name: amendment_id
        in: path
        description: A unique identifier for the employee contract amendment.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: URL of exported PDF(valid for 15m)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eor-amendments_getContractAmendmentPdf_Response_200'
        '400':
          description: Bad Request. The request could not be understood or was missing required parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEorContractAmendmentPdfDownloadLinkForClientAndEmployee-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Resource not found (e.g., contract, profile, amendment, change request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEorContractAmendmentPdfDownloadLinkForClientAndEmployee-v2026-01-01RequestNotFoundError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEorContractAmendmentPdfDownloadLinkForClientAndEmployee-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
  /eor/contracts/{contract_id}/amendments:
    post:
      operationId: eorAmendments_createContractAmendment
      summary: Create amendment
      description: 'Creates a new amendment for an existing EOR contract, supporting changes to terms such as salary, currency, effective date, and other contract conditions. All requests are validated against applicable business and regulatory rules before the amendment is accepted.


        **Token scopes**: `contracts:write`'
      tags:
      - eorAmendments
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier of the EOR worker contract
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Amendment info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eor-amendments_createContractAmendment_Response_201'
        '400':
          description: Bad Request. The request could not be understood or was missing required parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAnEorContractAmendment-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden. The caller does not have permission to perform this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAnEorContractAmendment-v2026-01-01RequestForbiddenError'
        '404':
          description: Resource not found (e.g., contract, profile, amendment, change request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAnEorContractAmendment-v2026-01-01RequestNotFoundError'
        '409':
          description: Conflict error. Indicates that the requested operation conflicts with the current state of the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAnEorContractAmendment-v2026-01-01RequestConflictError'
        '422':
          description: Validation errors or disabled amendments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAnEorContractAmendment-v2026-01-01RequestUnprocessableEntityError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAnEorContractAmendment-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/EorContractsContractIdAmendmentsPostRequestBodyContentApplicationJsonSchemaData'
      security:
      - deelToken: []
    get:
      operationId: eorAmendments_getContractAmendments
      summary: Get amendments by contract
      description: 'Retrieves all amendments associated with a given EOR contract, including each amendment''s type, effective date, and current status, providing a full history of changes applied to the contract.


        **Token scopes**: `contracts:read`'
      tags:
      - eorAmendments
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier of EOR worker contract.
        required: true
        schema:
          type: string
          format: alphanumeric
      responses:
        '200':
          description: Amendment info. Returns the amendment flow details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eor-amendments_getContractAmendments_Response_200'
        '400':
          description: Bad Request. The request could not be understood or was missing required parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAllAmendmentsForAnEorContract-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Resource not found (e.g., contract, profile, amendment, change request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAllAmendmentsForAnEorContract-v2026-01-01RequestNotFoundError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAllAmendmentsForAnEorContract-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
  /eor/contracts/{contract_id}/amendments/validation/settings:
    get:
      operationId: eorAmendments_getContractAmendmentsValidationSettings
      summary: Get amendment validation settings
      description: 'Returns the validation settings for all available amendment data points on an EOR contract, optionally scoped to a specific employment state. Use these settings to determine which fields are editable and what constraints apply before constructing an amendment request.


        **Token scopes**: `contracts:read`'
      tags:
      - eorAmendments
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier of EOR worker contract.
        required: true
        schema:
          type: string
          format: alphanumeric
      - name: employment_state
        in: query
        description: The employment state of the EOR worker contract
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Amendment settings response with additional_details included as optional.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eor-amendments_getContractAmendmentsValidationSettings_Response_200'
        '400':
          description: Bad Request. The request could not be understood or was missing required parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAmendmentValidationSettingsForAnEorContract-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Resource not found (e.g., contract, profile, amendment, change request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAmendmentValidationSettingsForAnEorContract-v2026-01-01RequestNotFoundError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAmendmentValidationSettingsForAnEorContract-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
  /eor/contracts/{contract_id}/amendments/{amendment_id}/effective-date-limitations:
    get:
      operationId: eorAmendments_getContractAmendmentEffectiveDateLimitations
      summary: Retrieve Effective Date Limitations
      description: 'Returns validation rules for the effective date field within an EOR contract amendment flow.


        **Token scopes**: `contracts:read`'
      tags:
      - eorAmendments
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier of the EOR worker contract
        required: true
        schema:
          type: string
      - name: amendment_id
        in: path
        description: A unique identifier for the employee contract amendment
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Returns the effective date limits for the amendment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eor-amendments_getContractAmendmentEffectiveDateLimitations_Response_200'
        '400':
          description: Bad Request. The request could not be understood or was missing required parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveEffectiveDateLimitations-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden. The caller does not have permission to perform this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveEffectiveDateLimitations-v2026-01-01RequestForbiddenError'
        '404':
          description: Resource not found (e.g., contract, profile, amendment, change request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveEffectiveDateLimitations-v2026-01-01RequestNotFoundError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveEffectiveDateLimitations-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
  /eor/contracts/{contract_id}/amendments/{amendment_id}/sign:
    post:
      operationId: eorAmendments_signEORAmendment
      summary: Sign a contract amendment (employee)
      description: 'Records the employee''s signature on a specific contract amendment, confirming acceptance of the amendment terms. Returns the updated amendment record upon successful signing.


        **Token scopes**: `worker:write`'
      tags:
      - eorAmendments
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier of EOR worker contract.
        required: true
        schema:
          type: string
          format: alphanumeric
      - name: amendment_id
        in: path
        description: A unique identifier for the employee contract amendment.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Amendment info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eor-amendments_signEORAmendment_Response_200'
        '400':
          description: Bad Request. The request could not be understood or was missing required parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignAContractAmendmentEmployee-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Resource not found (e.g., contract, profile, amendment, change request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignAContractAmendmentEmployee-v2026-01-01RequestNotFoundError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignAContractAmendmentEmployee-v2026-01-01RequestInternalServerError'
      requestBody:
        description: This operation does not require a request body. Provide an empty JSON object if required by the client.
        content:
          application/json:
            schema:
              type: object
              properties: {}
      security:
      - deelToken: []
  /eor/contracts/{contract_id}/amendments/validate:
    post:
      operationId: eorAmendments_validateEORAmendments
      summary: Validate amendment data points
      description: 'Validates amendment data points for a given contract against any external validation rules before an amendment is submitted. This call should be made prior to creating an amendment to confirm that the proposed data points are acceptable.


        **Token scopes**: `contracts:write`'
      tags:
      - eorAmendments
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier of the employee contract.
        required: true
        schema:
          type: string
          format: alphanumeric
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eor-amendments_validateEORAmendments_Response_200'
        '400':
          description: Bad Request. The request could not be understood or was missing required parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateAmendmentDataPoints-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Resource not found (e.g., contract, profile, amendment, change request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateAmendmentDataPoints-v2026-01-01RequestNotFoundError'
        '500':
          description: Internal server error.
          content:
            application/json:
