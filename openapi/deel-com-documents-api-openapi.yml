openapi: 3.2.0
info:
  title: Endpoints Documents API
  version: 1.0.0
  description: API endpoints related to Documents.
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: Documents
  description: API endpoints related to Documents.
paths:
  /legal-entities/{legal_entity_id}/registration-documents/{document_id}:
    patch:
      operationId: documents_addLegalEntityRegistrationDocumentFiles-v2026-08-17
      summary: Add Files To Legal Entity Registration Document
      description: 'Attaches more files to an existing submission, keeping the files already on it. Use this when a document was submitted incomplete — a missing page or an extra supporting file — and it is still awaiting review. To replace a rejected submission outright, use the replace-files endpoint instead.


        **Token scopes**: `legal-entity:write`'
      tags:
      - Documents
      parameters:
      - name: legal_entity_id
        in: path
        description: Public UUID of the legal entity.
        required: true
        schema:
          type: string
          format: uuid
      - name: document_id
        in: path
        description: Public UUID of the document submission.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Files added successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Documents_addLegalEntityRegistrationDocumentFiles-v2026-08-17_Response_200'
        '400':
          description: Bad request — invalid or missing parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddLegalEntityRegistrationDocumentFiles-v2026-08-17RequestBadRequestError'
        '401':
          description: Unauthorized — missing or invalid authentication token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddLegalEntityRegistrationDocumentFiles-v2026-08-17RequestUnauthorizedError'
        '403':
          description: Forbidden — the token lacks access to this legal entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddLegalEntityRegistrationDocumentFiles-v2026-08-17RequestForbiddenError'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddLegalEntityRegistrationDocumentFiles-v2026-08-17RequestNotFoundError'
        '422':
          description: Unprocessable entity — a file has an unsupported type or its content does not match its extension.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddLegalEntityRegistrationDocumentFiles-v2026-08-17RequestUnprocessableEntityError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/LegalEntitiesLegalEntityIdRegistrationDocumentsDocumentIdPatchRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
    delete:
      operationId: documents_deleteLegalEntityRegistrationDocument-v2026-08-17
      summary: Delete Legal Entity Registration Document
      description: 'Withdraws a document submission and removes its files. Use this when something was submitted in error — against the wrong requirement or for the wrong entity. Deletion is permanent: the submission and its files cannot be recovered, and the underlying requirement returns to being outstanding.


        **Token scopes**: `legal-entity:write`'
      tags:
      - Documents
      parameters:
      - name: legal_entity_id
        in: path
        description: Public UUID of the legal entity.
        required: true
        schema:
          type: string
          format: uuid
      - name: document_id
        in: path
        description: Public UUID of the document submission.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Document deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Bad request — invalid or missing parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteLegalEntityRegistrationDocument-v2026-08-17RequestBadRequestError'
        '401':
          description: Unauthorized — missing or invalid authentication token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteLegalEntityRegistrationDocument-v2026-08-17RequestUnauthorizedError'
        '403':
          description: Forbidden — the token lacks access to this legal entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteLegalEntityRegistrationDocument-v2026-08-17RequestForbiddenError'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteLegalEntityRegistrationDocument-v2026-08-17RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
    get:
      operationId: documents_getLegalEntityRegistrationDocument-v2026-08-17
      summary: Get Legal Entity Registration Document
      description: 'Returns a single document submission, including its review status, attached files and any superseded revisions. Use this to poll one submission after uploading, rather than re-listing every document for the entity. Archived submissions are returned by this endpoint as well as active ones.


        **Token scopes**: `legal-entity:read`'
      tags:
      - Documents
      parameters:
      - name: legal_entity_id
        in: path
        description: Public UUID of the legal entity.
        required: true
        schema:
          type: string
          format: uuid
      - name: document_id
        in: path
        description: Public UUID of the document submission.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Document returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Documents_getLegalEntityRegistrationDocument-v2026-08-17_Response_200'
        '400':
          description: Bad request — invalid or missing parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLegalEntityRegistrationDocument-v2026-08-17RequestBadRequestError'
        '401':
          description: Unauthorized — missing or invalid authentication token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLegalEntityRegistrationDocument-v2026-08-17RequestUnauthorizedError'
        '403':
          description: Forbidden — the token lacks access to this legal entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLegalEntityRegistrationDocument-v2026-08-17RequestForbiddenError'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLegalEntityRegistrationDocument-v2026-08-17RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
    put:
      operationId: documents_resubmitLegalEntityRegistrationDocument-v2026-08-17
      summary: Update Legal Entity Registration Document Files
      description: 'Replaces the files on a legal entity document with newly uploaded ones, typically after the document was rejected. The previous submission is archived rather than deleted, so the review history is preserved, and a new submission id is returned. Use the add-files endpoint instead when attaching a missing page to a document that is still under review.


        **Token scopes**: `legal-entity:write`'
      tags:
      - Documents
      parameters:
      - name: legal_entity_id
        in: path
        description: Public UUID of the legal entity.
        required: true
        schema:
          type: string
          format: uuid
      - name: document_id
        in: path
        description: Public UUID of the document submission.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Document resubmitted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Documents_resubmitLegalEntityRegistrationDocument-v2026-08-17_Response_200'
        '400':
          description: Bad request — invalid or missing parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResubmitLegalEntityRegistrationDocument-v2026-08-17RequestBadRequestError'
        '401':
          description: Unauthorized — missing or invalid authentication token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResubmitLegalEntityRegistrationDocument-v2026-08-17RequestUnauthorizedError'
        '403':
          description: Forbidden — the token lacks access to this legal entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResubmitLegalEntityRegistrationDocument-v2026-08-17RequestForbiddenError'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResubmitLegalEntityRegistrationDocument-v2026-08-17RequestNotFoundError'
        '422':
          description: Unprocessable entity — a file has an unsupported type or its content does not match its extension.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResubmitLegalEntityRegistrationDocument-v2026-08-17RequestUnprocessableEntityError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/LegalEntitiesLegalEntityIdRegistrationDocumentsDocumentIdPutRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
  /organizations/secure-vault/folders:
    post:
      operationId: documents_createOrganizationSecureVaultFolder-v2026-08-05
      summary: Create Organization Secure Vault Folder
      description: 'Creates a folder in the Organization Secure Vault. Omit `parent_folder_id` to create a root folder, or provide it to create a sub-folder.


        **Token scopes**: `organizations:write`'
      tags:
      - Documents
      responses:
        '201':
          description: Folder created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Documents_createOrganizationSecureVaultFolder-v2026-08-05_Response_201'
        '400':
          description: Bad request — invalid or missing parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrganizationSecureVaultFolder-v2026-08-05RequestBadRequestError'
        '401':
          description: Unauthorized — missing or invalid authentication token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrganizationSecureVaultFolder-v2026-08-05RequestUnauthorizedError'
        '403':
          description: Forbidden — the token lacks access to this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrganizationSecureVaultFolder-v2026-08-05RequestForbiddenError'
        '404':
