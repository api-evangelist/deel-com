          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrganizationSecureVaultFolder-v2026-08-05RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/OrganizationsSecureVaultFoldersPostRequestBodyContentApplicationJsonSchemaData'
                  description: The folder to create.
              required:
              - data
      security:
      - deelToken: []
  /legal-entities/{legal_entity_id}/registration-documents/{document_id}/files:
    delete:
      operationId: documents_deleteLegalEntityRegistrationDocumentFiles-v2026-08-17
      summary: Delete Legal Entity Registration Document Files
      description: 'Removes specific files from a submission while leaving the submission itself in place. Use this to drop a page that was uploaded by mistake without withdrawing the whole document. Removal is permanent — the files cannot be recovered. Removing every file leaves the submission with none attached, so delete the submission instead when that is the intent.


        **Token scopes**: `legal-entity:write`'
      tags:
      - Documents
      parameters:
      - name: legal_entity_id
        in: path
        description: Public UUID of the legal entity.
        required: true
        schema:
          type: string
          format: uuid
      - name: document_id
        in: path
        description: Public UUID of the document submission.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Files deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Bad request — invalid or missing parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteLegalEntityRegistrationDocumentFiles-v2026-08-17RequestBadRequestError'
        '401':
          description: Unauthorized — missing or invalid authentication token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteLegalEntityRegistrationDocumentFiles-v2026-08-17RequestUnauthorizedError'
        '403':
          description: Forbidden — the token lacks access to this legal entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteLegalEntityRegistrationDocumentFiles-v2026-08-17RequestForbiddenError'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteLegalEntityRegistrationDocumentFiles-v2026-08-17RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/LegalEntitiesLegalEntityIdRegistrationDocumentsDocumentIdFilesDeleteRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
  /organizations/secure-vault/files/{file_id}:
    delete:
      operationId: documents_deleteOrganizationSecureVaultFile-v2026-08-05
      summary: Delete Organization Secure Vault File
      description: 'Deletes a single file from the Organization Secure Vault, such as an obsolete draft or duplicate that is no longer needed. This action is permanent and the file cannot be recovered.


        **Token scopes**: `organizations:write`'
      tags:
      - Documents
      parameters:
      - name: file_id
        in: path
        description: Public UUID of the Organization Secure Vault file.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: File deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Bad request — invalid or missing parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteOrganizationSecureVaultFile-v2026-08-05RequestBadRequestError'
        '401':
          description: Unauthorized — missing or invalid authentication token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteOrganizationSecureVaultFile-v2026-08-05RequestUnauthorizedError'
        '403':
          description: Forbidden — the token lacks access to this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteOrganizationSecureVaultFile-v2026-08-05RequestForbiddenError'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteOrganizationSecureVaultFile-v2026-08-05RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /organizations/secure-vault/folders/{folder_id}:
    delete:
      operationId: documents_deleteOrganizationSecureVaultFolder-v2026-08-05
      summary: Delete Organization Secure Vault Folder
      description: 'Deletes an Organization Secure Vault folder that is no longer needed, such as a temporary or misfiled folder structure, along with all of its sub-folders. Files that can be deleted are permanently removed and cannot be recovered; files that cannot be deleted (e.g. signed documents) are moved into the "Other Files" folder instead. The system-managed "Other Files" folder cannot be deleted.


        **Token scopes**: `organizations:write`'
      tags:
      - Documents
      parameters:
      - name: folder_id
        in: path
        description: Public UUID of the folder.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Folder deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Bad request — invalid or missing parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteOrganizationSecureVaultFolder-v2026-08-05RequestBadRequestError'
        '401':
          description: Unauthorized — missing or invalid authentication token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteOrganizationSecureVaultFolder-v2026-08-05RequestUnauthorizedError'
        '403':
          description: Forbidden — the token lacks access to this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteOrganizationSecureVaultFolder-v2026-08-05RequestForbiddenError'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteOrganizationSecureVaultFolder-v2026-08-05RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
    get:
      operationId: documents_getOrganizationSecureVaultFolder-v2026-08-05
      summary: Get Organization Secure Vault Folder
      description: 'Returns a single Organization Secure Vault folder, including its ancestor chain from the root folder down to its parent.


        **Token scopes**: `organizations:read`'
      tags:
      - Documents
      parameters:
      - name: folder_id
        in: path
        description: Public UUID of the folder.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Folder returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Documents_getOrganizationSecureVaultFolder-v2026-08-05_Response_200'
        '400':
          description: Bad request — invalid or missing parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrganizationSecureVaultFolder-v2026-08-05RequestBadRequestError'
        '401':
          description: Unauthorized — missing or invalid authentication token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrganizationSecureVaultFolder-v2026-08-05RequestUnauthorizedError'
        '403':
          description: Forbidden — the token lacks access to this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrganizationSecureVaultFolder-v2026-08-05RequestForbiddenError'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrganizationSecureVaultFolder-v2026-08-05RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
    patch:
      operationId: documents_updateOrganizationSecureVaultFolder-v2026-08-05
      summary: Update Organization Secure Vault Folder
      description: 'Renames an Organization Secure Vault folder and updates its description. The system-managed "Other Files" folder cannot be modified.


        **Token scopes**: `organizations:write`'
      tags:
      - Documents
      parameters:
      - name: folder_id
        in: path
        description: Public UUID of the folder.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Folder updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Bad request — invalid or missing parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateOrganizationSecureVaultFolder-v2026-08-05RequestBadRequestError'
        '401':
          description: Unauthorized — missing or invalid authentication token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateOrganizationSecureVaultFolder-v2026-08-05RequestUnauthorizedError'
        '403':
          description: Forbidden — the token lacks access to this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateOrganizationSecureVaultFolder-v2026-08-05RequestForbiddenError'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateOrganizationSecureVaultFolder-v2026-08-05RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/OrganizationsSecureVaultFoldersFolderIdPatchRequestBodyContentApplicationJsonSchemaData'
                  description: Fields to update on the folder.
              required:
              - data
      security:
      - deelToken: []
  /legal-entities/{legal_entity_id}/registration-documents/{document_id}/files/{file_id}/download:
    get:
      operationId: documents_downloadLegalEntityRegistrationDocumentFile-v2026-08-17
      summary: Download Legal Entity Registration Document File
      description: 'Issues a time-limited download URL for one file attached to a submission. Use this to retrieve a document already on file — for an audit, or to re-file it in your own system. The URL expires shortly after it is issued, so fetch it rather than storing it; request a new one when it lapses.


        **Token scopes**: `legal-entity:read`'
      tags:
      - Documents
      parameters:
      - name: legal_entity_id
        in: path
        description: Public UUID of the legal entity.
        required: true
        schema:
          type: string
          format: uuid
      - name: document_id
        in: path
        description: Public UUID of the document submission.
        required: true
        schema:
          type: string
          format: uuid
      - name: file_id
        in: path
        description: Public UUID of a file attached to the submission.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Download URL issued successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Documents_downloadLegalEntityRegistrationDocumentFile-v2026-08-17_Response_200'
        '400':
          description: Bad request — invalid or missing parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadLegalEntityRegistrationDocumentFile-v2026-08-17RequestBadRequestError'
        '401':
          description: Unauthorized — missing or invalid authentication token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadLegalEntityRegistrationDocumentFile-v2026-08-17RequestUnauthorizedError'
        '403':
          description: Forbidden — the token lacks access to this legal entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadLegalEntityRegistrationDocumentFile-v2026-08-17RequestForbiddenError'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadLegalEntityRegistrationDocumentFile-v2026-08-17RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /registration-document-requirements/{requirement_id}/template:
    get:
      operationId: documents_downloadLegalEntityRegistrationDocumentRequirementTemplate-v2026-08-17
      summary: Download Legal Entity Registration Document Requirement Template
      description: 'Issues a time-limited download URL for the blank template provided for a document requirement. Some requirements must be submitted on a supplied form; this returns that form so it can be completed and submitted back. Check `requirement.has_template` on a document before calling this endpoint.


        **Token scopes**: `legal-entity:read`'
      tags:
      - Documents
      parameters:
      - name: requirement_id
        in: path
        description: Public UUID of the document requirement.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Template download URL issued successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Documents_downloadLegalEntityRegistrationDocumentRequirementTemplate-v2026-08-17_Response_200'
        '400':
          description: Bad request — invalid or missing parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadLegalEntityRegistrationDocumentRequirementTemplate-v2026-08-17RequestBadRequestError'
        '401':
          description: Unauthorized — missing or invalid authentication token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadLegalEntityRegistrationDocumentRequirementTemplate-v2026-08-17RequestUnauthorizedError'
        '403':
          description: Forbidden — the token lacks access to this legal entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadLegalEntityRegistrationDocumentRequirementTemplate-v2026-08-17RequestForbiddenError'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadLegalEntityRegistrationDocumentRequirementTemplate-v2026-08-17RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
