openapi: 3.2.0
info:
  title: Endpoints It Warehouses API
  version: 1.0.0
  description: API endpoints related to IT warehouses.
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: itWarehouses
  description: API endpoints related to IT warehouses.
paths:
  /it/warehouses:
    get:
      operationId: itWarehouses_listItWarehouses-v2026-09-15
      summary: List warehouses
      description: 'Lists your organization''s storage locations — your own offices and any Deel-managed warehouses. Use it to resolve a `warehouse_id` before routing a collection or an asset location update, and to enumerate sites alongside `GET /rest/it/assets`.


        **Token scopes**: `it-assets:read`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2026-12-15.'
      tags:
      - itWarehouses
      parameters:
      - name: cursor
        in: query
        description: Indicates where the next page of results starts, as returned in a paginated list response
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Return a page of results with given number of records
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: search
        in: query
        description: Free-text search on warehouse name
        required: false
        schema:
          type: string
      - name: country
        in: query
        description: Filter by warehouse country (ISO 3166 alpha-2). Repeat the key to filter on multiple values.
        required: false
        schema:
          type: string
      - name: type
        in: query
        description: Filter by organization warehouse type. Repeat the key to filter on multiple values.
        required: false
        schema:
          $ref: '#/components/schemas/ItWarehousesGetParametersType'
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/ItWarehousesGetParametersXBeta'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IT_warehouses_listItWarehouses-v2026-09-15_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListItWarehouses-v2026-09-15RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListItWarehouses-v2026-09-15RequestInternalServerError'
      security:
      - deelToken: []
  /it/warehouses/{warehouse_id}:
    get:
      operationId: itWarehouses_retrieveAnItWarehouse-v2026-09-15
      summary: Retrieve a warehouse
      description: 'Retrieves one storage location with its address and type. Call this to confirm a warehouse''s delivery address before routing a collection or an asset location update to it.


        **Token scopes**: `it-assets:read`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2026-12-15.'
      tags:
      - itWarehouses
      parameters:
      - name: warehouse_id
        in: path
        description: Unique identifier of the warehouse
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/ItWarehousesWarehouseIdGetParametersXBeta'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IT_warehouses_retrieveAnItWarehouse-v2026-09-15_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAnItWarehouse-v2026-09-15RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAnItWarehouse-v2026-09-15RequestNotFoundError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAnItWarehouse-v2026-09-15RequestInternalServerError'
      security:
      - deelToken: []
