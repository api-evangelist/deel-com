openapi: 3.2.0
info:
  title: Endpoints Worker Information API
  version: 1.0.0
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: workerInformation
paths:
  /gp/workers/{worker_id}/banks:
    post:
      operationId: workerInformation_createGPWorkerBank
      summary: Add bank account
      description: 'Adds a bank account for the GP worker; country-specific field requirements must be retrieved from `GET /gp/workers/{worker_id}/banks/guide` before submitting.


        **Token scopes**: `people:write`'
      tags:
      - workerInformation
      parameters:
      - name: worker_id
        in: path
        description: Unique identifier for a worker in UUID format.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/worker-information_createGPWorkerBank_Response_201'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        description: Request body containing the details of the bank account to be added.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/GpWorkersWorkerIdBanksPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
    get:
      operationId: workerInformation_getGPWorkerBanks
      summary: Retrieve bank accounts
      description: 'Returns all bank accounts associated with the employee.


        **Token scopes**: `people:read`'
      tags:
      - workerInformation
      parameters:
      - name: worker_id
        in: path
        description: Unique identifier for a worker.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/worker-information_getGPWorkerBanks_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /gp/workers/contracts/{contract_id}/additional-information:
    post:
      operationId: workerInformation_createGPWorkerAdditionalInformation
      summary: Add GP Workers Additional Information
      description: 'Adds supplementary fields to the contract, with the extra data supplied under the `data` object in the request body.


        **Token scopes**: `people:write`'
      tags:
      - workerInformation
      parameters:
      - name: contract_id
        in: path
        description: The unique public identifier of the contract.
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Operation successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/worker-information_createGPWorkerAdditionalInformation_Response_201'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddGpWorkersAdditionalInformation-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddGpWorkersAdditionalInformation-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  additionalProperties:
                    $ref: '#/components/schemas/GpWorkersContractsContractIdAdditionalInformationPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
    patch:
      operationId: workerInformation_getGPWorkerAdditionalInformation
      summary: Update GP worker additional information
      description: 'Use this endpoint to correct or change country-specific additional information already held on a Global Payroll worker contract, for example after the worker reports a new marital status or a tax identifier changes. Only the fields sent under `data` are modified; everything else is left untouched. Field keys must belong to the additional-information fields defined for the contract country (see `GET /rest/forms/gp/worker-additional-fields/{country_code}`). For fields the organization has configured as effective-dated, a date must be supplied in `effective_dates` (`YYYY-MM-DD`) whenever the value changes: today or a past date applies the change immediately, a future date schedules it and the current value stays in effect until then. Unchanged values and clears need no date. Changes are recorded in the contract history and may update the worker onboarding checklist. By default returns 204. Pass `?include_completion_status=true` to receive a 200 response with `is_additional_data_done` (true when all required fields for EDM onboarding are provided) and `missing_keys` (required fields still absent). Requires the `people:write` scope.


        **Token scopes**: `people:write`'
      tags:
      - workerInformation
      parameters:
      - name: contract_id
        in: path
        description: The unique public identifier of the contract.
        required: true
        schema:
          type: string
      - name: include_completion_status
        in: query
        description: Pass `true` to receive a 200 response with `is_additional_data_done` and `missing_keys` instead of the default 204 No Content.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Returned only when `?include_completion_status=true` is passed. Contains completion status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/worker-information_getGPWorkerAdditionalInformation_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateGpWorkersAdditionalInformation-v2026-01-01RequestBadRequestError'
        '401':
          description: Unauthorized — missing or invalid authentication token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateGpWorkersAdditionalInformation-v2026-01-01RequestUnauthorizedError'
        '403':
          description: Forbidden — caller lacks the people:write permission or cannot access this contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateGpWorkersAdditionalInformation-v2026-01-01RequestForbiddenError'
        '404':
          description: Not found — the contract does not exist or is not accessible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateGpWorkersAdditionalInformation-v2026-01-01RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateGpWorkersAdditionalInformation-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  additionalProperties:
                    $ref: '#/components/schemas/GpWorkersContractsContractIdAdditionalInformationPatchRequestBodyContentApplicationJsonSchemaData'
                effective_dates:
                  type: object
                  additionalProperties:
                    type: string
                    format: date
                    pattern: ^\d{4}-\d{2}-\d{2}$
                  description: Per-field effective date (YYYY-MM-DD), keyed like `data`. Only allowed for effective-dated fields, and required whenever such a field is set to a new value (unchanged values and clears need no date). Past dates apply immediately as corrections, future dates are scheduled.
              required:
              - data
      security:
      - deelToken: []
  /gp/workers/{worker_id}/banks/{bank_id}:
    patch:
      operationId: workerInformation_updateGPWorkerBank
      summary: Modify bank account
      description: 'Partially updates the bank account for the worker; only fields provided in the request body are modified.


        **Token scopes**: `people:write`'
      tags:
      - workerInformation
      parameters:
      - name: worker_id
        in: path
        description: Unique identifier for a worker in UUID format.
        required: true
        schema:
          type: string
          format: uuid
      - name: bank_id
        in: path
        description: Unique identifier for the bank account in UUID format.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/worker-information_updateGPWorkerBank_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        description: Request body to modify an existing bank account for an employee.
        content:
          application/json:
            schema:
              type: object
              properties:
                city:
                  type: string
                  description: The city of the user's address.
                iban:
                  type: string
                  description: The International Bank Account Number (IBAN).
                email:
                  type: string
                  description: The user's email address.
                phone:
                  type: string
                  description: The user's phone number.
                postal:
                  type: string
                  description: The user's postal or ZIP code.
                tax_id:
                  type: string
                  description: The user's tax identification number.
                bank_code:
                  type: string
                  description: The bank code.
                bank_name:
                  type: string
                  description: Name of the user's bank.
                full_name:
                  type: string
                  description: Full name of the user.
                swift_bic:
                  type: string
                  description: SWIFT/BIC code for the bank.
                rib_number:
                  type: string
                  description: The RIB (Relevé d'Identité Bancaire).
                branch_code:
                  type: string
                  description: The branch code of the user's bank.
                account_type:
                  type: string
                  description: Bank account type.
                country_code:
                  type: string
                  description: The country code of the user's address.
                address_line1:
                  type: string
                  description: The primary address line.
                address_line2:
                  type: string
                  description: The secondary address line.
                currency_code:
                  type: string
                  description: The currency code for transactions.
                original_name:
                  type: string
                  description: The original name of the user.
                account_number:
                  type: string
                  description: The user's bank account number.
                province_state:
                  type: string
                  description: The state or province of the user's address.
                bank_branch_name:
                  type: string
                  description: The name of the user's bank branch.
                bank_country_code:
                  type: string
                  description: The country code where the bank is located.
                ach_routing_number:
                  type: string
                  description: The ACH (Automated Clearing House) Routing Number.
      security:
      - deelToken: []
  /gp/workers/{worker_id}/banks/guide:
    get:
      operationId: workerInformation_getGPWorkerBankGuide
      summary: Retrieve bank guide
      description: 'Returns the country-specific field requirements for a worker''s bank account form, which determines the fields required when adding a bank account.


        **Token scopes**: `people:read`'
      tags:
      - workerInformation
      parameters:
      - name: worker_id
        in: path
        description: Unique identifier for a worker in UUID format.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/worker-information_getGPWorkerBankGuide_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /gp/workers/{worker_id}/address:
    patch:
      operationId: workerInformation_updateGPWorkerAddress
      summary: Update address
      description: 'Partially updates the address on record for the GP employee.


        **Token scopes**: `people:write`'
      tags:
      - workerInformation
      parameters:
      - name: worker_id
        in: path
        description: Unique identifier for a worker in UUID format.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/worker-information_updateGPWorkerAddress_Response_201'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        description: The desired address of the Global Payroll employee
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/GpWorkersWorkerIdAddressPatchRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
  /gp/workers/{worker_id}/compensation:
    patch:
      operationId: workerInformation_updateGPWorkerCompensation
      summary: Update compensation
      description: 'Updates the compensation for the GP employee and returns the complete compensation history including the applied change.


        **Token scopes**: `people:write`'
      tags:
