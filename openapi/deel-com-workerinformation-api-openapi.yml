        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        description: Contract object that needs to be amended.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/GpWorkersWorkerIdPtoPolicyPatchRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
components:
  schemas:
    worker-information_updateGPWorkerCompensation_Response_200:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/GpWorkersWorkerIdCompensationPatchResponsesContentApplicationJsonSchemaDataItems'
      required:
      - data
      title: worker-information_updateGPWorkerCompensation_Response_200
    UpdateGpWorkersAdditionalInformation-v2026-01-01RequestForbiddenError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/GpWorkersContractsContractIdAdditionalInformationPatchResponsesContentApplicationJsonSchemaErrorsItems'
      title: UpdateGpWorkersAdditionalInformation-v2026-01-01RequestForbiddenError
    GpWorkersWorkerIdPtoPolicyPatchResponsesContentApplicationJsonSchemaData:
      type: object
      properties:
        updated:
          type: boolean
          description: Indicates if the PTO policy was successfully updated.
      required:
      - updated
      title: GpWorkersWorkerIdPtoPolicyPatchResponsesContentApplicationJsonSchemaData
    GpWorkersContractsContractIdAdditionalInformationPatchResponsesContentApplicationJsonSchemaErrorsItems:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable explanation of the error
      title: GpWorkersContractsContractIdAdditionalInformationPatchResponsesContentApplicationJsonSchemaErrorsItems
    GpWorkersContractsContractIdAdditionalInformationPatchRequestBodyContentApplicationJsonSchemaData:
      oneOf:
      - type: string
        maxLength: 1000
      - type: number
        format: double
      - type: boolean
      title: GpWorkersContractsContractIdAdditionalInformationPatchRequestBodyContentApplicationJsonSchemaData
    GpWorkersWorkerIdBanksBankIdPatchResponsesContentApplicationJsonSchemaData:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the modified bank account.
        status:
          type: string
          description: The status of the modified bank account.
        created_at:
          type: string
          format: date-time
          description: Timestamp of when the bank account was created, in ISO-8601 format.
        updated_at:
          type: string
          format: date-time
          description: Timestamp of the last update to the bank account, in ISO-8601 format.
      required:
      - id
      - status
      - created_at
      - updated_at
      title: GpWorkersWorkerIdBanksBankIdPatchResponsesContentApplicationJsonSchemaData
    GpWorkersWorkerIdCompensationPatchResponsesContentApplicationJsonSchemaDataItems:
      type: object
      properties:
        scale:
          $ref: '#/components/schemas/GpWorkersWorkerIdCompensationPatchResponsesContentApplicationJsonSchemaDataItemsScale'
          description: The scale to which a given salary applies.
        salary:
          type: string
          description: Compensation salary.
        status:
          $ref: '#/components/schemas/GpWorkersWorkerIdCompensationPatchResponsesContentApplicationJsonSchemaDataItemsStatus'
          description: The status of a salary amendment.
        effective_date:
          type: string
          format: date
          description: 'Short date in format ISO-8601 (YYYY-MM-DD). For example: 2022-12-31.'
      title: GpWorkersWorkerIdCompensationPatchResponsesContentApplicationJsonSchemaDataItems
    worker-information_updateGPWorkerPTOPolicy_Response_200:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/GpWorkersWorkerIdPtoPolicyPatchResponsesContentApplicationJsonSchemaData'
      required:
      - data
      title: worker-information_updateGPWorkerPTOPolicy_Response_200
    GpWorkersWorkerIdPtoPolicyPatchRequestBodyContentApplicationJsonSchemaData:
      type: object
      properties:
        yearly_allowance:
          type: string
          description: 'Enter the number of holidays. Example: ''15'' for 15 days.'
        accrual_start_date:
          type: string
          format: date
          description: 'Short date in format ISO-8601 (YYYY-MM-DD). For example: ''2022-12-31''.'
      required:
      - yearly_allowance
      - accrual_start_date
      title: GpWorkersWorkerIdPtoPolicyPatchRequestBodyContentApplicationJsonSchemaData
    GpWorkersWorkerIdEmployeeInformationPatchRequestBodyContentApplicationJsonSchemaData:
      type: object
      properties:
        employee_number:
          type: string
          description: Employee's unique number.
      title: GpWorkersWorkerIdEmployeeInformationPatchRequestBodyContentApplicationJsonSchemaData
    GpWorkersContractsContractIdAdditionalInformationPostRequestBodyContentApplicationJsonSchemaData:
      oneOf:
      - type: string
        maxLength: 1000
      - type: number
        format: double
      - type: boolean
      title: GpWorkersContractsContractIdAdditionalInformationPostRequestBodyContentApplicationJsonSchemaData
    GpWorkersWorkerIdAddressPatchRequestBodyContentApplicationJsonSchemaData:
      type: object
      properties:
        zip:
          type: string
          description: Zip code.
        city:
          type: string
          description: City name.
        street:
          type: string
