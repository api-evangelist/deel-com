openapi: 3.2.0
info:
  title: Endpoints Eor Offboarding API
  version: 1.0.0
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: eorOffboarding
paths:
  /eor/contracts/{contract_id}/offboarding/review-client-sign-offs:
    post:
      operationId: eorOffboarding_createEOROffboardingClientSignOff
      summary: Create client sign off
      description: 'Submits a client sign-off decision—approval or change request—for the offboarding documents of a specific contract during the client sign-off step.


        **Token scopes**: `contracts:write`'
      tags:
      - eorOffboarding
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier of the employee contract.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Approval submitted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eor-offboarding_createEOROffboardingClientSignOff_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewApproveOrRequestChangesToEorOffboardingDocuments-v2026-01-01RequestBadRequestError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewApproveOrRequestChangesToEorOffboardingDocuments-v2026-01-01RequestUnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewApproveOrRequestChangesToEorOffboardingDocuments-v2026-01-01RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewApproveOrRequestChangesToEorOffboardingDocuments-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/EorContractsContractIdOffboardingReviewClientSignOffsPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
  /eor/contracts/{contract_id}/offboarding/required-information:
    get:
      operationId: eorOffboarding_getEORContractOffboardingRequiredInformation
      summary: Get additional information required to request employee termination
      description: 'Returns country-specific mandatory and optional questions, and identifies required supporting documents, that must be provided when initiating the offboarding process for a contract.


        **Token scopes**: `contracts:read`'
      tags:
      - eorOffboarding
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier of the employee contract.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ok response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eor-offboarding_getEORContractOffboardingRequiredInformation_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAdditionalInformationRequiredToRequestEmployeeTermination-v2026-01-01RequestBadRequestError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAdditionalInformationRequiredToRequestEmployeeTermination-v2026-01-01RequestUnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAdditionalInformationRequiredToRequestEmployeeTermination-v2026-01-01RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAdditionalInformationRequiredToRequestEmployeeTermination-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
  /eor/contracts/{contract_id}/offboarding/time-offs:
    get:
      operationId: eorOffboarding_getContractOffboardingTimeOffs
      summary: Retrieve Employee Time Off Data for Offboarding
      description: 'Returns time off entitlements, balances, and upcoming time offs for the employee on the specified contract, optionally scoped to a target end_date. The response includes policy settings and tracking configuration required to support completion of an offboarding request.


        **Token scopes**: `contracts:read`'
      tags:
      - eorOffboarding
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier of the employee contract.
        required: true
        schema:
          type: string
      - name: end_date
        in: query
        description: Desired end date for offboarding
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Successfully retrieved used time off information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eor-offboarding_getContractOffboardingTimeOffs_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveEmployeeTimeOffDataForOffboarding-v2026-01-01RequestBadRequestError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveEmployeeTimeOffDataForOffboarding-v2026-01-01RequestUnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveEmployeeTimeOffDataForOffboarding-v2026-01-01RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveEmployeeTimeOffDataForOffboarding-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
  /eor/contracts/{contract_id}/offboarding/attachments/{attachment_id}:
    get:
      operationId: eorOffboarding_getContractOffboardingAttachmentById
      summary: Retrieve offboarding attachment
      description: 'Downloads the content of a specific attachment associated with the termination for a given contract.


        **Token scopes**: `contracts:read`'
      tags:
      - eorOffboarding
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier of the employee contract.
        required: true
        schema:
          type: string
      - name: attachment_id
        in: path
        description: The unique identifier of the attachment to download.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: File download successful
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveOffboardingAttachment-v2026-01-01RequestBadRequestError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveOffboardingAttachment-v2026-01-01RequestUnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveOffboardingAttachment-v2026-01-01RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveOffboardingAttachment-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
  /eor/contracts/{contract_id}/offboarding:
    get:
      operationId: eorOffboarding_getContractOffboarding
      summary: Retrieve Offboarding Request
      description: 'Retrieves the offboarding request associated with a specific EOR contract, including termination details, document review status, offboarding request data, and pending employee notification state.


        **Token scopes**: `contracts:read`, `worker:read`'
      tags:
      - eorOffboarding
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier of the employee contract.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful retrieval of the offboarding request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eor-offboarding_getContractOffboarding_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveOffboardingRequest-v2026-01-01RequestBadRequestError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveOffboardingRequest-v2026-01-01RequestUnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveOffboardingRequest-v2026-01-01RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveOffboardingRequest-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
  /eor/contracts/{contract_id}/offboarding/restricted-dates:
    get:
      operationId: eorOffboarding_getContractOffboardingRestrictedDates
      summary: Retrieve restricted offboarding dates
      description: 'Returns country-specific dates unavailable for offboarding end-date selection—including weekends and public holidays—along with the earliest available end date; optionally filtered by termination type.


        **Token scopes**: `contracts:read`'
      tags:
      - eorOffboarding
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier of the employee contract.
        required: true
        schema:
          type: string
      - name: termination_type
        in: query
        description: Type of offboarding.
        required: false
        schema:
          $ref: '#/components/schemas/EorContractsContractIdOffboardingRestrictedDatesGetParametersTerminationType'
      responses:
        '200':
          description: Successful retrieval of restricted dates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eor-offboarding_getContractOffboardingRestrictedDates_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveRestrictedOffboardingDates-v2026-01-01RequestBadRequestError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveRestrictedOffboardingDates-v2026-01-01RequestUnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveRestrictedOffboardingDates-v2026-01-01RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveRestrictedOffboardingDates-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
  /eor/contracts/{contract_id}/offboarding/resignations/review-pto:
    post:
      operationId: eorOffboarding_reviewEOROffboardingPTO
      summary: Submit employee resignation PTO review
      description: 'Submits PTO details for a resignation request, triggers related notifications, and finalizes the PTO review step. Only callable when the resignation status is `AWAITING_PTO`.


        **Token scopes**: `contracts:write`'
      tags:
      - eorOffboarding
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier of the employee contract.
        required: true
        schema:
          type: string
      responses:
        '201':
          description: PTO review submitted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eor-offboarding_reviewEOROffboardingPTO_Response_201'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitEmployeeResignationPtoReview-v2026-01-01RequestBadRequestError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitEmployeeResignationPtoReview-v2026-01-01RequestUnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitEmployeeResignationPtoReview-v2026-01-01RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitEmployeeResignationPtoReview-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/EorContractsContractIdOffboardingResignationsReviewPtoPostRequestBodyContentApplicationJsonSchemaData'
      security:
      - deelToken: []
  /eor/contracts/{contract_id}/offboarding/review-employee-sign-offs:
    post:
      operationId: eorOffboarding_reviewEOROffboardingEmployeeSignOffs
      summary: Submit employee sign-off review for offboarding documents
      description: 'Records an employee''s sign-off decision—approval or change request with feedback—for the offboarding document set of a contract.


        **Token scopes**: `worker:write`'
      tags:
      - eorOffboarding
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier of the employee contract.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Approval submitted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eor-offboarding_reviewEOROffboardingEmployeeSignOffs_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitEmployeeSignOffReviewForOffboardingDocuments-v2026-01-01RequestBadRequestError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitEmployeeSignOffReviewForOffboardingDocuments-v2026-01-01RequestUnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitEmployeeSignOffReviewForOffboardingDocuments-v2026-01-01RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitEmployeeSignOffReviewForOffboardingDocuments-v2026-01-01RequestInternalServerError'
      requestBody:
        description: Ok response
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/EorContractsContractIdOffboardingReviewEmployeeSignOffsPostRequestBodyContentApplicationJsonSchemaData'
      security:
      - deelToken: []
components:
  schemas:
    EorContractsContractIdOffboardingReviewEmployeeSignOffsPostRequestBodyContentApplicationJsonSchemaData:
      type: object
      properties:
        approved:
          type: boolean
          description: Indicates if the employee has approved the sign-off review
        requested_changes:
          type:
          - string
          - 'null'
          maxLength: 2000
          description: Details of requested changes if the review is not approved
        reviewer_signature:
          type:
          - string
          - 'null'
          maxLength: 1000
          description: Signature of the reviewer if the review is approved
      required:
      - approved
      - requested_changes
      - reviewer_signature
      title: EorContractsContractIdOffboardingReviewEmployeeSignOffsPostRequestBodyContentApplicationJsonSchemaData
    SubmitEmployeeSignOffReviewForOffboardingDocuments-v2026-01-01RequestForbiddenError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/EorContractsContractIdOffboardingReviewEmployeeSignOffsPostResponsesContentApplicationJsonSchemaErrorsItems'
      title: SubmitEmployeeSignOffReviewForOffboardingDocuments-v2026-01-01RequestForbiddenError
    EorContractsContractIdOffboardingGetResponsesContentApplicationJsonSchemaDataRequestDataUsedTimeOffTimeOffsItems:
      type: object
      properties:
        unit:
          $ref: '#/components/schemas/EorContractsContractIdOffboardingGetResponsesContentApplicationJsonSchemaDataRequestDataUsedTimeOffTimeOffsItemsUnit'
          description: The unit of measurement for time off tracking
        policy_type:
          type: string
          description: The type of time-off policy
        tracking_periods:
          type: array
          items:
            $ref: '#/components/schemas/EorContractsContractIdOffboardingGetResponsesContentApplicationJsonSchemaDataRequestDataUsedTimeOffTimeOffsItemsTrackingPeriodsItems'
        scheduled_until_end_date:
          type: number
          format: double
          description: The amount of time off scheduled until the end date of the current tracking period
      required:
      - unit
      - policy_type
      - tracking_periods
      - scheduled_until_end_date
      title: EorContractsContractIdOffboardingGetResponsesContentApplicationJsonSchemaDataRequestDataUsedTimeOffTimeOffsItems
    eor-offboarding_createEOROffboardingClientSignOff_Response_200:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/EorContractsContractIdOffboardingReviewClientSignOffsPostResponsesContentApplicationJsonSchemaData'
      required:
      - data
      title: eor-offboarding_createEOROffboardingClientSignOff_Response_200
    EorContractsContractIdOffboardingResignationsReviewPtoPostRequestBodyContentApplicationJsonSchemaDataUsedTimeOff:
      type: object
      properties:
        tracking_type:
          $ref: '#/components/schemas/EorContractsContractIdOffboardingResignationsReviewPtoPostRequestBodyContentApplicationJsonSchemaDataUsedTimeOffTrackingType'
          description: Type of time off tracking - whether it's tracked on Deel platform or off platform
        off_platform_used_time_off:
          oneOf:
          - $ref: '#/components/schemas/EorContractsContractIdOffboardingResignationsReviewPtoPostRequestBodyContentApplicationJsonSchemaDataUsedTimeOffOffPlatformUsedTimeOff'
          - type: 'null'
          description: Required when tracking_type is OFF_PLATFORM, null otherwise
      description: Time-off usage data including policy information and tracking periods
      title: EorContractsContractIdOffboardingResignationsReviewPtoPostRequestBodyContentApplicationJsonSchemaDataUsedTimeOff
    ? EorContractsContractIdOffboardingReviewClientSignOffsPostResponsesContentApplicationJsonSchemaDataDocumentsOffboardingItemsStatus
    : type: string
      enum:
      - AWAITING_REVIEW
      - AWAITING_FEEDBACK
      - FEEDBACK_PROVIDED
      - APPROVED
      - CHANGES_REQUESTED_BY_CLIENT
      - CHANGES_REQUESTED_BY_EMPLOYEE
      - WAIVED_REVIEW
      - NOT_RESPONDED
      - CANCELLED
      description: The current status of the document review
      title: EorContractsContractIdOffboardingReviewClientSignOffsPostResponsesContentApplicationJsonSchemaDataDocumentsOffboardingItemsStatus
    GetAdditionalInformationRequiredToRequestEmployeeTermination-v2026-01-01RequestUnauthorizedError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/EorContractsContractIdOffboardingRequiredInformationGetResponsesContentApplicationJsonSchemaErrorsItems'
      title: GetAdditionalInformationRequiredToRequestEmployeeTermination-v2026-01-01RequestUnauthorizedError
    EorContractsContractIdOffboardingResignationsReviewPtoPostResponsesContentApplicationJsonSchemaDataRequestDataUsedTimeOff:
      type: object
      properties:
        time_offs:
          type: array
          items:
            $ref: '#/components/schemas/EorContractsContractIdOffboardingResignationsReviewPtoPostResponsesContentApplicationJsonSchemaDataRequestDataUsedTimeOffTimeOffsItems'
        additional_details:
          oneOf:
          - $ref: '#/components/schemas/EorContractsContractIdOffboardingResignationsReviewPtoPostResponsesContentApplicationJsonSchemaDataRequestDataUsedTimeOffAdditionalDetails'
          - type: 'null'
        is_deel_pto_confirmed:
          type: boolean
          description: Indicates whether the PTO allocation has been confirmed by Deel's system
      required:
      - time_offs
      - is_deel_pto_confirmed
      description: Time-off usage data including policy information and tracking periods
      title: EorContractsContractIdOffboardingResignationsReviewPtoPostResponsesContentApplicationJsonSchemaDataRequestDataUsedTimeOff
    EorContractsContractIdOffboardingTimeOffsGetResponsesContentApplicationJsonSchemaErrorsItems:
      type: object
      properties:
        code:
          type: string
          description: Error code of the handler which produced the returned error
        field:
          type: string
          description: The field name where error occurred (null for server errors)
        message:
          type: string
          description: Description of the returned error
      title: EorContractsContractIdOffboardingTimeOffsGetResponsesContentApplicationJsonSchemaErrorsItems
    EorContractsContractIdOffboardingTimeOffsGetResponsesContentApplicationJsonSchemaDataEntitlementsItemsEntitlementUnit:
      type: string
      enum:
      - BUSINESS_DAY
      - CALENDAR_DAY
      - HOUR
      - WEEK
      - MONTH
      - YEAR
      description: Unit of time measurement
      title: EorContractsContractIdOffboardingTimeOffsGetResponsesContentApplicationJsonSchemaDataEntitlementsItemsEntitlementUnit
    RetrieveEmployeeTimeOffDataForOffboarding-v2026-01-01RequestUnauthorizedError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/EorContractsContractIdOffboardingTimeOffsGetResponsesContentApplicationJsonSchemaErrorsItems'
      title: RetrieveEmployeeTimeOffDataForOffboarding-v2026-01-01RequestUnauthorizedError
    ? EorContractsContractIdOffboardingGetResponsesContentApplicationJsonSchemaDataRequestDataUsedTimeOffTimeOffsItemsTrackingPeriodsItems
    : type: object
      properties:
        used:
          type: number
          format: double
          description: The amount of time off used in this tracking period
        end_date:
          type: string
          format: date-time
          description: The end date of the tracking period
        start_date:
          type: string
          format: date-time
          description: The start date of the tracking period
      required:
      - used
      - end_date
      - start_date
      title: EorContractsContractIdOffboardingGetResponsesContentApplicationJsonSchemaDataRequestDataUsedTimeOffTimeOffsItemsTrackingPeriodsItems
    ? EorContractsContractIdOffboardingResignationsReviewPtoPostRequestBodyContentApplicationJsonSchemaDataUsedTimeOffOffPlatformUsedTimeOff
    : type: object
      properties:
        entitlements:
          type: array
          items:
            $ref: '#/components/schemas/EorContractsContractIdOffboardingResignationsReviewPtoPostRequestBodyContentApplicationJsonSchemaDataUsedTimeOffOffPlatformUsedTimeOffEntitlementsItems'
          description: Array of time off entitlements for different tracking periods
        total_scheduled:
          type: string
          title: float
          description: Total amount of time off scheduled until the end date
        entitlement_unit:
          $ref: '#/components/schemas/EorContractsContractIdOffboardingResignationsReviewPtoPostRequestBodyContentApplicationJsonSchemaDataUsedTimeOffOffPlatformUsedTimeOffEntitlementUnit'
          description: Unit of measurement for the time off entitlements
      required:
      - entitlements
      - total_scheduled
      - entitlement_unit
      description: Required when tracking_type is OFF_PLATFORM, null otherwise
      title: EorContractsContractIdOffboardingResignationsReviewPtoPostRequestBodyContentApplicationJsonSchemaDataUsedTimeOffOffPlatformUsedTimeOff
    ? EorContractsContractIdOffboardingReviewEmployeeSignOffsPostResponsesContentApplicationJsonSchemaDataDocumentsSupportingItems
    : type: object
      properties:
        id:
          type: string
          description: The unique identifier of the file
        name:
          type: string
          description: The name of the file
        type:
          type: string
          description: The type/extension of the file
        created_at:
          type: string
          format: date-time
          description: The date and time the file was created
        updated_at:
          type: string
          format: date-time
          description: The date and time the file was updated
        is_additional_supporting_document:
          type: boolean
          description: Indicates if this is an additional supporting document added after the initial submission
      required:
      - id
      - name
      - type
      - created_at
      - updated_at
      - is_additional_supporting_document
      title: EorContractsContractIdOffboardingReviewEmployeeSignOffsPostResponsesContentApplicationJsonSchemaDataDocumentsSupportingItems
    ? EorContractsContractIdOffboardingResignationsReviewPtoPostResponsesContentApplicationJsonSchemaDataRequestDataUsedTimeOffTimeOffsItemsTrackingPeriodsItems
    : type: object
      properties:
        used:
          type: number
          format: double
          description: The amount of time off used in this tracking period
        end_date:
          type: string
          format: date-time
          description: The end date of the tracking period
        start_date:
          type: string
          format: date-time
          description: The start date of the tracking period
      required:
      - used
      - end_date
      - start_date
      title: EorContractsContractIdOffboardingResignationsReviewPtoPostResponsesContentApplicationJsonSchemaDataRequestDataUsedTimeOffTimeOffsItemsTrackingPeriodsItems
    EorContractsContractIdOffboardingGetResponsesContentApplicationJsonSchemaErrorsItems:
      type: object
      properties:
        code:
          type: string
          description: Error code of the handler which produced the returned error
        field:
          type: string
          description: The field name where error occurred (null for server errors)
        message:
          type: string
          description: Description of the returned error
      title: EorContractsContractIdOffboardingGetResponsesContentApplicationJsonSchemaErrorsItems
    EorContractsContractIdOffboardingReviewEmployeeSignOffsPostResponsesContentApplicationJsonSchemaErrorsItems:
      type: object
      properties:
        code:
