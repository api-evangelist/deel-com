openapi: 3.2.0
info:
  title: Endpoints Ats API
  version: 1.0.0
  description: API endpoints related to ATS.
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: ATS
  description: API endpoints related to ATS.
paths:
  /ats/candidates/{candidate_id}/notes:
    post:
      operationId: ats_addNoteToACandidate-v2026-01-01
      summary: Add note to a candidate
      description: 'Adds a note to a candidate — the candidate-level counterpart to the application-notes endpoint. Use this when feedback applies to the candidate overall rather than to a single application; the note then stays visible across all of that candidate''s applications.


        **Token scopes**: `ats:write`, `worker:write`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2026-12-29.'
      tags:
      - ATS
      parameters:
      - name: candidate_id
        in: path
        description: Id of the candidate which the note will be added
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/AtsCandidatesCandidateIdNotesPostParametersXBeta'
      responses:
        '201':
          description: Candidate note created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ATS_addNoteToACandidate-v2026-01-01_Response_201'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddNoteToACandidate-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden. ATS is not enabled for this organization or insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddNoteToACandidate-v2026-01-01RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddNoteToACandidate-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/AtsCandidatesCandidateIdNotesPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
  /ats/interviews/{interview_id}/transcript:
    get:
      operationId: ats_getInterviewTranscript-v2026-10-16
      summary: Get an interview transcript
      description: 'Returns the transcript of an interview as a paginated, ordered list of speaker segments. Only returned for organizations with Interview Assistant enabled, for interviews where the candidate consented to recording and transcription.


        **Token scopes**: `ats:read`, `worker:read`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2027-01-16.'
      tags:
      - ATS
      parameters:
      - name: interview_id
        in: path
        description: Unique identifier of the interview to retrieve the transcript for.
        required: true
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        description: Pagination cursor returned by a previous response.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of transcript segments to return per page.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/AtsInterviewsInterviewIdTranscriptGetParametersXBeta'
      responses:
        '200':
          description: Paginated list of transcript segments, ordered by the time they were spoken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ATS_getInterviewTranscript-v2026-10-16_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInterviewTranscript-v2026-10-16RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden. ATS is not enabled for this organization or insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInterviewTranscript-v2026-10-16RequestForbiddenError'
        '404':
          description: The interview does not exist, belongs to another organization, or is not visible to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInterviewTranscript-v2026-10-16RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInterviewTranscript-v2026-10-16RequestInternalServerError'
      security:
      - deelToken: []
  /ats/applications/{application_id}/feedbacks:
    get:
      operationId: ats_listApplicationFeedbacks-v2026-07-02
      summary: List feedbacks for an application
      description: 'Retrieves the feedback a hiring panel has recorded against one application''s interviews and evaluations. Use it to pull scorecards into an external reporting, analytics or compliance system, or to decide whether a candidate is ready to advance: only NOT_SUBMITTED is still outstanding, while DISMISSED and REVOKED are resolved outcomes that will never produce a submission and should not be waited on.


        **Token scopes**: `ats:read`, `worker:read`'
      tags:
      - ATS
      parameters:
      - name: application_id
        in: path
        description: Unique identifier of the application to retrieve feedbacks for.
        required: true
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        description: Filter feedbacks by submission status.
        required: false
        schema:
          $ref: '#/components/schemas/AtsApplicationsApplicationIdFeedbacksGetParametersStatus'
      - name: should_hide_sensitive_fields
        in: query
        description: When true, form responses marked as sensitive are omitted from the response. Defaults to true.
        required: false
        schema:
          type: boolean
      - name: cursor
        in: query
        description: Pagination cursor returned by a previous response.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of feedbacks to return per page.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Paginated list of application feedbacks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ATS_listApplicationFeedbacks-v2026-07-02_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListApplicationFeedbacks-v2026-07-02RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden. ATS is not enabled for this organization or insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListApplicationFeedbacks-v2026-07-02RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListApplicationFeedbacks-v2026-07-02RequestInternalServerError'
      security:
      - deelToken: []
  /ats/feedbacks:
    get:
      operationId: ats_listFeedbacks-v2026-09-18
      summary: List interview and evaluation feedback across the organization
      description: 'Use this endpoint to pull organization-wide interview feedback when following up across candidates and jobs — for example, after filtering interviews or applications by stage, call this to see which reviewers still owe feedback (status=NOT_SUBMITTED) or what they recommended, without fetching each application individually.


        **Token scopes**: `ats:read`, `worker:read`'
      tags:
      - ATS
      parameters:
      - name: job_ids
        in: query
        description: Filter feedback by job IDs.
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: application_ids
        in: query
        description: Filter feedback by application IDs.
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: candidate_ids
        in: query
        description: Filter feedback by candidate IDs.
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: reviewer_hris_organization_user_ids
        in: query
        description: Filter feedback by the HRIS organization user IDs of the reviewers (interviewers) who owe or submitted it.
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: interview_plan_stage_ids
        in: query
        description: Filter feedback by the interview plan stage of the activity it belongs to (stage ids from GET /rest/ats/jobs/{job_id}/interview-plan-stages).
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: scheduled_interview_ids
        in: query
        description: Filter feedback by the scheduled interview it was collected for (ids from GET /rest/ats/interviews).
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: status
        in: query
        description: SUBMITTED returns completed scorecards; NOT_SUBMITTED returns feedback still owed by a reviewer.
        required: false
        schema:
          $ref: '#/components/schemas/AtsFeedbacksGetParametersStatus'
      - name: activity_type
        in: query
        description: Filter by the kind of activity the feedback belongs to.
        required: false
        schema:
          $ref: '#/components/schemas/AtsFeedbacksGetParametersActivityType'
      - name: submitted_after
        in: query
        description: Return feedback submitted at or after this ISO 8601 datetime.
        required: false
        schema:
          type: string
          format: date-time
      - name: submitted_before
        in: query
        description: Return feedback submitted at or before this ISO 8601 datetime.
        required: false
        schema:
          type: string
          format: date-time
      - name: updated_after
        in: query
        description: Return feedback updated strictly after this ISO 8601 datetime (incremental sync).
        required: false
        schema:
          type: string
          format: date-time
      - name: include
        in: query
        description: Optional expansions. FORM_RESPONSES embeds the submitted scorecard answers (caps limit at 50).
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/AtsFeedbacksGetParametersIncludeSchemaItems'
      - name: should_hide_sensitive_fields
        in: query
        description: When true (default), form responses marked as sensitive are omitted.
        required: false
        schema:
          type: boolean
      - name: sort_order
        in: query
        description: Order by feedback creation time.
        required: false
        schema:
          $ref: '#/components/schemas/AtsFeedbacksGetParametersSortOrder'
      - name: cursor
        in: query
        description: Pagination cursor returned by a previous response.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of feedback records per page (1-100; 1-50 with include=FORM_RESPONSES).
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Paginated list of feedback records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ATS_listFeedbacks-v2026-09-18_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFeedbacks-v2026-09-18RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden. ATS is not enabled for this organization or insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFeedbacks-v2026-09-18RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFeedbacks-v2026-09-18RequestInternalServerError'
      security:
      - deelToken: []
  /ats/jobs/{job_id}/interview-plan-stages:
    get:
      operationId: ats_listJobInterviewPlanStages-v2026-09-18
      summary: List interview plan stages of a job with pipeline counts
      description: 'Returns the interview plan of a job in pipeline order, with how many applications are in each stage now and how many have ever reached it. Use it to read a pipeline snapshot of the job or to find a stage before filtering `GET /rest/ats/applications` or `GET /rest/ats/interviews` by it. Counts cover only the applications the caller may see.


        **Token scopes**: `ats:read`, `worker:read`'
      tags:
      - ATS
      parameters:
      - name: job_id
        in: path
        description: Job whose interview plan stages to list.
        required: true
        schema:
          type: string
          format: uuid
      - name: include
        in: query
        description: Optional expansions. CURRENT_APPLICATIONS embeds the most recently moved applications currently sitting in each stage.
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/AtsJobsJobIdInterviewPlanStagesGetParametersIncludeSchemaItems'
      - name: applications_per_stage_limit
        in: query
        description: Maximum number of current applications embedded per stage when include=CURRENT_APPLICATIONS (1-25).
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 25
          default: 10
      responses:
        '200':
          description: Interview plan stages with pipeline counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ATS_listJobInterviewPlanStages-v2026-09-18_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListJobInterviewPlanStages-v2026-09-18RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden. ATS is not enabled for this organization or insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListJobInterviewPlanStages-v2026-09-18RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListJobInterviewPlanStages-v2026-09-18RequestInternalServerError'
      security:
      - deelToken: []
  /ats/interviews:
    get:
      operationId: ats_listInterviews-v2026-06-03
      summary: List interviews
      description: 'Lists interviews for review, including who interviewed and whether each took place or was cancelled. By default each application contributes only the interviews of the stage it is in now; filter by applications or interview stages to also get interviews from stages it has already passed. Results are limited to interviews the caller may see.


        **Token scopes**: `ats:read`, `worker:read`'
      tags:
      - ATS
      parameters:
      - name: interviewer_hou_ids
        in: query
        description: Filter interviews by interviewer HRIS organization user IDs.
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: job_ids
        in: query
        description: Filter interviews by job IDs.
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: status
        in: query
        description: Filter interviews by status.
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/AtsInterviewsGetParametersStatusSchemaItems'
      - name: candidate_ids
        in: query
        description: Filter interviews by candidate IDs.
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: application_ids
        in: query
        description: Filter interviews by application IDs. When set, every interview of those applications is returned — past, cancelled and on stages the candidate has already moved past — and results default to latest meeting first.
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: interview_plan_stage_ids
        in: query
        description: Filter interviews by the interview plan stage the interview belongs to (from GET /rest/ats/jobs interview_plan_stages). When set, every interview on those stages is returned regardless of the candidate's current stage, and results default to latest meeting first.
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: date_range_start
        in: query
        description: Lower bound of interview start time (ISO 8601).
        required: false
        schema:
          type: string
          format: date-time
      - name: date_range_end
        in: query
        description: Upper bound of interview start time (ISO 8601).
        required: false
        schema:
          type: string
          format: date-time
      - name: updated_after
        in: query
        description: Return interviews updated strictly after this ISO 8601 datetime (incremental sync).
        required: false
        schema:
          type: string
          format: date-time
      - name: sort_order
        in: query
        description: Order interviews by upcoming-first, newest-first (by creation), oldest-first, or latest-meeting-first (most recent meeting time, for past-interview views).
        required: false
        schema:
          $ref: '#/components/schemas/AtsInterviewsGetParametersSortOrder'
      - name: cursor
        in: query
        description: Pagination cursor returned by a previous response.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of interviews to return per page.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Paginated list of interviews
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ATS_listInterviews-v2026-06-03_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInterviews-v2026-06-03RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden. ATS is not enabled for this organization or insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInterviews-v2026-06-03RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInterviews-v2026-06-03RequestInternalServerError'
      security:
      - deelToken: []
  /ats/openings:
    get:
      operationId: ats_listOpenings-v2026-06-15
      summary: List job openings
      description: 'Lists the headcount openings (requisitions), that is the positions that jobs are hiring for. Use it to review that headcount and to see which hire filled each opening. Callers with restricted access see only the openings they may view.


        **Token scopes**: `ats:read`, `worker:read`'
      tags:
      - ATS
      parameters:
      - name: cursor
        in: query
        description: Pagination cursor returned by a previous response.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of openings to return per page.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: status
        in: query
        description: Filter openings by one or more statuses.
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/AtsOpeningsGetParametersStatusSchemaItems'
      - name: team_ids
        in: query
        description: Filter openings by team IDs.
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: location_ids
        in: query
        description: Filter openings by location IDs.
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: job_ids
        in: query
        description: Filter openings by linked job IDs.
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: tag_ids
        in: query
        description: Filter openings by tag IDs.
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: tag_ids_operator
        in: query
        description: Operator for tag_ids filter. 'ANY' returns openings with at least one matching tag; 'ALL' returns openings with all specified tags. Defaults to 'ANY'.
        required: false
        schema:
          $ref: '#/components/schemas/AtsOpeningsGetParametersTagIdsOperator'
      responses:
        '200':
          description: Paginated list of job openings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ATS_listOpenings-v2026-06-15_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOpenings-v2026-06-15RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden. ATS is not enabled for this organization or insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOpenings-v2026-06-15RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOpenings-v2026-06-15RequestInternalServerError'
      security:
      - deelToken: []
  /ats/hires:
    get:
      operationId: ats_retrieveAListOfAtsHires-v2026-10-01
      summary: Retrieve a list of ATS hires
      description: 'Maps ATS applications to the HRIS profiles they were hired into, oldest change first, with cursor pagination. To poll, set updated_after a few minutes before the updated_at of the last row you read: a row can commit late with an earlier updated_at. Rows then repeat, so upsert by application_id. The feed has inserts and updates only: the hire of a deleted application drops out with no marker, so run a full sync from time to time.


        **Token scopes**: `ats:read`, `worker:read`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2027-01-01.'
      tags:
      - ATS
      parameters:
      - name: cursor
        in: query
        description: Cursor for pagination. Use the next_cursor value from the previous response to get the next page of results.
        required: false
        schema:
          type: string
          maxLength: 1000
      - name: limit
        in: query
        description: Maximum number of records to return per page
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
      - name: updated_after
        in: query
        description: Return only records updated strictly after this timestamp (ISO 8601 format). Use it to poll for changes.
        required: false
        schema:
          type: string
          format: date-time
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/AtsHiresGetParametersXBeta'
      responses:
        '200':
          description: Successfully retrieved hires.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ATS_retrieveAListOfAtsHires-v2026-10-01_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAListOfAtsHires-v2026-10-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden. ATS is not enabled for this organization or insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAListOfAtsHires-v2026-10-01RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
