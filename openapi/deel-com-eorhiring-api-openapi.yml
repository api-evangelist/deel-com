openapi: 3.2.0
info:
  title: Endpoints Eor Hiring API
  version: 1.0.0
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: eorHiring
paths:
  /eor/contract/{oid}/cancel:
    post:
      operationId: eorHiring_cancelContract
      summary: Cancel EOR Contract
      description: 'Cancels the EOR contract identified by oid. The contract must be in an active or pending state to be eligible for cancellation.


        **Token scopes**: `contracts:write`'
      tags:
      - eorHiring
      parameters:
      - name: oid
        in: path
        description: Contract oid
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Contract cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelEorContract-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Contract not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelEorContract-v2026-01-01RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        description: Cancel EOR Contract
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/EorContractOidCancelPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
  /eor/contract/{oid}/delay-onboarding:
    patch:
      operationId: eorHiring_delayOnboarding
      summary: Delay EOR employee onboarding
      description: 'Defers the scheduled onboarding start date for the EOR employee on the specified contract.


        **Token scopes**: `contracts:write`'
      tags:
      - eorHiring
      parameters:
      - name: oid
        in: path
        description: Contract oid
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Employee onboarding delay status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eor-hiring_delayOnboarding_Response_200'
        '400':
          description: Bad Request - Contract not found or invalid status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelayEorEmployeeOnboarding-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        description: Indicates if the employee onboarding is delayed
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/EorContractOidDelayOnboardingPatchRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
  /forms/eor/create-contract/{country_code}:
    get:
      operationId: eorHiring_getCreateContractForm
      summary: Fetch EOR Contract form
      description: 'Retrieves the versioned form definition for creating an EOR contract in the specified country, including fields, validation rules, and conditional logic. The `state` parameter is only required for countries that mandate it.


        **Token scopes**: `forms:read`'
      tags:
      - eorHiring
      parameters:
      - name: country_code
        in: path
        description: Two-letter country code in ISO 3166-1 alpha-2 format
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{2}$
          minLength: 2
          maxLength: 2
      - name: state
        in: query
        description: The selected state code of the contract. This is only required for countries that specify it.
        required: false
        schema:
          type: string
      - name: start_date
        in: query
        description: The selected start date of the contract in ISO 8601 formatted date string.
        required: false
        schema:
          type: string
          format: date
      - name: work_hours_per_week
        in: query
        description: The selected number of work hours per week.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 168
      - name: contract_duration_in_days
        in: query
        description: The contract duration in days for definite contracts.
        required: false
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Successful response containing form configuration data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eor-hiring_getCreateContractForm_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchEorContractForm-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Country not found or EOR not available in the requested country.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchEorContractForm-v2026-01-01RequestNotFoundError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchEorContractForm-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
  /eor/start-date:
    get:
      operationId: eorHiring_getStartDate
      summary: Fetch Start Date for EOR Contracts
      description: 'Returns the earliest allowed start date for a new EOR contract quote based on the specified employment country, nationality, and visa requirements. The response also includes payroll timing parameters — `start_date_buffer`, `first_payroll_lock`, and `is_same_month_payment_country` — that govern when the contract can take effect.


        **Token scopes**: `contracts:read`'
      tags:
      - eorHiring
      parameters:
      - name: employment_country
        in: query
        description: Employment country in ISO 3166-1 alpha-2 format
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{2}$
      - name: employee_nationality
        in: query
        description: Employee nationality in ISO 3166-1 alpha-2 format
        required: false
        schema:
          type: string
          pattern: ^[A-Z]{2}$
      - name: work_visa
        in: query
        description: Whether a work visa is required
        required: false
        schema:
          type: boolean
      - name: team_id
        in: query
        description: Team ID
        required: true
        schema:
          type: string
      - name: legal_entity_id
        in: query
        description: Legal entity ID
        required: false
        schema:
          type: string
      - name: employment_state
        in: query
        description: State or province of employment
        required: false
        schema:
          type: string
      - name: special_job_id
        in: query
        description: Special job ID (if applicable)
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Start date details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eor-hiring_getStartDate_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchStartDateForEorContracts-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /eor/additional-costs/{country}:
    get:
      operationId: eorHiring_getAdditionalCosts
      summary: Get EOR Additional Costs
      description: 'Returns the allowances and non-statutory additional costs available for inclusion in an EOR contract quote for the specified country.


        **Token scopes**: `contracts:read`'
      tags:
      - eorHiring
      parameters:
      - name: country
        in: path
        description: The two-letter ISO code of the country for which to retrieve the EOR additional costs.
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{2}$
          minLength: 2
          maxLength: 2
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eor-hiring_getAdditionalCosts_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEorAdditionalCosts-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /eor/benefits:
    get:
      operationId: eorHiring_getBenefits
      summary: Retrieve Benefits by Country
      description: 'Returns benefits available in a specific country, scoped by work visa requirement, weekly work hours, employment type, team, and legal entity.


        **Token scopes**: `benefits:read`'
      tags:
      - eorHiring
      parameters:
      - name: country_code
        in: query
        description: Country code.
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{2}$
          minLength: 2
          maxLength: 2
      - name: work_visa
        in: query
        description: Indicates if work visa is required.
        required: true
        schema:
          type: boolean
      - name: work_hours_per_week
        in: query
        description: Working hours per week
        required: true
        schema:
          type: number
          format: double
          minimum: 0
          maximum: 168
      - name: employment_type
        in: query
        description: Type of employment
        required: true
        schema:
          $ref: '#/components/schemas/EorBenefitsGetParametersEmploymentType'
      - name: team_id
        in: query
        description: The ID of the team the worker belongs to.
        required: true
        schema:
          type: string
          format: uuid
      - name: legal_entity_id
        in: query
        description: The ID of the legal entity.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eor-hiring_getBenefits_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveBenefitsByCountry-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /eor/validations/{country_code}:
    get:
      operationId: eorHiring_getEORHiringGuideByCountry
      summary: Retrieve detailed hiring guide for a country
      description: 'Returns country-specific hiring guide data — including salary requirements, holidays, probation terms, health insurance, and currency — for use in creating and validating EOR contract quotes.


        **Token scopes**: `contracts:read`'
      tags:
      - eorHiring
      parameters:
      - name: country_code
        in: path
        description: The two-letter ISO code of the country for which to retrieve the hiring guide.
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{2}$
          minLength: 2
          maxLength: 2
      responses:
        '200':
          description: The hiring guide data was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eor-hiring_getEORHiringGuideByCountry_Response_200'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /eor/contracts/{contract_id}/documents/{type}/sign:
    post:
      operationId: eorHiring_signContractDocument
      summary: Sign EOR contract document
      description: 'Applies a signature and job title to a specified EOR contract document. Currently only the `FRAMEWORK_AGREEMENT` document type is supported.


        **Token scopes**: `contracts:write`'
      tags:
      - eorHiring
      parameters:
      - name: contract_id
        in: path
        description: EOR contract ID
        required: true
        schema:
          type: string
      - name: type
        in: path
        description: The type of document. Currently only FRAMEWORK_AGREEMENT is supported.
        required: true
        schema:
          $ref: '#/components/schemas/EorContractsContractIdDocumentsTypeSignPostParametersType'
      responses:
        '200':
          description: The document has been signed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eor-hiring_signContractDocument_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignEorContractDocument-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/EorContractsContractIdDocumentsTypeSignPostRequestBodyContentApplicationJsonSchemaData'
      security:
      - deelToken: []
  /eor/contracts/{contract_id}/employee-information:
    patch:
      operationId: eorHiring_updateContractEmployeeInformation
      summary: Update Employee Information for EOR Contract
      description: 'Applies partial updates to employee information on an EOR contract. Only accepts documented fields — any undocumented fields will cause a validation error. Updates are permitted only when the contract has a status of `new`, `under_review`, `waiting_for_client_sign`, `waiting_for_eor_sign`, `waiting_for_employee_contract`, `waiting_for_employee_sign`, `awaiting_deposit_payment`, or `rejected`.


        **Token scopes**: `contracts:write`'
      tags:
      - eorHiring
      parameters:
      - name: contract_id
        in: path
        description: The unique identifier of the employee contract.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Employee information updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eor-hiring_updateContractEmployeeInformation_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateEmployeeInformationForEorContract-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Contract not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateEmployeeInformationForEorContract-v2026-01-01RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateEmployeeInformationForEorContract-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/EorContractsContractIdEmployeeInformationPatchRequestBodyContentApplicationJsonSchemaData'
      security:
      - deelToken: []
components:
  schemas:
    ? FormsEorCreateContractCountryCodeGetResponsesContentApplicationJsonSchemaDataPagesItemsSectionsItemsQuestionsItemsDateLimitation
    : type: string
      enum:
      - BLOCK_PAST
      - BLOCK_FUTURE
      description: Limits date selection (e.g., blocking past dates). Will always be 'BLOCK_PAST' for now.
      title: FormsEorCreateContractCountryCodeGetResponsesContentApplicationJsonSchemaDataPagesItemsSectionsItemsQuestionsItemsDateLimitation
    eor-hiring_delayOnboarding_Response_200:
      type: object
      properties:
        success:
          type: boolean
          description: Operation success status
        contractOid:
          type: string
          description: Contract OID
        is_employee_onboarding_delayed:
          type: boolean
          description: Current onboarding delay status
      required:
      - success
      title: eor-hiring_delayOnboarding_Response_200
    eor-hiring_getBenefits_Response_200:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EorBenefitsGetResponsesContentApplicationJsonSchemaDataItems'
      required:
      - data
      title: eor-hiring_getBenefits_Response_200
    EorContractOidCancelPostRequestBodyContentApplicationJsonSchemaDataCancellationReason:
      type: string
      enum:
      - INTERNAL_DECISION
      - UNSATISFACTORY_EXPERIENCE
      - EXPLORING_ALTERNATIVE
      - OFFER_CHANGES
      description: Reason for contract termination
      title: EorContractOidCancelPostRequestBodyContentApplicationJsonSchemaDataCancellationReason
    EorContractsContractIdEmployeeInformationPatchResponsesContentApplicationJsonSchemaData:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the employee contract.
        status:
          $ref: '#/components/schemas/EorContractsContractIdEmployeeInformationPatchResponsesContentApplicationJsonSchemaDataStatus'
          description: Current status of the contract
        scope_of_work:
          type: string
          description: Scope of work description.
        employee_last_name:
          type: string
          description: The last name of the contract employee.
        employee_first_name:
          type: string
          description: The first name of the contract employee.
      required:
      - id
      - status
      title: EorContractsContractIdEmployeeInformationPatchResponsesContentApplicationJsonSchemaData
    ? FormsEorCreateContractCountryCodeGetResponsesContentApplicationJsonSchemaDataPagesItemsSectionsItemsQuestionsItemsAdditionalInfoOneOf5NoticePeriodSettingsItemsNoticePeriodAfterProbationTimeUnit
    : type: string
      enum:
      - DAY
      - WEEK
      - MONTH
      description: Time unit for the notice period values.
      title: FormsEorCreateContractCountryCodeGetResponsesContentApplicationJsonSchemaDataPagesItemsSectionsItemsQuestionsItemsAdditionalInfoOneOf5NoticePeriodSettingsItemsNoticePeriodAfterProbationTimeUnit
    ? FormsEorCreateContractCountryCodeGetResponsesContentApplicationJsonSchemaDataPagesItemsSectionsItemsQuestionsItemsRulesItemsMaxValue
    : oneOf:
      - type: string
      - type: number
        format: double
      description: Maximum value allowed.
      title: FormsEorCreateContractCountryCodeGetResponsesContentApplicationJsonSchemaDataPagesItemsSectionsItemsQuestionsItemsRulesItemsMaxValue
    EorBenefitsGetResponsesContentApplicationJsonSchemaErrorsItems:
      type: object
      properties:
        path:
          type: string
          description: The JSON path where input validation failed
        message:
          type: string
          description: A description of the returned error
      title: EorBenefitsGetResponsesContentApplicationJsonSchemaErrorsItems
    UpdateEmployeeInformationForEorContract-v2026-01-01RequestInternalServerError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/EorContractsContractIdEmployeeInformationPatchResponsesContentApplicationJsonSchemaErrorsItems'
      title: UpdateEmployeeInformationForEorContract-v2026-01-01RequestInternalServerError
    FormsEorCreateContractCountryCodeGetResponsesContentApplicationJsonSchemaDataPagesItemsSectionsItemsQuestionsItemsType:
      type: string
      enum:
      - FreeText
      - Paragraph
      - SingleSelection
      - MultiSelection
      - Address
      - PhoneNumber
      - DocumentUpload
      - Number
      - Dropdown
      - DatePicker
      - Email
      - CustomDropdown
      - PresetDropdown
      - Nested
      description: Type of the question.
      title: FormsEorCreateContractCountryCodeGetResponsesContentApplicationJsonSchemaDataPagesItemsSectionsItemsQuestionsItemsType
    FetchStartDateForEorContracts-v2026-01-01RequestBadRequestError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/EorStartDateGetResponsesContentApplicationJsonSchemaErrorsItems'
        request:
          $ref: '#/components/schemas/EorStartDateGetResponsesContentApplicationJsonSchemaRequest'
      title: FetchStartDateForEorContracts-v2026-01-01RequestBadRequestError
    EorBenefitsGetResponsesContentApplicationJsonSchemaDataItemsProvidersItemsPlansItemsAttachmentsItems:
      type: object
      properties:
        id:
          type: string
          description: The unique ID of the attachment.
        url:
          type: string
          description: The url of the attachment.
        label:
          type: string
          description: The label of the attachment.
      required:
      - id
      - url
      - label
      title: EorBenefitsGetResponsesContentApplicationJsonSchemaDataItemsProvidersItemsPlansItemsAttachmentsItems
    ? FormsEorCreateContractCountryCodeGetResponsesContentApplicationJsonSchemaDataPagesItemsSectionsItemsQuestionsItemsRulesItemsOptionsItems
    : type: object
      properties:
        title:
          type: string
          description: Display text for the option.
        value:
          type:
          - string
          - 'null'
          description: Value associated with the option.
      title: FormsEorCreateContractCountryCodeGetResponsesContentApplicationJsonSchemaDataPagesItemsSectionsItemsQuestionsItemsRulesItemsOptionsItems
    EorStartDateGetResponsesContentApplicationJsonSchemaRequest:
      type: object
      properties:
        url:
          type: string
          description: The relative URL of the failed request
        code:
          type: number
          format: double
          description: The code of the source handler which produced the returned error
        docs:
          type: string
          description: A link to the official documentation for the requested endpoint resource
        method:
          type: string
          description: The HTTP method of the failed request
        source:
          type: string
          description: The source handler which produced the returned error
        status:
          type: number
          format: double
          description: The status code of the response
        api_req_id:
          type: string
          description: The request ID of the failed request
      title: EorStartDateGetResponsesContentApplicationJsonSchemaRequest
    eor-hiring_getAdditionalCosts_Response_200:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/EorAdditionalCostsCountryGetResponsesContentApplicationJsonSchemaData'
      title: eor-hiring_getAdditionalCosts_Response_200
    eor-hiring_getStartDate_Response_200:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/EorStartDateGetResponsesContentApplicationJsonSchemaData'
      required:
      - data
      title: eor-hiring_getStartDate_Response_200
    FetchEorContractForm-v2026-01-01RequestInternalServerError:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/FormsEorCreateContractCountryCodeGetResponsesContentApplicationJsonSchemaError'
      title: FetchEorContractForm-v2026-01-01RequestInternalServerError
    ? FormsEorCreateContractCountryCodeGetResponsesContentApplicationJsonSchemaDataPagesItemsSectionsItemsQuestionsItemsAdditionalInfo5
    : type: object
      properties:
        notice_period_settings:
