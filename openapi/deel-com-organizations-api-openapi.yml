components:
  schemas:
    AddChildOrganizationAdmins-v2026-10-12RequestInternalServerError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationsChildrenAdminsPostResponsesContentApplicationJsonSchemaErrorsItems'
      required:
      - errors
      title: AddChildOrganizationAdmins-v2026-10-12RequestInternalServerError
    OrganizationsDealRegistrationsPostResponsesContentApplicationJsonSchemaErrorsItems:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable error code.
        message:
          type: string
          description: Human-readable explanation of the error.
      required:
      - code
      - message
      title: OrganizationsDealRegistrationsPostResponsesContentApplicationJsonSchemaErrorsItems
    OrganizationsChildrenAdminsPostResponsesContentApplicationJsonSchemaDataItemsItems:
      type: object
      properties:
        email:
          type: string
          format: email
          description: The email of the admin, as submitted.
        status:
          $ref: '#/components/schemas/OrganizationsChildrenAdminsPostResponsesContentApplicationJsonSchemaDataItemsItemsStatus'
          description: 'The outcome for the pair. ADDED means the person is now an admin of the child organization: a person who was not a member is added with the admin role and receives the invitation email, and a member with another role is made an admin. ALREADY_ADMIN means the person already was, and nothing changed or was sent. FAILED means the pair could not be processed; the other pairs are unaffected and the same request can be retried.'
        child_org_id:
          type: string
          format: uuid
          description: The public id of the child organization.
      required:
      - email
      - status
      - child_org_id
      title: OrganizationsChildrenAdminsPostResponsesContentApplicationJsonSchemaDataItemsItems
    GetTeams-v2026-01-01RequestUnauthorizedError:
      type: object
      properties:
        error:
          type: string
          description: An error message indicating that the authentication failed.
      title: GetTeams-v2026-01-01RequestUnauthorizedError
    OrganizationsChildrenPostResponsesContentApplicationJsonSchemaData:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the created child organization.
        token:
          type: string
          description: The API token generated for the created child organization
        created_at:
          type: string
          format: date-time
          description: When the created child organization was created (ISO 8601 format)
        updated_at:
          type: string
          format: date-time
          description: When the created child organization was updated for the last time (ISO 8601 format)
      required:
      - id
      - token
      - created_at
      - updated_at
      title: OrganizationsChildrenPostResponsesContentApplicationJsonSchemaData
    OrganizationsChildrenAdminsPostResponsesContentApplicationJsonSchemaDataItemsItemsStatus:
      type: string
      enum:
      - ADDED
      - ALREADY_ADMIN
      - FAILED
      description: 'The outcome for the pair. ADDED means the person is now an admin of the child organization: a person who was not a member is added with the admin role and receives the invitation email, and a member with another role is made an admin. ALREADY_ADMIN means the person already was, and nothing changed or was sent. FAILED means the pair could not be processed; the other pairs are unaffected and the same request can be retried.'
      title: OrganizationsChildrenAdminsPostResponsesContentApplicationJsonSchemaDataItemsItemsStatus
    Organizations_retrieveWorkingLocations-v2026-01-01_Response_200:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkingLocationsGetResponsesContentApplicationJsonSchemaDataItems'
      required:
      - data
      title: Organizations_retrieveWorkingLocations-v2026-01-01_Response_200
    Organizations_UpdateOrganizationRole-v2026-01-01_Response_200:
      type: object
      properties:
        id:
