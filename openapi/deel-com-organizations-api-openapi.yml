              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Unauthorized. The request is missing authentication credentials or the credentials provided are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrganizations-v2026-01-01RequestUnauthorizedError'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Organization not found. The current organization associated with the authentication token could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrganizations-v2026-01-01RequestNotFoundError'
