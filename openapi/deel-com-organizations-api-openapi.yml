openapi: 3.2.0
info:
  title: Endpoints Organizations API
  version: 1.0.0
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: Organizations
paths:
  /organizations/children/admins:
    post:
      operationId: organizations_addChildOrganizationAdmins-v2026-10-12
      summary: Add admins to child organizations
      description: 'Add multiple admins to child organizations in one call (e.g., when a new team member joins). Provide the admins and target child organizations: people who are not members yet are invited by email, and existing members are made admins. People who are already admins are left unchanged and get no new invitation. The response shows results for each admin-organization pair.


        **Token scopes**: `organizations:write`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2027-01-12.'
      tags:
      - Organizations
      parameters:
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/OrganizationsChildrenAdminsPostParametersXBeta'
      responses:
        '200':
          description: The outcome for every admin and child organization pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organizations_addChildOrganizationAdmins-v2026-10-12_Response_200'
        '400':
          description: 'Bad request. Nothing is written. Codes: VALIDATION_ERROR (the request body failed validation, for example a malformed email, an email or child organization id listed twice, or an empty list; the error item also carries a details object naming the offending key), GENERIC_ERROR (the number of admins multiplied by the number of child organizations is above 100). The API gateway rejects a schema-invalid request body before it reaches Deel; each error item of that response carries a path field and no code.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddChildOrganizationAdmins-v2026-10-12RequestBadRequestError'
        '401':
          description: Unauthorized. The request token is missing or invalid. The API gateway rejects an unauthenticated call before it reaches Deel; a call that reaches Deel without a valid session is rejected by the access middleware, whose error item carries a message and no code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddChildOrganizationAdmins-v2026-10-12RequestUnauthorizedError'
        '403':
          description: Forbidden. The caller lacks the permission to manage child organizations, or at least one submitted id is not a direct child organization of the authenticated organization. The message lists every rejected id. Nothing is written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddChildOrganizationAdmins-v2026-10-12RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '429':
          description: Too many requests. Each partner organization can call this endpoint at most 20 times per hour, with up to 100 admin and child organization pairs per call. Nothing is written; retry once the hour has passed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddChildOrganizationAdmins-v2026-10-12RequestTooManyRequestsError'
        '500':
          description: An unexpected error occurred before any admin and child organization pair was processed. Nothing is written, and the same request can be retried.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddChildOrganizationAdmins-v2026-10-12RequestInternalServerError'
      requestBody:
        description: The people to add as admins and the child organizations to add them to.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/OrganizationsChildrenAdminsPostRequestBodyContentApplicationJsonSchemaData'
                  description: The request payload.
              required:
              - data
      security:
      - deelToken: []
  /organizations/deal-registrations:
    post:
      operationId: organizations_createDealRegistration-v2026-09-30
      summary: Create a deal registration
      description: 'Registers a prospective end client against the authenticated partner organization. An approved registration protects the partner claim on that client for a fixed period. It stops Deel and other partners from pursuing the same account.


        **Token scopes**: `organizations:write`


        **Beta**: this version requires the `X-Beta: true` request header and its contract may change before it is promoted to stable. It is scheduled to become stable on 2026-12-30.'
      tags:
      - Organizations
      parameters:
      - name: X-Beta
        in: header
        description: Opts in to the beta version of this endpoint. Must be `true`.
        required: true
        schema:
          $ref: '#/components/schemas/OrganizationsDealRegistrationsPostParametersXBeta'
      responses:
        '200':
          description: The deal registration outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organizations_createDealRegistration-v2026-09-30_Response_200'
        '400':
          description: 'Bad request. Codes: VALIDATION_ERROR (the request body failed validation; the error item also carries a details object naming the offending key), GENERIC_ERROR (the submitted domain could not be normalised, or the authenticated organization is not set up for deal registration). The API gateway rejects a schema-invalid request body before it reaches Deel; each error item of that response carries a path field and no code, and the body also carries a request object that describes the failed call.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDealRegistration-v2026-09-30RequestBadRequestError'
        '401':
          description: Unauthorized. The request token is missing or invalid. The API gateway rejects an unauthenticated call before it reaches Deel; a call that reaches Deel without a valid session is rejected by the access middleware, whose error item carries a message and no code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDealRegistration-v2026-09-30RequestUnauthorizedError'
        '403':
          description: Deal registration is not enabled for the authenticated organization, or the caller lacks the required permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDealRegistration-v2026-09-30RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '429':
          description: The caller exceeded the deal registration rate limit for its organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDealRegistration-v2026-09-30RequestTooManyRequestsError'
        '500':
          description: An unexpected error occurred. The outcome is not confirmed. Retry the same payload — retries are idempotent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDealRegistration-v2026-09-30RequestInternalServerError'
      requestBody:
        description: The end client the partner wants to register.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/OrganizationsDealRegistrationsPostRequestBodyContentApplicationJsonSchemaData'
                  description: The request payload.
              required:
              - data
      security:
      - deelToken: []
  /organizations/children/{child_organization_id}/session:
    post:
      operationId: organizations_createChildOrgSessionToken-v2026-07-14
      summary: Create a session token for a child organization
      description: 'Issues a short-lived session token (valid 6 hours) for a child organisation. If an active session token with more than one hour of remaining validity already exists, that token is returned. Otherwise the prior session token is invalidated and a new 6-hour token is issued. Session tokens do not affect the child organisation’s original permanent token.


        **Token scopes**: `organizations:write`'
      tags:
      - Organizations
      parameters:
      - name: child_organization_id
        in: path
        description: The public UUID of the child organisation for which to issue a session token.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Session token issued successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organizations_createChildOrgSessionToken-v2026-07-14_Response_201'
        '400':
          description: Bad Request. The request was malformed or failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateChildOrgSessionToken-v2026-07-14RequestBadRequestError'
        '401':
          description: Unauthorized. Authentication credentials were missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateChildOrgSessionToken-v2026-07-14RequestUnauthorizedError'
        '403':
          description: Forbidden. The caller does not have the required scope or permission to access this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateChildOrgSessionToken-v2026-07-14RequestForbiddenError'
        '404':
          description: Not Found. The child organisation does not exist or is missing a service account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateChildOrgSessionToken-v2026-07-14RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /organizations/children:
    post:
      operationId: organizations_createOrganizationChild
      summary: Create child organization
      description: 'Creates a child organization under the authenticated parent organization. Use it to provision child organizations from your own systems instead of the Partner Portal create form. The `token` field in the response holds the child organization''s API token. It is returned only once and cannot be retrieved later, so store it on receipt.


        **Token scopes**: `organizations:write`'
      tags:
      - Organizations
      responses:
        '201':
          description: Operation successful. The child organization was created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/organizations_createOrganizationChild_Response_201'
        '400':
          description: Bad request. The request body failed validation, admin_email or a parent_admin_emails entry is not an admin of the parent organization, parent_admin_emails or child_admins is sent while multiple admins are not enabled for the parent organization, or the parent organization cannot create child organizations. When the API gateway rejects the request body before it reaches Deel, each error item carries a path field instead of code, and the body also carries a request object that describes the failed call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateChildOrganization-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '409':
          description: Conflict - an organization with this name is currently being created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateChildOrganization-v2026-01-01RequestConflictError'
        '429':
          description: Too Many Requests - retry limit exceeded for creating this organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateChildOrganization-v2026-01-01RequestTooManyRequestsError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateChildOrganization-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/OrganizationsChildrenPostRequestBodyContentApplicationJsonSchemaData'
                  description: The request payload.
              required:
              - data
      security:
      - deelToken: []
