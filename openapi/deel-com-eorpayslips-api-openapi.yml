paths:
  /eor/workers/{worker_id}/payslips:
    get:
      operationId: eorPayslips_getWorkerPayslips
      summary: Retrieve employee payslip records
      description: 'Returns a list of payslip records for the specified worker.


        **Token scopes**: `payslips:read`'
      tags:
      - eorPayslips
      parameters:
      - name: worker_id
        in: path
        description: The ID of the worker whose payslips are being retrieved.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Payslip records successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eor-payslips_getWorkerPayslips_Response_200'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
