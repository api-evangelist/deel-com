        max_amount:
          type:
          - number
          - 'null'
          format: double
          description: Maximum compensation amount
        min_amount:
          type:
          - number
          - 'null'
          format: double
          description: Minimum compensation amount
        currency_iso_code:
          type: string
          description: Currency ISO code for the compensation
      required:
      - id
      - currency_iso_code
      description: Compensation information for the job
      title: AtsJobPostingsJobPostingIdGetResponsesContentApplicationJsonSchemaDataJobCompensation
    AtsJobPostingsJobPostingIdGetResponsesContentApplicationJsonSchemaErrorsItems:
