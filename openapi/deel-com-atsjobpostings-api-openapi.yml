openapi: 3.2.0
info:
  title: Endpoints Ats Job Postings API
  version: 1.0.0
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: atsJobPostings
paths:
  /ats/job-boards/{job_board_id}/job-postings:
    get:
      operationId: atsJobPostings_retrieveAListOfAtsJobPostings
      summary: Retrieve a list of ATS job postings
      description: 'Returns job postings for a specific job board, including publication status and nested job details, to monitor active postings on that board integration.


        **Token scopes**: `ats:read`, `worker:read`'
      tags:
      - atsJobPostings
      parameters:
      - name: job_board_id
        in: path
        description: Job Board ID must be a valid UUID
        required: true
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        description: The cursor for pagination (optional)
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of records returned in one response (optional)
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ats-job-postings_retrieveAListOfAtsJobPostings_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAListOfAtsJobPostings-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden. ATS is not enabled for this organization or insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAListOfAtsJobPostings-v2026-01-01RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAListOfAtsJobPostings-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
  /ats/job-postings/{job_posting_id}:
    get:
      operationId: atsJobPostings_retrieveAtsJobPosting
      summary: Retrieve ATS job posting
      description: 'Look up a specific job posting when you have its ID. Retrieves the complete posting details including publication status across all job boards, associated job information, and application form configuration. Use the list endpoint for discovery and filtering.


        **Token scopes**: `ats:read`, `worker:read`'
      tags:
      - atsJobPostings
      parameters:
      - name: job_posting_id
        in: path
        description: Unique identifier of the job posting to retrieve
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ats-job-postings_retrieveAtsJobPosting_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAtsJobPosting-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden. ATS is not enabled for this organization or insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAtsJobPosting-v2026-01-01RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAtsJobPosting-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
  /ats/job-postings:
    get:
      operationId: atsJobPostings_retrieveAtsJobPostings-v2026-04-10
      summary: Retrieve ATS job postings
      description: 'List job postings across your organization, optionally filtered by job board or job ID. Omit filters to retrieve all postings; use the job-board-scoped endpoint instead for queries by board alone.


        **Token scopes**: `ats:read`'
      tags:
      - atsJobPostings
      parameters:
      - name: job_board_id
        in: query
        description: Job board to list postings from (UUID).
        required: false
        schema:
          type: string
          format: uuid
      - name: job_id
        in: query
        description: When set, only postings for this job are returned (UUID).
        required: false
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        description: Opaque cursor for pagination. Use the value from next_cursor of the previous response to fetch the next page.
        required: false
        schema:
          type: string
          maxLength: 1000
      - name: limit
        in: query
        description: 'Maximum number of job postings to return per page (min: 1, max: 100).'
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Successful operation. Returns job postings for the requested job board (and optional job filter), with nested job details and publication state per board.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ats-job-postings_retrieveAtsJobPostings-v2026-04-10_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAtsJobPostings-v2026-04-10RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden. ATS is not enabled for this organization or insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAtsJobPostings-v2026-04-10RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAtsJobPostings-v2026-04-10RequestInternalServerError'
      security:
      - deelToken: []
components:
  schemas:
    AtsJobPostingsJobPostingIdGetResponsesContentApplicationJsonSchemaDataJobJobDepartmentsItemsDepartment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Department identifier.
        name:
          type: string
          maxLength: 100
          description: Display name of the department.
      title: AtsJobPostingsJobPostingIdGetResponsesContentApplicationJsonSchemaDataJobJobDepartmentsItemsDepartment
    AtsJobPostingsJobPostingIdGetResponsesContentApplicationJsonSchemaDataJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the job
        job_teams:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AtsJobPostingsJobPostingIdGetResponsesContentApplicationJsonSchemaDataJobJobTeamsItems'
          description: Teams associated with the job
        compensation:
          oneOf:
          - $ref: '#/components/schemas/AtsJobPostingsJobPostingIdGetResponsesContentApplicationJsonSchemaDataJobCompensation'
          - type: 'null'
          description: Compensation information for the job
        job_locations:
          type: array
          items:
            $ref: '#/components/schemas/AtsJobPostingsJobPostingIdGetResponsesContentApplicationJsonSchemaDataJobJobLocationsItems'
          description: Locations associated with the job
        job_departments:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AtsJobPostingsJobPostingIdGetResponsesContentApplicationJsonSchemaDataJobJobDepartmentsItems'
          description: Departments associated with the job
        job_employment_types:
          type: array
          items:
            $ref: '#/components/schemas/AtsJobPostingsJobPostingIdGetResponsesContentApplicationJsonSchemaDataJobJobEmploymentTypesItems'
          description: Employment types associated with the job
      required:
      - id
      - compensation
      - job_locations
      - job_employment_types
      description: Associated job information
      title: AtsJobPostingsJobPostingIdGetResponsesContentApplicationJsonSchemaDataJob
    AtsJobPostingsGetResponsesContentApplicationJsonSchemaDataItems:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the job posting
        job:
          $ref: '#/components/schemas/AtsJobPostingsGetResponsesContentApplicationJsonSchemaDataItemsJob'
          description: Associated job information
        title:
          type: string
          maxLength: 200
          description: Job posting title
        job_id:
          type: string
          format: uuid
          description: Identifier of the underlying job this posting belongs to.
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
        publications:
          type: array
          items:
            $ref: '#/components/schemas/AtsJobPostingsGetResponsesContentApplicationJsonSchemaDataItemsPublicationsItems'
          description: Publication rows for this posting, one per job board integration, with current state.
        application_form:
          oneOf:
          - $ref: '#/components/schemas/AtsJobPostingsGetResponsesContentApplicationJsonSchemaDataItemsApplicationForm'
          - type: 'null'
          description: Application form assigned to the job posting
        richtext_description:
          type:
          - string
          - 'null'
          description: Rich text description of the job posting
        is_compensation_visible:
          type: boolean
          description: Indicates if compensation details are visible to candidates
      required:
      - id
      - job
      - title
      - job_id
      - created_at
      - updated_at
      - publications
      - richtext_description
      - is_compensation_visible
      description: Job posting with nested job details and publication status.
      title: AtsJobPostingsGetResponsesContentApplicationJsonSchemaDataItems
    AtsJobBoardsJobBoardIdJobPostingsGetResponsesContentApplicationJsonSchemaDataItemsJobJobDepartmentsItems:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Job-department association row identifier.
        department:
          oneOf:
          - $ref: '#/components/schemas/AtsJobBoardsJobBoardIdJobPostingsGetResponsesContentApplicationJsonSchemaDataItemsJobJobDepartmentsItemsDepartment'
          - type: 'null'
      required:
      - id
      title: AtsJobBoardsJobBoardIdJobPostingsGetResponsesContentApplicationJsonSchemaDataItemsJobJobDepartmentsItems
    AtsJobPostingsGetResponsesContentApplicationJsonSchemaDataItemsJobJobEmploymentTypesItemsEmploymentType:
      type: object
      properties:
        id:
