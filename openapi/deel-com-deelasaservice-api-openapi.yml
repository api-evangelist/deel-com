paths:
  /daas/payslips:
    get:
      operationId: deelAsAService_getEorEmployeePayslips-v2026-01-01
      summary: Get list of payslips for an EOR employee
      description: 'Returns all payslips for an EOR employee.


        **Token scopes**: `worker:read`'
      tags:
      - deelAsAService
      responses:
        '200':
          description: Payslip records successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deel_As_a_Service_getEorEmployeePayslips-v2026-01-01_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /daas/banks/{bank_id}:
    patch:
      operationId: deelAsAService_patchEORBankAccount-v2026-01-01
      summary: Modify bank account for an EOR employee
      description: 'Applies a partial update to the bank account details for an EOR employee. The request body accepts an array of field-level updates.


        **Token scopes**: `worker:write`'
      tags:
      - deelAsAService
      parameters:
      - name: bank_id
        in: path
        description: Unique identifier for a bank in UUID format.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deel_As_a_Service_patchEORBankAccount-v2026-01-01_Response_201'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        description: Bank Account object that needs to be modified
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/DaasBanksBankIdPatchRequestBodyContentApplicationJsonSchemaDataItems'
                  description: Array of key value properties of bank account
              required:
              - data
      security:
      - deelToken: []
