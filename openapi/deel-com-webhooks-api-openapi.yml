openapi: 3.2.0
info:
  title: Endpoints Webhooks API
  version: 1.0.0
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: Webhooks
paths:
  /webhooks:
    post:
      operationId: webhooks_createWebhook
      summary: Create a webhook
      description: 'Creates a new webhook subscription with the specified URL, events, and configuration. Returns the created webhook, including its signing key for verifying incoming event payloads.


        **Token scopes**: `webhooks:write`'
      tags:
      - Webhooks
      responses:
        '201':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webhooks_createWebhook_Response_201'
        '400':
          description: Bad Request. The request could not be understood or was missing required parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWebhook-v2026-01-01RequestBadRequestError'
        '401':
          description: Unauthorized. Authentication credentials were missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWebhook-v2026-01-01RequestUnauthorizedError'
        '403':
          description: Forbidden. You do not have permission to access this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWebhook-v2026-01-01RequestForbiddenError'
        '404':
          description: Not Found. The requested resource could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWebhook-v2026-01-01RequestNotFoundError'
        '405':
          description: Method Not Allowed. The HTTP method is not supported for this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWebhook-v2026-01-01RequestMethodNotAllowedError'
        '429':
          description: Too Many Requests. The rate limit has been exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWebhook-v2026-01-01RequestTooManyRequestsError'
        '500':
          description: Internal Server Error. An unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWebhook-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: Endpoint to receive webhook.
                name:
                  type:
                  - string
                  - 'null'
                  description: Webhook subscription name.
                events:
                  type: array
                  items:
                    type: string
                  description: The list of events to enable for this subscription.
                status:
                  $ref: '#/components/schemas/WebhooksPostRequestBodyContentApplicationJsonSchemaStatus'
                  description: Status of webhook.
                api_version:
                  type: string
                  default: v2
                  description: Deel API version. Only v2 is accepted.
                description:
                  type:
                  - string
                  - 'null'
                  description: Webhook subscription description.
                signing_key:
                  type:
                  - string
                  - 'null'
                  minLength: 32
                  maxLength: 128
                  description: The webhook's signing key, used to generate webhook signatures. Auto-generated if omitted.
                include_child_orgs:
                  type:
                  - boolean
                  - 'null'
                  description: When true, the webhook will also receive events from child organizations.
              required:
              - url
              - name
              - events
              - status
              - api_version
              - description
      security:
      - deelToken: []
    get:
      operationId: webhooks_getWebhooks
      summary: List webhooks
      description: 'Lists every webhook subscription configured for the organization. Use this to find the id of a specific subscription before retrieving, updating, or deleting it, or to audit which events are currently wired up.


        **Token scopes**: `webhooks:read`'
      tags:
      - Webhooks
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webhooks_getWebhooks_Response_200'
        '400':
          description: Bad Request. The request could not be understood or was missing required parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllWebhooks-v2026-01-01RequestBadRequestError'
        '401':
          description: Unauthorized. Authentication credentials were missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllWebhooks-v2026-01-01RequestUnauthorizedError'
        '403':
          description: Forbidden. You do not have permission to access this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllWebhooks-v2026-01-01RequestForbiddenError'
        '404':
          description: Not Found. The requested resource could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllWebhooks-v2026-01-01RequestNotFoundError'
        '405':
          description: Method Not Allowed. The HTTP method is not supported for this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllWebhooks-v2026-01-01RequestMethodNotAllowedError'
        '429':
          description: Too Many Requests. The rate limit has been exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllWebhooks-v2026-01-01RequestTooManyRequestsError'
        '500':
          description: Internal Server Error. An unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllWebhooks-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
  /webhooks/{id}:
    delete:
      operationId: webhooks_deleteWebhook
      summary: Delete a webhook
      description: 'Permanently deletes the specified webhook subscription by its unique identifier. This action cannot be undone.


        **Token scopes**: `webhooks:write`'
      tags:
      - Webhooks
      parameters:
      - name: id
        in: path
        description: Unique identifier of the webhook subscription.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webhooks_deleteWebhook_Response_200'
        '400':
          description: Bad Request. The request could not be understood or was missing required parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWebhookById-v2026-01-01RequestBadRequestError'
        '401':
          description: Unauthorized. Authentication credentials were missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWebhookById-v2026-01-01RequestUnauthorizedError'
        '403':
          description: Forbidden. You do not have permission to access this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWebhookById-v2026-01-01RequestForbiddenError'
        '404':
          description: Not Found. The requested resource could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWebhookById-v2026-01-01RequestNotFoundError'
        '405':
          description: Method Not Allowed. The HTTP method is not supported for this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWebhookById-v2026-01-01RequestMethodNotAllowedError'
        '429':
          description: Too Many Requests. The rate limit has been exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWebhookById-v2026-01-01RequestTooManyRequestsError'
        '500':
          description: Internal Server Error. An unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWebhookById-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
    get:
      operationId: webhooks_getWebhook
      summary: Retrieve a single webhook
      description: 'Retrieves the full configuration of a single webhook subscription by its id, including its signing key for verifying incoming payload signatures. Use this to check the current status and events of a subscription before updating it via PATCH or deleting it via DELETE /rest/webhooks/{id}.


        **Token scopes**: `webhooks:read`'
      tags:
      - Webhooks
      parameters:
      - name: id
        in: path
        description: Unique identifier of the webhook subscription.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webhooks_getWebhook_Response_200'
        '400':
          description: Bad Request. The request could not be understood or was missing required parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWebhookById-v2026-01-01RequestBadRequestError'
        '401':
          description: Unauthorized. Authentication credentials were missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWebhookById-v2026-01-01RequestUnauthorizedError'
        '403':
          description: Forbidden. You do not have permission to access this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWebhookById-v2026-01-01RequestForbiddenError'
        '404':
          description: Not Found. The requested resource could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWebhookById-v2026-01-01RequestNotFoundError'
        '405':
          description: Method Not Allowed. The HTTP method is not supported for this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWebhookById-v2026-01-01RequestMethodNotAllowedError'
        '429':
          description: Too Many Requests. The rate limit has been exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWebhookById-v2026-01-01RequestTooManyRequestsError'
        '500':
          description: Internal Server Error. An unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWebhookById-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
    patch:
      operationId: webhooks_updateWebhook
      summary: Update a webhook
      description: 'Updates one or more fields of an existing webhook subscription without recreating it — for example, enabling or disabling delivery, changing the events it is subscribed to, or opting it in to also receive events from child organizations. Use this after creating a webhook via POST /rest/webhooks whenever its configuration needs to change.


        **Token scopes**: `webhooks:write`'
      tags:
      - Webhooks
      parameters:
      - name: id
        in: path
        description: Unique identifier of the webhook subscription.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webhooks_updateWebhook_Response_200'
        '400':
          description: Bad Request. The request could not be understood or was missing required parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateWebhookById-v2026-01-01RequestBadRequestError'
        '401':
          description: Unauthorized. Authentication credentials were missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateWebhookById-v2026-01-01RequestUnauthorizedError'
        '403':
          description: Forbidden. You do not have permission to access this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateWebhookById-v2026-01-01RequestForbiddenError'
        '404':
          description: Not Found. The requested resource could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateWebhookById-v2026-01-01RequestNotFoundError'
        '405':
          description: Method Not Allowed. The HTTP method is not supported for this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateWebhookById-v2026-01-01RequestMethodNotAllowedError'
        '429':
          description: Too Many Requests. The rate limit has been exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateWebhookById-v2026-01-01RequestTooManyRequestsError'
        '500':
          description: Internal Server Error. An unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateWebhookById-v2026-01-01RequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: Endpoint to receive webhook. Must use https.
                name:
                  type: string
                  maxLength: 128
                  description: Webhook subscription name.
                events:
                  type: array
                  items:
                    type: string
                  description: Replaces the list of events enabled for this subscription. Retries scheduled for removed events are cancelled.
                status:
                  $ref: '#/components/schemas/WebhooksIdPatchRequestBodyContentApplicationJsonSchemaStatus'
                  description: Status of webhook.
                description:
                  type:
                  - string
                  - 'null'
                  description: Webhook subscription description.
                include_child_orgs:
                  type:
                  - boolean
                  - 'null'
                  description: When true, the webhook will also receive events from child organizations.
      security:
      - deelToken: []
  /webhooks/events/types:
    get:
      operationId: webhooks_getWebhookEvents
      summary: List webhook event types
      description: 'Lists the catalog of webhook event types available on the platform. Use this to discover valid event identifiers before populating the events array when creating a webhook via POST /rest/webhooks or updating one via PATCH /rest/webhooks/{id}


        **Token scopes**: `webhooks:read`'
      tags:
      - Webhooks
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webhooks_getWebhookEvents_Response_200'
        '400':
