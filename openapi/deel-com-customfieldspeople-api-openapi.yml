openapi: 3.2.0
info:
  title: Endpoints Custom Fields People API
  version: 1.0.0
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: customFieldsPeople
paths:
  /people/{worker_id}/custom_fields/{id}:
    delete:
      operationId: customFieldsPeople_deletePersonCustomField
      summary: Delete the custom field value from Worker by Id
      description: 'Removes a specific custom field value from a worker record by the custom field''s ID.


        **Token scopes**: `people:write`'
      tags:
      - customFieldsPeople
      parameters:
      - name: id
        in: path
        description: Custom field id.
        required: true
        schema:
          type: string
          format: uuid
      - name: worker_id
        in: path
        description: Worker id.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                description: Any type
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /people/custom_fields/{id}:
    get:
      operationId: customFieldsPeople_getPersonCustomField
      summary: Get custom field from people by id
      description: '"Retrieves a single person custom field definition by its `id`.


        **Token scopes**: `people:read`'
      tags:
      - customFieldsPeople
      parameters:
      - name: id
        in: path
        description: Custom field id.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/custom-fields-people_getPersonCustomField_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /people/custom_fields:
    get:
      operationId: customFieldsPeople_getCustomFields
      summary: List all people custom fields
      description: 'Returns the list of custom field definitions configured for people within the organization. The response includes field metadata, not specific person field values. It provides definitions with people placement for supported types such as text, list, multiselect, number, percentage, currency, date, and hyperlink.


        **Token scopes**: `people:read`'
      tags:
      - customFieldsPeople
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/custom-fields-people_getCustomFields_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAllPeopleCustomFields-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
  /people/{worker_id}/custom_fields:
    get:
      operationId: customFieldsPeople_getPersonCustomFields
      summary: Retrieve custom fields for a worker
      description: 'Returns all custom field values currently set for the specified worker.


        **Token scopes**: `people:read`'
      tags:
      - customFieldsPeople
      parameters:
      - name: worker_id
        in: path
        description: Worker id.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/custom-fields-people_getPersonCustomFields_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Worker not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveCustomFieldsForAWorker-v2026-01-01RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
    put:
      operationId: customFieldsPeople_putPersonCustomField
      summary: Update custom field value
      description: 'Creates or updates a custom field value for a worker; if a value for the specified field already exists it is overwritten.


        **Token scopes**: `people:write`'
      tags:
      - customFieldsPeople
      parameters:
      - name: worker_id
        in: path
        description: Worker id.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/custom-fields-people_putPersonCustomField_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                description: Any type
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/PeopleWorkerIdCustomFieldsPutRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
