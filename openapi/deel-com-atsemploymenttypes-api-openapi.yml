openapi: 3.2.0
info:
  title: Endpoints Ats Employment Types API
  version: 1.0.0
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: atsEmploymentTypes
paths:
  /ats/employment-types:
    get:
      operationId: atsEmploymentTypes_retrieveAListOfAtsEmploymentTypes
      summary: Retrieve a list of ATS employment types
      description: 'Returns a paginated list of employment types available in the organization''s ATS. Use it to resolve the employment type IDs required when creating a job and accepted by the `employment_type_ids` filter when listing jobs.


        **Token scopes**: `ats:read`'
      tags:
      - atsEmploymentTypes
      parameters:
      - name: cursor
        in: query
        description: The cursor for pagination
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of records returned in one response
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Successful response with employment types data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ats-employment-types_retrieveAListOfAtsEmploymentTypes_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAListOfAtsEmploymentTypes-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Forbidden. ATS is not enabled for this organization or insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAListOfAtsEmploymentTypes-v2026-01-01RequestForbiddenError'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAListOfAtsEmploymentTypes-v2026-01-01RequestInternalServerError'
      security:
      - deelToken: []
components:
  schemas:
    AtsEmploymentTypesGetResponsesContentApplicationJsonSchemaErrorsItems:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable error code
        field:
          type: string
          description: Request field related to the error, if applicable
        message:
          type: string
          description: Human-readable error message
      required:
      - code
      - message
      title: AtsEmploymentTypesGetResponsesContentApplicationJsonSchemaErrorsItems
    RetrieveAListOfAtsEmploymentTypes-v2026-01-01RequestInternalServerError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/AtsEmploymentTypesGetResponsesContentApplicationJsonSchemaErrorsItems'
          description: List of error objects
      required:
      - errors
      title: RetrieveAListOfAtsEmploymentTypes-v2026-01-01RequestInternalServerError
    RetrieveAListOfAtsEmploymentTypes-v2026-01-01RequestForbiddenError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/AtsEmploymentTypesGetResponsesContentApplicationJsonSchemaErrorsItems'
          description: List of error objects
      required:
      - errors
      title: RetrieveAListOfAtsEmploymentTypes-v2026-01-01RequestForbiddenError
    AtsEmploymentTypesGetResponsesContentApplicationJsonSchemaDataItems:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the employment type
        name:
          type: string
          description: Name of the employment type
        created_at:
          type: string
          format: date-time
          description: Timestamp when the employment type was created
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the employment type was last updated
      required:
      - id
      - name
      - created_at
      - updated_at
      title: AtsEmploymentTypesGetResponsesContentApplicationJsonSchemaDataItems
    ApiErrorContainer:
      type: object
      properties:
        request:
          $ref: '#/components/schemas/ApiErrorRequest'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiError'
      title: ApiErrorContainer
    ApiError:
      type: object
      properties:
        message:
          type: string
          description: A description of the returned error
        path:
          type: string
          description: The JSON path where input validation failed
      title: ApiError
    ApiErrorRequest:
      type: object
      properties:
        method:
          type: string
          description: The HTTP method of the failed request
        url:
          type: string
          description: The relative URL of the failed request
        status:
          type: number
          format: double
          description: The status code of the response
        api_req_id:
          type: string
          description: The request ID of the failed request
        docs:
          type: string
          description: A link to the official documentation for the requested endpoint resource
        source:
          type: string
          description: The source handler which produced the returned error
        code:
          type: number
          format: double
          description: The code of the source handler which produced the returned error
      title: ApiErrorRequest
    RetrieveAListOfAtsEmploymentTypes-v2026-01-01RequestBadRequestError:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/AtsEmploymentTypesGetResponsesContentApplicationJsonSchemaErrorsItems'
          description: List of error objects
      required:
      - errors
      title: RetrieveAListOfAtsEmploymentTypes-v2026-01-01RequestBadRequestError
    ats-employment-types_retrieveAListOfAtsEmploymentTypes_Response_200:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AtsEmploymentTypesGetResponsesContentApplicationJsonSchemaDataItems'
          description: List of employment types
        has_more:
          type: boolean
          description: Indicates if there are more employment types available
        next_cursor:
          type:
          - string
          - 'null'
          description: Cursor for pagination to get the next set of results
        total_count:
          type: integer
          minimum: 0
          description: Total number of employment types available
      required:
      - data
      - has_more
      - next_cursor
      - total_count
      title: ats-employment-types_retrieveAListOfAtsEmploymentTypes_Response_200
  securitySchemes:
    deelToken:
      type: http
      scheme: bearer
      description: "## Authentication\nThe Deel API uses bearer tokens to authenticate requests. All API calls must be made over HTTPS — calls over plain HTTP or without authentication will fail.\n\n```curl\ncurl -X GET 'https://api.letsdeel.com/rest/v2/contracts' \\\n  -H 'Authorization: Bearer YOUR-TOKEN-HERE'\n```\n\n[Learn more about authentication](/api/authentication)"
    oauth2:
      type: http
      scheme: bearer
      description: Standard OAuth2 security scheme based on https://swagger.io/docs/specification/authentication/
