openapi: 3.2.0
info:
  title: Endpoints Cost Centers API
  version: 1.0.0
  description: API endpoints related to Cost Centers.
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: costCenters
  description: API endpoints related to Cost Centers.
paths:
  /contracts/{contract_id}/cost-centers:
    post:
      operationId: costCenters_assignCostCentersToAnEmploymentContract-v2026-01-01
      summary: Assign cost centers to an employment contract
      description: 'Assign cost centers to employment by contract id


        **Token scopes**: `contracts:write`'
      tags:
      - costCenters
      parameters:
      - name: contract_id
        in: path
        description: Employment's contract ID
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Cost center allocation was successfully added to the contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cost_Centers_assignCostCentersToAnEmploymentContract-v2026-01-01_Response_201'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignCostCentersToAnEmploymentContract-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      requestBody:
        description: Cost center information to allocate to the contract
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/ContractsContractIdCostCentersPostRequestBodyContentApplicationJsonSchemaData'
              required:
              - data
      security:
      - deelToken: []
  /legal-entities/{legal_entity_id}/cost-centers:
    get:
      operationId: costCenters_getLegalEntityCostCenters
      summary: Get cost centers by legal entity
      description: 'Returns all cost centers associated with the specified legal_entity_id.


        **Token scopes**: `legal-entity:read`'
      tags:
      - costCenters
      parameters:
      - name: legal_entity_id
        in: path
        description: Legal entity id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Cost center data was successfully fetched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cost-centers_getLegalEntityCostCenters_Response_200'
        '400':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCostCentersByLegalEntity-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /legal-entities/{legal_entity_id}/cost-centers/synchronize:
    post:
      operationId: costCenters_syncCostCentersForLegalEntity-v2026-01-01
      summary: Sync cost centers for legal entity
      description: 'Update legal entity cost center''s data to replicate the data provided on the request


        **Token scopes**: `legal-entity:write`'
      tags:
      - costCenters
      parameters:
      - name: legal_entity_id
        in: path
        description: Legal entity id
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Cost center data was successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cost_Centers_syncCostCentersForLegalEntity-v2026-01-01_Response_201'
        '400':
          description: Cannot define legal entity cost centers as the provided data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncCostCentersForLegalEntity-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncCostCentersForLegalEntity-v2026-01-01RequestInternalServerError'
      requestBody:
        description: Cost center data to overwrite current configuration
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/LegalEntitiesLegalEntityIdCostCentersSynchronizePostRequestBodyContentApplicationJsonSchemaDataItems'
              required:
              - data
      security:
      - deelToken: []
