openapi: 3.2.0
info:
  title: Endpoints Onboarding API
  version: 1.0.0
  description: API endpoints related to Onboarding.
servers:
- url: https://api.letsdeel.com/rest
  description: Production
- url: https://api-staging.letsdeel.com/rest
  description: Demo
- url: https://api.letsdeel.com/scim/v2
  description: Production
- url: https://api-staging.letsdeel.com/scim/v2
  description: Demo
tags:
- name: Onboarding
  description: API endpoints related to Onboarding.
paths:
  /onboarding/tracker/hris_profile/{hris_profile_id}:
    get:
      operationId: onboarding_getOnboardingDetailsByEmployeeHrisProfileId-v2026-01-01
      summary: Get onboarding details by employee HRIS profile ID
      description: 'Use this endpoint to see where one worker is in onboarding and what is needed next, when you hold their HRIS profile ID, for example from `GET /people` or `hris_profile.oid` on the onboarding tracker list. It covers the worker''s main contract and lists their other contracts.


        **Token scopes**: `contracts:read`, `people:read`'
      tags:
      - Onboarding
      parameters:
      - name: hris_profile_id
        in: path
        description: The unique identifier of the employee HRIS profile.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Onboarding overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Onboarding_getOnboardingDetailsByEmployeeHrisProfileId-v2026-01-01_Response_200'
        '400':
          description: Bad Request. The HRIS profile ID is not a valid HRIS profile ID, returned as `errors.errors`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOnboardingDetailsByEmployeeHrisProfileId-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Not Found - No onboarding exists for the provided HRIS profile ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOnboardingDetailsByEmployeeHrisProfileId-v2026-01-01RequestNotFoundError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /onboarding/tracker/{tracker_id}:
    get:
      operationId: onboarding_getOnboardingDetailsByOnboardingTrackerId-v2026-01-01
      summary: Get onboarding details by onboarding tracker ID
      description: 'Use this endpoint to see where one worker is in onboarding and what is needed next, when you hold their tracker ID, the `unique_id` of a row on the onboarding tracker list. It covers the contract that row is about and lists the worker''s other contracts.


        **Token scopes**: `contracts:read`, `people:read`'
      tags:
      - Onboarding
      parameters:
      - name: tracker_id
        in: path
        description: The unique identifier of the onboarding tracker.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Onboarding overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Onboarding_getOnboardingDetailsByOnboardingTrackerId-v2026-01-01_Response_200'
        '400':
          description: Bad Request. The tracker ID cannot be read, returned as `errors.errors`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOnboardingDetailsByOnboardingTrackerId-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Not Found - No onboarding exists for the provided onboarding tracker ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOnboardingDetailsByOnboardingTrackerId-v2026-01-01RequestNotFoundError'
        '412':
          description: Precondition Failed. The tracker ID can be read but is not one the tracker returns
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOnboardingDetailsByOnboardingTrackerId-v2026-01-01RequestPreconditionFailedError'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
  /onboarding/tracker:
    get:
      operationId: onboarding_listOnboardingEmployees-v2026-01-01
      summary: List onboarding employees
      description: 'Use this endpoint to monitor workers as they progress through onboarding and identify onboarding records that require follow-up.


        **Token scopes**: `contracts:read`, `people:read`'
      tags:
      - Onboarding
      parameters:
      - name: search
        in: query
        description: Search term to filter contracts by name or other attributes
        required: false
        schema:
          type: string
          maxLength: 255
      - name: contractOid
        in: query
        description: Search attribute to filter onboarding list by contract id
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
      - name: hiringTypes
        in: query
        description: Search attribute to filter onboarding list by hiring type
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingTrackerGetParametersHiringTypesSchemaItems'
          default: []
      - name: progressStatuses
        in: query
        description: Search attribute to filter onboarding list by progress status
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingTrackerGetParametersProgressStatusesSchemaItems'
          default: []
      - name: countries
        in: query
        description: Filter by contract country. Uses ISO 3166-1 alpha-2 codes.
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
      - name: teams
        in: query
        description: Search attribute to filter onboarding list by team
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
      - name: legalEntities
        in: query
        description: Search attribute to filter onboarding list by legal entity
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
      - name: hrisDirectManagers
        in: query
        description: Search attribute to filter onboarding list by HRIS direct manager. Expects the manager's HRIS profile ID, as returned by `GET /people` in `employments[].team.direct_manager_id` — not a worker or contract ID.
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
          default: []
      - name: fromDate
        in: query
        description: Start date for filtering contracts
        required: false
        schema:
          type: string
          format: date-time
      - name: toDate
        in: query
        description: End date for filtering contracts
        required: false
        schema:
          type: string
          format: date-time
      - name: actions
        in: query
        description: Filter by whether the onboarding is waiting on an action from the client
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingTrackerGetParametersActionsSchemaItems'
          default: []
      - name: lifecycleStatuses
        in: query
        description: Filter by lifecycle status, the same value each item returns in `progress.lifecycle_status`
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingTrackerGetParametersLifecycleStatusesSchemaItems'
          default: []
      - name: waitingOnParties
        in: query
        description: Filter by the party the onboarding is waiting on, the same value each item returns in `progress.waiting_on`
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingTrackerGetParametersWaitingOnPartiesSchemaItems'
          default: []
      - name: card
        in: query
        description: Narrow the list to the workers one filter card counts. `STARTING_THIS_WEEK` also needs `weekFromDate` and `weekToDate`.
        required: false
        schema:
          $ref: '#/components/schemas/OnboardingTrackerGetParametersCard'
      - name: weekFromDate
        in: query
        description: First day of the week the `STARTING_THIS_WEEK` card counts, in the caller's timezone
        required: false
        schema:
          type: string
          format: date
      - name: weekToDate
        in: query
        description: Last day of the week the `STARTING_THIS_WEEK` card counts, in the caller's timezone. On or after `weekFromDate`
        required: false
        schema:
          type: string
          format: date
      - name: limit
        in: query
        description: Number of results to return per page. Ignored when `cursor` is supplied — a cursor already carries the page size and filters of the request that produced it.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
      - name: sort_by
        in: query
        description: Field to sort by
        required: false
        schema:
          $ref: '#/components/schemas/OnboardingTrackerGetParametersSortBy'
          default: progressStatusWeight
      - name: sort_order
        in: query
        description: Sorting order
        required: false
        schema:
          $ref: '#/components/schemas/OnboardingTrackerGetParametersSortOrder'
          default: ASC
      - name: cursor
        in: query
        description: Cursor for pagination, taken from `page.cursor` of the previous response. It replaces the other query parameters, which are carried over from the request that produced it.
        required: false
        schema:
          type: string
      - name: include_overview
        in: query
        description: Include an overview of the contract
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: A list of onboarding and their details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Onboarding_listOnboardingEmployees-v2026-01-01_Response_200'
        '400':
          description: Bad Request. A query parameter outside its declared values, format or length returns `errors` as a list, one item per failing parameter. A combination of parameters the endpoint rejects, such as `card=STARTING_THIS_WEEK` without `weekFromDate`, returns `errors.errors`. A cursor that cannot be read returns `errors` as a list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOnboardingEmployees-v2026-01-01RequestBadRequestError'
        '401':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '403':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '404':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
        '500':
          description: Operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorContainer'
      security:
      - deelToken: []
components:
  schemas:
    Onboarding_getOnboardingDetailsByOnboardingTrackerId-v2026-01-01_Response_200:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/OnboardingTrackerTrackerIdGetResponsesContentApplicationJsonSchemaData'
      title: Onboarding_getOnboardingDetailsByOnboardingTrackerId-v2026-01-01_Response_200
    OnboardingTrackerTrackerIdGetResponsesContentApplicationJsonSchemaDataContractsItemsEntity:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the legal entity
        name:
          type:
          - string
          - 'null'
          description: The name of the legal entity. A Deel entity that a contractor of record works under ends in (COR)
      description: The legal entity the contract sits under. Null when there is none
      title: OnboardingTrackerTrackerIdGetResponsesContentApplicationJsonSchemaDataContractsItemsEntity
    OnboardingTrackerGetResponsesContentApplicationJsonSchemaDataItemsOverviewContractEmployeeAgreement:
      type: object
      properties:
        phase:
          oneOf:
          - $ref: '#/components/schemas/OnboardingTrackerGetResponsesContentApplicationJsonSchemaDataItemsOverviewContractEmployeeAgreementPhase'
          - type: 'null'
          description: Signing-lifecycle phase that produced the current Employment Agreement PDF. Can be null if the EA has not yet been generated
        status:
          type:
          - string
          - 'null'
          description: Status of the Employment Agreement. Can be null if the EA has not yet been generated
        version_hash:
          type:
          - string
          - 'null'
          description: Version of the Employment Agreement. Can be null if the EA has not yet been generated
      description: Information about the Employment Agreement
      title: OnboardingTrackerGetResponsesContentApplicationJsonSchemaDataItemsOverviewContractEmployeeAgreement
    OnboardingTrackerGetResponsesContentApplicationJsonSchemaDataItemsContractEor:
      type: object
      properties:
        is_unassigned_candidate:
          type:
          - boolean
          - 'null'
          description: Whether the candidate still waits to be assigned through the Deel interview process
        has_additional_active_eor_contracts:
          type: boolean
          description: Whether the employee has other active EOR contracts
      description: Only for an EOR contract
      title: OnboardingTrackerGetResponsesContentApplicationJsonSchemaDataItemsContractEor
    OnboardingTrackerHrisProfileHrisProfileIdGetResponsesContentApplicationJsonSchemaDataChecklistStepsItemsGroup:
      type: string
      enum:
      - COMPLETED
      - OUTSTANDING
      description: Whether the worker still owes the step
      title: OnboardingTrackerHrisProfileHrisProfileIdGetResponsesContentApplicationJsonSchemaDataChecklistStepsItemsGroup
    OnboardingTrackerTrackerIdGetResponsesContentApplicationJsonSchemaDataProgress:
      type: object
      properties:
        status:
          type: string
          description: Current status of the onboarding process (e.g., ACTIVE)
        sub_status:
          oneOf:
          - $ref: '#/components/schemas/OnboardingTrackerTrackerIdGetResponsesContentApplicationJsonSchemaDataProgressSubStatus'
          - type: 'null'
          description: Finer state within the status, when there is one
        reference_date:
          type: string
          format: date-time
          description: Reference date for the progress
        subject_to_overdue:
          type: boolean
          description: Indicates if the onboarding is subject to overdue
        reference_date_timezone:
          type: string
          description: Timezone of the reference date
        is_action_required_from_client:
          type: boolean
          description: Indicates if action is required from the client
      description: Progress of the onboarding process
      title: OnboardingTrackerTrackerIdGetResponsesContentApplicationJsonSchemaDataProgress
    OnboardingTrackerHrisProfileHrisProfileIdGetResponsesContentApplicationJsonSchemaDataAppExperience:
      type: object
      properties:
        experience_type:
          oneOf:
          - $ref: '#/components/schemas/OnboardingTrackerHrisProfileHrisProfileIdGetResponsesContentApplicationJsonSchemaDataAppExperienceExperienceType'
          - type: 'null'
          description: The app experience the employee is given, when there is a specific one
        is_minimal_requirements:
          type: boolean
          description: Whether the worker gets the minimal app experience, as a person without a contract does
      description: The app experience of the employee
      title: OnboardingTrackerHrisProfileHrisProfileIdGetResponsesContentApplicationJsonSchemaDataAppExperience
    OnboardingTrackerHrisProfileHrisProfileIdGetResponsesContentApplicationJsonSchemaDataBanner:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/OnboardingTrackerHrisProfileHrisProfileIdGetResponsesContentApplicationJsonSchemaDataBannerKey'
          description: What the banner is about
        action:
          oneOf:
          - $ref: '#/components/schemas/OnboardingTrackerHrisProfileHrisProfileIdGetResponsesContentApplicationJsonSchemaDataBannerAction'
          - type: 'null'
          description: What the client can do about it, when there is something
        severity:
          $ref: '#/components/schemas/OnboardingTrackerHrisProfileHrisProfileIdGetResponsesContentApplicationJsonSchemaDataBannerSeverity'
          description: How serious it is
      description: The one thing worth saying about this worker, or null when there is nothing
      title: OnboardingTrackerHrisProfileHrisProfileIdGetResponsesContentApplicationJsonSchemaDataBanner
    OnboardingTrackerTrackerIdGetResponsesContentApplicationJsonSchemaDataAppExperienceExperienceType:
      type: string
      enum:
      - LIGHTWEIGHT
      description: The app experience the employee is given, when there is a specific one
      title: OnboardingTrackerTrackerIdGetResponsesContentApplicationJsonSchemaDataAppExperienceExperienceType
    OnboardingTrackerTrackerIdGetResponsesContentApplicationJsonSchemaDataChecklistStepsItemsState:
      type: string
      enum:
      - NOT_STARTED
      - IN_PROGRESS
      - IN_REVIEW
      - COMPLETED
      - OVERDUE
      description: State of the step, reported the same way for every worker type
      title: OnboardingTrackerTrackerIdGetResponsesContentApplicationJsonSchemaDataChecklistStepsItemsState
    OnboardingTrackerHrisProfileHrisProfileIdGetResponsesContentApplicationJsonSchemaDataChecklist:
      type: object
      properties:
        steps:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingTrackerHrisProfileHrisProfileIdGetResponsesContentApplicationJsonSchemaDataChecklistStepsItems'
          description: List of checklist steps
        summary:
          $ref: '#/components/schemas/OnboardingTrackerHrisProfileHrisProfileIdGetResponsesContentApplicationJsonSchemaDataChecklistSummary'
          description: How far along the checklist is
      description: List of checklist steps
      title: OnboardingTrackerHrisProfileHrisProfileIdGetResponsesContentApplicationJsonSchemaDataChecklist
    OnboardingTrackerTrackerIdGetResponsesContentApplicationJsonSchemaErrors:
      oneOf:
      - $ref: '#/components/schemas/OnboardingTrackerTrackerIdGetResponsesContentApplicationJsonSchemaErrors0'
      - $ref: '#/components/schemas/OnboardingTrackerTrackerIdGetResponsesContentApplicationJsonSchemaErrors1'
      description: The errors, as an object with an `errors` list, or as the list
      title: OnboardingTrackerTrackerIdGetResponsesContentApplicationJsonSchemaErrors
    OnboardingTrackerTrackerIdGetResponsesContentApplicationJsonSchemaDataContractFirstEarlyInvoiceStatus:
      type: string
      enum:
      - OPEN
      - PENDING
      - SKIPPED
      - PREPROCESSING
      - PROCESSING
      - CREDITED
      - PROCESSED
      - PAID
      - FAILED
      - CANCELLED
      - REFUNDED
      - UNPAYABLE
      - AWAITING_PAYMENT
      description: Status of the invoice
      title: OnboardingTrackerTrackerIdGetResponsesContentApplicationJsonSchemaDataContractFirstEarlyInvoiceStatus
    OnboardingTrackerGetResponsesContentApplicationJsonSchemaDataItemsOverviewStepperItemsDataEmailsItems:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/OnboardingTrackerGetResponsesContentApplicationJsonSchemaDataItemsOverviewStepperItemsDataEmailsItemsMeta'
          description: Email metadata
      title: OnboardingTrackerGetResponsesContentApplicationJsonSchemaDataItemsOverviewStepperItemsDataEmailsItems
    OnboardingTrackerTrackerIdGetResponsesContentApplicationJsonSchemaDataSummaryItemsValue:
      oneOf:
      - type: string
      - type: number
        format: double
      - type: boolean
      - type: string
        format: date-time
      - type: object
        additionalProperties:
          description: Any type
      description: Value of the summary item
      title: OnboardingTrackerTrackerIdGetResponsesContentApplicationJsonSchemaDataSummaryItemsValue
    OnboardingTrackerGetResponsesContentApplicationJsonSchemaDataItemsAppExperience:
      type: object
      properties:
        experience_type:
          oneOf:
          - $ref: '#/components/schemas/OnboardingTrackerGetResponsesContentApplicationJsonSchemaDataItemsAppExperienceExperienceType'
          - type: 'null'
          description: The app experience the employee is given, when there is a specific one
        is_minimal_requirements:
          type: boolean
          description: Indicates if the employee meets minimal requirements
      description: The app experience of the employee
      title: OnboardingTrackerGetResponsesContentApplicationJsonSchemaDataItemsAppExperience
    OnboardingTrackerGetResponsesContentApplicationJsonSchemaDataItemsProgress:
      type: object
      properties:
        steps:
          oneOf:
          - $ref: '#/components/schemas/OnboardingTrackerGetResponsesContentApplicationJsonSchemaDataItemsProgressSteps'
          - type: 'null'
          description: 'Onboarding checklist step counts per state. Null when the counts are not available: the worker has no checklist yet, the row is a contractor draft or a draft quote, or the steps could not be read'
        status:
          type: string
          description: Current status of the onboarding
        sub_status:
          oneOf:
          - $ref: '#/components/schemas/OnboardingTrackerGetResponsesContentApplicationJsonSchemaDataItemsProgressSubStatus'
          - type: 'null'
          description: Finer state within the status, when there is one
        waiting_on:
          oneOf:
          - $ref: '#/components/schemas/OnboardingTrackerGetResponsesContentApplicationJsonSchemaDataItemsProgressWaitingOn'
          - type: 'null'
          description: The party whose action the onboarding waits on. Null when nothing is outstanding, which includes a settled onboarding (READY_TO_START, ACTIVE, OFFBOARDING, INACTIVE) with no client action required
        reference_date:
          $ref: '#/components/schemas/OnboardingTrackerGetResponsesContentApplicationJsonSchemaDataItemsProgressReferenceDate'
          description: The reference date determining the onboarding status
        lifecycle_status:
          $ref: '#/components/schemas/OnboardingTrackerGetResponsesContentApplicationJsonSchemaDataItemsProgressLifecycleStatus'
          description: Lifecycle status of this contract, the same value the People list shows for it
        people_list_status:
          type: string
          description: Status of the people list
        subject_to_overdue:
          type: boolean
          description: Whether the onboarding is subject to overdue
        onboarding_due_date:
          $ref: '#/components/schemas/OnboardingTrackerGetResponsesContentApplicationJsonSchemaDataItemsProgressOnboardingDueDate'
          description: Due date for onboarding
        reference_date_type:
          type:
          - string
          - 'null'
          description: Type of the reference date (e.g., EFFECTIVE_DATE)
        reference_date_timezone:
          type:
          - string
          - 'null'
          description: Timezone of the reference date
        is_action_required_from_client:
          type:
          - boolean
          - 'null'
          description: Whether action is required from the client
      description: The progress state of the onboarding
      title: OnboardingTrackerGetResponsesContentApplicationJsonSchemaDataItemsProgress
    OnboardingTrackerTrackerIdGetResponsesContentApplicationJsonSchemaDataBannerKey:
      type: string
      enum:
      - DOCUMENT_REJECTED
      - ONBOARDING_OVERDUE
      - ONBOARDING_AT_RISK
      - START_DATE_PASSED_WITHOUT_INVITE
      - EMPLOYEE_AGREEMENT_AWAITING_REVIEW
      - AWAITING_DEPOSIT_PAYMENT
      - CONTRACT_REDLINING
      - CONTRACT_AMENDMENTS_IN_PROGRESS
      - QUOTE_REQUIRES_CHANGES
      - DRAFT_QUOTE
      - CONTRACT_DRAFT
      - QUOTE_READY_TO_ACCEPT
      - NO_APP_ACCESS
      - NO_ONBOARDING_STEPS
      - IN_REVIEW_WITH_DEEL
      - IN_OFFER_STAGE
      - PENDING_INVITE
      - INVITED
      - ONBOARDING
      description: What the banner is about
      title: OnboardingTrackerTrackerIdGetResponsesContentApplicationJsonSchemaDataBannerKey
    OnboardingTrackerGetParametersWaitingOnPartiesSchemaItems:
      type: string
      enum:
      - WORKER
      - CLIENT
      - DEEL
      description: Party the onboarding is waiting on
      title: OnboardingTrackerGetParametersWaitingOnPartiesSchemaItems
    OnboardingTrackerGetResponsesContentApplicationJsonSchemaDataItemsOverviewAppExperience:
      type: object
      properties:
        experience_type:
          oneOf:
          - $ref: '#/components/schemas/OnboardingTrackerGetResponsesContentApplicationJsonSchemaDataItemsOverviewAppExperienceExperienceType'
          - type: 'null'
          description: The app experience the employee is given, when there is a specific one
        is_minimal_requirements:
          type: boolean
          description: Whether the worker gets the minimal app experience, as a person without a contract does
      description: The app experience of the employee
      title: OnboardingTrackerGetResponsesContentApplicationJsonSchemaDataItemsOverviewAppExperience
    OnboardingTrackerHrisProfileHrisProfileIdGetResponsesContentApplicationJsonSchemaDataHrisProfileInvitationsItemsStatus:
      type: string
      enum:
      - SENT
      - DISABLED
      - SUSPENDED
      - SCHEDULED
      - FAILED
      description: Status of the invitation
      title: OnboardingTrackerHrisProfileHrisProfileIdGetResponsesContentApplicationJsonSchemaDataHrisProfileInvitationsItemsStatus
    OnboardingTrackerHrisProfileHrisProfileIdGetResponsesContentApplicationJsonSchemaDataProfile:
      type: object
      properties:
        id:
          type: integer
          description: Internal ID of the profile
        name:
          type: string
          description: Name associated with the profile
        email:
          type: string
          format: email
          description: Email of the profile
        country:
          type:
          - string
          - 'null'
          description: Country code
        pic_url:
          type:
          - string
          - 'null'
          description: URL of the profile picture
        last_login:
          type: string
          format: date-time
          description: Last login timestamp
        paid_invoices:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingTrackerHrisProfileHrisProfileIdGetResponsesContentApplicationJsonSchemaDataProfilePaidInvoicesItems'
          description: A paid invoice on the contract, if any, at most one. Only for a contractor, empty for other worker types
        previously_onboarded:
          type: boolean
          description: Indicates if the contractor has previously onboarded
      description: Employee profile information
      title: OnboardingTrackerHrisProfileHrisProfileIdGetResponsesContentApplicationJsonSchemaDataProfile
    OnboardingTrackerGetParametersSortOrder:
      type: string
      enum:
      - ASC
      - DESC
      default: ASC
      title: OnboardingTrackerGetParametersSortOrder
    OnboardingTrackerGetResponsesContentApplicationJsonSchemaDataItemsOverviewProgressSubStatus:
      type: string
      enum:
      - PENDING_INVITE
      - INVITED
      - ONBOARDING
      - AWAITING_CLIENT_REVIEW
      - CANCELLED
      - REJECTED
      description: Finer state within the status, when there is one
      title: OnboardingTrackerGetResponsesContentApplicationJsonSchemaDataItemsOverviewProgressSubStatus
    OnboardingTrackerTrackerIdGetResponsesContentApplicationJsonSchemaData:
      type: object
      properties:
        banner:
          oneOf:
          - $ref: '#/components/schemas/OnboardingTrackerTrackerIdGetResponsesContentApplicationJsonSchemaDataBanner'
          - type: 'null'
          description: The one thing worth saying about this worker, or null when there is nothing
        actions:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingTrackerTrackerIdGetResponsesContentApplicationJsonSchemaDataActionsItems'
          description: Actions the caller can take on this onboarding
        profile:
          oneOf:
          - $ref: '#/components/schemas/OnboardingTrackerTrackerIdGetResponsesContentApplicationJsonSchemaDataProfile'
          - type: 'null'
          description: Employee profile information
        stepper:
          type: array
