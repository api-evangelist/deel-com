naftiko: 1.0.0-alpha2
info:
  label: Deel ATS API — Jobs
  description: Self-contained Naftiko capability for managing ATS jobs and job postings.
  tags:
  - Deel
  - ATS
  - Jobs
  - Recruiting
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    DEEL_API_TOKEN: DEEL_API_TOKEN
capability:
  consumes:
  - type: http
    namespace: ats-jobs
    baseUri: https://api.letsdeel.com/rest/v2
    description: Deel ATS Jobs capability.
    resources:
    - name: ats-jobs
      path: /ats/jobs
      operations:
      - name: listAtsJobs
        method: GET
        description: List ATS jobs.
        outputRawFormat: json
        outputParameters:
        - { name: result, type: object, value: $. }
        inputParameters:
        - { name: status, in: query, type: string, required: false }
      - name: createAtsJob
        method: POST
        description: Create ATS job.
        outputRawFormat: json
        outputParameters:
        - { name: result, type: object, value: $. }
        inputParameters:
        - { name: body, in: body, type: object, required: true }
    authentication:
      type: bearer
      value: '{{env.DEEL_API_TOKEN}}'
      placement: header
  exposes:
  - type: rest
    namespace: ats-jobs-rest
    port: 8080
    description: REST adapter for ATS jobs.
    resources:
    - path: /v1/ats/jobs
      name: ats-jobs
      description: REST surface for ATS jobs.
      operations:
      - method: GET
        name: listAtsJobs
        description: List ATS jobs.
        call: ats-jobs.listAtsJobs
        with: { status: rest.query.status }
      - method: POST
        name: createAtsJob
        description: Create ATS job.
        call: ats-jobs.createAtsJob
        with: { body: rest.body }
